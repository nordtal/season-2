# The workflows pin actions to a commit SHA rather than a tag, because a tag can be moved by its
# owner and every release job here carries write access to this repository. Dependabot opens a
# pull request when a pinned action has a newer release and rewrites the SHA and the trailing
# `# vX.Y.Z` comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for all of them; they move together often enough to make separate ones wasteful.
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
