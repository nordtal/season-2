name: build

# Every push to main and every pull request. The release workflow only runs when a release is
# published, so without this a broken main - a compile error, a red test - stays invisible until
# somebody tags, and then it fails on the release instead of on the commit that caused it.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # `build` is compile + test + every shadowJar, because nordtal.shaded makes `build` depend
      # on `shadowJar`. The integration tests need a Docker daemon; ubuntu-latest has one, and
      # without it Testcontainers tests skip themselves rather than fail, so a green run on a
      # machine without Docker would prove less than it looks.
      - name: Build and test
        run: ./gradlew build

      # ALL FOUR IMAGES ARE BUILT HERE AND NONE IS PUSHED. Until 2026-09-02 only release.yml ever
      # built one, so a Dockerfile that COPYs a file the .dockerignore excludes could not fail
      # before a release - which is exactly how the bot image missed its own entrypoint that day.
      # Since release.yml now publishes all four, a Dockerfile that does not build is a release that
      # does not finish, and this is where that is caught instead. They take seconds and the two
      # that need jars have them from `build` above.
      - name: Build the images without pushing
        run: |
          version="$(grep '^version=' gradle.properties | cut -d= -f2)"
          docker build --build-arg "JAR=build/libs/discord-bot-$version.jar" \
            -t nordtal/discord-bot:ci discord-bot
          docker build --build-arg "JAR=build/libs/updater-$version.jar" \
            -t nordtal/updater:ci updater
          docker build -t nordtal/minecraft:ci deploy/minecraft
          docker build -t nordtal/postgres-backup:ci deploy/postgres-backup
