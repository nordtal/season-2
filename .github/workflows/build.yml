name: build

# Every push to master and every pull request. release.yml only runs on a pushed tag, so without
# this a broken master - a compile error, a source file Git ignores, a test that fails - stays
# invisible until somebody tags, exactly the gap papermc-display-tags/.github/workflows/build.yml
# closed on 2026-09-03. This repository had no CI at all before that.
#
# `check` here is checkSourcesTracked, compile and the real test suite, including the
# Testcontainers-backed DatabaseIntegrationTest - unlike JitPack's own build (see ../../jitpack.yml),
# GitHub's ubuntu-latest runners have a Docker daemon, so this is a strictly stronger check than
# what JitPack runs when a consumer first requests a tag.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Commit messages follow CONVENTIONS.md
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          for commit in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            sh .githooks/commit-msg "$RUNNER_TEMP/message"
          done

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build
