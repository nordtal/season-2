name: build

# Every push to main and every pull request. The release workflow only runs when a release is
# published, so without this a broken main - a compile error, a red test - stays invisible until
# somebody tags, and then it fails on the release instead of on the commit that caused it.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # `build` is compile + test + every shadowJar, because nordtal.shaded makes `build` depend
      # on `shadowJar`. The integration tests need a Docker daemon; ubuntu-latest has one, and
      # without it Testcontainers tests skip themselves rather than fail, so a green run on a
      # machine without Docker would prove less than it looks.
      - name: Build and test
        run: ./gradlew build
