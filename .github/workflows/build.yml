name: build

# Catches a broken main before a release is published.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Commit messages follow CONVENTIONS.md
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          for commit in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            sh .githooks/commit-msg "$RUNNER_TEMP/message"
          done

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # `build` includes every shadowJar; the integration tests use ubuntu-latest's Docker daemon.
      - name: Build and test
        run: ./gradlew build

      # Catches a broken Dockerfile on every push.
      - name: Build the images without pushing
        run: |
          for module in discord-bot steward steward-agent steward-bunq; do
            docker build -f deploy/jvm/Dockerfile --build-arg "MODULE=$module" -t "nordtal/$module:ci" .
          done
          docker build -t nordtal/minecraft:ci deploy/minecraft
