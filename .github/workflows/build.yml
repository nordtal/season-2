name: build

# Catches a broken main before a release is published.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older run. Every commit on main gets its own group, so
# no build of main is cancelled or dropped from the queue: a release needs its commit's build green.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Commit messages follow CONVENTIONS.md
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          # First parent only: a subtree merge brings in the history of another repository, which has its own rules.
          for commit in $(git rev-list --first-parent --no-merges "$range"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            sh .githooks/commit-msg "$RUNNER_TEMP/message"
          done

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      # Only main writes the cache. Without the key, which a fork's pull request does not get, the configuration cache is not kept.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # npmInstall is not cacheable, so `npm ci` takes its packages from npm's own cache instead of the registry.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('steward/frontend/package-lock.json') }}
          restore-keys: npm-

      # `build` stages the build/image of every image through `assemble`. The integration tests use the Docker daemon of ubuntu-latest.
      # SettingsPageEndToEndTest drives the runner's Chrome; without NORDTAL_CHROMIUM it skips.
      # The frontend job runs viteTest, the longest task, beside this one.
      - name: Build and test
        run: ./gradlew build -x :steward:viteTest
        env:
          NORDTAL_CHROMIUM: /usr/bin/google-chrome

      # Only main writes npm's cache, as it writes Gradle's.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('steward/frontend/package-lock.json') }}

      # A pull request builds the images only when it changes what they copy or how it is staged; main always does.
      - name: Find whether the images need a build
        id: images
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && git diff --quiet "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" -- \
            deploy .dockerignore compose.yml build-logic gradle discord-bot steward steward-agent steward-bunq; then
            echo "nothing the images copy changed"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # Catches a broken Dockerfile before it reaches main.
      - name: Build the images without pushing
        if: steps.images.outputs.build == 'true'
        run: |
          for module in discord-bot steward steward-agent steward-bunq; do
            docker build -f deploy/jvm/Dockerfile --build-arg "MODULE=$module" -t "nordtal/$module:ci" .
          done
          docker build -t nordtal/minecraft:ci deploy/minecraft

  # Steward's vitest suite in two halves, each on a runner of its own, beside the build job.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('steward/frontend/package-lock.json') }}
          restore-keys: npm-

      - name: Steward frontend tests ${{ matrix.shard }}
        run: ./gradlew :steward:viteTest -PvitestShard=${{ matrix.shard }}

  # Lua and LuaRocks install into the checkout, so the designer's tests keep them out of the build job's sources.
  designer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Lua of Nordtal Designer's Aseprite, which bundles 5.4.6
      - uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.4.6"

      # LuaRocks is the action's own version, which Dependabot moves with the action
      - uses: leafo/gh-actions-luarocks@1c4a92caecc8f6850f673cbadfd57b3e555417ce # v6.1.1

      # Dependabot does not know LuaRocks, so each run installs the current busted and dkjson
      - name: Lua tests of the designer plugin
        working-directory: designer
        run: |
          luarocks install busted
          luarocks install dkjson
          busted
