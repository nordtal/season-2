name: pr-title

# The title becomes the squash commit on main. build.yml checks that commit too late to refuse it.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The check reads the body together with the title for model and vendor names, which no commit hook sees.
      # The body of a Dependabot pull request quotes the release notes of the bumped packages, so only its title is checked.
      - name: Title and body follow CONVENTIONS.md
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          ACTOR: ${{ github.actor }}
        run: |
          [ "$ACTOR" = "dependabot[bot]" ] && BODY=""
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/message"
          sh .githooks/commit-msg "$RUNNER_TEMP/message"
