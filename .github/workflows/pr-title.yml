name: pr-title

# The title becomes the squash commit on main, which build.yml then checks too late to refuse.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Title follows CONVENTIONS.md
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/message"
          sh .githooks/commit-msg "$RUNNER_TEMP/message"
