name: pr-title

# The title becomes the squash commit on main. build.yml checks that commit too late to refuse it.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The title is the squash commit. The body is checked for model and vendor names, which no commit hook sees.
      # The body of a Dependabot pull request quotes the release notes of the bumped packages, so only its title is checked.
      - name: Title and body follow CONVENTIONS.md
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          sh .githooks/commit-msg "$RUNNER_TEMP/title"
          [ "$ACTOR" = "dependabot[bot]" ] && exit 0
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/body"
          sh .githooks/commit-msg "$RUNNER_TEMP/body" --names-only
