name: release

# Triggers on a published GitHub release, not on the tag push: a release published from a tag
# that already existed still needs to build, which `push: tags` cannot do. `git push --tags`
# alone therefore builds nothing; publish the release to build it. The tag must match the version
# in gradle.properties, checked below.
on:
  release:
    types: [published]
  # For re-running a release whose build failed, without unpublishing anything.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  packages: write

# One build per tag, so a hand-started re-run cannot upload the same assets twice.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Check the tag matches gradle.properties
        run: |
          tag_name="${{ github.event.release.tag_name || inputs.tag }}"
          tag="${tag_name#v}"
          declared="$(grep '^version=' gradle.properties | cut -d= -f2)"
          if [ "$tag" != "$declared" ]; then
            echo "tag $tag_name does not match version=$declared in gradle.properties" >&2
            exit 1
          fi
          echo "TAG=$tag_name" >> "$GITHUB_ENV"
          echo "VERSION=$declared" >> "$GITHUB_ENV"

      # `check` runs before `releaseArtifacts` so a release never ships jars whose tests nobody ran.
      - name: Build and test every release artifact
        run: ./gradlew check releaseArtifacts imageContexts

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp limbo/build/libs/limbo-${VERSION}.jar dist/
          cp hunger-games/build/libs/hunger-games-${VERSION}.jar dist/
          cp smp/build/libs/smp-${VERSION}.jar dist/
          cp proxy/build/libs/proxy-${VERSION}.jar dist/
          cp discord-bot/build/libs/discord-bot-${VERSION}.jar dist/
          cp steward-worker/build/libs/steward-worker-${VERSION}.jar dist/
          cp resource-pack/build/distributions/nordtal-resource-pack-${VERSION}.zip dist/
          cp resource-pack/build/distributions/nordtal-resource-pack-${VERSION}.zip.sha1 dist/
          ls -la dist

      # A Minecraft client refuses the pack when the sent hash disagrees with the zip, or when
      # pack.mcmeta is not at the zip's root; neither failure shows up until somebody joins.
      - name: Verify the resource pack
        run: |
          zip="dist/nordtal-resource-pack-${VERSION}.zip"
          expected="$(cat "$zip.sha1" | tr -d '[:space:]')"
          actual="$(sha1sum "$zip" | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "$zip.sha1 says $expected but the zip hashes to $actual" >&2
            exit 1
          fi
          if ! unzip -Z1 "$zip" | grep -qx 'pack.mcmeta'; then
            echo "pack.mcmeta is not at the root of $zip; the client would refuse the pack" >&2
            unzip -Z1 "$zip" | head -20 >&2
            exit 1
          fi
          echo "pack ok: sha1 $actual, pack.mcmeta at the root"

      - name: Write the release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: ${{ runner.temp }}/notes.md

      - name: Put the release notes on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ env.TAG }}" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Attach the artifacts to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # All five images are pushed: the deployment pulls, it never builds, so an image that exists
      # only in a local daemon makes a deploy fail with `denied` from the registry. The bot and
      # steward-worker images are a floor, not the running version - both run whatever jar is in
      # their volume, filled from the release assets above, and the baked-in jar only covers a
      # first deployment before any worker run has happened. compose.yml points only at `latest`;
      # the version tag is still pushed so the registry can say what `latest` was last week. No
      # build args: the two Dockerfiles that carry a jar find it by glob in build/libs.
      - name: Build and push the bot image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: discord-bot
          push: true
          tags: |
            ghcr.io/nordtal/discord-bot:${{ env.VERSION }}
            ghcr.io/nordtal/discord-bot:latest

      # The bootstrap image: a host with nothing yet pulls this rather than building it.
      - name: Build and push the steward-worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: steward-worker
          push: true
          tags: |
            ghcr.io/nordtal/steward-worker:${{ env.VERSION }}
            ghcr.io/nordtal/steward-worker:latest

      # One image for all four Minecraft services; the difference between them is environment. It
      # carries no Gradle output, only entrypoint.sh and a JRE, so it changes only on a release.
      - name: Build and push the minecraft image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/minecraft
          push: true
          tags: |
            ghcr.io/nordtal/minecraft:${{ env.VERSION }}
            ghcr.io/nordtal/minecraft:latest

      # The frontend is built by `:steward-ui:build` and bundled into the jar under `web/`, so
      # there is no Node in this image.
      - name: Build and push the steward-ui image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: steward-ui
          push: true
          tags: |
            ghcr.io/nordtal/steward-ui:${{ env.VERSION }}
            ghcr.io/nordtal/steward-ui:latest

      # The guard in front of 25565: Caddy plus `caddy-l4`, an xcaddy build rather than the stock
      # image, since a layer 4 module list is decided at build time.
      - name: Build and push the caddy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/caddy
          push: true
          tags: |
            ghcr.io/nordtal/caddy:${{ env.VERSION }}
            ghcr.io/nordtal/caddy:latest

      # The one image that carries compose.yml. Nothing in the stack can renew it, since it is the
      # service that would have to; a new version reaches the host through deploy/nordtal.sh.
      - name: Build and push the steward-deployer image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: steward-deployer
          push: true
          tags: |
            ghcr.io/nordtal/steward-deployer:${{ env.VERSION }}
            ghcr.io/nordtal/steward-deployer:latest
