name: release

# A release is a GitHub release, published by a human. Publishing from a brand-new tag and from a
# tag that has existed for weeks both build, which a `push: tags` trigger cannot do. `git push
# --tags` on its own builds nothing - tag, then publish the release.
#
# season-2's updater follows this repository's /releases/latest, so a fix that is not released
# never reaches a server, and a jar attached by hand is one nobody else can rebuild.
#
# The version in build.gradle is the single source of truth; the tag must equal it exactly. Tags
# here carry no leading 'v' (2.0.0, not v2.0.0), and the check below refuses one.
#
# The asset name is an interface: season-2's updater matches the installed jar by filename prefix
# (papermc-display-tags-<version>.jar -> 'papermc-display-tags'). Renaming the artifact would make
# every deployed copy an "unclaimed" jar that nothing supersedes.
on:
  release:
    types: [published]
  # For re-running a release whose build failed, without unpublishing anything.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. 2.1.0 (no leading v)'
        required: true

permissions:
  contents: write

# One build per tag. A re-run started by hand while the release build is still going would
# otherwise upload the same asset twice.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches build.gradle
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          case "$tag" in
            v*) echo "tag $tag has a leading 'v'; this repository's tags do not (2.0.0, not v2.0.0)" >&2; exit 1 ;;
          esac
          declared="$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)"
          if [ -z "$declared" ]; then
            echo "could not read version = '...' from build.gradle" >&2
            exit 1
          fi
          if [ "$tag" != "$declared" ]; then
            echo "tag $tag does not match version = '$declared' in build.gradle" >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$declared" >> "$GITHUB_ENV"

      # `check` runs checkSourcesTracked, which is the only thing standing between an ignored
      # source file and a jar that compiles locally and nowhere else. jcore comes from JitPack,
      # which needs no token.
      - name: Build and test
        run: ./gradlew check shadowJar

      - name: Verify the artifact
        run: |
          jar="build/libs/papermc-display-tags-${VERSION}.jar"
          test -f "$jar" || { echo "$jar was not built" >&2; ls -la build/libs >&2; exit 1; }
          # The shaded jar, not the thin one: it has to carry jcore's config package.
          unzip -Z1 "$jar" | grep -q '^eu/nordtal/jcore/config/' \
            || { echo "$jar does not contain eu.nordtal.jcore.config - is this the thin jar?" >&2; exit 1; }
          # None of the three below belongs in this jar either - Paper provides all three itself.
          # A second copy is a classloader clash, and slf4j's version of that clash is silent:
          # jcore's ConfigHandle logs through slf4j, a plugin-local slf4j-api finds no provider,
          # and the result is one "No SLF4J providers were found" line and nothing else ever again.
          # All three arrive transitively through jcore, which is why this check names all three
          # rather than the two most people remember.
          if unzip -Z1 "$jar" | grep -qE '^(com/google/gson|org/yaml/snakeyaml|org/slf4j)/'; then
            echo "$jar shades gson, snakeyaml or slf4j-api, which Paper already provides:" >&2
            unzip -Z1 "$jar" | grep -E '^(com/google/gson|org/yaml/snakeyaml|org/slf4j)/' | head -5 >&2
            exit 1
          fi
          ls -la "$jar"

      - name: Write the release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: ${{ runner.temp }}/notes.md

      - name: Put the release notes on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ env.TAG }}" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Attach the jar to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: build/libs/papermc-display-tags-${{ env.VERSION }}.jar
