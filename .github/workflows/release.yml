name: release

# A release is a tag. The version in gradle.properties is the single source of truth for
# every artifact; the tag must match it (checked below) so the release page and the jars
# can never disagree.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches gradle.properties
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(grep '^version=' gradle.properties | cut -d= -f2)"
          if [ "$tag" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match version=$declared in gradle.properties" >&2
            exit 1
          fi
          echo "VERSION=$declared" >> "$GITHUB_ENV"

      - name: Build every release artifact
        run: ./gradlew releaseArtifacts

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp resource-pack-coercion/build/libs/resource-pack-coercion-${VERSION}.jar dist/
          cp hunger-games/build/libs/hunger-games-${VERSION}.jar dist/
          cp smp/build/libs/smp-${VERSION}.jar dist/
          cp network-control/build/libs/network-control-${VERSION}.jar dist/
          cp access-bot/build/libs/access-bot-${VERSION}.jar dist/
          cp resource-pack/build/distributions/nordtal-resource-pack-${VERSION}.zip dist/
          cp resource-pack/build/distributions/nordtal-resource-pack-${VERSION}.zip.sha1 dist/
          ls -la dist

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the payments bot image
        uses: docker/build-push-action@v6
        with:
          context: access-bot
          build-args: JAR=build/libs/access-bot-${{ env.VERSION }}.jar
          push: true
          tags: |
            ghcr.io/nordtal/access-bot:${{ env.VERSION }}
            ghcr.io/nordtal/access-bot:latest
