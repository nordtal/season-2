name: release

# A release is a GitHub release, published by a human. That is the only trigger: publishing a
# release from a brand-new tag and publishing one from a tag that has existed for weeks both
# build, which a `push: tags` trigger cannot do - it never fires for the second case, so a
# release made that way would sit there with no assets at all.
#
# `git push --tags` on its own therefore builds nothing. Tag, then publish the release.
#
# The version in gradle.properties is the single source of truth for every artifact; the tag
# must match it (checked below) so the release page and the jars can never disagree.
on:
  release:
    types: [published]
  # For re-running a release whose build failed, without unpublishing anything.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  packages: write

# One build per tag. A re-run started by hand while the release build is still going would
# otherwise upload the same assets twice.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Check the tag matches gradle.properties
        run: |
          tag_name="${{ github.event.release.tag_name || inputs.tag }}"
          tag="${tag_name#v}"
          declared="$(grep '^version=' gradle.properties | cut -d= -f2)"
          if [ "$tag" != "$declared" ]; then
            echo "tag $tag_name does not match version=$declared in gradle.properties" >&2
            exit 1
          fi
          echo "TAG=$tag_name" >> "$GITHUB_ENV"
          echo "VERSION=$declared" >> "$GITHUB_ENV"

      # `check` before `releaseArtifacts`, not instead of it: a release must never ship jars
      # whose tests nobody ran. The integration tests need a Docker daemon, which ubuntu-latest
      # has - without one Testcontainers tests skip themselves and the run stays green while
      # proving less.
      - name: Build and test every release artifact
        run: ./gradlew check releaseArtifacts imageContexts

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp limbo/build/libs/limbo-${VERSION}.jar dist/
          cp hunger-games/build/libs/hunger-games-${VERSION}.jar dist/
          cp smp/build/libs/smp-${VERSION}.jar dist/
          cp proxy/build/libs/proxy-${VERSION}.jar dist/
          cp discord-bot/build/libs/discord-bot-${VERSION}.jar dist/
          cp steward-worker/build/libs/steward-worker-${VERSION}.jar dist/
          cp resource-pack/build/distributions/nordtal-resource-pack-${VERSION}.zip dist/
          cp resource-pack/build/distributions/nordtal-resource-pack-${VERSION}.zip.sha1 dist/
          ls -la dist

      # Both of these are things a Minecraft client punishes and a build does not: the client is
      # sent the URL and the hash and refuses the pack when they disagree, and it refuses a pack
      # whose pack.mcmeta is not at the root of the zip. Neither shows up until somebody joins.
      - name: Verify the resource pack
        run: |
          zip="dist/nordtal-resource-pack-${VERSION}.zip"
          expected="$(cat "$zip.sha1" | tr -d '[:space:]')"
          actual="$(sha1sum "$zip" | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "$zip.sha1 says $expected but the zip hashes to $actual" >&2
            exit 1
          fi
          if ! unzip -Z1 "$zip" | grep -qx 'pack.mcmeta'; then
            echo "pack.mcmeta is not at the root of $zip; the client would refuse the pack" >&2
            unzip -Z1 "$zip" | head -20 >&2
            exit 1
          fi
          echo "pack ok: sha1 $actual, pack.mcmeta at the root"

      - name: Write the release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: ${{ runner.temp }}/notes.md

      - name: Put the release notes on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ env.TAG }}" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Attach the artifacts to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ALL FIVE IMAGES ARE PUSHED, and until 2026-09-02 only this first one was. The reason it
      # changed is not a preference: THE DEPLOYMENT PULLS, IT DOES NOT BUILD. steward-deployer runs
      # `compose pull` and then `up --no-detach --no-deps`, so an image that exists nowhere but a
      # host's local daemon makes a deploy fail with `denied` from the registry - which is what
      # happened with ghcr.io/nordtal/minecraft:local, back when a panel did the pulling and the
      # same rule applied. Two of these cannot be built from a checkout at all: they COPY a jar
      # Gradle produces into a directory .gitignore excludes.
      #
      # THE IMAGES ARE A FLOOR, NOT THE VERSION. The bot and steward-worker run whatever jar is in
      # their volume, which the worker fills from the release assets above; the jar baked in is
      # what makes a first deployment possible before any worker run has happened. `latest` is what
      # compose.yml points at, and since 2026-09-09 it is the only thing it can point at: there is no
      # tag variable and no rollback-by-tag any more. The version tag below is still pushed, because
      # a registry that only ever holds `latest` cannot say what `latest` was last week.
      #
      # NO BUILD ARGS. The two Dockerfiles that carry a jar find it by glob in build/libs, so this
      # workflow no longer has to spell out a version that Gradle has already decided.
      - name: Build and push the bot image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: discord-bot
          push: true
          tags: |
            ghcr.io/nordtal/discord-bot:${{ env.VERSION }}
            ghcr.io/nordtal/discord-bot:latest

      # The bootstrap. It used to be deliberately unpublished, on the reasoning that a host with
      # nothing yet builds it from this repository - which stopped being true the moment the
      # deployment became a pull rather than a build.
      - name: Build and push the steward-worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: steward-worker
          push: true
          tags: |
            ghcr.io/nordtal/steward-worker:${{ env.VERSION }}
            ghcr.io/nordtal/steward-worker:latest

      # One image for all four Minecraft services; the difference between them is environment. It
      # contains no Gradle output at all - entrypoint.sh and a JRE - so a change to it still needs a
      # release to reach production, which is the deliberate cost of publishing only on release.
      - name: Build and push the minecraft image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/minecraft
          push: true
          tags: |
            ghcr.io/nordtal/minecraft:${{ env.VERSION }}
            ghcr.io/nordtal/minecraft:latest

      # The web interface. The frontend is inside this jar and not in the image as files - vite runs
      # under `:steward-ui:build` and processResources puts build/frontend-dist in under `web/` -
      # so there is no Node here and none in the image either.
      - name: Build and push the steward-ui image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: steward-ui
          push: true
          tags: |
            ghcr.io/nordtal/steward-ui:${{ env.VERSION }}
            ghcr.io/nordtal/steward-ui:latest

      # The guard in front of 25565 (season-2-ops/162), which is Caddy plus `caddy-l4` and therefore
      # cannot be the stock image from Docker Hub any more: a layer 4 app is a Go module and the
      # module list is decided at build time. It carries no Gradle output either - it is an xcaddy
      # build - so, like the minecraft image, a change to it needs a release to reach production.
      - name: Build and push the caddy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/caddy
          push: true
          tags: |
            ghcr.io/nordtal/caddy:${{ env.VERSION }}
            ghcr.io/nordtal/caddy:latest

      # The one image that carries compose.yml (§8b), which is what makes "which compose file is
      # live" a question with a version number for an answer. It is also the one image nothing in
      # the stack can renew: the service that would have to do it is this one, so a new version of
      # it arrives through deploy/nordtal.sh on the host.
      - name: Build and push the steward-deployer image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: steward-deployer
          push: true
          tags: |
            ghcr.io/nordtal/steward-deployer:${{ env.VERSION }}
            ghcr.io/nordtal/steward-deployer:latest
