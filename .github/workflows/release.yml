name: release

# Runs on a pushed release tag; the tag must match gradle.properties, and its commit must have a green
# build on main. The GitHub release is created last, with every asset, so a failed run publishes nothing.
on:
  push:
    tags: ["v*"]
  # Runs a release again after a failed run, or once a tag pushed before its build turned green.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.1.0"
        required: true

# Write access is granted on the job, the only place that needs it.
permissions:
  contents: read

# One build per tag, so a hand-started re-run cannot upload the same assets twice.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
      packages: write
    # The tag is a dispatch input or a tag name, so it reaches scripts as a variable, never as text in one.
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check the tag matches gradle.properties
        run: |
          tag="${RELEASE_TAG#v}"
          declared="$(grep '^version=' gradle.properties | cut -d= -f2)"
          if [ "$tag" != "$declared" ]; then
            echo "tag $RELEASE_TAG does not match version=$declared in gradle.properties" >&2
            exit 1
          fi
          echo "VERSION=$declared" >> "$GITHUB_ENV"

      # A release ships only a commit whose build on main went green, and only once.
      - name: Check the tag's commit has a green build on main and no release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          green="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$commit&branch=main&event=push&status=success" --jq .total_count)"
          if [ "$green" = 0 ]; then
            echo "$RELEASE_TAG is $commit, which has no successful build on main; once it has one:" >&2
            echo "  gh workflow run release.yml -f tag=$RELEASE_TAG" >&2
            exit 1
          fi
          # A draft is what a run that failed while uploading leaves behind; it was never published.
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$draft" = false ]; then
            echo "$RELEASE_TAG is already a release" >&2
            exit 1
          fi
          if [ "$draft" = true ]; then
            gh release delete "$RELEASE_TAG" --yes
          fi

      # `check` runs before `releaseArtifacts` so a release never ships jars whose tests nobody ran.
      - name: Build and test every release artifact
        run: ./gradlew check releaseArtifacts imageContexts

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp limbo/build/libs/limbo-${VERSION}.jar dist/
          cp hunger-games/build/libs/hunger-games-${VERSION}.jar dist/
          cp smp/build/libs/smp-${VERSION}.jar dist/
          cp proxy/build/libs/proxy-${VERSION}.jar dist/
          cp resource-pack/build/distributions/nordtal-resource-pack-${VERSION}.zip dist/
          cp resource-pack/build/distributions/nordtal-resource-pack-${VERSION}.zip.sha1 dist/
          ls -la dist

      # A client refuses a pack whose hash or root pack.mcmeta is wrong, which only shows on join.
      - name: Verify the resource pack
        run: |
          zip="dist/nordtal-resource-pack-${VERSION}.zip"
          expected="$(cat "$zip.sha1" | tr -d '[:space:]')"
          actual="$(sha1sum "$zip" | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "$zip.sha1 says $expected but the zip hashes to $actual" >&2
            exit 1
          fi
          if ! unzip -Z1 "$zip" | grep -qx 'pack.mcmeta'; then
            echo "pack.mcmeta is not at the root of $zip; the client would refuse the pack" >&2
            unzip -Z1 "$zip" | head -20 >&2
            exit 1
          fi
          echo "pack ok: sha1 $actual, pack.mcmeta at the root"

      - name: Write the release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: ${{ runner.temp }}/notes.md

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every image is pushed under the version alone: a stack runs exactly one release, named by
      # steward-agent's own tag, and nothing ever pulls a moving tag.
      - name: Build and push the bot image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/jvm/Dockerfile
          build-args: MODULE=discord-bot
          push: true
          tags: |
            ghcr.io/nordtal/discord-bot:${{ env.VERSION }}

      # The bootstrap image a fresh host pulls. The frontend is inside the jar under `web/`, so it has no Node.
      - name: Build and push the steward image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/jvm/Dockerfile
          build-args: MODULE=steward
          push: true
          tags: |
            ghcr.io/nordtal/steward:${{ env.VERSION }}

      # One image for all four Minecraft services, holding a JRE and entrypoint.sh but no Gradle output.
      - name: Build and push the minecraft image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/minecraft
          push: true
          tags: |
            ghcr.io/nordtal/minecraft:${{ env.VERSION }}

      # Caddy with `caddy-l4` for port 25565, built with xcaddy since modules are fixed at build time.
      - name: Build and push the caddy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/caddy
          push: true
          tags: |
            ghcr.io/nordtal/caddy:${{ env.VERSION }}

      # Carries compose.yml; deploy/nordtal.sh renews it from outside the stack.
      - name: Build and push the steward-agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/jvm/Dockerfile
          build-args: MODULE=steward-agent
          push: true
          tags: |
            ghcr.io/nordtal/steward-agent:${{ env.VERSION }}

      # The one image that holds the bank key; steward reaches it over an internal network only.
      - name: Build and push the steward-bunq image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/jvm/Dockerfile
          build-args: MODULE=steward-bunq
          push: true
          tags: |
            ghcr.io/nordtal/steward-bunq:${{ env.VERSION }}

      # Last: steward-agent and nordtal.sh take the newest published release for the one to install, so
      # every image it names has to be in the registry first. With assets, gh uploads them to a draft and
      # publishes it once they are all there.
      - name: Publish the release with its artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md" dist/*
