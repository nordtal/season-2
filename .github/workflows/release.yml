name: release

# Runs on a pushed release tag. The tag must match gradle.properties, and its commit must have a green
# build on main. The run creates the GitHub release last, with every asset, so a failed run publishes nothing.
on:
  push:
    tags: ["v*"]
  # Runs a release again after a failed run, or after a tag that was pushed before its build turned green.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.1.0"
        required: true

# Only the job that needs write access has it.
permissions:
  contents: read

# One build per tag, so that a hand-started re-run cannot upload the same assets twice.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
      packages: write
    # The tag is a dispatch input or a tag name, so it reaches scripts as a variable and never as text in a script.
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check the tag matches gradle.properties
        run: |
          tag="${RELEASE_TAG#v}"
          declared="$(grep '^version=' gradle.properties | cut -d= -f2)"
          if [ "$tag" != "$declared" ]; then
            echo "tag $RELEASE_TAG does not match version=$declared in gradle.properties" >&2
            exit 1
          fi
          echo "VERSION=$declared" >> "$GITHUB_ENV"

      # A release ships only a commit whose build on main is green, and only once.
      - name: Check the tag's commit has a green build on main and no release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          green="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$commit&branch=main&event=push&status=success" --jq .total_count)"
          if [ "$green" = 0 ]; then
            echo "$RELEASE_TAG is $commit, which has no successful build on main; once it has one:" >&2
            echo "  gh workflow run release.yml -f tag=$RELEASE_TAG" >&2
            exit 1
          fi
          # A draft is what a run leaves behind when it fails while uploading. It was never published.
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$draft" = false ]; then
            echo "$RELEASE_TAG is already a release" >&2
            exit 1
          fi
          if [ "$draft" = true ]; then
            gh release delete "$RELEASE_TAG" --yes
          fi

      # `check` runs before `releaseArtifacts`, so that a release never ships jars whose tests did not run.
      - name: Build and test every release artifact
        run: ./gradlew check releaseArtifacts imageContexts

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp limbo/build/libs/limbo-${VERSION}.jar dist/
          cp hunger-games/build/libs/hunger-games-${VERSION}.jar dist/
          cp smp/build/libs/smp-${VERSION}.jar dist/
          cp proxy/build/libs/proxy-${VERSION}.jar dist/
          cp bridge-mod/build/libs/nordtal-bridge-${VERSION}.jar dist/
          cp resource-pack/build/distributions/nordtal-resource-pack-${VERSION}.zip dist/
          cp resource-pack/build/distributions/nordtal-resource-pack-${VERSION}.zip.sha1 dist/
          ls -la dist

      # A client refuses a pack with a wrong hash or a wrong root pack.mcmeta, and the error shows only on join.
      - name: Verify the resource pack
        run: |
          zip="dist/nordtal-resource-pack-${VERSION}.zip"
          expected="$(cat "$zip.sha1" | tr -d '[:space:]')"
          actual="$(sha1sum "$zip" | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "$zip.sha1 says $expected but the zip hashes to $actual" >&2
            exit 1
          fi
          if ! unzip -Z1 "$zip" | grep -qx 'pack.mcmeta'; then
            echo "pack.mcmeta is not at the root of $zip; the client would refuse the pack" >&2
            unzip -Z1 "$zip" | head -20 >&2
            exit 1
          fi
          echo "pack ok: sha1 $actual, pack.mcmeta at the root"

      - name: Write the release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: ${{ runner.temp }}/notes.md

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every image but Caddy's is pushed under the version alone. A stack runs exactly one release, named by the tag
      # of steward-agent, and nothing pulls a moving tag. The source label links a package to a repository
      # on GHCR, and here it is always the repository that pushes it.
      - name: Build and push the bot image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/jvm/Dockerfile
          build-args: MODULE=discord-bot
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/nordtal/discord-bot:${{ env.VERSION }}

      # The bootstrap image that a fresh host pulls. The jar holds the frontend under `web/`, so the image needs no Node.
      - name: Build and push the steward image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/jvm/Dockerfile
          build-args: MODULE=steward
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/nordtal/steward:${{ env.VERSION }}

      # One image for all four Minecraft services. It holds a JRE and entrypoint.sh and no Gradle output.
      - name: Build and push the minecraft image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/minecraft
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/nordtal/minecraft:${{ env.VERSION }}

      # Caddy's tag is the hash of deploy/caddy that compose.yml names and `check` verified. A tag already in
      # the registry is never pushed again: a rebuild has another digest, and an update run would recreate
      # Caddy for it and disconnect every player.
      - name: Find whether the caddy image is in the registry
        id: caddy
        run: |
          tag="$(sed -n 's|^ *image: ${NORDTAL_IMAGES:-ghcr.io/nordtal}/caddy:\([0-9a-f]*\)$|\1|p' compose.yml)"
          [ -n "$tag" ] || { echo "compose.yml names no caddy tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Only an answer that the tag is missing leads to a push; any other failure fails the run.
          if answer="$(docker manifest inspect "ghcr.io/nordtal/caddy:$tag" 2>&1)"; then
            echo "ghcr.io/nordtal/caddy:$tag is in the registry, nothing to push"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          elif ! printf '%s' "$answer" | grep -qi 'manifest unknown\|not found'; then
            echo "$answer" >&2
            exit 1
          fi

      # Caddy with `caddy-l4` for port 25565, built with xcaddy, because modules are fixed at build time.
      - name: Build and push the caddy image
        if: steps.caddy.outputs.pushed != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/caddy
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/nordtal/caddy:${{ steps.caddy.outputs.tag }}

      # The image carries compose.yml. deploy/nordtal.sh renews it from outside the stack.
      - name: Build and push the steward-agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/jvm/Dockerfile
          build-args: MODULE=steward-agent
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/nordtal/steward-agent:${{ env.VERSION }}

      # The one image that holds the bank key. steward reaches it only over an internal network.
      - name: Build and push the steward-bunq image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/jvm/Dockerfile
          build-args: MODULE=steward-bunq
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/nordtal/steward-bunq:${{ env.VERSION }}

      # This step runs last. steward-agent and nordtal.sh take the newest published release as the one to
      # install, so every image that it names must be in the registry first. With assets, gh uploads them
      # to a draft and publishes the draft when all are there.
      - name: Publish the release with its artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md" dist/*
