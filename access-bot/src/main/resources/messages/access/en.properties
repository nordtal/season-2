# Season 2 access bot - English. This file is the fallback for every other language: a key that is
# missing here shows up on screen as the key itself, so keep it complete.
#
# Parameters are named and written in braces, substituted by eu.nordtal.s2.common.message.Messages.
# A placeholder with no matching parameter is left in the text on purpose - it is visible in a
# screenshot instead of silently blank.

# ---------------------------------------------------------------- the managed contribution message
contribution.title=Access to nordtal
contribution.body=Playing on nordtal needs an access period. Buy one below - it is bound to your \
  Discord account, and the Minecraft account you link to it may join for as long as it runs.
contribution.prices=Prices
contribution.tier-line={days} days - {price}
contribution.donation=Optional: add {amount} when you buy and keep a permanent donor role.
contribution.renew=Buying again while your access is still running adds the new period to the end \
  of the old one. You never lose paid time by renewing early.
contribution.button=Buy access

# ---------------------------------------------------------------- the managed link message
link.title=Link your Minecraft account
link.body=Log in to the server once. You will be disconnected with a code; type that code here to \
  link your Minecraft account to this Discord account.
link.unlink-hint=Already linked and want to link a different account? Use /unlink first - it takes \
  effect immediately.
link.button=Enter my code

# ---------------------------------------------------------------- the link modal
link.modal.title=Link your account
link.modal.code-label=Code
link.modal.code-placeholder=The code shown on the login screen
link.success=Your Minecraft account is now linked. You can log in to the server.
link.invalid-code=That code is wrong or has expired. Log in to the server again to get a new one.
link.already-linked=You already have a Minecraft account linked. Use /unlink first if you want to \
  link a different one.
link.failed=Something went wrong while linking your account. An admin has been told; please try \
  again in a few minutes.

# ---------------------------------------------------------------- /unlink
unlink.success=Your Minecraft account has been unlinked.
unlink.none=You do not have a Minecraft account linked.

# ---------------------------------------------------------------- the purchase flow
purchase.choose=How long do you want access for?
purchase.option={days} days - {price}
purchase.summary=**{days} days of access** for {price}.
purchase.summary.donation=Including a {donation} donation, which grants the permanent donor role.
purchase.summary.total=Total: **{total}**
purchase.button.confirm=Get the payment link
purchase.button.change=Change
purchase.button.donation.add=Add a {amount} donation
purchase.button.donation.remove=Remove the donation
purchase.link=Pay **{total}** here: {url}
purchase.link.reference=Reference **{reference}**. Do not change the description - it is how the \
  payment finds its way back to you.
purchase.link.ttl=This link is valid for {hours} hours.
purchase.gone=That purchase is no longer open. Start a new one from the button in the channel.
purchase.tier-gone=That option is not on offer any more. Start again to see the current prices.
purchase.failed=Something went wrong while creating the payment link. An admin has been told; \
  please try again in a few minutes.

# ---------------------------------------------------------------- direct messages
dm.granted=Your access is active until **{until}**. Have fun on nordtal.
dm.granted.short=You paid {paid}, which covers **{days} days**. Your access is active until \
  **{until}**.
dm.donor=Thank you for the donation - the donor role is yours to keep.
dm.expiring=Your access to nordtal runs out on **{until}**, in {days} days. Buy more in the \
  contribution channel to add time to the end of it.
dm.expired=Your access to nordtal has run out. Buy a new period in the contribution channel \
  whenever you want to come back.
dm.granted.admin=An admin granted you **{days} days** of access. It is active until **{until}**.
dm.revoked=Your access to nordtal was revoked by an admin.

# ---------------------------------------------------------------- public
public.donation={user} donated {amount}. Thank you!
