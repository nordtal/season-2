import xyz.jpenilla.runtask.task.AbstractRun

plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.1.0"
    id("com.gradleup.shadow") version "9.6.1"
}

group = 'eu.nordtal'
version = '2.1.0'

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
    maven { url = "https://repo.codemc.io/repository/maven-releases/" }
    maven { url = "https://repo.extendedclip.com/releases/" }
    maven { url = "https://jitpack.io" }   // TAB-API and jcore
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.2.build.120-stable")
    compileOnly("com.github.retrooper:packetevents-spigot:2.13.0")
    compileOnly("me.clip:placeholderapi:2.12.3")
    compileOnly("com.github.NEZNAMY:TAB-API:6.1.2")

    implementation(project(":api"))

    // The configuration system. jcore vendors Spec (the library this plugin used directly until
    // 3.0.0) and hardens it: unknown keys abort instead of being deleted silently, writes are
    // atomic, reload is locked, and the Gson number policy this file used to have to set itself
    // is applied there now.
    //
    // Only eu.nordtal.jcore.config is used here. jcore also exports its JDBI/HikariCP/Flyway
    // persistence layer, which is another ~8 MB of shaded jar this plugin has no use for, so the
    // whole persistence side is excluded. If this plugin ever needs a database, drop the
    // exclusions rather than adding a second dependency.
    implementation("com.github.nordtal:jcore:3.0.0") {
        exclude group: "org.jdbi"
        exclude group: "com.zaxxer"
        exclude group: "org.flywaydb"
        exclude group: "org.postgresql"
        exclude group: "org.apache.commons"
        exclude group: "commons-io"
    }

    // Paper 26.2 ships gson 2.14.0 and snakeyaml 2.6 in its libraries/ directory and the plugin
    // classloader resolves both - verified on this repo's own runServer on 2026-08-30 with
    // Class.forName in onEnable. They are compileOnly so they stay out of the shaded jar; see
    // the shadowJar block.
    compileOnly("com.google.code.gson:gson:2.14.0")
    compileOnly("org.yaml:snakeyaml:2.6")

}

tasks {
    runServer {
        minecraftVersion("26.2")
        downloadPlugins {
            modrinth("packetevents", "2.13.0+spigot")
            hangar("PlaceholderAPI", "2.12.3")
            // TAB publishes several Modrinth versions numbered "6.1.2" (modern, legacy 1.7-1.12 and
            // 1.20.5-1.21.4). The version number alone resolves to the wrong one, so pin the id of
            // the 26.2 build.
            modrinth("tab-was-taken", "Za7G9fdJ")
        }
    }

    // shadowJar takes over the plain artifact name, so the thin jar has to move out of the way -
    // otherwise both tasks write to build/libs/papermc-display-tags-<version>.jar.
    jar {
        archiveClassifier.set("thin")
    }

    shadowJar {
        // jcore's config package is already under eu.nordtal, so there is nothing to relocate -
        // the old relocate("revxrsal.spec", "eu.nordtal.libs.spec") is gone with the direct
        // Spec dependency.
        //
        // Gson and SnakeYAML come from Paper at runtime (see the dependency block). Excluding
        // them keeps a second copy out of the jar and avoids a version clash with the platform's
        // own. If a future Paper release stops shipping either, this is what breaks - re-run the
        // Class.forName check before bumping the platform.
        dependencies {
            exclude(dependency("com.google.code.gson:gson"))
            exclude(dependency("org.yaml:snakeyaml"))
        }

        archiveClassifier.set("")
    }

    build {
        dependsOn(shadowJar)
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.withType(AbstractRun.class).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        vendor = JvmVendorSpec.JETBRAINS
        languageVersion = JavaLanguageVersion.of(25)
    }
    jvmArgs("-XX:+AllowEnhancedClassRedefinition")
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

// A source file Git ignores compiles here and does not exist on a fresh checkout, which makes the
// local build and CI two different programs. nordtal/season-2 lost a release to exactly that on
// 2026-09-02: an unanchored `run/` in .gitignore matched the Java package eu.nordtal.s2.updater.run
// as readily as the server working directory, and an *ignored* file is not an untracked one -
// `git status` stayed clean the whole time. .gitignore is anchored here for the same reason; this
// asks Git the question anyway, on every `./gradlew build`, before the commit that would hide it.
allprojects { proj ->
    proj.plugins.withId('java') {
        def repositoryRoot = rootProject.layout.projectDirectory.asFile
        def sourceDirectories = proj.sourceSets.collect { it.allSource.srcDirs }.flatten()

        def checkSourcesTracked = proj.tasks.register('checkSourcesTracked') {
            group = 'verification'
            description = 'Fails when a source file is ignored by Git and therefore missing from the repository.'

            // .gitignore, the global ignore file and the index are inputs no task can declare, so
            // there is no honest up-to-date check here. The work is one `git` call.
            outputs.upToDateWhen { false }

            doLast {
                if (!new File(repositoryRoot, '.git').exists()) {
                    return
                }
                def pathspecs = sourceDirectories.findAll { it.directory }
                        .collect { dir -> repositoryRoot.toPath().relativize(dir.toPath()).collect { it.toString() }.join('/') }
                        .sort()
                if (pathspecs.isEmpty()) {
                    return
                }

                // Untracked *and* ignored: a tracked file that happens to match an ignore rule is
                // still in the repository, which is all this cares about.
                def command = ['git', 'ls-files', '--others', '--ignored', '--exclude-standard', '-z', '--'] + pathspecs
                def out = new StringBuilder()
                def err = new StringBuilder()
                def process = command.execute(null as List, repositoryRoot)
                process.waitForProcessOutput(out, err)
                if (process.exitValue() != 0) {
                    throw new GradleException("`${command.join(' ')}` failed with exit code ${process.exitValue()}:\n${err}")
                }

                def ignored = out.toString().split('\u0000').findAll { !it.trim().isEmpty() }
                if (!ignored.isEmpty()) {
                    throw new GradleException(
                            "Git ignores these files, so they are not in the repository:\n" +
                            ignored.collect { "    $it" }.join('\n') + "\n\n" +
                            "They sit under a source directory of ${proj.path}, so this build sees them and a\n" +
                            "build from a fresh checkout does not. Find the rule with\n" +
                            "    git check-ignore -v <path>\n" +
                            "and anchor it in .gitignore (`/*/run/`, never a bare `run/`), then `git add` the files.")
                }
            }
        }

        proj.tasks.named('check') { dependsOn(checkSourcesTracked) }
    }
}
