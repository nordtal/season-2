# Deutsche Fassung von messages/commands/en.properties. Die Regeln stehen dort; die wichtigste:
# KEINE AUSZEICHNUNG in dieser Datei, weil dieselbe Zeile auf Minecraft (MiniMessage) und in
# Discord (eigenes Markdown) gerendert wird und jede Auszeichnung auf der jeweils anderen Seite als
# Text erscheint.
#
# UTF-8, Umlaute als Umlaute. Eine fortgesetzte Zeile endet mit einem LEERZEICHEN vor dem
# Backslash - Properties.load entfernt die Einrückung der Folgezeile.

# ---------------------------------------------------------------- jeder Befehl

command.not-admin=Du bist kein Admin. Das entscheidet die Admin-Rolle im nordtal-Discord und sonst \
  nichts - es gibt keine zweite Liste, und kein Permission-Node vergibt es.
command.confirm.retype=Das lässt sich nicht rückgängig machen. Führe {command} innerhalb von \
  {seconds} Sekunden erneut aus, um es zu bestätigen.
command.confirm.expired=Die Bestätigung ist abgelaufen, es wurde nichts geändert. Führe {command} \
  erneut aus, um von vorne zu beginnen.
command.cancelled=Abgebrochen. Es wurde nichts geändert.
command.confirm.yes=Ja, ausführen
command.confirm.no=Abbrechen

# ------------------------------------------ ein Befehl, der reisen muss
#
# Ein Befehl, der auf einer Oberfläche eingegeben wird, deren Prozess ihn nicht ausführen kann,
# wird zu einer Zeile in command_request, adressiert an den Prozess, dem die Wirkung gehört. Das
# sind die einzigen Sätze, die die fragende Seite selbst erzeugt; alles andere kam wörtlich zurück.

command.remote.sent=Abgeschickt - zuständig ist {target}. Die Antwort kommt hier an.
command.remote.no-answer=Keine Antwort innerhalb von 30 Sekunden - {target} ist entweder aus oder \
  hört nicht zu, und nichts wurde geändert. Die Anfrage hat nie jemand angenommen.
command.remote.still-running=Die Anfrage wurde genau dann angenommen, als die Wartezeit ablief - \
  sie läuft also, und die Antwort erreicht diese Nachricht nicht mehr. Führe den Befehl dort aus, \
  wo er hingehört, um das Ergebnis zu sehen.
command.remote.failed=Das wurde nicht ausgeführt. Was schiefging, steht im Log des Prozesses, dem \
  der Befehl gehört.
command.remote.unknown={command} kennt dieser Prozess nicht. Die beiden laufen auf verschiedenen \
  Versionen; nichts wurde geändert.
command.remote.arguments={command} kam mit Argumenten an, die dieser Prozess nicht lesen konnte, \
  also wurde nichts geändert. Die beiden laufen auf verschiedenen Versionen.
command.remote.silent=Erledigt. Der Befehl hat etwas geändert und nichts dazu gesagt.

command.target.SMP=der SMP-Server
command.target.HUNGER_GAMES=der Hunger-Games-Server
command.target.LIMBO=der Warteraum
command.target.PROXY=der Proxy
command.target.BOT=der Discord-Bot

# ---------------------------------------------------------------- /phase

phase.current=Das Netzwerk ist in {phase}.
phase.current.unread=Das Netzwerk konnte seit dem Start dieses Prozesses nicht gelesen werden und \
  gilt deshalb als {phase}. In diesem Zustand kommt niemand außer Admins herein.
phase.dates=Das Netzwerk öffnet: {launch}. Bezahlter Zugang läuft ab: {smpStart}. Beide werden von \
  Hand gesetzt, und keines wechselt die Phase, wenn es vorbei ist - das bleibt /phase set. Zeiten \
  in {zone}.
phase.read.failed=Die Saisondaten konnten nicht gelesen werden - die Datenbank hat nicht \
  geantwortet. Die Phase oben ist das, was dieser Prozess zuletzt gesehen hat, und kann veraltet \
  sein.
phase.unknown=Unbekannte Phase: {value}. Eine von: {phases}
phase.changed=Saisonphase gewechselt: {previous} -> {current}. Der Wechsel steht im Audit-Log und \
  jeder Prozess übernimmt ihn innerhalb von dreißig Sekunden.
phase.unchanged=Das Netzwerk war bereits in {phase}. Der Wechsel wurde trotzdem im Audit-Log \
  festgehalten.
phase.failed=Die Phase konnte nicht gewechselt werden - die Datenbank hat den Schreibvorgang \
  nicht angenommen. Wenn die Datenbank selbst ausgefallen ist, hilft kein Befehl; letztes Mittel \
  ist ein UPDATE auf die season_phase-Zeile von Hand.
phase.confirm=Saisonphase von {previous} auf {current} wechseln? {consequence}
phase.confirm.same=Das Netzwerk ist bereits in {current}. Der Wechsel schreibt die Zeile und den \
  Audit-Eintrag erneut und ändert sonst nichts. {consequence}
phase.consequence.PRE_LAUNCH=Das Netzwerk schließt. Nur Admins kommen herein; alle anderen werden \
  getrennt und sehen den Countdown zur Eröffnung. Das ist ein Schritt zurück vor die Eröffnung und \
  keine Pause - für eine Pause ist MAINTENANCE da.
phase.consequence.PRE_EVENT=Alle Online-Spieler werden nach hunger-games verschoben. In dieser \
  Phase ist kein Zugang nötig - ein verknüpftes, nicht gebanntes Mitglied genügt.
phase.consequence.START_EVENT=Alle Online-Spieler werden nach hunger-games verschoben. In dieser \
  Phase ist kein Zugang nötig - ein verknüpftes, nicht gebanntes Mitglied genügt.
phase.consequence.SMP=Alle Online-Spieler werden nach smp verschoben, und jeder Spieler ohne \
  aktiven Zugang wird mit der Meldung des Login-Gates getrennt.
phase.consequence.MAINTENANCE=Nur Admins kommen herein. Alle anderen werden in limbo gehalten oder \
  abgewiesen.
phase.date.confirm={what} auf {when} setzen? Jeder Zugangszeitraum, der noch nicht begonnen hat, \
  wird mitverschoben, über alle Konten hinweg - und das Datum später zurückzusetzen verschiebt sie \
  erneut, statt das hier rückgängig zu machen.
phase.date.invalid=Das ist kein Datum. Schreib es als "{pattern}" in {zone}-Zeit - zum Beispiel \
  "2026-10-01 18:00" - oder "{clear}", um das Datum wieder zu entfernen.
phase.date.set={what} am {current} (vorher {previous}).
phase.date.unchanged={what} am {current} - das stand da schon.
phase.date.cleared=Für {what} gibt es kein Datum mehr. Ab jetzt gekaufter Zugang startet sofort, \
  und der Bot warnt bei jedem solchen Kauf.
phase.date.moved={grants} Zugangszeitraum/-räume von {accounts} Konto/Konten mitverschoben. \
  Gestapelte Zeiträume bleiben gestapelt, niemandes Dauer ändert sich.
phase.date.none-moved=Es musste kein Zugang verschoben werden.
phase.date.kept=Der bereits verkaufte Zugang wurde nicht verschoben - es gibt kein Datum mehr, an \
  dem er hängen könnte, also behält jeder sein Fenster.
phase.date.refused={reason}
phase.date.failed=Das Datum konnte nicht geschrieben werden - die Datenbank hat es abgelehnt. \
  Es wurde nichts geändert.
phase.date.what.launch=wann das Netzwerk öffnet
phase.date.what.smp-start=wann bezahlter Zugang zu laufen beginnt
