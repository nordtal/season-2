# Deutsche Fassung von messages/commands/en.properties; die Regeln stehen dort.
# Keine Auszeichnung: dieselbe Zeile wird in Minecraft als MiniMessage und in Discord als Markdown gerendert.
# UTF-8. Eine fortgesetzte Zeile endet mit einem Leerzeichen vor dem Backslash.

# ---------------------------------------------------------------- jeder Befehl

command.not-admin=Du bist kein Admin. Das entscheidet die Admin-Rolle im nordtal-Discord und sonst \
  nichts - es gibt keine zweite Liste, und kein Permission-Node vergibt es.
command.confirm.retype=Das lässt sich nicht rückgängig machen. Führe {command} innerhalb von \
  {seconds} Sekunden erneut aus, um es zu bestätigen.
command.confirm.expired=Die Bestätigung ist abgelaufen, es wurde nichts geändert. Führe {command} \
  erneut aus, um von vorne zu beginnen.
command.cancelled=Abgebrochen. Es wurde nichts geändert.
command.confirm.yes=Ja, ausführen
command.confirm.no=Abbrechen

# Eine Zeile für einen unbekannten und einen verbotenen Befehl, damit ein getippter Name nichts verrät; nicht aufteilen.
command.unknown=Diesen Befehl gibt es nicht.

command.player-offline=Auf diesem Server ist niemand mit diesem Namen online. Gesucht wird nach \
  dem genauen Namen, und nur unter denen, die gerade hier sind.
command.not-a-choice="{typed}" ist kein Wert, den {argument} annimmt. Möglich ist: {choices}.

# ----------------------------------------------------------- Hilfe und Syntax
#
# Ersetzt Brigadiers Parserfehler. Der Adapter füllt nur {usage}, {what} und {command}, daher kann
# ein Override des Operators die ganze Ausgabe umgestalten.

command.help.header={command} kennt diese:
command.help.line=\ \ {usage} - {what}
command.help.usage=Syntax: {usage}
command.help.what={what}
command.help.nothing=Hier lässt sich nichts ausführen.

command.describe.smp.reload=Liest Sounds, Milestone-Track und Nachrichten neu ein. config.yml \
  absichtlich nicht.
command.describe.smp.objective.complete=Schließt ein Ziel des aktiven Milestones von Hand ab und \
  zahlt aus, was tatsächlich gesammelt wurde.
command.describe.smp.milestone.unlock=Schaltet einen ganzen Milestone von Hand frei und zahlt alle \
  aus, die dafür in Frage kamen.
command.describe.smp.aura=Fügt Aura hinzu oder zieht sie ab, mit festgehaltenem Grund und Urheber.
command.describe.smp.access=Zeigt, ob jemand verknüpft ist, Zugang hat und gerade mitten in einem \
  Kauf steckt.

command.not-from-console=Dieser Befehl lässt sich nicht von der Konsole ausführen. Er hält fest, \
  wer die Entscheidung getroffen hat, und die Konsole ist niemand Bestimmtes - führe ihn im Spiel \
  oder in Discord aus.

# Ein command.not-in-game gibt es nicht; siehe en.properties an derselben Stelle.

command.account-unreachable=Unter diesem Namen ist kein Discord-Konto erreichbar. Entweder ist \
  niemand mit diesem Namen hier online, oder er ist es und hat nie verknüpft - und im Spiel führt \
  der Weg zu einem Discord-Konto nur über die Verknüpfung.

# ------------------------------------------ ein Befehl, der reisen muss
#
# Die einzigen Sätze, die die fragende Seite einer command_request-Zeile selbst schreibt.

command.remote.sent=Abgeschickt - zuständig ist {target}. Die Antwort kommt hier an.
command.remote.no-answer=Keine Antwort innerhalb von 30 Sekunden - {target} ist entweder aus oder \
  hört nicht zu, und nichts wurde geändert. Die Anfrage hat nie jemand angenommen.
command.remote.still-running=Die Anfrage wurde genau dann angenommen, als die Wartezeit ablief - \
  sie läuft also, und die Antwort erreicht diese Nachricht nicht mehr. Führe den Befehl dort aus, \
  wo er hingehört, um das Ergebnis zu sehen.
command.remote.failed=Das wurde nicht ausgeführt. Was schiefging, steht im Log des Prozesses, dem \
  der Befehl gehört.
command.remote.unknown={command} kennt dieser Prozess nicht. Die beiden laufen auf verschiedenen \
  Versionen; nichts wurde geändert.
command.remote.arguments={command} kam mit Argumenten an, die dieser Prozess nicht lesen konnte, \
  also wurde nichts geändert. Die beiden laufen auf verschiedenen Versionen.
command.remote.silent=Erledigt. Der Befehl hat etwas geändert und nichts dazu gesagt.

command.target.SMP=der SMP-Server
command.target.HUNGER_GAMES=der Hunger-Games-Server
command.target.LIMBO=der Warteraum
command.target.PROXY=der Proxy
command.target.BOT=der Discord-Bot

# ---------------------------------------------------------------- /smp

smp.access.active=Zugang läuft bis {until}.
smp.access.expired=Kein aktiver Zugang - der letzte Zeitraum endete am {since}.
smp.access.failed=Das konnte nicht gelesen werden - die Datenbank hat nicht geantwortet.
smp.access.linked={player.name} ist mit dem Discord-Konto {discord.name} verknüpft.
smp.access.never=Für dieses Konto wurde noch nie Zugang gekauft.
smp.access.no-payment=Es läuft kein Kauf.
smp.access.payment=Offener Kauf {reference}: {days} Tage, {amount} EUR, begonnen am {since}. Der \
  Zahlungslink existiert; bezahlt wurde noch nicht.
smp.access.payment-unknown=Der offene Kauf konnte nicht gelesen werden. Alles darüber gilt trotzdem.
smp.access.payment-unstarted=Offener Kauf {reference}: {days} Tage, begonnen am {since} - es wurde \
  nie ein Zahlungslink erstellt. Abgebrochen, bevor einer angefordert wurde.
smp.access.unlinked={player.name} hat kein verknüpftes Discord-Konto. Damit hätte der Login-Gate gar \
  nicht passiert werden dürfen - hier stimmt etwas anderes nicht.
smp.admin.aura-changed=Die Aura von {player.name} wurde um {delta} geändert, der Grund ist \
  festgehalten.
smp.admin.aura-unknown=Die Aura-Änderung für {player.name} ({delta}) ist mittendrin \
  fehlgeschlagen. Sie kann gebucht sein oder nicht - sieh nach, bevor du es erneut \
  versuchst.
smp.admin.milestone-unlocked=Milestone {key} wurde freigeschaltet, und alle, die dafür in Frage \
  kamen, sind ausgezahlt.
smp.admin.no-active-milestone=Es ist kein Milestone aktiv, also kann kein Ziel abgeschlossen werden.
smp.admin.nothing-to-unlock=Es ist kein Milestone aktiv, also gibt es nichts freizuschalten.
smp.admin.milestone-not-active=Milestone {key} ist nicht der aktive. Nur {milestone.name} kann freigeschaltet werden.
smp.admin.no-such-objective=Der aktive Milestone hat kein Ziel mit diesem Schlüssel.
smp.admin.player-offline=Dieser Spieler ist nicht online.
smp.admin.reloaded=Die Sounds, der Milestone-Track und die Nachrichten wurden neu geladen. In \
  der Konsole steht, ob eines der drei abgelehnt wurde.
smp.admin.track-refused=Die Sounds und die Nachrichten wurden neu geladen, der Milestone-Track \
  NICHT - die Datei widerspricht Fortschritt, den diese Saison bereits festgehalten hat. Der \
  laufende Track bleibt unverändert:\n{problems}

smp.admin.target-unlinked={player.name} hat kein verknüpftes Discord-Konto, es gibt also nichts, dem \
  Aura gutgeschrieben werden könnte.

smp.admin.objective-completed=Ziel {key} von Milestone {milestone.name} wurde von Hand abgeschlossen. \
  Ausgezahlt wurde, was tatsächlich gesammelt wurde, nicht der ganze Topf.
smp.admin.reload-failed=Mindestens eines der drei konnte nicht neu gelesen werden. In der Konsole \
  steht, welches; alles Geladene gilt, alles andere bleibt unverändert.
smp.admin.read-failed=Das ging nicht - die Datenbank hat nicht geantwortet. Nichts wurde geändert.

# ---------------------------------------------------------------- /hg

hg.admin.reload-failed=Es konnte nicht alles neu geladen werden; was fehlschlug, bleibt \
  unverändert. Welche Hälfte und warum, steht in der Konsole.
hg.admin.reloaded=Die Nachrichten und sounds.yml wurden neu geladen. config.yml wird absichtlich \
  nicht neu gelesen: ein laufendes Spiel ist eine laufende Uhr.
hg.ready-status.header=Team-Bereitschaft:
hg.ready-status.line={team.name} - {status}
hg.ready-status.not-ready=nicht bereit
hg.ready-status.ready=bereit
hg.start.below-hard-minimum=Es werden mindestens {minimum} Teilnehmer benötigt - darunter teilt \
  die Grenzverkleinerung durch null. Nur {count} sind registriert und anwesend.
hg.start.below-soft-minimum=Nur {count} Teilnehmer sind registriert und anwesend, unter dem \
  empfohlenen Minimum von {minimum}. Führe "/hg start confirm" innerhalb von {seconds} Sekunden \
  aus, um trotzdem zu starten.
hg.start.confirm-expired=Das Bestätigungsfenster ist abgelaufen. Führe "/hg start" erneut aus.
hg.start.no-game=Es ist gerade kein Hunger-Games-Event registriert.
hg.start.started=Das Hunger-Games-Event startet! {count} Teilnehmer werden zu ihren Spawn-Türmen \
  teleportiert.
hg.start.wrong-state=Das Event kann in seinem aktuellen Zustand ({state}) nicht gestartet werden.
hg.start.wrong-phase=Das Event kann nur im Start-Event gestartet werden; das Netzwerk ist in {phase}.

hg.start.read-failed=Die Anmeldung konnte nicht gelesen werden - die Datenbank hat nicht \
  geantwortet. Es wurde nichts gestartet.
hg.start.failed=Das Event konnte nicht gestartet werden. Es ist als gestartet vermerkt, also \
  sieh zuerst auf dem Server nach - den Befehl einfach noch einmal einzugeben ist hier falsch.

command.describe.hg.start=Startet das Hunger-Games-Event. Warnt vorher, wenn weniger als die \
  empfohlene Zahl an Teilnehmern angemeldet ist.
command.describe.hg.ready-status=Listet jedes angemeldete Team auf und ob es sich bereit gemeldet hat.
command.describe.hg.reload=Liest Nachrichten und sounds.yml neu ein. config.yml absichtlich nicht: \
  ein laufendes Spiel ist eine laufende Uhr.

# ---------------------------------------------------------------- /limbo
#
# Keine Farbe hier; das Bündel von limbo kann beide Schlüssel neu deklarieren und sie zurückgeben.

limbo.admin.reloaded=Die Nachrichten wurden neu geladen. config.yml wird absichtlich nicht \
  neu gelesen - die Wartewelt lässt sich nicht unter den Spielern neu bauen, die darin stehen.
limbo.admin.reload-failed=Die Nachrichten konnten nicht neu geladen werden; die laufenden \
  bleiben unverändert. Warum, steht in der Konsole.

command.describe.limbo.reload=Liest die Nachrichten des Warteraums neu ein. config.yml absichtlich \
  nicht: die Wartewelt lässt sich nicht unter den Spielern neu bauen, die darin stehen.

# ---------------------------------------------------------------- /network

network.reloaded=Die Nachrichten wurden neu geladen. Die Konfigurationsdateien werden \
  absichtlich nicht neu gelesen: jede von ihnen hängt an etwas, das ein laufender Proxy nicht \
  austauschen kann.
network.reload-failed=Die Nachrichten konnten nicht neu geladen werden; die laufenden bleiben \
  unverändert. Warum, steht in der Konsole.

command.describe.network.reload=Liest die Nachrichten des Proxys neu ein - die MOTD und jeden \
  Trennbildschirm. Die Konfigurationsdateien absichtlich nicht.

# ------------------------------------- die Spielerbefehle, und nur unsere eigenen
#
# Kein Admin-Befehl: das bleibt einem Spieler, nachdem network.yml die Vanilla-Befehle weggenommen hat.
# /msg, /whisper, /r, /discord und /rules stehen im eigenen Bündel des Proxys.

command.confirm.discord=Das lässt sich nicht rückgängig machen: {command}. Zum Ausführen den roten \
  Knopf drücken.
command.confirm.stale=Dieser Knopf stammt aus einer älteren Version des Bots oder gehört zu einem \
  Befehl, den es nicht mehr gibt. Es ist nichts passiert - führe den Befehl noch einmal aus.
command.player-unlinked={player.name} hat kein verknüpftes Minecraft-Konto, es gibt also niemanden, auf \
  den dieser Befehl wirken könnte.

# announce: was der Bot von sich aus in die Ankündigungskanäle von Discord schreibt
announce.phase=Das Netzwerk ist jetzt in {phase} (vorher {previous}).

