# Message bundle for eu.nordtal.s2.commands - every string a SHARED command says back.
#
# WHY THESE KEYS ARE NOT IN A PROCESS'S OWN BUNDLE
# A command declared once and adapted per surface has to say the same sentence on every surface, so
# its text belongs to the command and not to whichever process happens to be answering. Every
# process that adapts one of these loads this bundle underneath its own; keys of the same name in
# the process's bundle win, which is what lets a surface reword a line without editing this file.
#
# NO MARKUP IN THIS FILE. Deliberate, and it costs something. Paper and Velocity render MiniMessage;
# Discord renders its own markdown; a string carrying either shows the other one's tags as literal
# text. The bot's /phase confirmation used **bold** for the phase names until 2026-09-04 and lost it
# here - which is the price of the same sentence existing once, in two languages, instead of twice
# in one. A key that genuinely needs styling on one surface belongs in that process's own bundle.
#
# UTF-8. A continued line ends with a SPACE before the backslash: Properties.load strips the next
# line's indentation, and BundleContinuationTest fails the build over a missing one.

# ---------------------------------------------------------------- any command

command.not-admin=You are not an admin. This is decided by the admin role in the nordtal Discord \
  and by nothing else - there is no second list, and no permission node grants it.
command.confirm.retype=This cannot be undone. Run {command} again within {seconds} seconds to \
  confirm it.
command.confirm.expired=That confirmation timed out and nothing was changed. Run {command} again \
  to start over.
command.cancelled=Cancelled. Nothing was changed.
command.confirm.yes=Yes, do it
command.confirm.no=Cancel

# ---------------------------------------------------------------- /phase

phase.current=The network is in {phase}.
phase.current.unread=The network has not been readable since this process started, so it is being \
  treated as {phase}. Nobody but an admin can join in that state.
phase.dates=The network opens: {launch}. Paid access starts running: {smpStart}. Both are set by \
  hand and neither switches the phase when it passes - that stays /phase set. Times are {zone}.
phase.read.failed=The season dates could not be read - the database did not answer. The phase \
  above is what this process last saw, which may be out of date.
phase.unknown=Unknown phase: {value}. One of: {phases}
phase.changed=Season phase switched: {previous} -> {current}. It is written to the audit log and \
  every process picks it up within thirty seconds.
phase.unchanged=The network was already in {phase}. The switch was recorded in the audit log \
  anyway.
phase.failed=The phase could not be switched - the database did not accept the write. If the \
  database itself is down, no command can fix this; the last resort is an UPDATE on the \
  season_phase row by hand.
phase.confirm=Switch the season phase from {previous} to {current}? {consequence}
phase.confirm.same=The network is already in {current}. Switching writes the row and the audit \
  entry again and changes nothing else. {consequence}
phase.consequence.PRE_LAUNCH=The network closes. Only admins get in; everybody else online is \
  disconnected and sees the countdown to the opening. This is going back before the opening, not \
  pausing - use MAINTENANCE for a pause.
phase.consequence.PRE_EVENT=Everyone online is moved to hunger-games. Access is not required in \
  this phase - a linked, non-banned member is enough.
phase.consequence.START_EVENT=Everyone online is moved to hunger-games. Access is not required in \
  this phase - a linked, non-banned member is enough.
phase.consequence.SMP=Everyone online is moved to smp, and every player without active access is \
  disconnected with the message the login gate uses.
phase.consequence.MAINTENANCE=Only admins get in. Everyone else online is held in limbo or refused.
phase.date.confirm=Set {what} to {when}? Every access period that has not started yet moves with \
  it, across every account - and moving the date back later shifts them again rather than undoing \
  this.
phase.date.invalid=That is not a date. Type it as "{pattern}" in {zone} time - for example \
  "2026-10-01 18:00" - or "{clear}" to take the date away again.
phase.date.set={what} on {current} (was {previous}).
phase.date.unchanged={what} on {current}, which is what it already said.
phase.date.cleared=There is no date for {what} any more. Access bought from now on starts \
  immediately, and the bot warns on every such purchase.
phase.date.moved=Moved {grants} access period(s) belonging to {accounts} account(s) to match. \
  Stacked periods stay stacked and nobody's length changed.
phase.date.none-moved=No access had to move.
phase.date.kept=The access already sold did not move - there is no date left to anchor it to, so \
  everybody keeps the window they have.
phase.date.refused={reason}
phase.date.failed=The date could not be written - the database did not accept it. Nothing was \
  changed.
phase.date.what.launch=when the network opens
phase.date.what.smp-start=when paid access starts running
