# Message bundle for eu.nordtal.s2.commands - every string a SHARED command says back.
#
# WHY THESE KEYS ARE NOT IN A PROCESS'S OWN BUNDLE
# A command declared once and adapted per surface has to say the same sentence on every surface, so
# its text belongs to the command and not to whichever process happens to be answering. Every
# process that adapts one of these loads this bundle underneath its own; keys of the same name in
# the process's bundle win, which is what lets a surface reword a line without editing this file.
#
# NO MARKUP IN THIS FILE. Deliberate, and it costs something. Paper and Velocity render MiniMessage;
# Discord renders its own markdown; a string carrying either shows the other one's tags as literal
# text. The bot's /phase confirmation used **bold** for the phase names until 2026-09-04 and lost it
# here - which is the price of the same sentence existing once, in two languages, instead of twice
# in one. A key that genuinely needs styling on one surface belongs in that process's own bundle.
#
# UTF-8. A continued line ends with a SPACE before the backslash: Properties.load strips the next
# line's indentation, and BundleContinuationTest fails the build over a missing one.

# ---------------------------------------------------------------- any command

command.not-admin=You are not an admin. This is decided by the admin role in the nordtal Discord \
  and by nothing else - there is no second list, and no permission node grants it.
command.confirm.retype=This cannot be undone. Run {command} again within {seconds} seconds to \
  confirm it.
command.confirm.expired=That confirmation timed out and nothing was changed. Run {command} again \
  to start over.
command.cancelled=Cancelled. Nothing was changed.
command.confirm.yes=Yes, do it
command.confirm.no=Cancel

command.player-offline=No player by that name is online on this server. The lookup is by exact \
  name and only covers who is here right now.

# ------------------------------------------------------------- help and usage
#
# Printed instead of Brigadier's "Unknown or incomplete command, see below for error", which is an
# answer about the parser rather than about the command. Every usage line is derived from the
# declaration (Declaration#usage), so it cannot drift from what actually parses; every describe key
# is derived from the path, and CatalogueTest fails the build if one is missing in either language.
#
# THE FORMAT IS THESE FOUR KEYS AND NOTHING ELSE. The adapter composes no text of its own - it fills
# {usage}, {what} and {command} and sends the result. So the whole shape of the help output is
# changeable without a release, through the operator's message override
# (see docs/i18n.md): re-order the parts, drop the explanation, change the separator, indent
# differently. HelpFormatTest holds the adapter and these keys to the same placeholders, so an
# override that names one the adapter does not supply is reported rather than printed raw.
#
# The leading spaces in command.help.line are ESCAPED (\ \ ). Properties.load strips unescaped
# leading whitespace from a value, so the unescaped version silently loses the indent that makes a
# list read as a list - the same class of bug BundleContinuationTest exists for.

command.help.header={command} takes one of these:
command.help.line=\ \ {usage} - {what}
command.help.usage=Usage: {usage}
command.help.what={what}
command.help.nothing=Nothing can be run here.

command.describe.phase.show=Shows the season phase, when the network opens, and when paid access \
  starts running.
command.describe.phase.set=Switches the season phase. This is what decides who can join and which \
  server they land on.
command.describe.phase.launch=Sets the date and time the network opens. It does not switch the \
  phase when it passes.
command.describe.phase.smp-start=Sets the day paid access starts running. Moving it shifts every \
  period that has not started yet.
command.describe.smp.reload=Re-reads the sounds, the milestone track and the message bundles. \
  config.yml is deliberately not among them.
command.describe.smp.farmreset.now=Deletes the farm world and regenerates it, immediately.
command.describe.smp.objective.complete=Closes one objective of the active milestone by hand, \
  paying out what was actually collected.
command.describe.smp.milestone.unlock=Unlocks a whole milestone by hand and pays everybody who \
  qualified.
command.describe.smp.aura=Adds or removes aura, recording who did it and why.
command.describe.smp.access=Shows whether somebody is linked, has access, and is halfway through \
  paying.

# --------------------------------------------- a command that has to travel
#
# A command asked for on a surface whose process cannot carry it out becomes a row in
# command_request, addressed to the process that owns the effect. These are the only sentences the
# asking side produces on its own; everything else it prints came back from the target verbatim.

command.remote.sent=Sent - this is handled by {target}. The answer comes back here.
command.remote.no-answer=No answer within 30 seconds - {target} is either down or not listening, \
  and nothing was changed. Nothing ever picked the request up.
command.remote.still-running=It was picked up just as the wait ran out, so it is running now and \
  the answer will not reach this message. Run the command where it lives to see the result.
command.remote.failed=That did not run. What went wrong is in the log of the process the command \
  belongs to.
command.remote.unknown={command} is not a command that process knows. The two are on different \
  versions; nothing was changed.
command.remote.arguments={command} arrived with arguments that process could not read, so nothing \
  was changed. The two are on different versions.
command.remote.silent=Done. The command changed something and had nothing to say about it.

command.target.SMP=the SMP server
command.target.HUNGER_GAMES=the hunger games server
command.target.LIMBO=the waiting room
command.target.PROXY=the proxy
command.target.BOT=the Discord bot

# ---------------------------------------------------------------- /phase

phase.current=The network is in {phase}.
phase.current.unread=The network has not been readable since this process started, so it is being \
  treated as {phase}. Nobody but an admin can join in that state.
phase.dates=The network opens: {launch}. Paid access starts running: {smpStart}. Both are set by \
  hand and neither switches the phase when it passes - that stays /phase set. Times are {zone}.
phase.read.failed=The season dates could not be read - the database did not answer. The phase \
  above is what this process last saw, which may be out of date.
phase.unknown=Unknown phase: {value}. One of: {phases}
phase.changed=Season phase switched: {previous} -> {current}. It is written to the audit log and \
  every process picks it up within thirty seconds.
phase.unchanged=The network was already in {phase}. The switch was recorded in the audit log \
  anyway.
phase.failed=The phase could not be switched - the database did not accept the write. If the \
  database itself is down, no command can fix this; the last resort is an UPDATE on the \
  season_phase row by hand.
phase.confirm=Switch the season phase from {previous} to {current}? {consequence}
phase.confirm.same=The network is already in {current}. Switching writes the row and the audit \
  entry again and changes nothing else. {consequence}
phase.consequence.PRE_LAUNCH=The network closes. Only admins get in; everybody else online is \
  disconnected and sees the countdown to the opening. This is going back before the opening, not \
  pausing - use MAINTENANCE for a pause.
phase.consequence.PRE_EVENT=Everyone online is moved to hunger-games. Access is not required in \
  this phase - a linked, non-banned member is enough.
phase.consequence.START_EVENT=Everyone online is moved to hunger-games. Access is not required in \
  this phase - a linked, non-banned member is enough.
phase.consequence.SMP=Everyone online is moved to smp, and every player without active access is \
  disconnected with the message the login gate uses.
phase.consequence.MAINTENANCE=Only admins get in. Everyone else online is held in limbo or refused.
phase.date.confirm=Set {what} to {when}? Every access period that has not started yet moves with \
  it, across every account - and moving the date back later shifts them again rather than undoing \
  this.
phase.date.invalid=That is not a date. Type it as "{pattern}" in {zone} time - for example \
  "2026-10-01 18:00" - or "{clear}" to take the date away again.
phase.date.set={what} on {current} (was {previous}).
phase.date.unchanged={what} on {current}, which is what it already said.
phase.date.cleared=There is no date for {what} any more. Access bought from now on starts \
  immediately, and the bot warns on every such purchase.
phase.date.moved=Moved {grants} access period(s) belonging to {accounts} account(s) to match. \
  Stacked periods stay stacked and nobody's length changed.
phase.date.none-moved=No access had to move.
phase.date.kept=The access already sold did not move - there is no date left to anchor it to, so \
  everybody keeps the window they have.
phase.date.refused={reason}
phase.date.failed=The date could not be written - the database did not accept it. Nothing was \
  changed.
phase.date.what.launch=when the network opens
phase.date.what.smp-start=when paid access starts running

# ---------------------------------------------------------------- /smp
#
# These moved out of the smp module's own bundle on 2026-09-05, when /smp became a command that can
# also be typed in Discord. They belong to the command now, not to the process that happens to run
# it - and none of them carried MiniMessage markup, which is why they could move rather than being
# duplicated with the styling stripped.

smp.access.active=Access runs until {until}.
smp.access.expired=No active access - the last period ended {since}.
smp.access.failed=That could not be read - the database did not answer.
smp.access.linked={player} is linked to Discord account {discord}.
smp.access.never=No access has ever been bought for this account.
smp.access.no-payment=No purchase is in progress.
smp.access.payment=Open purchase {reference}: {days} days, {amount} EUR, started {since}. The \
  payment link exists; they have not paid yet.
smp.access.payment-unknown=The open purchase could not be read. Everything above still holds.
smp.access.payment-unstarted=Open purchase {reference}: {days} days, started {since} - no payment \
  link was ever created. They stopped before asking for one.
smp.access.unlinked={player} has no Discord account linked. They should not have got past the login \
  gate at all, so something else is wrong.
smp.admin.aura-changed={player}'s aura was changed by {delta}, and the reason was recorded.
smp.admin.farmreset=Resetting the farm world now.
smp.admin.farmreset-confirm=This deletes the farm world folder and regenerates it from \
  scratch. Everything standing in it, and everything anybody left there, is gone.
smp.admin.milestone-unlocked=Milestone {key} was unlocked, and everybody who qualified has been \
  paid.
smp.admin.no-active-milestone=No milestone is active, so no objective can be completed.
smp.admin.no-such-objective=The active milestone has no objective by that key.
smp.admin.player-offline=That player is not online.
smp.admin.reloaded=The sounds, the milestone track and the message bundles were reloaded. The \
  console says whether any of the three refused.

# Addressed to the ADMIN, about somebody else. /smp aura used to answer smp.error.no-account-link
# here - "Your Minecraft account is not linked" - which is written for a player about their own
# account and told the admin the wrong thing about the person in front of them.
smp.admin.target-unlinked={player} has no Discord account linked, so there is nothing to credit \
  aura to.

smp.admin.objective-completed=Objective {key} of milestone {milestone} was closed by hand. It paid \
  out what was actually collected, not the whole pot.
smp.admin.reload-failed=At least one of the three could not be re-read. The console says which; \
  everything that did load is in effect and everything that did not is unchanged.
smp.admin.farmreset-failed=The farm world reset did not finish. The console says what stopped it - \
  the world may be half deleted, so check before anyone goes back in.
smp.admin.read-failed=That could not be done - the database did not answer. Nothing was changed.

# ---------------------------------------------------------------- /hg
#
# Moved out of the hunger-games module's own bundle on 2026-09-05 with the command. hg.start.not-admin
# went with them and is gone: :commands' own command.not-admin says the same thing once, for every
# command on the network, and it says the part that matters - that the admin role in Discord is the
# only thing that decides it.

hg.admin.reload-failed=Not everything could be reloaded; whatever failed is unchanged. The \
  console says which half and why.
hg.admin.reloaded=The message bundles and sounds.yml were reloaded. config.yml is deliberately \
  not re-read: a running game is a running clock.
hg.ready-status.header=Team readiness:
hg.ready-status.line={team} - {status}
hg.ready-status.not-ready=not ready
hg.ready-status.ready=ready
hg.start.below-hard-minimum=At least {minimum} participants are required to start - the border \
  step divides by zero below that. Only {count} are registered and present.
hg.start.below-soft-minimum=Only {count} participants are registered and present, below the \
  recommended minimum of {minimum}. Run "/hg start confirm" within {seconds} seconds to start \
  anyway.
hg.start.confirm-expired=The confirmation window has passed. Run "/hg start" again.
hg.start.no-game=There is no hunger games event registered right now.
hg.start.started=The hunger games event is starting! {count} participants are being teleported to \
  their spawn towers.
hg.start.wrong-state=The event cannot be started from its current state ({state}).

hg.start.read-failed=The registration could not be read - the database did not answer. Nothing \
  was started.

command.describe.hg.start=Starts the hunger games event. Warns first if fewer than the recommended \
  number of participants are registered.
command.describe.hg.start.confirm=Starts the hunger games event anyway, after the warning.
command.describe.hg.ready-status=Lists every registered team and whether it has said it is ready.
command.describe.hg.reload=Re-reads the message bundles and sounds.yml. config.yml is deliberately \
  not among them: a running game is a running clock.

# ---------------------------------------------------------------- /limbo
#
# Moved out of the limbo module's bundle on 2026-09-05 with the command. Both lost their MiniMessage
# colours on the way: Discord renders none of it, and the shared bundle cannot carry markup that is
# literal text on one of the two surfaces. limbo's own bundle may put the colour back by re-declaring
# either key - later roots win.

limbo.admin.reloaded=The message bundles were reloaded. config.yml is deliberately not \
  re-read - the waiting world cannot be rebuilt under the players standing in it.
limbo.admin.reload-failed=The messages could not be reloaded; the running ones are \
  unchanged. The console says why.

command.describe.limbo.reload=Re-reads the waiting room's message bundles. config.yml is \
  deliberately not among them: the waiting world cannot be rebuilt under the players standing in it.
