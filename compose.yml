# nordtal.eu season 2 - the whole deployment.
#
#   cp .env.example .env        # fill it in; .env is gitignored and must never be committed
#   docker compose up -d
#
# THIS FILE LIVES AT THE REPOSITORY ROOT and is copied from here into steward-deployer's image
# (§8b), which is the one thing in the stack allowed to create a container. "Which compose file is
# live" therefore has a version number for an answer. Everything else that belongs to the deployment
# is still in deploy/ - including deploy/setup.sh, the only part of this that runs on the host.
#
# CADDY'S CONFIGURATION IS IN HERE TOO, as an inline `configs:` block at the foot of the file, for
# the same reason: the deployer runs compose from inside its own image, so a Caddyfile on the host
# would be a file it cannot see.
#
# EVERY IMAGE IS PULLED, NOTHING IS BUILT ON THE HOST. A deploy pulls and never builds, and
# four of these images COPY a jar that Gradle produces and .gitignore excludes, so a host with only
# a checkout could not build them. Five come from ghcr.io/nordtal, pushed by release.yml - minecraft,
# discord-bot, steward-worker, steward-ui, steward-deployer - and the two that are somebody else's
# (postgres, caddy) come from Docker Hub. The `build:` blocks that remain are for developing here.
#
# EVERY IMAGE IS `latest`, AND THERE IS NO WAY TO PIN ONE. That is the decision, not an oversight,
# and it is the same one this project already made about the Paper build: a rollback lever is a
# version number written down outside gradle.properties, and every version number written down twice
# in this repository has gone stale - IMAGE_TAG's own example said 0.2.1 while the release was 0.8.1.
# A bad release is fixed by publishing a better one. The escape hatch that remains is not a version:
#
#   MC_IMAGE=...        one image somewhere else entirely, if it ever comes to that
#
# The images are a FLOOR, not the version of what runs: steward-worker replaces jars inside the
# volumes at runtime, and it follows whatever GitHub calls the latest release.
#
# COMPOSE_PROFILES in .env decides what "everything" means. Production is `db,bot,mc,backup`:
#
#   COMPOSE_PROFILES=bot               just the Discord bot, against a database that already exists
#   COMPOSE_PROFILES=db,bot            bot and database, no Minecraft at all
#   COMPOSE_PROFILES=db,bot,mc,backup  the production network
#
# `backup` belongs in that default. The database is the only irreversible risk in this project, so
# an opt-in backup sidecar is one forgotten variable away from none - and a selection that omits it
# breaks `down`, because the sidecar is never stopped and the network cannot then be removed.
#
# WHATEVER IS CHOSEN, `up` AND `down` HAVE TO USE THE SAME SELECTION. Compose only acts on the
# services the current selection names, in both directions.
#
# STEWARD-WORKER HAS NO PROFILE, so it is in every selection. It is the only process that applies the
# schema, so nothing else can correctly start before it; and it answers /update in Discord and
# /smp update in game, which needs it running rather than run.
#
# The bot has no Minecraft dependency and never waits for a proxy or a backend; the `bot` profile is
# what preserves that.
#
# THERE IS NO depends_on ON THE DATABASE, deliberately: compose pulls a profiled dependency in
# whether you asked for it or not, which would make "point at an external PostgreSQL" impossible
# without editing this file. Every service fails fast on an unreachable database and
# `restart: unless-stopped` retries it.
#
# THERE IS A depends_on ON STEWARD-WORKER, and it is the one ordering rule this file can express:
# after a redeploy the whole stack starts at once, and without it a plugin can come up against a
# schema older than itself. The worker becomes healthy the moment the schema is current. This is
# safe where a database dependency would not be, because the worker has no profile.

name: nordtal-s2

# ---------------------------------------------------------------------------------------------
# Shared by the four Minecraft services. They differ only in environment: which server software,
# which build, which plugin jars. Nothing about a specific server is baked into the image.
# ---------------------------------------------------------------------------------------------
x-minecraft: &minecraft
  profiles: ["mc"]
  # A DEPLOY NEVER RUNS THIS: it pulls and does not build. The block is kept because it is
  # how this image is developed locally, and because build.yml runs the same build on every push,
  # which catches a Dockerfile that COPYs a file .dockerignore excludes.
  build:
    context: ./deploy/minecraft
  image: ${MC_IMAGE:-ghcr.io/nordtal/minecraft:latest}
  restart: unless-stopped
  depends_on:
    # The schema, and nothing else. Not the database - see the note at the top of this file.
    steward-worker:
      condition: service_healthy
  # The entrypoint MUST be PID 1: it traps SIGTERM and turns it into a graceful save, and it holds
  # the stdout that `docker logs` reads. `init: true` would put tini there instead and break both.
  init: false
  # 10s (the default) does not save a border-4000 world. The entrypoint forwards SIGTERM to the
  # JVM, whose shutdown hook saves and stops; this is the time it is given to finish.
  stop_grace_period: 180s
  # HEALTHY MEANS "THE SEASON PLUGIN IS RUNNING", NOT "A JVM EXISTS". Both conditions are needed: a
  # plugin that throws in onEnable leaves Paper running with an open port and every jar in plugins/,
  # which is indistinguishable from health outside the JVM. The marker is written at the very end of
  # onEnable and refreshed every 30s, so a process that stops ticking stops writing it.
  #
  # THIS SUPERSEDES THE `HEALTHCHECK` IN deploy/minecraft/Dockerfile - a compose healthcheck replaces
  # the image's outright - which is why the TCP half is repeated here.
  #
  # 90 SECONDS IS THREE MISSED BEATS, a literal because a shell test in a YAML file cannot read
  # Readiness.STALE_AFTER. :steward-worker's TopologyTest holds the two equal.
  #
  # `bash -c` and not CMD-SHELL: /bin/sh in this image is dash, which has no /dev/tcp.
  healthcheck:
    test: ["CMD", "bash", "-c",
           "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/nordtal-ready) )) -lt 90 && exec 3<>/dev/tcp/127.0.0.1/$${SERVER_PORT:-25565}"]
    interval: 15s
    timeout: 5s
    # 45s of consecutive failure on top of the 90s the marker takes to go stale. Deliberately not 1:
    # the accept queue can refuse a connection during a long tick, and a backend that flickers red on
    # a lag spike is a signal people learn to ignore.
    retries: 3
    # FIVE MINUTES: the marker lands strictly later than the port, being the last line of onEnable
    # after four worlds are loaded. Nothing waits on a Minecraft service being healthy, so a generous
    # window costs a longer "starting" while a short one makes every restart flap red first.
    start_period: 300s
  environment: &minecraft-env
    TZ: ${TZ:-Europe/Berlin}
    # SERVER_VERSION, set per service below, is a LITERAL and deliberately not from .env: it is the
    # Minecraft version for the three Paper backends and Fill's name for Velocity's major on the
    # proxy, both mirrored by eu.nordtal.s2.common.Platform, which is what steward-worker resolves
    # against and what every plugin here is compiled for.
    #
    # There is no SERVER_BUILD: the worker owns the server jar, the entrypoint runs whatever build
    # is in .server/, and an empty cache is filled from the Fill API's newest STABLE build. Nothing
    # pins a build anywhere.
    #
    # The plugin jars are the `steward-worker` service's, not this container's - two owners is one
    # too many. What this container still owns is the server jar, the datapacks and the seeded
    # configuration.
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# ---------------------------------------------------------------------------------------------
# One database, five clients: the bot and the four Minecraft services. Each process reads its own
# environment prefix - NORDTAL_DATABASE_* for the bot, NORDTAL_SMP_DATABASE_* for the SMP plugin,
# and so on - but the three values are always the same ones, so they are written once here.
#
# NORDTAL_DATABASE_* in .env points the WHOLE stack at a PostgreSQL outside it; POSTGRES_* is the
# one this compose runs. Nothing has to be filled in per plugin, and nothing is edited inside a
# volume: a plugin whose database.yml is left at its defaults still gets these.
# ---------------------------------------------------------------------------------------------
x-database:
  url: &db-url ${NORDTAL_DATABASE_JDBC_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nordtal}}
  username: &db-username ${NORDTAL_DATABASE_USERNAME:-${POSTGRES_USER:-nordtal}}
  password: &db-password ${NORDTAL_DATABASE_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD or NORDTAL_DATABASE_PASSWORD in .env}}

services:

  # -------------------------------------------------------------------------------------------
  postgres:
    profiles: ["db"]
    # THE ONE SERVICE ON BOTH SEGMENTS, and that is what makes the split work at all: everything
    # here is a client of this database, and only the Steward services may reach each other. See
    # the `networks:` block at the foot of this file.
    networks: ["default", "steward"]
    # The version every integration test in this repository runs against.
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      # Everything that reads this database is in the same stack, so this publish exists only for
      # backups and for a psql from the host. Loopback until POSTGRES_BIND says otherwise.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  # -------------------------------------------------------------------------------------------
  # The Discord bot. No Minecraft dependency: PostgreSQL, the Discord gateway and bunq. It validates
  # the schema and refuses to start on a database nobody migrated. Runbook: discord-bot/README.md.
  #
  # THE SERVICE NAME IS `discord-bot` AND IT IS THE SAME STRING AS EVERYTHING ELSE ABOUT THIS JAR:
  # the module directory, the artefact id in :steward-worker's Topology, the volume path the worker
  # writes to (/volumes/discord-bot) and the image. It was `bot` until 2026-09-11, and that one
  # shorter name was a whole class of failure: the worker looks the container runtime up for the
  # service called `discord-bot`, got nothing back, and refused the entire run - "NOTHING WAS
  # INSTALLED", every server stopped and started again for no reason. TopologyTest now holds the two
  # equal.
  #
  # THE PROFILE IS STILL `bot`, deliberately. A profile name is not a service name, and renaming it
  # would invalidate every COMPOSE_PROFILES=db,bot,mc,backup already written into a .env on a host.
  discord-bot:
    profiles: ["bot"]
    # THE IMAGE TAG IS A FLOOR, NOT THE VERSION. The bot runs whatever discord-bot-*.jar is in the
    # `bot-jar` volume; the jar baked into the image only makes a first deployment possible. What is
    # actually running is printed by the entrypoint on every start.
    image: ${BOT_IMAGE:-ghcr.io/nordtal/discord-bot:latest}
    build:
      # Compose cannot run Gradle: `./gradlew :discord-bot:shadowJar` has to happen first, which is
      # why a production host pulls this image. There are no build args at all any more - the
      # Dockerfile finds its jar in build/libs by glob - which also settles the older trap that a
      # `:?` in a build arg is interpolated even by a deploy that only pulls, and would have stopped
      # the deploy before it reached a single image.
      context: ./discord-bot
    restart: unless-stopped
    depends_on:
      # The bot refuses a database it was not built against, so without this it would crash-loop
      # until the worker got there.
      steward-worker:
        condition: service_healthy
    # The same marker the four Minecraft services use. Written after JDA is ready and both reconciles
    # are done, and refreshed on the timer thread - so a wedged timer thread, which is a bot that has
    # silently stopped booking payments, goes red.
    #
    # No port half here: this process listens on nothing, so CMD-SHELL is enough.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/nordtal-ready) )) -lt 90"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Three minutes: a Discord login, a full member chunk, the managed messages and two reconciles
      # all land before the marker, and a bad token deliberately sleeps 60s before exiting.
      start_period: 180s
    environment:
      TZ: ${TZ:-Europe/Berlin}

      # --- database.yml ------------------------------------------------------------------
      NORDTAL_DATABASE_JDBC_URL: *db-url
      NORDTAL_DATABASE_USERNAME: *db-username
      NORDTAL_DATABASE_PASSWORD: *db-password
      NORDTAL_DATABASE_MAXIMUM_POOL_SIZE: ${NORDTAL_DATABASE_MAXIMUM_POOL_SIZE:-}
      NORDTAL_DATABASE_LOG_SQL: ${NORDTAL_DATABASE_LOG_SQL:-}

      # --- bot.yml -----------------------------------------------------------------------
      NORDTAL_BOT_TOKEN: ${NORDTAL_BOT_TOKEN:?set NORDTAL_BOT_TOKEN in .env}
      NORDTAL_BOT_BUNQ_API_KEY: ${NORDTAL_BOT_BUNQ_API_KEY:?set NORDTAL_BOT_BUNQ_API_KEY in .env}
      NORDTAL_BOT_BUNQ_ACCOUNT_ID: ${NORDTAL_BOT_BUNQ_ACCOUNT_ID:?set NORDTAL_BOT_BUNQ_ACCOUNT_ID in .env}

      # --- access.yml --------------------------------------------------------------------
      NORDTAL_ACCESS_GUILD_ID: ${NORDTAL_ACCESS_GUILD_ID:?set NORDTAL_ACCESS_GUILD_ID in .env}
      NORDTAL_ACCESS_ROLES_ACCESS: ${NORDTAL_ACCESS_ROLES_ACCESS:?set NORDTAL_ACCESS_ROLES_ACCESS in .env - the bot-owned access role}
      NORDTAL_ACCESS_ROLES_DONOR: ${NORDTAL_ACCESS_ROLES_DONOR:?set NORDTAL_ACCESS_ROLES_DONOR in .env - the permanent donor role}
      NORDTAL_ACCESS_ROLES_ADMIN: ${NORDTAL_ACCESS_ROLES_ADMIN:?set NORDTAL_ACCESS_ROLES_ADMIN in .env - the role mirrored into discord_user.admin}
      NORDTAL_ACCESS_ROLES_ADMIN_PING: ${NORDTAL_ACCESS_ROLES_ADMIN_PING:?set NORDTAL_ACCESS_ROLES_ADMIN_PING in .env - the role pinged in the admin channel}
      NORDTAL_ACCESS_CHANNELS_ADMIN: ${NORDTAL_ACCESS_CHANNELS_ADMIN:?set NORDTAL_ACCESS_CHANNELS_ADMIN in .env - the admin channel}
      NORDTAL_ACCESS_LANGUAGES: ${NORDTAL_ACCESS_LANGUAGES:?set NORDTAL_ACCESS_LANGUAGES in .env - the JSON language list, whose shape .env.example ships in full}
      NORDTAL_ACCESS_TIERS: ${NORDTAL_ACCESS_TIERS:-}
      NORDTAL_ACCESS_DONATION_CENTS: ${NORDTAL_ACCESS_DONATION_CENTS:-}
      NORDTAL_ACCESS_PAYMENT_POLL_INTERVAL_SECONDS: ${NORDTAL_ACCESS_PAYMENT_POLL_INTERVAL_SECONDS:-}
      NORDTAL_ACCESS_PAYMENT_REQUEST_TTL_HOURS: ${NORDTAL_ACCESS_PAYMENT_REQUEST_TTL_HOURS:-}
      # Leave empty on a fresh database: the first start stamps its own instant into bot_setting and
      # no later start rewrites it. Without it the first poll books up to 50 historical bunq
      # payments, roles, DMs and public thank-yous included.
      NORDTAL_ACCESS_PAYMENT_WATERMARK: ${NORDTAL_ACCESS_PAYMENT_WATERMARK:-}
      NORDTAL_ACCESS_PAYMENT_RECENT_PAYMENT_COUNT: ${NORDTAL_ACCESS_PAYMENT_RECENT_PAYMENT_COUNT:-}
      NORDTAL_ACCESS_EXPIRY_REMINDER_LEAD_DAYS: ${NORDTAL_ACCESS_EXPIRY_REMINDER_LEAD_DAYS:-}
      NORDTAL_ACCESS_ROLE_RECONCILE_INTERVAL_MINUTES: ${NORDTAL_ACCESS_ROLE_RECONCILE_INTERVAL_MINUTES:-}
    volumes:
      - bot-config:/app/config
      # The jar itself. steward-worker writes into this same volume as /volumes/discord-bot; here
      # it is /app/lib, where the entrypoint looks.
      - bot-jar:/app/lib
      # bunq binds an API context to the device it was registered from: this must be created on
      # the host that will use it, never copied over from a laptop.
      - bunq-context:/app/bunq
    logging: *logging

  # -------------------------------------------------------------------------------------------
  # The resource pack, served off this machine. NOT PART OF PRODUCTION: `devpack` is a profile and
  # nothing on the production host selects it - there the client fetches the pack from the GitHub
  # release URL steward-worker wrote into pack.yml.
  #
  # It exists because the pack and the plugins are one change and not two: a glyph code point is
  # declared in :common's Glyphs, in a font file and in a PNG, and every menu panel is a texture the
  # Java arithmetic is derived from, so testing against the previous release's pack answers nothing.
  # `deploy/dev pack` builds the zip into PACK_ROOT and writes exactly url and sha1 into pack.yml.
  #
  # The client runs on the machine that runs Docker here, so the URL is a plain
  # http://localhost:${PACK_PORT}/<name>.zip; the bind stays on loopback.
  pack-host:
    profiles: ["devpack"]
    image: ${PACK_HOST_IMAGE:-nginx:alpine}
    restart: unless-stopped
    ports:
      - "${PACK_BIND:-127.0.0.1}:${PACK_PORT:-8080}:80"
    volumes:
      - ${PACK_ROOT:-./deploy/pack}:/usr/share/nginx/html:ro
    logging: *logging

  # -------------------------------------------------------------------------------------------
  # The Velocity proxy. The only service that publishes a port to the network.
  network-control:
    <<: *minecraft
    environment:
      <<: *minecraft-env
      SERVER_KIND: velocity
      # What this volume has to hold before the proxy is allowed to start. Filename prefixes, split
      # the way steward-worker splits them (JarName, ${file%-*.jar}); a MINIMUM, never an exact set,
      # so a hand-installed extra is fine.
      #
      # SIMPLE VOICE CHAT'S PROXY PLUGIN IS DELIBERATELY NOT IN THIS LIST. The worker installs it
      # and carries the row in its Topology, but voice chat is optional for a player and this
      # container is the whole network: a proxy refusing to start because an alpha of somebody
      # else's plugin did not resolve is an outage bought for something nice to have.
      EXPECTED_PLUGINS: ${NETWORK_CONTROL_EXPECTED_PLUGINS:-network-control}
      # THE PLAYER LIMIT AND THE MOTD both belong to the plugin: network-control answers every ping
      # with the MOTD for the current phase and refuses the login that would exceed the limit. These
      # are jcore environment overrides, so they win over network.yml and are never written back.
      #
      # NETWORK_MAX_PLAYERS is the ONLY number that decides who gets on the network: the same
      # variable sets MAX_PLAYERS on all three Paper backends below, so what the browser advertises,
      # what the login gate enforces and what a backend's tab list shows are one value. Raising it
      # needs the backends restarted too, not just this proxy.
      #
      # The five MOTDs are one per season phase, listed here so .env can override them without
      # anybody learning the NORDTAL_ naming rule. Leaving one unset keeps network.yml's default.
      NORDTAL_NETWORK_CONTROL_NETWORK_MAX_PLAYERS: ${NETWORK_MAX_PLAYERS:-500}
      NORDTAL_NETWORK_CONTROL_NETWORK_MOTD_PRE_LAUNCH: ${NETWORK_MOTD_PRE_LAUNCH:-}
      NORDTAL_NETWORK_CONTROL_NETWORK_MOTD_PRE_EVENT: ${NETWORK_MOTD_PRE_EVENT:-}
      NORDTAL_NETWORK_CONTROL_NETWORK_MOTD_START_EVENT: ${NETWORK_MOTD_START_EVENT:-}
      NORDTAL_NETWORK_CONTROL_NETWORK_MOTD_SMP: ${NETWORK_MOTD_SMP:-}
      NORDTAL_NETWORK_CONTROL_NETWORK_MOTD_MAINTENANCE: ${NETWORK_MOTD_MAINTENANCE:-}
      # FILL'S NAME FOR VELOCITY'S MAJOR, NOT A VERSION. The proxy follows the newest release inside
      # the 4.x line, which Fill calls `4.0.0`; the entrypoint and the worker both resolve it out of
      # Platform.VELOCITY_FAMILY. A literal and not a variable, because a platform version is a
      # property of the season and not of a deployment. TopologyTest holds this against the constant.
      SERVER_VERSION: "4.0.0"
      HEAP: ${PROXY_HEAP:-1G}
      # Modern forwarding. The same value reaches the three backends below as
      # PAPER_VELOCITY_SECRET, so there is nothing to paste into a config file any more.
      VELOCITY_FORWARDING_SECRET: ${VELOCITY_FORWARDING_SECRET:?set VELOCITY_FORWARDING_SECRET in .env - generate one with `openssl rand -hex 24`}
      # The network topology, used only to seed velocity.toml on a fresh volume. The names are
      # what network-control's gate.yml#server-* keys expect; the hosts are these service names.
      VELOCITY_SERVERS: ${VELOCITY_SERVERS:-limbo=limbo:25565 hunger-games=hunger-games:25565 smp=smp:25565}
      VELOCITY_TRY: ${VELOCITY_TRY:-limbo}
      # THE RESOURCE PACK IS NOT A VARIABLE HERE, and must not become one: a jcore environment
      # override wins over the file and is never written back, so the worker writing a new sha1 into
      # pack.yml while PACK_URL and PACK_SHA1 were set would write into a value nothing reads.
      #
      # pack.yml in this volume is the place, and `steward-worker bootstrap` writes it, taking the
      # URL from the release asset and the hash from the .sha1 asset beside it.
      #
      # The proxy refuses to start with an empty url or sha1 while pack.enabled is true. On a brand
      # new volume that means: bring network-control up once so it writes its config, then run the
      # worker, then start it for real. See deploy/README.md.
      NORDTAL_NETWORK_CONTROL_DATABASE_JDBC_URL: *db-url
      NORDTAL_NETWORK_CONTROL_DATABASE_USERNAME: *db-username
      NORDTAL_NETWORK_CONTROL_DATABASE_PASSWORD: *db-password
    ports:
      - "${PROXY_BIND:-0.0.0.0}:${PROXY_PORT:-25565}:25565"
      # SIMPLE VOICE CHAT, AND THIS IS THE ONLY VOICE PORT ON THE NETWORK. Audio is UDP and does not
      # travel inside the Minecraft connection. The proxy plugin detects each backend's voice address
      # and port itself and forwards over this compose network, so smp and hunger-games publish
      # nothing at all.
      #
      # 25565 ON BOTH SIDES, AND NOT ${PROXY_PORT}. voicechat-proxy.properties ships `port: -1`,
      # meaning "whatever port the proxy uses", so the plugin binds 25565 inside this container and
      # hands the CLIENT that same number; a host mapping that renumbered it would answer the
      # handshake and time out every packet after it. Making voice follow PROXY_PORT is `voice_host`
      # in plugins/voicechat/voicechat-proxy.properties, not a second number here.
      - "${PROXY_BIND:-0.0.0.0}:25565:25565/udp"
    volumes:
      - mc-network-control:/data
      # PLUGINS/ IS ITS OWN VOLUME, separate from the server's. Everything else under /data - the
      # world, the .server/ jar cache, logs/ - stays in mc-<name>: a plugin's config.yml,
      # milestones.yml, sounds.yml and pack.yml are hand-edited and worth backing up on their own
      # schedule, while a world is 4 GB.
      #
      # THE DEFAULT MUST BE A VOLUME NAME AND THE BIND IS THE EXCEPTION. A path under a directory a
      # deployment checks out is deleted the next time it is checked out, taking every hand-edited
      # config with it (finding 151). Production sets none of these variables and therefore gets a
      # named volume.
      #
      # Setting one to a path is what the local stack does, so that reading plugins/smp/config.yml is
      # opening a file rather than two `docker compose cp`s. A value with a `/` in it is a bind mount
      # to Docker and a value without one is a volume name; nothing else distinguishes them, which is
      # why :steward-worker's TopologyTest asserts the default carries neither a slash nor a dot.
      - ${NETWORK_CONTROL_PLUGINS:-mc-network-control-plugins}:/data/plugins

  # -------------------------------------------------------------------------------------------
  # The waiting room. Needs the database for one thing only: the player's language.
  limbo:
    <<: *minecraft
    environment:
      <<: *minecraft-env
      SERVER_KIND: paper
      SERVER_VERSION: "26.2"
      EXPECTED_PLUGINS: ${LIMBO_EXPECTED_PLUGINS:-limbo}
      # THE SAME NUMBER THE PROXY IS GIVEN, out of the same .env variable, which is why this is not a
      # second setting. The proxy owns the decision and refuses at the login gate where it can say
      # why; this only makes sure a backend is never a SMALLER limit than the advertised one (Paper's
      # own default is 20) and never shows a bigger one on a tab list. Admins past a full network are
      # admitted here by the plugin - see common's FullServerAdmission.
      MAX_PLAYERS: ${NETWORK_MAX_PLAYERS:-500}
      HEAP: ${LIMBO_HEAP:-1G}
      # No LEVEL_NAME and no LEVEL_SEED, deliberately: limbo builds its own empty world at enable and
      # moves every player into it, so whatever Paper generates as `world` is never seen.
      EULA: ${EULA:?set EULA=true to accept https://aka.ms/MinecraftEULA}
      # A Paper server given a forwarding secret is a backend: the entrypoint sets
      # online-mode=false and seeds modern forwarding for it. Paper reads the secret from
      # this variable itself, which replaces pasting it into three config files - it does
      # NOT keep it out of the volume, Paper writes it into paper-global.yml on first load.
      PAPER_VELOCITY_SECRET: ${VELOCITY_FORWARDING_SECRET:?set VELOCITY_FORWARDING_SECRET in .env - generate one with `openssl rand -hex 24`}
      NORDTAL_LIMBO_DATABASE_JDBC_URL: *db-url
      NORDTAL_LIMBO_DATABASE_USERNAME: *db-username
      NORDTAL_LIMBO_DATABASE_PASSWORD: *db-password
    volumes:
      - mc-limbo:/data
      # plugins/ in its own volume, the rest in mc-limbo - see network-control above.
      - ${LIMBO_PLUGINS:-mc-limbo-plugins}:/data/plugins

  # -------------------------------------------------------------------------------------------
  # The start event. Runs once, then the phase turns to SMP and this can be stopped.
  hunger-games:
    <<: *minecraft
    environment:
      <<: *minecraft-env
      SERVER_KIND: paper
      SERVER_VERSION: "26.2"
      # SIMPLE VOICE CHAT IS INSTALLED HERE AND IS NOT IN THIS LIST. It runs here and on smp, not on
      # limbo, where the waiting room is seconds long. It is out of the guard because voice chat is
      # optional for a player: a missing jar is a quiet evening, a guard entry for it is a server
      # that will not start.
      EXPECTED_PLUGINS: ${HUNGER_GAMES_EXPECTED_PLUGINS:-hunger-games}
      MAX_PLAYERS: ${NETWORK_MAX_PLAYERS:-500}
      HEAP: ${HUNGER_GAMES_HEAP:-4G}
      # The hand-built event world. The plugin does NOT load a world of its own - it disables itself
      # when that world is not there - so level-name is what brings it up. The two defaults are
      # asserted against each other by :hunger-games' ComposeWorldTest, which reads this file.
      LEVEL_NAME: ${HUNGER_GAMES_LEVEL_NAME:-hunger_games}
      EULA: ${EULA:?set EULA=true to accept https://aka.ms/MinecraftEULA}
      # A Paper server given a forwarding secret is a backend: the entrypoint sets
      # online-mode=false and seeds modern forwarding for it. Paper reads the secret from
      # this variable itself, which replaces pasting it into three config files - it does
      # NOT keep it out of the volume, Paper writes it into paper-global.yml on first load.
      PAPER_VELOCITY_SECRET: ${VELOCITY_FORWARDING_SECRET:?set VELOCITY_FORWARDING_SECRET in .env - generate one with `openssl rand -hex 24`}
      NORDTAL_HUNGER_GAMES_DATABASE_JDBC_URL: *db-url
      NORDTAL_HUNGER_GAMES_DATABASE_USERNAME: *db-username
      NORDTAL_HUNGER_GAMES_DATABASE_PASSWORD: *db-password
    volumes:
      - mc-hunger-games:/data
      # plugins/ in its own volume, the rest in mc-hunger-games - see network-control above.
      - ${HUNGER_GAMES_PLUGINS:-mc-hunger-games-plugins}:/data/plugins

  # -------------------------------------------------------------------------------------------
  # The SMP - four worlds, and the only service with required third-party plugins.
  smp:
    <<: *minecraft
    environment:
      <<: *minecraft-env
      SERVER_KIND: paper
      SERVER_VERSION: "26.2"
      # DisplayTags, PacketEvents and Chunky are resolved by steward-worker - DisplayTags from its
      # own repository's releases, the other two from Modrinth filtered to this Minecraft version
      # and `paper` - and are not pinned here.
      #
      # They are still REQUIRED: smp's paper-plugin.yml declares DisplayTags load: BEFORE,
      # required: true, and PacketEvents is required under it. The guard is in entrypoint.sh.
      # Terralith and Dungeons and Taverns, pinned by sha512, fetched into the level-name world's
      # datapacks/ folder BEFORE the server starts. Datapacks are server-global and read once at
      # start, so this one folder feeds every world including the nightly farm world - and a pack
      # added later changes no terrain.
      DATAPACK_URLS: ${SMP_DATAPACK_URLS:-f5283548323149ecd3f218b8efbe03c1c582df3f40b6bb3b095ba9e4cac0c87108b98adabd6ebd3a8037ec239773a253f75b8bee7db52e6f5663bf9dc63c2ea3@https://cdn.modrinth.com/data/8oi3bsk5/versions/CzijfXJQ/Terralith_26.2_v2.6.4.zip cf026b67f4fc0f5ab15229995f11faf43fdd41b29777a6756151276e83da65f887fe03b6356c5011f8ba32371f98941778928e4258e81b4c97411a40af1635ca@https://cdn.modrinth.com/data/tpehi7ww/versions/CS77UwHE/Dungeons%20and%20Taverns%20v5.3.2.zip}
      # Must match SmpSpec#world-nordtal: without it Paper generates `world`, the datapacks above go
      # into a folder nothing reads, and the SMP refuses to start on a season world that does not
      # exist. Asserted against the spec default by :smp's ComposeWorldTest, which reads this file.
      LEVEL_NAME: ${SMP_LEVEL_NAME:-nordtal}
      # The seed Nordtal is pre-generated from, ONCE, to border 4000, then frozen for the season.
      # Written into server.properties only while the world does not exist yet; a volume that already
      # holds one is compared and warned about, never re-rolled. Terralith and Dungeons and Taverns
      # decide the terrain on top of it, so this number produces a different landscape without them.
      LEVEL_SEED: ${SMP_LEVEL_SEED:-1837371427}
      # All four, by FILENAME PREFIX. The two third-party prefixes are not the worker's artefact ids
      # (`packetevents` resolves to packetevents-spigot-*.jar, `chunky` to Chunky-Bukkit-*.jar):
      # Topology reads those back off the resolved filename and this list assumes them, so a
      # publisher renaming a jar stops this container with the prefix in the message.
      #
      # TWO PLUGINS ARE DELIBERATELY NOT IN THIS LIST. CoreProtect cannot be installed at all while
      # its publisher has no build for this Minecraft version, and an artefact that cannot be
      # installed must not be one this container refuses to start without. Simple Voice Chat can be,
      # but voice chat is optional for a player: a server nobody can talk on is a far smaller thing
      # than a server nobody can join.
      #
      # :steward-worker's TopologyTest asserts the guard asks for exactly the artefacts that are not
      # optional, in both directions.
      EXPECTED_PLUGINS: ${SMP_EXPECTED_PLUGINS:-smp papermc-display-tags packetevents-spigot Chunky-Bukkit}
      MAX_PLAYERS: ${NETWORK_MAX_PLAYERS:-500}
      HEAP: ${SMP_HEAP:-6G}
      EULA: ${EULA:?set EULA=true to accept https://aka.ms/MinecraftEULA}
      # A Paper server given a forwarding secret is a backend: the entrypoint sets
      # online-mode=false and seeds modern forwarding for it. Paper reads the secret from
      # this variable itself, which replaces pasting it into three config files - it does
      # NOT keep it out of the volume, Paper writes it into paper-global.yml on first load.
      PAPER_VELOCITY_SECRET: ${VELOCITY_FORWARDING_SECRET:?set VELOCITY_FORWARDING_SECRET in .env - generate one with `openssl rand -hex 24`}
      # Whether smp starts pre-generating tomorrow's farm world in its onEnable. True in production;
      # a machine also used for something else wants false, because Chunky takes every core it is
      # given. The cost is one postponed reset.
      #
      # The default is REPEATED from SmpSpec rather than left empty: an environment variable set to
      # the empty string still WINS over the file in jcore, so `${VAR:-}` would blank out the spec's
      # own default. smp's ConfigsTest asserts the two copies agree.
      NORDTAL_SMP_PREGENERATION_ON_START: ${SMP_PREGENERATION_ON_START:-true}
      # HOW RECENT A BACKUP HAS TO BE BEFORE THIS SERVER WILL RESET THE FARM WORLD.
      #
      # The nightly clock moved to steward-worker on 2026-09-13 (§9a), because a season with `smp`
      # down had no backup at all and nothing said so. What used to make the order safe was two
      # times fifteen minutes apart in two different config files - a promise no test could hold.
      # Now the reset asks the database instead: no successful backup inside this window means the
      # world is left alone, loudly.
      #
      # The default is repeated from SmpSpec because an empty environment variable wins over the
      # file; smp's ConfigsTest asserts the two copies agree. `0` turns the check off, which is
      # what a local stack with no steward-worker wants, and which is logged on every start.
      NORDTAL_SMP_FARM_RESET_BACKUP_WINDOW_HOURS: ${SMP_FARM_RESET_BACKUP_WINDOW_HOURS:-12}
      NORDTAL_SMP_DATABASE_JDBC_URL: *db-url
      NORDTAL_SMP_DATABASE_USERNAME: *db-username
      NORDTAL_SMP_DATABASE_PASSWORD: *db-password
    volumes:
      - mc-smp:/data
      # plugins/ in its own volume, the rest in mc-smp - see network-control above.
      - ${SMP_PLUGINS:-mc-smp-plugins}:/data/plugins

  # -------------------------------------------------------------------------------------------
  # steward-worker. No profile, because everything else in this stack depends on it.
  #
  # WHAT IT OWNS: the database schema, and the version of every jar that runs anywhere here - the
  # four servers' plugins, their Paper and Velocity jars, the proxy's resource-pack url and sha1,
  # the bot's jar, and its own.
  #
  # WHAT IT IS NOT: a scheduler. `serve` applies the schema once at startup and then does nothing at
  # all until somebody writes a row into update_request - no timer, no watching, no "check for
  # updates on boot". A crash restart at three in the morning must not move a version.
  #
  # THE THREE ONE-SHOT COMMANDS work beside the running one, and are how a first deployment happens,
  # because the servers refuse to start on an empty plugins folder:
  #
  #   docker compose run --rm steward-worker report     # resolve and report. Writes no file a server reads.
  #   docker compose run --rm steward-worker migrate    # the schema, and nothing else.
  #   docker compose run --rm steward-worker bootstrap  # fill EMPTY volumes. Upgrades nothing.
  #
  # A bootstrap takes a PostgreSQL advisory lock, so it cannot collide with the service: the second
  # one to ask is refused rather than queued.
  steward-worker:
    build:
      # Same as the bot: Gradle first, so production pulls, and no build args - the Dockerfile globs
      # build/libs for its jar rather than being told a version.
      context: ./steward-worker
    image: ${STEWARD_WORKER_IMAGE:-ghcr.io/nordtal/steward-worker:latest}
    restart: unless-stopped
    # ONLY THE STEWARD SEGMENT (§3). This container holds the docker socket and serves an API that
    # can read any log and type on any console; a Minecraft server able to resolve the name
    # `steward-worker` would make a compromised plugin into exactly that. It reaches PostgreSQL
    # because PostgreSQL is on both segments, and GitHub because any bridge network has a way out.
    networks: ["steward"]
    # `serve`. THIS LINE IS ALSO WHAT A `run` INHERITS: a `docker compose run` naming no subcommand
    # is handed this one and starts a SECOND daemon. Removing it does not help - a `run` against a
    # service with no `command` takes the image's CMD instead. The read-only run is
    # `steward-worker report`, by name, and that is why the name exists.
    command: ["serve"]
    # THIS IS A CONTAINER, so `localhost` in any URL given to it is this container and not the
    # host. This mapping is what makes http://host.docker.internal:<port> work on Linux as well as
    # on Docker Desktop; it costs nothing and is what any future host-side address needs.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Written once the schema is current and the request loop is about to start. Everything else in
      # this file waits for it.
      test: ["CMD-SHELL", "test -f /tmp/steward-worker-ready"]
      interval: 10s
      timeout: 3s
      # 15 minutes: on a FIRST deployment the marker is written only once the bootstrap has downloaded
      # four server jars and every plugin. Nothing acts on "unhealthy" here except the depends_on
      # below, which simply keeps waiting.
      retries: 90
      start_period: 120s
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # --- database.yml ------------------------------------------------------------------
      # THIS IS THE PROCESS THAT MIGRATES. `serve` applies the schema at startup and then becomes
      # healthy; `steward-worker migrate` applies it and nothing else; `steward-worker bootstrap`
      # does it before it moves a jar, so a plugin never comes up against a schema older than
      # itself.
      NORDTAL_STEWARD_DATABASE_JDBC_URL: *db-url
      NORDTAL_STEWARD_DATABASE_USERNAME: *db-username
      NORDTAL_STEWARD_DATABASE_PASSWORD: *db-password

      # --- steward.yml -------------------------------------------------------------------
      # WHICH RELEASE IS NOT A SETTING. steward-worker follows whatever GitHub calls the latest
      # release of each repository, and there is no variable and no config key that says otherwise -
      # the rollback-by-tag lever was removed on 2026-09-09 for the reason at the top of this file.
      # What a server runs is the jar lying in its volume, never a variable claiming to describe it.
      NORDTAL_STEWARD_SEASON_REPO: ${SEASON_REPO:-nordtal/season-2}
      # No platform version and no build pin here, deliberately: the versions are constants in
      # :common, because a Minecraft version is a property of the season rather than of an
      # installation, and the newest STABLE build is what all five processes install and run.
      # Whether `serve` fills EMPTY volumes before it reports ready. This is what lets a stack come up
      # with nobody typing anything on the host: a Minecraft server refuses to start on an empty
      # plugins folder, and a deploy that only pulls images cannot run
      # `docker compose run --rm steward-worker bootstrap`.
      #
      # It cannot move a version - only artefacts with nothing installed at all are fetched - so a
      # restart of a live network finds nothing missing and does nothing. Repeated from
      # StewardSpec#bootstrap because an env var set to the empty string still wins over the file.
      NORDTAL_STEWARD_BOOTSTRAP: ${STEWARD_WORKER_BOOTSTRAP:-true}
      # Optional. Raises GitHub's unauthenticated limit of 60 requests per hour per IP; a run makes
      # two GitHub calls, so it only matters on a host sharing its address with something busy.
      NORDTAL_STEWARD_GITHUB_TOKEN: ${STEWARD_WORKER_GITHUB_TOKEN:-}
      # --- the internal API steward-ui reads this container through ------------------------
      # THE SAME SECRET BOTH CONTAINERS ARE GIVEN, out of one variable, because two copies of a
      # shared secret is one copy that is wrong. Empty would mean the API does not start at all and
      # the interface says "could not look" on every page - so it is required rather than optional.
      NORDTAL_STEWARD_API_TOKEN: ${STEWARD_API_TOKEN:?set STEWARD_API_TOKEN in .env - the secret steward-ui and steward-worker share, `openssl rand -hex 32`}

      # There is no restart endpoint and no panel here any more. Stopping, starting and recreating
      # go through the Docker socket mounted below and through steward-deployer; the whole
      # `arcane:` block of steward.yml was removed on 2026-09-13, along with the ARCANE_* variables
      # that used to be repeated here. A deployed steward.yml still carrying that block loses it
      # with a WARN and a .bak rather than refusing to start - ConfigsTest holds that.
    volumes:
      - steward-worker-config:/app/config
      # Everything this module owns, under the names Topology expects beneath volumes-root. Writable,
      # because `apply` puts the jars here and writes network-control's pack.yml.
      - mc-network-control:/volumes/network-control
      - mc-limbo:/volumes/limbo
      - mc-hunger-games:/volumes/hunger-games
      - mc-smp:/volumes/smp
      # THE SAME FOUR plugins/ SOURCES THE SERVERS READ, EXPRESSION FOR EXPRESSION. Copying the
      # default rather than the variable, or spelling one differently, splits the two sides in the
      # one way nothing can see: this container installs into its own volume, `apply` reports
      # success, the jars are on disk, and no server runs one of them. TopologyTest holds the two
      # halves together, character for character.
      - ${NETWORK_CONTROL_PLUGINS:-mc-network-control-plugins}:/volumes/network-control/plugins
      - ${LIMBO_PLUGINS:-mc-limbo-plugins}:/volumes/limbo/plugins
      - ${HUNGER_GAMES_PLUGINS:-mc-hunger-games-plugins}:/volumes/hunger-games/plugins
      - ${SMP_PLUGINS:-mc-smp-plugins}:/volumes/smp/plugins
      # The bot's jar and this container's own: to the code above them both are the same shape as a
      # plugins folder - a directory with one jar in it that gets replaced.
      - bot-jar:/volumes/discord-bot
      # Mounted at the path the entrypoint reads on the next start. This container installs its own
      # new jar here and carries on running the old one: no process replaces the jar it is executing,
      # so the new one takes effect at the restart and never during a run.
      - steward-worker-jar:/volumes/steward-worker
      # THE VOLUMES THIS SERVICE SAVES, READ-ONLY (§9a).
      #
      # One line per volume in steward.yml#backup.volumes, mounted where TarSnapshots looks for it.
      # `:ro` is load-bearing here, unlike on the socket below: these are worlds and databases, the
      # one thing in this stack that cannot be rebuilt from the repository, and this container's
      # other job is writing jars. A backup that can write to what it is saving is one bug away
      # from being what destroyed it.
      #
      # A volume named in the config but missing here is a FAILED line naming the path - not a
      # small archive that looks like a success. That distinction is todo.md A23, which was a run
      # reporting success having saved nothing.
      - mc-smp:/backup-sources/nordtal-s2_mc-smp:ro
      - mc-smp-plugins:/backup-sources/nordtal-s2_mc-smp-plugins:ro
      - mc-network-control:/backup-sources/nordtal-s2_mc-network-control:ro
      - mc-network-control-plugins:/backup-sources/nordtal-s2_mc-network-control-plugins:ro
      - mc-limbo-plugins:/backup-sources/nordtal-s2_mc-limbo-plugins:ro
      - mc-hunger-games-plugins:/backup-sources/nordtal-s2_mc-hunger-games-plugins:ro
      - bot-config:/backup-sources/nordtal-s2_bot-config:ro
      - steward-ui-config:/backup-sources/nordtal-s2_steward-ui-config:ro
      # Where the archives and the database dump land. NOT one of the volumes above: a backup
      # directory inside a backed-up volume grows by its own contents every night.
      - steward-backups:/backups
      # THE DOCKER SOCKET, AND WHAT THAT ACTUALLY MEANS.
      #
      # With this, steward-worker can read every container's state, health, image digest, log and
      # resource use, and can stop and start them - which is how the interface answers "what is
      # running", "is anything behind its registry" and "what did it just print". Before 2026-09-12
      # all of that went through a management panel whose image check never asked a registry at all:
      # four releases ran behind while it reported everything current (todo.md A24).
      #
      # IT IS NOT READ-ONLY AND CANNOT BE MADE READ-ONLY. Appending `:ro` restricts the socket FILE,
      # not the API behind it; a container that can talk to this socket can do anything the daemon
      # can, including starting a privileged container. The restraint is in the code above it -
      # DockerOps reads, stops and starts, and refuses to create containers - and the boundary that
      # matters is §3's: steward-ui gets no socket at all, because the web interface is the part an
      # attacker reaches first.
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *logging

  # -------------------------------------------------------------------------------------------
  # steward-ui - the web interface, and THE ONE SERVICE HERE THAT HOLDS NO DOCKER SOCKET (§3).
  #
  # That is the whole of its privilege: it can reach steward-worker and steward-deployer over the
  # `steward` network with two different secrets, and it can reach PostgreSQL. Everything it knows
  # about a container it asked the worker for; every container it creates, the deployer created.
  #
  # WHAT THE BOUNDARY ACTUALLY BUYS, so nobody relies on what it does not: it does not stop somebody
  # who takes this container from calling the worker's API - it stops them from calling anything but
  # its fixed-shape endpoints. There is no open `exec` anywhere in this stack, because `docker exec
  # … mc list` and `docker exec … sh` are the same permission to the daemon and the restriction can
  # therefore only live in our code.
  steward-ui:
    profiles: ["steward"]
    # A DEPLOY NEVER RUNS THIS - it pulls. Kept because it is how the image is developed here, and
    # because build.yml catches a Dockerfile that COPYs a file .dockerignore excludes.
    build:
      context: ./steward-ui
    image: ${STEWARD_UI_IMAGE:-ghcr.io/nordtal/steward-ui:latest}
    restart: unless-stopped
    networks: ["steward"]
    depends_on:
      # The schema, like everything else here. This service reads `update_request`, `audit_log`
      # and the metrics table directly, so it must not come up against an older one.
      steward-worker:
        condition: service_healthy
    # No healthcheck block: the image carries one (curl against /api/health, which also says
    # whether the worker answers). Repeating it here would replace the image's outright and be a
    # second copy to keep equal.
    environment:
      TZ: ${TZ:-Europe/Berlin}

      # --- database.yml ------------------------------------------------------------------
      # The same database as everything else, under this service's own prefix.
      NORDTAL_STEWARD_UI_DATABASE_JDBC_URL: *db-url
      NORDTAL_STEWARD_UI_DATABASE_USERNAME: *db-username
      NORDTAL_STEWARD_UI_DATABASE_PASSWORD: *db-password

      # --- steward-ui.yml ----------------------------------------------------------------
      # ONE NAME, TWO USES. This is the value Caddy answers on and the redirect URI Discord is
      # given, derived from the same variable so the two cannot disagree - which they would, once,
      # silently, on the day somebody changed one of them.
      NORDTAL_STEWARD_UI_PUBLIC_URL: https://${STEWARD_HOST:?set STEWARD_HOST in .env - the name this interface answers on, e.g. steward.dev.nordtal.eu}
      # The worker's secret and the deployer's, and they are NOT the same value. The deployer may
      # create containers and the worker may not; one token for both would make that boundary a
      # comment in a Java file.
      NORDTAL_STEWARD_UI_WORKER_TOKEN: ${STEWARD_API_TOKEN:?set STEWARD_API_TOKEN in .env - the secret steward-ui and steward-worker share, `openssl rand -hex 32`}
      NORDTAL_STEWARD_UI_DEPLOYER_TOKEN: ${STEWARD_DEPLOYER_TOKEN:?set STEWARD_DEPLOYER_TOKEN in .env - the secret steward-ui and steward-deployer share, and a DIFFERENT one, `openssl rand -hex 32`}
      # Discord sign-in. The BOT'S application, reused: one client id, a second secret. Empty
      # values mean nobody can sign in, and the sign-in page names the one that is missing rather
      # than failing at Discord - so these are not `:?`.
      NORDTAL_STEWARD_UI_DISCORD_CLIENT_ID: ${STEWARD_UI_DISCORD_CLIENT_ID:-}
      NORDTAL_STEWARD_UI_DISCORD_CLIENT_SECRET: ${STEWARD_UI_DISCORD_CLIENT_SECRET:-}
      # A SECOND COPY of what the bot's access.yml says, deliberately: two processes, two volumes,
      # no shared file. Written from the same .env variables so they start out agreeing.
      NORDTAL_STEWARD_UI_DISCORD_GUILD_ID: ${NORDTAL_ACCESS_GUILD_ID:?set NORDTAL_ACCESS_GUILD_ID in .env}
      NORDTAL_STEWARD_UI_DISCORD_ADMIN_ROLE: ${NORDTAL_ACCESS_ROLES_ADMIN:?set NORDTAL_ACCESS_ROLES_ADMIN in .env - the role mirrored into discord_user.admin}
    volumes:
      - steward-ui-config:/app/config
      # THE CONFIGURATION OF EVERY SERVICE IN THE STACK, mounted a second time so the interface can
      # draw a form for it (§10a.6). One directory per compose service, named after it, because
      # that is exactly what the page shows as the service a file belongs to.
      #
      # THEY ARE WRITABLE, AND THAT IS THE DECISION (Till, 2026-09-13): saving is what makes the
      # page worth having, and it is also the reload - a write publishes on `nordtal_config`, which
      # is what made ReloadSmp, ReloadNetwork, ReloadHungerGames and ReloadBotMessages unnecessary.
      # A volume left out here is simply not listed; the page says nothing about what it cannot see.
      #
      # THE FOUR PLUGIN VOLUMES USE THE SAME EXPRESSIONS THE SERVERS DO, character for character.
      # Spelling one differently here would show an operator a file nothing reads - the same class
      # of failure TopologyTest holds shut for steward-worker.
      - steward-ui-config:/configs/steward-ui
      - steward-worker-config:/configs/steward-worker
      - bot-config:/configs/discord-bot
      - ${NETWORK_CONTROL_PLUGINS:-mc-network-control-plugins}:/configs/network-control
      - ${LIMBO_PLUGINS:-mc-limbo-plugins}:/configs/limbo
      - ${HUNGER_GAMES_PLUGINS:-mc-hunger-games-plugins}:/configs/hunger-games
      - ${SMP_PLUGINS:-mc-smp-plugins}:/configs/smp
    logging: *logging

  # -------------------------------------------------------------------------------------------
  # steward-deployer - the only process in this stack allowed to create a container (§8a, §8b).
  #
  # IT CARRIES THIS FILE INSIDE ITS OWN IMAGE. "Which compose.yml is live" is therefore answered by
  # an image tag rather than by a commit hash, and there is no working tree on the host that
  # somebody can edit and lose at the next sync - which is the failure mode Arcane's GitOps
  # checkout had, and the reason this service exists.
  #
  # IT NEVER RECREATES ITSELF. `Compose.SELF` is refused wherever a service name is accepted: it is
  # the container the request travels through, so the answer would never come back. Renewing this
  # one is deploy/setup.sh's job on the host (§9c).
  steward-deployer:
    profiles: ["steward"]
    build:
      context: ./steward-deployer
    image: ${STEWARD_DEPLOYER_IMAGE:-ghcr.io/nordtal/steward-deployer:latest}
    restart: unless-stopped
    networks: ["steward"]
    healthcheck:
      # busybox wget - this image is `25-jre-alpine`, not the Ubuntu-based `25-jre`, and the
      # difference matters: measured 2026-09-13, the Alpine one carries wget and the Ubuntu one
      # carries neither wget nor curl. A healthcheck against a binary that is not there is a
      # service that answers every request and is reported unhealthy forever.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # IT REFUSES TO SERVE WITHOUT THIS. A process that can recreate every container in the stack,
      # unauthenticated on a shared network, is a remote root shell with extra steps - and a
      # service that only logs a warning about that gets deployed anyway.
      NORDTAL_STEWARD_DEPLOYER_TOKEN: ${STEWARD_DEPLOYER_TOKEN:?set STEWARD_DEPLOYER_TOKEN in .env - the secret steward-ui and steward-deployer share, `openssl rand -hex 32`}
      # WHAT `up` MEANS HAS TO BE THE SAME SELECTION ON BOTH SIDES. This service runs
      # `docker compose up` with the mounted .env as its --env-file, so COMPOSE_PROFILES comes from
      # there and not from here; the variable is repeated only so that a `docker compose` typed on
      # the host and a deploy from the interface act on the same set of services.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-db,bot,mc,backup,steward}
    volumes:
      # THE SOCKET. It is not read-only and cannot be made read-only: `:ro` restricts the socket
      # FILE and not the API behind it, and a container that can talk to this daemon can start a
      # privileged one. The restraint is that this process runs `docker compose` with a file it
      # cannot be given from outside, and that steward-ui - the part an attacker reaches first -
      # has no socket at all.
      - /var/run/docker.sock:/var/run/docker.sock
      # The deployment's secrets, for compose to interpolate. READ-ONLY, and an ABSOLUTE host path:
      # this is the one file in the deployment that is in no image and in no repository, and
      # deploy/setup.sh is what puts it where this points.
      - ${STEWARD_ENV_FILE:?set STEWARD_ENV_FILE in .env - the ABSOLUTE path of this .env on the host, which deploy/setup.sh writes}:/app/env/.env:ro
    logging: *logging

  # -------------------------------------------------------------------------------------------
  # Caddy - HTTPS for the interface, and the only thing in this file that listens on the internet
  # besides the Minecraft proxy (§9c: chosen over Traefik because automatic certificates without
  # configuration is the entire requirement).
  #
  # THE CADDYFILE IS IN THIS FILE, as an inline `configs:` block. It could not usefully be a file on
  # the host: steward-deployer runs compose with `--project-directory /app` inside its own image, so
  # a relative bind would point into the image and an absolute one would be a second thing the setup
  # script has to place and keep in step with this file. Verified on 2026-09-13 that both compose
  # versions in play support inline content - the host's v5.5.1 and the v2.40.3 baked into the
  # deployer image - and that ${...} inside it is interpolated exactly like anywhere else.
  #
  # WHICH IS ALSO THE TRAP: Caddy's own environment syntax is `{$VAR}`, and compose eats that too
  # (measured, not assumed - it warns "variable is not set" and substitutes a blank). Caddy
  # placeholders without a `$` - `{http.request.uri}` and the like - pass through untouched. So
  # every value here is interpolated by compose, and none by Caddy.
  #
  # ONE CERTIFICATE, FOR ONE NAME. Ports 80 and 443 on this host were free when this was written
  # (checked 2026-09-12); 80 is not decoration, it is how the HTTP-01 challenge is answered and how
  # a browser typing the bare name is redirected.
  caddy:
    profiles: ["steward"]
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    networks: ["steward"]
    # NO depends_on, deliberately. A reverse proxy that will not start because its upstream is
    # unhealthy is a host that answers nothing at all - not even the 502 that would say which half
    # is broken. Caddy retries the upstream by itself on every request.
    ports:
      - "${CADDY_BIND:-0.0.0.0}:80:80"
      - "${CADDY_BIND:-0.0.0.0}:443:443"
      # HTTP/3. Caddy advertises it in Alt-Svc whether or not this is published, so leaving it out
      # is a browser trying a port nothing listens on and falling back a moment later.
      - "${CADDY_BIND:-0.0.0.0}:443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      # THE CERTIFICATES AND THE ACME ACCOUNT KEY. This volume is why a recreate of this container
      # does not ask Let's Encrypt for a new certificate - and why losing it is a rate limit away
      # from an outage rather than a free retry.
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # The admin API on 127.0.0.1:2019, which is Caddy's own answer to "is my configuration
      # loaded". Measured 2026-09-13: caddy:2-alpine is v2.11.4 and carries busybox wget, no curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

configs:
  # The whole of Caddy's configuration. Short on purpose: one name, one upstream, and the
  # certificate is Caddy's business.
  caddyfile:
    content: |
      {
      	email ${STEWARD_ACME_EMAIL:?set STEWARD_ACME_EMAIL in .env - where Let's Encrypt sends expiry warnings}
      }

      ${STEWARD_HOST} {
      	encode zstd gzip

      	# Everything behind this is steward-ui, which holds no docker socket. There is no second
      	# route here and there must not be: steward-worker's internal API and steward-deployer's
      	# are reachable from the `steward` network and from nowhere else, which is what keeps the
      	# thing on the internet from being the thing that holds the socket.
      	reverse_proxy steward-ui:8080 {
      		# The log follow and the deploy output are Server-Sent Events. Caddy flushes
      		# text/event-stream by itself, so this is only about the deadline: a stream that is
      		# quiet for two minutes - a server nobody is typing on - must not be cut.
      		flush_interval -1
      	}
      }

volumes:
  # Every archive steward-worker writes: one tar.zst per volume per run, plus the database dump.
  # It is deliberately NOT in backup.volumes - saving the backups into the backups is how a disk
  # fills up overnight - and it is what the Storage Box upload reads when there is one.
  steward-backups:
  postgres-data:
  bot-config:
  steward-worker-config:
  # The interface's own steward-ui.yml. It is in the backup list because the Ampel's thresholds
  # live in it and are edited from the interface - the file is small and the alternative is
  # "somebody will remember what those numbers were".
  steward-ui-config:
  # Caddy's certificates and its ACME account key. Losing this is not a free retry: the next start
  # asks Let's Encrypt for a new certificate, and their rate limit is what turns that into an
  # outage. It is deliberately NOT in the backup list - a certificate is reissued, and an archive
  # of a private key is one more copy of a private key.
  caddy-data:
  caddy-config:
  # The two jars that are a whole container each. Written by steward-worker, read by the container
  # they belong to; neither is worth backing up - a lost one is refilled by
  # `steward-worker bootstrap`.
  bot-jar:
  steward-worker-jar:
  bunq-context:
  mc-network-control:
  mc-limbo:
  mc-hunger-games:
  mc-smp:
  # The four plugins/ folders, one volume each and separate from the server volume beside them. THEY
  # HOLD THE ONLY HAND-EDITED FILES IN THE DEPLOYMENT - every plugin's config.yml, smp's
  # milestones.yml and sounds.yml, the proxy's pack.yml - so they are worth a nightly snapshot,
  # and they are separate from the worlds so that saving them is not saving four gigabytes of
  # terrain. The jars in them are steward-worker's and are not worth saving.
  #
  # A local stack points the four variables above at directories instead and none of these is
  # created. See deploy/dev.env.example.
  mc-network-control-plugins:
  mc-limbo-plugins:
  mc-hunger-games-plugins:
  mc-smp-plugins:

# ---------------------------------------------------------------------------------------------
# TWO SEGMENTS, AND THE LINE BETWEEN THEM IS THE POINT (§3).
#
#   default   PostgreSQL and its ordinary clients: the four Minecraft services and the bot.
#   steward   PostgreSQL again, plus steward-worker, steward-ui, steward-deployer and Caddy.
#
# Without the split, "the worker's API is only reachable internally" would also read "every plugin
# can deploy", and a compromised third-party plugin would be a deploy button. A Minecraft container
# on `default` cannot even resolve the name `steward-worker`, let alone ask it for a console.
#
# WHY POSTGRES IS ON BOTH rather than the worker being on `default`: the worker is the container
# with the docker socket and the console endpoint, and the database is a database. Putting the
# smaller privilege on both sides is the cheaper mistake.
#
# `default` IS NAMED EXPLICITLY so that nothing changes for the services that do not mention a
# network - the four Minecraft ones, the bot, pack-host. Compose puts them here, under the name it
# would have used anyway, and adding this block does not silently move them.
networks:
  default:
  steward:
