# nordtal.eu season 2, the whole deployment. Install it with:
#
#   curl -fsSL https://raw.githubusercontent.com/nordtal/season-2/main/deploy/nordtal.sh | bash
#
# The installation is the directory the script runs in; NORDTAL_DIR is its absolute path and every
# volume defaults to a folder under it. The environment file lives at STEWARD_ENV_FILE, outside that
# directory, so a hand-typed `docker compose` needs `--env-file`. .env.example documents every setting.
#
# This file is baked into steward-agent's image, the only service allowed to create containers.
# Caddy's config is inline at the foot for the same reason: the agent cannot see host files.
#
# Every image of ours is the release's, tagged with its version: NORDTAL_RELEASE, which steward-agent
# sets to its own on every compose command, so the agent's release is the stack's. `build:` blocks are
# for local development. Only the plugins and Paper/Velocity are files, which runs install.
#
# COMPOSE_PROFILES selects the services; production is `db,bot,mc,backup,steward`. `up` and `down`
# must use the same selection. `standby` is never selected: an update run starts those services
# by name and stops them again.
#
# migrate applies the schema from steward-agent's image and exits; every service with a database login
# waits for it to succeed, so nothing starts against an older schema. The Minecraft services also wait
# for steward-agent, which installs what they are missing. Neither has a profile. Nothing depends on
# postgres, so an external database works.

name: nordtal-s2

# Our JVM services share one image template; each passes its module.
x-jvm-build: &jvm-build # `./gradlew imageContexts` first: the template copies each module's build/image/app.jar.
  context: .
  dockerfile: deploy/jvm/Dockerfile

# Healthy means the process refreshed its readiness marker within 90s: three beats, held equal to
# Readiness.STALE_AFTER by TopologyTest. Every JVM service of ours writes it.
x-readiness: &readiness ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/nordtal-ready) )) -lt 90"]

# Shared by the four Minecraft services, which differ only in environment.
x-minecraft: &minecraft
  profiles: ["mc"]
  # For local development only; a deploy pulls.
  build:
    context: ./deploy/minecraft
  image: ${NORDTAL_IMAGES:-ghcr.io/nordtal}/minecraft:${NORDTAL_RELEASE:?the release every image of ours runs - steward-agent and deploy/nordtal.sh pass it}
  restart: unless-stopped
  depends_on:
    # The schema, and the jars steward-agent installs; see the header on why not the database.
    migrate:
      condition: service_completed_successfully
    steward-agent:
      condition: service_healthy
  # The entrypoint must be PID 1 to trap SIGTERM and hold stdout; `init: true` would break both.
  init: false
  # Time for the JVM's shutdown hook to save; the 10s default is too short.
  stop_grace_period: 180s
  # Healthy means the season plugin refreshed its readiness marker within 90s (three beats, held equal
  # to Readiness.STALE_AFTER by TopologyTest) and the port answers. `bash -c`, since dash has no /dev/tcp.
  healthcheck:
    test:
      [
        "CMD",
        "bash",
        "-c",
        "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/nordtal-ready) )) -lt 90 && exec 3<>/dev/tcp/127.0.0.1/$${SERVER_PORT:-25565}",
      ]
    interval: 15s
    timeout: 5s
    # Not 1: a long tick can refuse a connection, and flapping health gets ignored.
    retries: 3
    # The marker lands after onEnable loads every world, well after the port opens.
    start_period: 300s
  environment: &minecraft-env
    TZ: ${TZ:-Europe/Berlin}
    # SERVER_VERSION is a literal per service, mirroring eu.nordtal.s2.common.Platform.
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# The database every client connects to, each under its own variable prefix. NORDTAL_DATABASE_* points
# the stack at an external PostgreSQL; POSTGRES_* configures the bundled one. migrate and steward-agent
# log in as the owner; migrate first creates every other service's role with the password given here, and
# every other service logs in as its own role, whose name is fixed (DatabaseRole in :database).
x-database:
  url: &db-url ${NORDTAL_DATABASE_JDBC_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nordtal}}
  username: &db-username ${NORDTAL_DATABASE_USERNAME:-${POSTGRES_USER:-nordtal}}
  password: &db-password ${NORDTAL_DATABASE_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD or NORDTAL_DATABASE_PASSWORD in .env}}
  discord-bot-password: &db-discord-bot-password ${POSTGRES_DISCORD_BOT_PASSWORD:?set POSTGRES_DISCORD_BOT_PASSWORD in .env}
  proxy-password: &db-proxy-password ${POSTGRES_PROXY_PASSWORD:?set POSTGRES_PROXY_PASSWORD in .env}
  limbo-password: &db-limbo-password ${POSTGRES_LIMBO_PASSWORD:?set POSTGRES_LIMBO_PASSWORD in .env}
  hunger-games-password: &db-hunger-games-password ${POSTGRES_HUNGER_GAMES_PASSWORD:?set POSTGRES_HUNGER_GAMES_PASSWORD in .env}
  smp-password: &db-smp-password ${POSTGRES_SMP_PASSWORD:?set POSTGRES_SMP_PASSWORD in .env}
  steward-password: &db-steward-password ${POSTGRES_STEWARD_PASSWORD:?set POSTGRES_STEWARD_PASSWORD in .env}

services:
  postgres:
    profiles: ["db"]
    # A run renews its image last of all, since the run's report goes through it.
    labels: { eu.nordtal.renew: last, eu.nordtal.section: Database }
    # On every network a process with a database login is on; see `networks:` at the foot.
    networks: ["default", "steward", "agent-database"]
    # The version the integration tests run against.
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      # Published for backups and a host psql only; loopback unless POSTGRES_BIND says otherwise.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_DATA:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/postgres-data}:/var/lib/postgresql/data
      # steward-agent runs pg_dump inside this container, so the dump directory is mounted here.
      # postgres-data itself is never archived: a tar of a live PGDATA does not restore.
      - ${STEWARD_BACKUPS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/steward-backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  # The Discord bot: no Minecraft dependency and no bank credential. It validates the schema and asks
  # steward for payment links through a table. The name matches the module and the artefact id,
  # held equal by TopologyTest; the profile stays `bot`.
  discord-bot:
    profiles: ["bot"]
    # A run renews it.
    labels:
      eu.nordtal.renew: run
      eu.nordtal.section: Discord
      eu.nordtal.stores-in: postgres
    image: ${NORDTAL_IMAGES:-ghcr.io/nordtal}/discord-bot:${NORDTAL_RELEASE:?the release every image of ours runs - steward-agent and deploy/nordtal.sh pass it}
    build:
      <<: *jvm-build
      args: { MODULE: discord-bot }
    restart: unless-stopped
    depends_on:
      # The bot refuses an unmigrated database.
      migrate:
        condition: service_completed_successfully
    # The marker is written once JDA is ready and refreshed by the timer thread, so a wedged timer goes
    # red. The bot listens on nothing, so there is no port check.
    healthcheck:
      test: *readiness
      interval: 15s
      timeout: 5s
      retries: 3
      # Three minutes: a Discord login, a full member chunk, the managed messages and two reconciles
      # all land before the marker, and a bad token deliberately sleeps 60s before exiting.
      start_period: 180s
    environment:
      TZ: ${TZ:-Europe/Berlin}

      # The database group
      NORDTAL_DATABASE_JDBC_URL: *db-url
      NORDTAL_DATABASE_USERNAME: nordtal_discord_bot
      NORDTAL_DATABASE_PASSWORD: *db-discord-bot-password

      # The bot group
      NORDTAL_BOT_TOKEN: ${NORDTAL_BOT_TOKEN:?set NORDTAL_BOT_TOKEN in .env}
      # The bunq key lives on steward-bunq, not here.

      # The access group: the guild and the admin role are required; deploy/nordtal.sh asks for both.
      NORDTAL_ACCESS_GUILD_ID: ${NORDTAL_ACCESS_GUILD_ID:?set NORDTAL_ACCESS_GUILD_ID in the environment file - deploy/nordtal.sh asks for it}
      NORDTAL_ACCESS_ROLES_ADMIN: ${NORDTAL_ACCESS_ROLES_ADMIN:?set NORDTAL_ACCESS_ROLES_ADMIN in the environment file - deploy/nordtal.sh asks for it}
    logging: *logging

  # Serves a locally built resource pack on loopback; `devpack` is never selected in production.
  # `dev pack` builds the zip into PACK_ROOT and sets the proxy's pack to it.
  pack-host:
    profiles: ["devpack"]
    # Nobody here builds its image; a run renews it once the rest is back.
    labels: { eu.nordtal.renew: after }
    image: ${PACK_HOST_IMAGE:-nginx:alpine}
    restart: unless-stopped
    ports:
      - "${PACK_BIND:-127.0.0.1}:${PACK_PORT:-8080}:80"
    volumes:
      - ${PACK_ROOT:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/pack}:/usr/share/nginx/html:ro
    logging: *logging

  # The Velocity proxy.
  proxy:
    <<: *minecraft
    # What server it is and which plugins it runs, read by steward-agent and, through the aliases in the
    # environment, by the entrypoint. A plugin is artifact[=jar prefix][?]: the prefix where the jar is not
    # named after the artefact, `?` where its absence must not stop the server. A run renews it; steward-agent
    # types into its console, which the standbys do not have.
    labels:
      eu.nordtal.server: &proxy-kind velocity
      # Voice chat's proxy half may be missing: this container is the network.
      eu.nordtal.plugins: &proxy-plugins "proxy voicechat-velocity?"
      eu.nordtal.renew: run
      eu.nordtal.console: "true"
      eu.nordtal.section: Entry
      eu.nordtal.entry: "true"
      eu.nordtal.reaches: smp hunger-games limbo
      eu.nordtal.stores-in: postgres
    # Holds nothing that cannot be rebuilt, so the OOM killer should take it first.
    oom_score_adj: 500
    # Anchored so proxy-standby reuses this exact node.
    environment: &proxy-env
      <<: *minecraft-env
      SERVER_KIND: *proxy-kind
      SERVER_PLUGINS: *proxy-plugins
      # Fill's family name; TopologyTest holds it against Platform.VELOCITY_FAMILY.
      SERVER_VERSION: "4.0.0"
      HEAP: ${PROXY_HEAP:-1G}
      # Replaces the whole java command line, heap size included.
      JVM_OPTS: ${PROXY_JVM_OPTS:-}
      # Also reaches the backends as PAPER_VELOCITY_SECRET.
      VELOCITY_FORWARDING_SECRET: ${VELOCITY_FORWARDING_SECRET:?set VELOCITY_FORWARDING_SECRET in .env - generate one with `openssl rand -hex 24`}
      # Seeds velocity.toml on a fresh volume only; later changes are made by hand.
      VELOCITY_SERVERS: ${VELOCITY_SERVERS:-limbo=limbo:25565 limbo-standby=limbo-standby:25565 hunger-games=hunger-games:25565 smp=smp:25565}
      VELOCITY_TRY: ${VELOCITY_TRY:-limbo}
      # host:port a client is transferred to; empty disables transfers, so an update takes the network down.
      NORDTAL_PROXY_NETWORK_PUBLIC_ADDRESS: ${NETWORK_PUBLIC_ADDRESS:-}
      # The port proxy-standby publishes.
      NORDTAL_PROXY_NETWORK_STANDBY_PORT: ${PROXY_STANDBY_PORT:-25566}
      # Set explicitly so the live proxy never mistakes itself for the standby.
      NORDTAL_PROXY_NETWORK_STANDBY: "false"
      # caddy sends a PROXY header; the entrypoint writes this into velocity.toml on every start.
      VELOCITY_HAPROXY: ${VELOCITY_HAPROXY:-true}
      # The pack url and sha1 are settings steward writes, never set here: an override would hide them.
      NORDTAL_PROXY_DATABASE_JDBC_URL: *db-url
      NORDTAL_PROXY_DATABASE_USERNAME: nordtal_proxy
      NORDTAL_PROXY_DATABASE_PASSWORD: *db-proxy-password
    # No published ports: caddy forwards 25565 to whichever proxy answers.
    volumes:
      - ${PROXY_DATA:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-proxy}:/data
      # An absolute bind path by default, so SFTP can read it; TopologyTest holds that.
      - ${PROXY_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-proxy-plugins}:/data/plugins

  # A second proxy that holds players while the live one restarts; no ordinary profile starts it.
  # Shares the proxy's environment node and has volumes of its own.
  proxy-standby:
    <<: *minecraft
    labels: { eu.nordtal.standby-of: proxy }
    # OomLightningRodTest holds this equal to the proxy's.
    oom_score_adj: 500
    # Started by name only.
    profiles: ["standby"]
    # The one setting a process cannot infer about itself.
    environment:
      <<: *proxy-env
      NORDTAL_PROXY_NETWORK_STANDBY: "true"
    # Reached through caddy on ${PROXY_STANDBY_PORT}; voice follows whichever proxy answers.
    volumes:
      - ${PROXY_STANDBY_DATA:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-proxy-standby}:/data
      # steward copies the live proxy's jars and data files here.
      - ${PROXY_STANDBY_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-proxy-standby-plugins}:/data/plugins

  # The waiting room. Needs the database for one thing only: the player's language.
  limbo:
    <<: *minecraft
    # As the proxy's.
    labels:
      eu.nordtal.server: &limbo-kind paper
      eu.nordtal.plugins: &limbo-plugins "limbo"
      eu.nordtal.renew: run
      eu.nordtal.console: "true"
      eu.nordtal.section: Paper
      eu.nordtal.stores-in: postgres
    # Holds nothing that cannot be rebuilt, so the OOM killer should take it first.
    oom_score_adj: 500
    # Anchored so limbo-standby reuses this exact node.
    environment: &limbo-env
      <<: *minecraft-env
      SERVER_KIND: *limbo-kind
      SERVER_VERSION: "26.2"
      SERVER_PLUGINS: *limbo-plugins
      HEAP: ${LIMBO_HEAP:-1G}
      JVM_OPTS: ${LIMBO_JVM_OPTS:-}
      # No level name or seed: limbo builds its own empty world.
      EULA: ${EULA:?set EULA=true to accept https://aka.ms/MinecraftEULA}
      # Makes this a Velocity backend; Paper reads the secret from here.
      PAPER_VELOCITY_SECRET: ${VELOCITY_FORWARDING_SECRET:?set VELOCITY_FORWARDING_SECRET in .env - generate one with `openssl rand -hex 24`}
      NORDTAL_LIMBO_DATABASE_JDBC_URL: *db-url
      NORDTAL_LIMBO_DATABASE_USERNAME: nordtal_limbo
      NORDTAL_LIMBO_DATABASE_PASSWORD: *db-limbo-password
    volumes:
      - ${LIMBO_DATA:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-limbo}:/data
      # plugins/ apart from the rest, as for the proxy.
      - ${LIMBO_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-limbo-plugins}:/data/plugins

  # A second limbo that holds players while limbo or the SMP restarts; listed in both velocity.toml files.
  limbo-standby:
    <<: *minecraft
    labels: { eu.nordtal.standby-of: limbo }
    # Equal to limbo's.
    oom_score_adj: 500
    profiles: ["standby"]
    environment: *limbo-env
    volumes:
      - ${LIMBO_STANDBY_DATA:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-limbo-standby}:/data
      - ${LIMBO_STANDBY_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-limbo-standby-plugins}:/data/plugins

  # The start event; stoppable once the phase turns to SMP.
  hunger-games:
    <<: *minecraft
    # As the proxy's. Voice chat runs where people play, not on limbo, and may be missing.
    labels:
      eu.nordtal.server: &hunger-games-kind paper
      eu.nordtal.plugins: &hunger-games-plugins "hunger-games voicechat?"
      eu.nordtal.renew: run
      eu.nordtal.console: "true"
      eu.nordtal.section: Paper
      eu.nordtal.stores-in: postgres
    environment:
      <<: *minecraft-env
      SERVER_KIND: *hunger-games-kind
      SERVER_VERSION: "26.2"
      SERVER_PLUGINS: *hunger-games-plugins
      HEAP: ${HUNGER_GAMES_HEAP:-4G}
      JVM_OPTS: ${HUNGER_GAMES_JVM_OPTS:-}
      # The event world; ComposeWorldTest holds this default against the plugin's.
      LEVEL_NAME: ${HUNGER_GAMES_LEVEL_NAME:-hunger_games}
      EULA: ${EULA:?set EULA=true to accept https://aka.ms/MinecraftEULA}
      # Makes this a Velocity backend; Paper reads the secret from here.
      PAPER_VELOCITY_SECRET: ${VELOCITY_FORWARDING_SECRET:?set VELOCITY_FORWARDING_SECRET in .env - generate one with `openssl rand -hex 24`}
      NORDTAL_HUNGER_GAMES_DATABASE_JDBC_URL: *db-url
      NORDTAL_HUNGER_GAMES_DATABASE_USERNAME: nordtal_hunger_games
      NORDTAL_HUNGER_GAMES_DATABASE_PASSWORD: *db-hunger-games-password
    volumes:
      - ${HUNGER_GAMES_DATA:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-hunger-games}:/data
      # plugins/ apart from the rest, as for the proxy.
      - ${HUNGER_GAMES_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-hunger-games-plugins}:/data/plugins

  # The SMP: four worlds, and the only service with required third-party plugins.
  smp:
    <<: *minecraft
    # As the proxy's; a backup also stops it, since a snapshot of a running world is torn. CoreProtect has
    # no build for every version and voice chat is optional, so neither may stop it.
    labels:
      eu.nordtal.server: &smp-kind paper
      eu.nordtal.plugins: &smp-plugins "smp display-tags=papermc-display-tags packetevents=packetevents-spigot voicechat? coreprotect?"
      eu.nordtal.renew: run
      eu.nordtal.console: "true"
      eu.nordtal.backup: stop
      eu.nordtal.section: Paper
      eu.nordtal.stores-in: postgres
    environment:
      <<: *minecraft-env
      SERVER_KIND: *smp-kind
      SERVER_VERSION: "26.2"
      SERVER_PLUGINS: *smp-plugins
      # The datapacks are pinned by sha512.
      DATAPACK_URLS: ${SMP_DATAPACK_URLS:-f5283548323149ecd3f218b8efbe03c1c582df3f40b6bb3b095ba9e4cac0c87108b98adabd6ebd3a8037ec239773a253f75b8bee7db52e6f5663bf9dc63c2ea3@https://cdn.modrinth.com/data/8oi3bsk5/versions/CzijfXJQ/Terralith_26.2_v2.6.4.zip cf026b67f4fc0f5ab15229995f11faf43fdd41b29777a6756151276e83da65f887fe03b6356c5011f8ba32371f98941778928e4258e81b4c97411a40af1635ca@https://cdn.modrinth.com/data/tpehi7ww/versions/CS77UwHE/Dungeons%20and%20Taverns%20v5.3.2.zip}
      # Must match SmpSpec#world-nordtal; ComposeWorldTest holds that.
      LEVEL_NAME: ${SMP_LEVEL_NAME:-nordtal}
      # Applied only while the world does not exist yet.
      LEVEL_SEED: ${SMP_LEVEL_SEED:-1837371427}
      HEAP: ${SMP_HEAP:-6G}
      JVM_OPTS: ${SMP_JVM_OPTS:-}
      EULA: ${EULA:?set EULA=true to accept https://aka.ms/MinecraftEULA}
      # Makes this a Velocity backend; Paper reads the secret from here.
      PAPER_VELOCITY_SECRET: ${VELOCITY_FORWARDING_SECRET:?set VELOCITY_FORWARDING_SECRET in .env - generate one with `openssl rand -hex 24`}
      NORDTAL_SMP_DATABASE_JDBC_URL: *db-url
      NORDTAL_SMP_DATABASE_USERNAME: nordtal_smp
      NORDTAL_SMP_DATABASE_PASSWORD: *db-smp-password
    volumes:
      - ${SMP_DATA:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-smp}:/data
      # plugins/ apart from the rest, as for the proxy.
      - ${SMP_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-smp-plugins}:/data/plugins

  # steward: the web interface and its API, payments, alerts and the clocks that ask for runs. It
  # carries out no run. One-shot commands: `forget-factors` and `generate-vapid-keys`.
  steward:
    labels:
      eu.nordtal.renew: run
      eu.nordtal.section: Steward
      eu.nordtal.reaches: steward-agent steward-bunq
      eu.nordtal.stores-in: postgres
    build:
      <<: *jvm-build
      args: { MODULE: steward }
    image: ${NORDTAL_IMAGES:-ghcr.io/nordtal}/steward:${NORDTAL_RELEASE:?the release every image of ours runs - steward-agent and deploy/nordtal.sh pass it}
    restart: unless-stopped
    # It reaches Docker and payments only through `agent` and `bank`, which are its alone.
    networks: ["steward", "agent", "bank"]
    command: ["serve"]
    # Steward starts against a current schema.
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Makes http://host.docker.internal:<port> reach the host on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: *readiness
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # The database group.
      NORDTAL_STEWARD_DATABASE_JDBC_URL: *db-url
      NORDTAL_STEWARD_DATABASE_USERNAME: nordtal_steward
      NORDTAL_STEWARD_DATABASE_PASSWORD: *db-steward-password

      # steward#agent: containers, logs, backups and the plan come from steward-agent's API.
      NORDTAL_STEWARD_AGENT_TOKEN: ${STEWARD_AGENT_TOKEN:?set STEWARD_AGENT_TOKEN in .env - the secret steward and steward-agent share, `openssl rand -hex 32`}

      # steward#bunq: payments go through steward-bunq, which alone holds the bank key.
      NORDTAL_STEWARD_BUNQ_TOKEN: ${STEWARD_BUNQ_TOKEN:?set STEWARD_BUNQ_TOKEN in .env - the secret steward and steward-bunq share, `openssl rand -hex 32`}

      # The web group; the address is also the Discord redirect URI and the WebAuthn origin.
      NORDTAL_STEWARD_WEB_PUBLIC_URL: ${STEWARD_PUBLIC_URL:-https://${STEWARD_HOST:?set STEWARD_HOST in .env - the name this interface answers on, e.g. steward.dev.nordtal.eu}}
      # Must cover the host above, or the container refuses to start; blank keeps the web group.
      NORDTAL_STEWARD_WEB_WEBAUTHN_RELYING_PARTY_ID: ${STEWARD_WEBAUTHN_RP_ID:-}
      # Discord sign-in; empty disables it, and the sign-in page says which value is missing.
      NORDTAL_STEWARD_WEB_DISCORD_CLIENT_ID: ${STEWARD_DISCORD_CLIENT_ID:-}
      NORDTAL_STEWARD_WEB_DISCORD_CLIENT_SECRET: ${STEWARD_DISCORD_CLIENT_SECRET:-}
      # Seeded from the same variable as the bot's access group.
      NORDTAL_STEWARD_WEB_DISCORD_GUILD_ID: ${NORDTAL_ACCESS_GUILD_ID:?set NORDTAL_ACCESS_GUILD_ID in the environment file - deploy/nordtal.sh asks for it}
      # Only lists guild roles and channels for the editor's pickers; empty falls back to text fields.
      NORDTAL_STEWARD_WEB_DISCORD_BOT_TOKEN: ${NORDTAL_BOT_TOKEN:-}
      # Web Push keys from `steward generate-vapid-keys`; blank keeps what the web group holds.
      NORDTAL_STEWARD_WEB_WEB_PUSH_PUBLIC_KEY: ${STEWARD_WEB_PUSH_PUBLIC_KEY:-}
      NORDTAL_STEWARD_WEB_WEB_PUSH_PRIVATE_KEY: ${STEWARD_WEB_PUSH_PRIVATE_KEY:-}
    ports:
      # Loopback only; production traffic comes through Caddy.
      - "${STEWARD_BIND:-127.0.0.1}:${STEWARD_PORT:-8080}:8080"
    logging: *logging

  # migrate: the one process that applies the schema, from steward-agent's image. It creates every
  # other service's role with the password given here, migrates as the owner and exits; a restore runs
  # it again. No profile: everything with a database login waits for it to succeed.
  migrate:
    image: ${NORDTAL_IMAGES:-ghcr.io/nordtal}/steward-agent:${NORDTAL_RELEASE:?the release every image of ours runs - steward-agent and deploy/nordtal.sh pass it}
    command: ["migrate"]
    restart: "no"
    # postgres alone.
    networks: ["agent-database"]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      NORDTAL_STEWARD_AGENT_DATABASE_JDBC_URL: *db-url
      NORDTAL_STEWARD_AGENT_DATABASE_USERNAME: *db-username
      NORDTAL_STEWARD_AGENT_DATABASE_PASSWORD: *db-password
      # The passwords of the roles it creates before migrating.
      NORDTAL_STEWARD_AGENT_DATABASE_DISCORD_BOT_PASSWORD: *db-discord-bot-password
      NORDTAL_STEWARD_AGENT_DATABASE_PROXY_PASSWORD: *db-proxy-password
      NORDTAL_STEWARD_AGENT_DATABASE_LIMBO_PASSWORD: *db-limbo-password
      NORDTAL_STEWARD_AGENT_DATABASE_HUNGER_GAMES_PASSWORD: *db-hunger-games-password
      NORDTAL_STEWARD_AGENT_DATABASE_SMP_PASSWORD: *db-smp-password
      NORDTAL_STEWARD_AGENT_DATABASE_STEWARD_PASSWORD: *db-steward-password
    logging: *logging

  # steward-agent: the only process allowed to create a container, and the one that carries out every
  # run. It carries this file in its image and never recreates itself: a run of a newer release goes
  # to a one-shot from this service at that release, `<project>-steward-agent-run`, which renews it last.
  # No profile: the Minecraft services wait for it.
  steward-agent:
    labels: { eu.nordtal.section: Steward }
    build:
      <<: *jvm-build
      args: { MODULE: steward-agent }
    image: ${NORDTAL_IMAGES:-ghcr.io/nordtal}/steward-agent:${NORDTAL_RELEASE:?the release every image of ours runs - steward-agent and deploy/nordtal.sh pass it}
    restart: unless-stopped
    # `agent` is steward's way in, `agent-database` reaches postgres alone, `agent-egress` the release sources.
    networks: ["agent", "agent-database", "agent-egress"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The marker is first written once every missing jar is installed.
      test: *readiness
      interval: 10s
      timeout: 3s
      # 15 minutes, for a first bootstrap that downloads every jar.
      retries: 90
      start_period: 120s
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # Required; it refuses to serve without one.
      NORDTAL_STEWARD_AGENT_TOKEN: ${STEWARD_AGENT_TOKEN:?set STEWARD_AGENT_TOKEN in .env - the secret steward and steward-agent share, `openssl rand -hex 32`}
      # The env file decides; repeated so host and interface select the same services.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-db,bot,mc,backup,steward}
      # Must match the host's project, or a deploy starts a second, empty stack.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-nordtal-s2}
      # The release this container was made as. Every compose command it runs inherits both, so the
      # agent's release is the stack's; the environment of a process outranks the env file.
      NORDTAL_RELEASE: ${NORDTAL_RELEASE:?the release every image of ours runs - steward-agent and deploy/nordtal.sh pass it}
      NORDTAL_IMAGES: ${NORDTAL_IMAGES:-ghcr.io/nordtal}
      # A file name inside the directory mounted below, not a path.
      NORDTAL_STEWARD_AGENT_ENV_FILE: /app/env/${STEWARD_ENV_FILE_NAME:?set STEWARD_ENV_FILE_NAME in .env - the file name (not the path) of the environment file, derived from STEWARD_ENV_FILE by deploy/nordtal.sh}

      # The database group, as the owner: clearing old requests out of every inbox is its alone.
      NORDTAL_STEWARD_AGENT_DATABASE_JDBC_URL: *db-url
      NORDTAL_STEWARD_AGENT_DATABASE_USERNAME: *db-username
      NORDTAL_STEWARD_AGENT_DATABASE_PASSWORD: *db-password

      # The runs group; every run follows each repository's latest GitHub release.
      NORDTAL_STEWARD_AGENT_SEASON_REPO: ${SEASON_REPO:-}
      # Optional; raises GitHub's rate limit.
      NORDTAL_STEWARD_AGENT_GITHUB_TOKEN: ${STEWARD_GITHUB_TOKEN:-}
      # The installer's one question: whether Mojang's client jar may be fetched to draw item icons.
      NORDTAL_STEWARD_AGENT_MOJANG_ASSETS: ${NORDTAL_MOJANG_ASSETS:-false}
    volumes:
      # `:ro` cannot restrict the API behind the socket.
      - /var/run/docker.sock:/var/run/docker.sock
      # A directory, not the file: a file bind would keep the pre-rotation inode.
      - ${STEWARD_ENV_DIR:?set STEWARD_ENV_DIR in .env - the directory holding STEWARD_ENV_FILE, derived from it by deploy/nordtal.sh}:/app/env:ro
      # What a backup saves and a restore writes back. Proxy and limbo hold nothing worth saving.
      # Plugin paths must match the servers' expressions exactly; TopologyTest holds that.
      - ${SMP_DATA:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-smp}:/backup-sources/nordtal-s2_mc-smp
      - ${SMP_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-smp-plugins}:/backup-sources/nordtal-s2_mc-smp-plugins
      - ${HUNGER_GAMES_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-hunger-games-plugins}:/backup-sources/nordtal-s2_mc-hunger-games-plugins
      # Archives land here, outside every backed-up volume; postgres writes its dump into the same one.
      - ${STEWARD_BACKUPS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/steward-backups}:/backups
      # What a run installs into, under the names Topology expects; also the rotated logs behind the
      # console's backlog and each volume's size.
      - ${PROXY_DATA:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-proxy}:/volumes/proxy
      - ${LIMBO_DATA:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-limbo}:/volumes/limbo
      - ${HUNGER_GAMES_DATA:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-hunger-games}:/volumes/hunger-games
      - ${SMP_DATA:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-smp}:/volumes/smp
      # Must match the servers' plugins/ expressions exactly; TopologyTest holds that.
      - ${PROXY_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-proxy-plugins}:/volumes/proxy/plugins
      - ${LIMBO_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-limbo-plugins}:/volumes/limbo/plugins
      - ${HUNGER_GAMES_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-hunger-games-plugins}:/volumes/hunger-games/plugins
      - ${SMP_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-smp-plugins}:/volumes/smp/plugins
      # Standby plugins/: copies of the live ones after every apply, not backed up.
      - ${PROXY_STANDBY_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-proxy-standby-plugins}:/volumes/proxy-standby/plugins
      - ${LIMBO_STANDBY_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-limbo-standby-plugins}:/volumes/limbo-standby/plugins
      # Every service's message bundles, one directory per service, read out of the jars in it.
      # Plugin paths must match the servers' expressions exactly. The bot's stays empty: its jar is in its image.
      - ${BOT_CONFIG:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/bot-config}:/configs/discord-bot
      - ${PROXY_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-proxy-plugins}:/configs/proxy
      - ${LIMBO_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-limbo-plugins}:/configs/limbo
      - ${HUNGER_GAMES_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-hunger-games-plugins}:/configs/hunger-games
      - ${SMP_PLUGINS:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/mc-smp-plugins}:/configs/smp
    logging: *logging

  # steward-bunq: the only process that holds the bank key. It decides nothing and keeps nothing but
  # bunq's session for this device, which bunq binds to the device and IP that registered it.
  steward-bunq:
    profiles: ["steward"]
    labels: { eu.nordtal.renew: run, eu.nordtal.section: Steward }
    build:
      <<: *jvm-build
      args: { MODULE: steward-bunq }
    image: ${NORDTAL_IMAGES:-ghcr.io/nordtal}/steward-bunq:${NORDTAL_RELEASE:?the release every image of ours runs - steward-agent and deploy/nordtal.sh pass it}
    restart: unless-stopped
    # `bank` is steward's way in, `bank-egress` its own way out to bunq; nobody else is on either.
    networks: ["bank", "bank-egress"]
    healthcheck:
      # The marker is written once the API listens.
      test: *readiness
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # Required; it refuses to serve without one.
      NORDTAL_STEWARD_BUNQ_TOKEN: ${STEWARD_BUNQ_TOKEN:?set STEWARD_BUNQ_TOKEN in .env - the secret steward and steward-bunq share, `openssl rand -hex 32`}
      # Optional; without them payments are off, and the startup log says so.
      NORDTAL_STEWARD_BUNQ_API_KEY: ${NORDTAL_STEWARD_BUNQ_API_KEY:-}
      NORDTAL_STEWARD_BUNQ_ACCOUNT_ID: ${NORDTAL_STEWARD_BUNQ_ACCOUNT_ID:-}
    volumes:
      # Never copied: bunq binds the context to the registering device and IP.
      - ${BUNQ_CONTEXT:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/bunq-context}:/app/bunq
    logging: *logging

  # Caddy: HTTPS for the interface and the guard in front of the game port. The Caddyfile is inline
  # below; compose interpolates `${...}` inside it, so Caddy's `{$VAR}` syntax cannot be used.
  caddy:
    # Also in `mc`, because it guards the game port; a run renews it only once the rest is back.
    profiles: ["steward", "mc"]
    labels:
      eu.nordtal.renew: after
      eu.nordtal.section: Entry
      eu.nordtal.entry: "true"
      eu.nordtal.reaches: steward
    build:
      # Caddy with the layer 4 app built in.
      context: ./deploy/caddy
    image: ${NORDTAL_IMAGES:-ghcr.io/nordtal}/caddy:${NORDTAL_RELEASE:?the release every image of ours runs - steward-agent and deploy/nordtal.sh pass it}
    restart: unless-stopped
    # `steward` for the interface, `default` for the proxies.
    networks: ["steward", "default"]
    # No depends_on: Caddy retries upstreams itself.
    ports:
      - "${CADDY_BIND:-0.0.0.0}:80:80"
      - "${CADDY_BIND:-0.0.0.0}:443:443"
      # HTTP/3.
      - "${CADDY_BIND:-0.0.0.0}:443:443/udp"
      # The game port, so a restart can fail over to the standby.
      - "${PROXY_BIND:-0.0.0.0}:${PROXY_PORT:-25565}:25565"
      # Voice chat.
      - "${PROXY_BIND:-0.0.0.0}:25565:25565/udp"
      # The standby's port; it drops connections without a PROXY header.
      - "${PROXY_BIND:-0.0.0.0}:${PROXY_STANDBY_PORT:-25566}:25566"
      - "${PROXY_BIND:-0.0.0.0}:${PROXY_STANDBY_PORT:-25566}:25566/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      # Certificates and the ACME account key.
      - ${CADDY_DATA:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/caddy-data}:/data
      - ${CADDY_CONFIG:-${NORDTAL_DIR:?the installation directory, an absolute path - deploy/nordtal.sh writes it}/caddy-config}:/config
    healthcheck:
      # The admin API; the image has wget, not curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

configs:
  caddyfile:
    content: |
      {
      	email ${STEWARD_ACME_EMAIL:?set STEWARD_ACME_EMAIL in .env - where Let's Encrypt sends expiry warnings}

      	# The game port guard: prefers the live proxy and falls over to the standby. Velocity needs the
      	# PROXY header to see the player's address.
      	layer4 {
      		0.0.0.0:25565 {
      			route {
      				proxy {
      					lb_policy first
      					lb_try_duration 5s
      					lb_try_interval 250ms
      					fail_duration 10s
      					proxy_protocol v2
      					upstream proxy:25565
      					upstream proxy-standby:25565
      				}
      			}
      		}

      		# Voice is UDP without a PROXY header, which Simple Voice Chat would read as audio.
      		udp/0.0.0.0:25565 {
      			route {
      				proxy {
      					lb_policy first
      					lb_try_duration 5s
      					fail_duration 10s
      					upstream proxy:25565
      					upstream proxy-standby:25565
      				}
      			}
      		}

      		# The standby's own port, without failover back to the live proxy.
      		0.0.0.0:25566 {
      			route {
      				proxy {
      					proxy_protocol v2
      					upstream proxy-standby:25565
      				}
      			}
      		}

      		udp/0.0.0.0:25566 {
      			route {
      				proxy {
      					upstream proxy-standby:25565
      				}
      			}
      		}
      	}
      }

      ${STEWARD_HOST} {
      	encode zstd gzip

      	# No CSP: one would have to allow cdn.modrinth.com in img-src, and CaddyPolicyTest holds that.
      	# Only steward is exposed here; the internal APIs must never get a route.
      	reverse_proxy steward:8080 {
      		# Keeps quiet Server-Sent Event streams open.
      		flush_interval -1
      	}
      }

# Unused by default; deploy/dev.env.example points the local stack at these names.
volumes:
  # Not backed up itself.
  steward-backups:
  postgres-data:
  bot-config:
  # Not backed up; losing it means a new certificate and Let's Encrypt's rate limit.
  caddy-data:
  caddy-config:
  # Never copied or backed up: bunq binds it to one device and IP.
  bunq-context:
  mc-proxy:
  mc-limbo:
  mc-hunger-games:
  mc-smp:
  # The hand-edited plugin configs, backed up apart from the worlds.
  mc-proxy-plugins:
  mc-limbo-plugins:
  mc-hunger-games-plugins:
  mc-smp-plugins:
  # Rebuilt or copied on every apply, so not backed up.
  mc-proxy-standby:
  mc-proxy-standby-plugins:
  mc-limbo-standby:
  mc-limbo-standby-plugins:

# `default` holds the Minecraft services and the bot; `steward` holds steward and Caddy. Postgres is
# on both, so no plugin can reach steward. `agent` and `bank` each join steward to one service that
# only steward may reach; neither leads out. `agent-database` joins steward-agent and migrate to postgres alone.
# Each of the two reaches the internet through an egress network of its own.
networks:
  default:
  steward:
  agent:
    internal: true
  agent-database:
    internal: true
  agent-egress:
  bank:
    internal: true
  bank-egress:
