# admin, English only: what an admin reads of the network. Steward's page and the admin channel render these; a
# value is never markup, and a text carries no markdown, so the page shows it as Discord does.

# The journal: one line per action, its values typed, rendered when somebody reads it.
journal.action={action, select, admin-root {First admin} grant-admin {Admin granted} revoke-admin {Admin revoked} enforce-pack {Pack enforced} exempt-pack {Pack exempted} grant-access {Access granted} revoke-access {Access revoked} set-playtime {Play time set} link {Account linked} unlink {Account unlinked} settle {Payment settled} set-phase {Phase changed} set-launch {Opening set} set-smp-start {Paid time set} register-key {Security key added} held-key {Security key used} rename-key {Security key renamed} remove-key {Security key removed} add-authenticator {Authenticator app added} used-authenticator {Authenticator app used} remove-authenticator {Authenticator app removed} forget-factors {Security reset} web-push-subscribe {Push on} web-push-unsubscribe {Push off} web-push-test {Push tested} set-alert-preference {Alert preference} console {Console} save-settings {Settings saved} save-messages {Texts saved} add-plugin {Plugin added} remove-plugin {Plugin removed} request-run {Run asked for} cancel-run {Run cancelled} download-backup {Backup downloaded} announce {Announcement} complete-objective {Objective completed} unlock-milestone {Milestone unlocked} start-game {Hunger Games started} unanchored-grant {No season start} link-codes-exhausted {Too many wrong codes} set-aura {Aura set} set-spins {Spins set} remove-stack {Stack removed} service-down {Service down} backup-stale {Backups not current} disk-full {Disk full} memory-full {Memory full} image-drift {Older images} pack-dead {Resource pack down} run-failed {Run failed} payment-needs-look {Payment needs a look} link-refused {Payment link refused} link-failed {Link failed} purchase-failed {Purchase failed} dm-not-delivered {Direct message not delivered} role-not-changed {Role not changed} role-ambiguous {Role ambiguous} role-not-created {Role not created} lock-not-kept {Lock not kept} lock-without-channel {Lock without channel} other {{action}}}
