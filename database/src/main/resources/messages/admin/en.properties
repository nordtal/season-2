# admin, English only: what an admin reads of the network. Steward's page and the admin channel render these; a
# value is never markup, and a text carries no markdown, so the page shows it as Discord does.

# The journal: one line per action, its values typed, rendered when somebody reads it.
journal.action={action, select, admin-root {First admin} grant-admin {Admin granted} revoke-admin {Admin revoked} enforce-pack {Pack enforced} exempt-pack {Pack exempted} grant-access {Access granted} revoke-access {Access revoked} set-playtime {Play time set} link {Account linked} unlink {Account unlinked} settle {Payment settled} set-phase {Phase changed} set-launch {Opening set} set-smp-start {Paid time set} register-key {Security key added} held-key {Security key used} rename-key {Security key renamed} remove-key {Security key removed} forget-factors {Security reset} web-push-subscribe {Push on} web-push-unsubscribe {Push off} web-push-test {Push tested} set-alert-preference {Alert preference} console {Console} save-settings {Settings saved} save-messages {Texts saved} add-plugin {Plugin added} cancel-run {Run cancelled} announce {Announcement} complete-objective {Objective completed} unlock-milestone {Milestone unlocked} start-game {Hunger Games started} other {{action}}}
journal.actor={kind, select, steward {Steward} host {the host} other {{kind}}}
journal.person={person}
journal.by=By
journal.concerns=Concerns
journal.minecraft=Minecraft
journal.written={detail}
journal.admin-root=Signed in as the first admin.
journal.grant-admin=Made an admin.
journal.revoke-admin={count, plural, =0 {Admin revoked.} other {Admin revoked, and from {below} below them.}}
journal.enforce-pack=Gets the resource pack again.
journal.exempt-pack=Exempted from the resource pack.
journal.grant-access={days, plural, one {# day} other {# days}} of access, until {until, instant, date}.
journal.revoke-access={grants, plural, one {# grant} other {# grants}} of access revoked.
journal.set-playtime=Play time set to {seconds, duration, short}.
journal.link=Linked a Minecraft account with a code.
journal.unlink={selfService, select, true {Unlinked their own Minecraft account.} other {Unlinked the Minecraft account.}}
journal.settle=Payment {reference}: {received} received for {ordered, plural, one {# day} other {# days}}, {days, plural, one {# day} other {# days}} granted, {donation} donated. Matched by {matched, select, tab {its tab} reference {its reference} other {{matched}}}.
journal.settle-by-hand=Payment {reference} booked by hand for {ordered, plural, one {# day} other {# days}}, {days, plural, one {# day} other {# days}} granted, {donation} donated.
journal.set-phase=Phase {from} to {to}.
journal.set-phase-because=Phase {from} to {to}: {reason}
journal.set-launch=The network opens {to}.
journal.clear-launch=The opening date was taken away.
journal.set-smp-start=Paid time starts {to}; {movedGrants, plural, one {# grant} other {# grants}} moved with it.
journal.clear-smp-start=The start of paid time was taken away.
journal.register-key=Added the security key "{label}".
journal.held-key={unlocked, select, true {Unlocked the security key "{label}".} other {Held the security key "{label}".}}
journal.rename-key=Renamed a security key to "{label}".
journal.remove-key=Removed the security key "{label}"; {left, plural, =0 {none left} one {# left} other {# left}}.
journal.forget-factors={keys, plural, one {# security key} other {# security keys}} and {sessions, plural, one {# session} other {# sessions}} cleared on the host.
journal.web-push-subscribe=This browser gets push alerts.
journal.web-push-unsubscribe=This browser gets no push alerts.
journal.web-push-test=Sent a test push of {alert}.
journal.set-alert-preference={enabled, select, true {Alerts of {alert} on by {channel}.} other {Alerts of {alert} off by {channel}.}}
journal.console=Typed "{command}" into the console of {service}.
journal.save-settings=Saved {group} of {service}.
journal.save-messages=Saved the texts of {bundle}.
journal.add-plugin=Added {artifact} to {service}.
journal.cancel-run=Cancelled run {run, number, plain}, a {kind}.
journal.announce=Announced in {languages}.
journal.complete-objective=Completed the objective {objective}.
journal.unlock-milestone=Unlocked the milestone {milestone}.
journal.start-game=Started the Hunger Games.

# A run, as the journal, the actions feed and the update feed name it.
run.kind={kind, select, update {Update} backup {Backup} restart {Restart} down {Take down} start {Start} recreate {Recreate} deploy {Deploy} restore {Restore} remove-plugin {Remove plugin} other {{kind}}}
run.status={status, select, pending {waiting} running {running} done {done} failed {failed} cancelled {cancelled} other {{status}}}
run.stage={stage, select, resolving {Working out what is new} planned {What is new} countdown {Updating shortly} stopping {Stopping the servers} backing-up {Saving the volumes} installing {Installing} starting {Starting the servers} verifying {Waiting for the servers to come back} done {Update finished} nothing-to-do {Everything is already current} failed {The update failed} cancelled {Stopped} other {{stage}}}
run.successful={successful, number} of {total, number} successful
run.state={state, select, unchanged {unchanged} planned {waiting} stopped {stopped} installed {updated} saved {saved} starting {starting} healthy {running} failed {failed} other {{state}}}
run.heading=Run
run.services=Services
run.notes=Notes
run.duration=Duration
run.took={took, duration, short}
run.no-build=no build yet
run.more=+{count, number, plain} more

# An alert: its title and the lines below it, which a lock screen, the admin channel and Steward's page render.
alert.level={level, select, ok {all clear} warn {needs a look} down {down} other {{level}}}
alert.words={text}
alert.clear=All clear: {subject}
alert.several={count, plural, other {# at once}}: {subjects}
alert.run-failed=The {kind} run failed
alert.run=Run {run, number, plain}.
alert.no-services=Docker returned no services
alert.not-running={service} is not running
alert.unhealthy={service} is unhealthy
alert.health-fails=It is running, but its healthcheck fails.
alert.docker-state=Docker reports the state {state}.
alert.older-image={services} {count, plural, one {runs} other {run}} an older image than the registry has
alert.not-compared=The images were not compared
alert.no-backup=There is no finished backup
alert.only-started=Only started ones (.partial).
alert.no-dump=There is no database dump
alert.dump-matters=The worlds and configurations are saved, the accesses and payments are not.
alert.no-archive=There is no volume archive
alert.old-dump=The newest database dump is {hours, plural, one {# hour} other {# hours}} old
alert.old-archive=The newest archive of {volume} is {hours, plural, one {# hour} other {# hours}} old
alert.permitted-age=The permitted age is {hours, plural, one {# hour} other {# hours}}.
alert.disk=The disk is {percent, number, plain} % full
alert.memory=Memory is {percent, number, plain} % used
alert.threshold=The threshold is {percent, number, plain} %.
alert.no-limit=No container has a limit.
alert.payment=A payment needs a look
alert.unknown-reference=Payment {payment} ({amount}) carries the reference {reference}, which no request has.
alert.not-open=Payment {payment} ({amount}) arrived on {reference}, which is {status}. Nothing was booked; grant the access by hand if it is genuine.
alert.claimed=Payment {payment} ({amount}) was matched to {reference} but is already claimed by another request. Nothing was granted for it; grant the access by hand if it is genuine.
alert.no-tier=Payment {payment} ({amount}) on {reference} covers no tier, so nothing was booked. The request stays open until it expires; grant the access by hand if the payer should have it.
alert.role-missing=The {role} role is missing
alert.no-such-role=There is no role {id}.
alert.roles-not-kept=Nobody's access role is kept.
alert.reconcile-idle=The reconcile does nothing.
alert.donor-not-given={person} did not get it. The donor flag is set either way.
alert.admin-not-kept=It is not kept in step with Steward.
alert.role-not-changed={given, select, true {The {role} role was not given} other {The {role} role was not taken}}
alert.failed-for={person}: {error}
alert.dm=A direct message was not delivered
alert.to=To {person}:
alert.link-failed=A link failed
alert.purchase-failed=A purchase failed
alert.link-refused=bunq refused a payment link
