# A note: a card the bot posts to the admin channel for later, without a mention.
note.payment-booked=Payment booked
note.booked={reference} for {payer}: {days, plural, one {# day} other {# days}}, until {until, instant, datetime}
note.too-many-codes=Too many wrong codes
note.refused-for-the-hour={person} is refused for the rest of the hour.
note.no-season-start=No season start
note.runs-from-the-grant={person}'s access runs from {from, instant, datetime} instead of the SMP opening. Set the date in Steward under Season.

# A run's report: its notes and a line's detail. A subsystem's own answer is a value, as it came.
report.words={text}
report.orphaned=The steward-agent carrying out this request stopped before it finished. Nothing here says how far it got - check the report of the next run before assuming anything was installed.
report.restored-over=The database was restored from {dump}, which held this run open; it was not carried out after the restore.
report.failed-unexpectedly=This request failed: {error}. steward-agent's log has the stack trace.
report.cancelled=Stopped during the countdown. Nothing was stopped and nothing was installed.
report.standbys-ready={standbys} started and healthy, so {run, select, restart {this restart} backup {this backup} take-down {this take-down} start {this start} recreate {this recreate} deploy {this deploy} remove-plugin {this removal} restore-volume {this restore} restore-database {this restore} other {this run}} has somewhere to put the players.
report.no-standby={run, select, install {NOTHING WAS STOPPED AND NOTHING WAS INSTALLED. This run stops a service whose players have to go somewhere, and the somewhere is a standby - so a standby that does not come up is a run that would take the network down with nowhere to put anybody.} restart {NOTHING WAS RESTARTED. Every service is still running exactly as it was.} backup {NOTHING WAS STOPPED AND NOTHING WAS SAVED. The database dump above was taken with everything running and is real; the volumes were not touched.} remove-plugin {NOTHING WAS STOPPED AND NOTHING WAS REMOVED.} restore-volume {NOTHING WAS STOPPED AND NOTHING WAS RESTORED.} restore-database {NOTHING WAS STOPPED AND NOTHING WAS RESTORED.} start {Nothing was started.} other {NOTHING WAS STOPPED.}}
report.not-stopped={run, select, install {NOTHING WAS INSTALLED: installing into a server that is still running is the failure this sequence exists to prevent.} backup {NOTHING WAS SAVED: a snapshot of a running server is one that fails when somebody tries to restore it.} remove-plugin {NOTHING WAS REMOVED: a running server keeps a deleted plugin loaded and its folder open.} restore-volume {NOTHING WAS RESTORED: putting files back under a running server is what this run stops it for.} restore-database {NOTHING WAS RESTORED: a service writing into the database while it is replaced writes into the one being thrown away.} other {NOTHING WAS MADE AGAIN:}} {services} could not be stopped, and every service that did stop has been started again.
report.unverified-stop=UNVERIFIED STOP. {services} stopped, and how it ended could not be read back, so nothing here knows whether the server had finished writing when {run, select, install {the jars were moved into its plugins directory} renew-agent {steward-agent was renewed} restart {it was started again on the same world} backup {the archives were taken - they were kept, and each one has a .unverified file beside it saying so, which deploy/restore.sh --list prints} take-down {it was put down on purpose} start {it was started again} remove-plugin {the plugin was deleted} restore-volume {the archive was put back} restore-database {the database was replaced} other {its container was made again}}. Nothing was thrown away and nothing was undone. {failsTheRun, select, true {This run is reported as FAILED for that reason alone, so that nothing counts this archive as one.} other {This run is not reported as a failure over it: it left nothing behind that anybody has to decide whether to trust.}}
report.standby-not-started={standby} could not be started: {reason}
report.standby-seen={standby} ({seen})
report.standbys-unhealthy={standbys} did not become healthy within {minutes, number, plain} {minutes, plural, one {minute} other {minutes}}
report.standbys-interrupted=steward-agent stopped while waiting for {standbys}
report.evacuation-interrupted=steward-agent stopped while waiting for the players to be moved off {services}
report.stopped-with-players=stopped with {players, plural, one {# player} other {# players}} still connected ({servers}) after waiting {seconds, number, plain}s
report.players-unknown=Nothing recent said how many players were on {services}, so the {seconds, number, plain}s wait ran out rather than ending: the proxy writes those counts, and a proxy that is not writing them is the one thing this wait cannot see past
report.standby-stopped={standby} was started for this run and has been stopped again
report.standby-stopped-with-players={standby} was started for this run and has been stopped again - stopped with {players, number, plain} still on it after {seconds, number, plain}s
report.standby-stopped-interrupted={standby} was started for this run and has been stopped again - stopped while it still had {players, number, plain} on it
report.standby-no-container={standby} was started for this run and could not be stopped again: the compose project has no container for it. It is still running.
report.standby-not-stopped={standby} was started for this run and could not be stopped again: {reason}. It is still running.
report.held-left-out={services} is being held down and was left out of this run. Start it again and ask for the update once more.
report.released-meanwhile=NOTHING WAS STOPPED AND NOTHING WAS INSTALLED. {release} was published while this run was handed to steward-agent {own}. Ask for the update again.
report.older-release=NOTHING WAS STOPPED AND NOTHING WAS INSTALLED. The newest release is {release} and steward-agent is {own}, and no schema goes back to an earlier release.
report.handed=This run goes to a one-shot steward-agent at release {release}, which carries it out and renews the running one last.
report.one-shot-not-started=NOTHING WAS STOPPED AND NOTHING WAS INSTALLED. The steward-agent at {release} did not start: {reason}
report.not-migrated=NOTHING WAS INSTALLED. The schema could not be brought to this release, so every server was started again on what it had: {reason}
report.not-installed={artefact}: {reason}
report.restart-all-held=Every Minecraft service is being held down, so there was nothing to restart. Nothing was stopped.
report.restart-none-in-scope=Nothing in {scope} is a Minecraft service this run may restart - either it is not one, or it is being held down. Nothing was stopped.
report.held-not-restarted={services} is being held down and was not restarted. It stays down until somebody starts it.
report.backup-unread=steward-agent did not say what a backup saves, so nothing was stopped and nothing was saved: {reason}
report.no-backup-volumes=compose.yml mounts no volume for steward-agent to back up, so there is nothing to save and nothing was stopped.
report.pruned=kept {daily, number, plain} daily, {weekly, number, plain} weekly and {monthly, number, plain} monthly of each series, and removed {count, number, plain}: {archives}
report.down-unnamed=This request asks to put services down without naming any. Nothing was stopped: an unnamed scope means the whole network, and taking the whole network down until somebody presses Start is not something anybody asks for by leaving a field empty.
report.down-refused=Nothing was stopped: {services} cannot be put down from here. Steward is where Start is pressed, and this run writes its report through postgres, so a run that stopped either one could not be undone or say what it had done.
report.held-down=Held down: {services}. Nothing starts a held service again on its own: not a later update run, not a restart, and not steward-agent coming back.
report.nothing-held=No service is being held down, so there was nothing to start.
report.remake-unnamed=This {kind, select, deploy {deploy} other {recreate}} names no service. Nothing was stopped: a container is made again one service at a time, by name.
report.remake-agent=Nothing was stopped: steward-agent carries this run out, so it cannot make its own container again. An update hands itself to a one-shot steward-agent whenever this one is out of date, and that one-shot renews it.
report.remake-unknown=Nothing was stopped: {services} is not a service a run may make again.
report.held-not-remade={services} is being held down and was left out: making its container again would start it.
report.removal-unnamed=This row does not say which plugin to remove. Nothing was stopped.
report.removal-unknown=Nothing was stopped: {service} has no added plugin {artifact}. The plugins the network gives are not in that list and cannot be removed.
report.removal-empty={artifact} had nothing installed; it is off the list.
report.removed=Removed {files}.
report.removal-failed=The plugin was not removed: {reason}
report.restore-unnamed=This row does not say which archive to restore. Nothing was stopped.
report.restore-unknown=Nothing was stopped: {archive} is not a finished archive in the backups.
report.restore-not-a-volume=Nothing was stopped: {volume} is not a volume compose.yml lets steward-agent back up, so it cannot put {archive} back either.
report.restore-unsaved=NOTHING WAS RESTORED: {volume} could not be saved as it is first, and a restore without that backup could not be taken back.
report.restore-database-unsaved=Nothing was stopped and the database was not touched: the database could not be saved as it is first. {reason}
report.restore-failed=The restore failed and the backup taken just before it holds what was there.
report.no-container-to-stop=the compose project has no container for this service, so it could not be stopped and nothing was installed for it
report.stop-failed=could not be stopped: {reason}
report.no-container-to-start=no container id to start it with
report.start-failed=could not be started: {reason}
report.recreating={pull, select, true {pulling its image and recreating the container} other {recreating the container}}
report.image-outdated=out of date
report.made-again={pull, select, true {made again from a pulled image} other {made again}}
report.nothing-changes=nothing changes
report.saving=saving
report.stopped-while-saving=stopped while saving
report.saved=saved {size} in {took, duration, short}
report.not-saved=not saved
report.size={amount, number} {unit, select, b {B} kib {KiB} mib {MiB} gib {GiB} other {TiB}}
report.stays-down=stays down
report.starts-again=held down until now, starting
report.plugin-removed=removed
report.stopped-for-restore=stopped to put back {archive}
report.restored=restored {size}
report.not-restored=not restored
report.images-unread=The images could not be read, so this run knows nothing about image updates: {answer}
report.images-uncompared=No service's image was compared against a registry, so this run cannot tell a current image from a stale one. Either the daemon listed no running container for this project, or no reference could be resolved.
report.images-unverifiable=The registry could not be asked about {services}, so nothing here can tell a current image from a stale one for {count, plural, one {it} other {them}}. A local build is told apart from this already, so what is left is a registry that did not answer, or an image whose exact identity the daemon no longer has on file. Neither of those means up to date, and a run that stayed silent about {count, plural, one {it} other {them}} would read exactly as if it had checked and found nothing to do.
report.images-local=Built on this host and never published: {services}. The next real update run replaces {count, plural, one {it} other {them}} with whatever the last release actually contains, without asking.
report.not-recreated={outdated, select, true {its image is out of date and the} other {the}} container could not be recreated: {reason} - and there is no container id to put the old one back with
report.fell-back={outdated, select, true {its image is out of date and the} other {the}} container could not be recreated: {reason}. It was started again on the image it already had, and has not been seen coming back yet.
report.fell-back-healthy={outdated, select, true {its image is out of date and the} other {the}} container could not be recreated: {reason}. It was started again on the image it already had, and it is back on that old version.
report.fell-back-down={outdated, select, true {its image is out of date and the} other {the}} container could not be recreated: {reason}. It was started again on the image it already had, and it did NOT come back within {minutes, number, plain} {minutes, plural, one {minute} other {minutes}} ({seen}). The service is down.
report.fell-back-interrupted={outdated, select, true {its image is out of date and the} other {the}} container could not be recreated: {reason}. It was started again on the image it already had, and steward-agent stopped before it was seen coming back.
report.not-fell-back={outdated, select, true {its image is out of date and the} other {the}} container could not be recreated: {reason}, and starting it again on the old image failed too: {answer}
report.no-container=no container for it in the project
report.runtime-unread=the container runtime could not be read: {answer}
report.not-healthy=did not come back within {minutes, number, plain} {minutes, plural, one {minute} other {minutes}} ({seen}) - its own log is where the reason is, and the jar it was running before this update is still on disk
report.wait-interrupted=steward-agent stopped while waiting for this service
report.renewing-agent=recreating the container at this release
report.agent-not-renewed=the container could not be recreated: {reason}. The one it had is still running at its old release.
report.foreign-not-recreated=the container could not be recreated: {reason}. The one it had is still running.
report.foreign-newer=The registry has a newer image for {services}, which steward-agent does not own and never stops. Renew {count, plural, one {it} other {them}} with a redeploy of the project from the host.
report.pack-moves=the resource pack moves to {version}
report.pack-unchecked=the resource pack could not be checked: {reason}
report.not-in-release={service}: {reason}; {installed} stays
report.unclaimed={service} also holds {file}, which nothing in this plan claims - if that is a renamed jar, the server is loading two versions of one plugin
report.held-back={reason}; held back: {held}
# Why the resolver could not say what a run would do; a source's own answer is a value, as it came.
report.release-unread=could not read the latest release of {repo}: {error}
report.release-without-jar=release {release} carries no {artefact} jar
report.release-without-pack=release {release} carries no pack zip
report.release-without-sha-1=release {release} carries {zip} but no SHA-1 next to it - the client is sent both or neither
report.sha-1-unread=could not read {file}: {error}
report.no-build={artefact} has no stable build for Minecraft {minecraft} on {loader} yet, and a build for another version is never installed in its place
report.no-source=no source answered for {artefact}
report.not-mounted={directory} is not mounted in this container
report.no-database=no database, so what the proxy sends is unknown
report.proxy-pack-unread=could not read the proxy's pack: {error}
report.proxy-without-pack=the proxy has no pack yet
report.proxy-pack-without-sha-1=the proxy's pack has no SHA-1
report.velocity-ahead=the proxy resolves to Velocity {version}, and proxy is compiled against {api} - a plugin running on an API it was not built for. Nothing is blocked; the fix is one line in gradle/libs.versions.toml and a release.
report.unverified-archive=UNVERIFIED STOP - see {mark}
report.unmarked-archive=UNVERIFIED STOP - and the mark beside the archive could not be written: the servers were stopped for this backup and the end of {services} could not be read back, so nothing here knows whether the world had finished saving. The archive is readable; what is unverified is the moment it was taken.
