# admin, English only: what an admin reads of the network. Steward's page and the admin channel render these; a
# value is never markup, and a text carries no markdown, so the page shows it as Discord does.

# The journal: one line per action, its values typed, rendered when somebody reads it.
journal.action={action, select, admin-root {First admin signed in} grant-admin {Admin granted} revoke-admin {Admin revoked} enforce-pack {Pack enforced} exempt-pack {Pack exempted} grant-access {Access granted} revoke-access {Access revoked} set-playtime {Playtime set} link {Account linked} unlink {Account unlinked} settle {Payment settled} register-key {Security key added} held-key {Security key used} rename-key {Security key renamed} remove-key {Security key removed} add-authenticator {Authenticator app added} used-authenticator {Authenticator app used} remove-authenticator {Authenticator app removed} forget-factors {Security reset} web-push-subscribe {Push alerts on} web-push-unsubscribe {Push alerts off} web-push-test {Test push sent} set-alert-preference {Alert preference changed} console {Console command sent} save-settings {Settings saved} save-messages {Texts saved} save-npc {NPC saved} remove-npc {NPC removed} add-plugin {Plugin added} remove-plugin {Plugin removed} request-run {Run requested} cancel-run {Run cancelled} download-backup {Backup downloaded} announce {Announcement requested} complete-objective {Objective completed} unlock-milestone {Milestone unlocked} start-game {{@terms.hunger-games} started} link-codes-exhausted {Too many wrong codes} set-aura {Aura set} set-spins {Extra spins set} remove-stack {Stack removed} open-inventory {Inventory opened in the game} reset-track {Track reset} set-launch-date {Launch date set} launch-now {{@terms.season} launched} close-season {{@terms.season} closed} set-maintenance {Maintenance changed} switch-mode {Game mode switched} service-down {Service down} backup-stale {Backups not current} disk-full {Disk full} memory-full {Memory full} image-drift {Older images} pack-dead {Resource pack down} run-failed {Run failed} payment-needs-look {Payment needs a look} link-refused {Payment link refused} link-failed {Account link failed} purchase-failed {Purchase failed} dm-not-delivered {Direct message not delivered} role-not-changed {Role not changed} role-ambiguous {Several roles share a name} role-not-created {Role not created} lock-not-kept {Lock leaves channels open} lock-without-channel {Lock without choose channel} start-channel-hidden {Start channel hidden} language-not-kept {Language channels left open} channel-seen {Channel not closed off} other {{action}}}
