run.status={status, select, pending {waiting} running {running} done {done} failed {failed} cancelled {cancelled} other {{status}}}
run.title={stage, select, resolving {{kind, select, update {Working out what is new} other {{kind, select, update {Update requested} restart {Restart requested} backup {Backup requested} down {Take-down requested} start {Start requested} restore {Restore requested} recreate {Recreate requested} deploy {Deploy requested} remove-plugin {Plugin removal requested} switch-mode {New {@terms.game-mode} requested} install {Start-up install requested} live-swap {Resource pack swap requested} other {Run requested}}}}} planned {{kind, select, update {Update planned} restart {Restart planned} backup {Backup planned} down {Take-down planned} start {Start planned} restore {Restore planned} recreate {Recreate planned} deploy {Deploy planned} remove-plugin {Plugin removal planned} switch-mode {New {@terms.game-mode} planned} install {Start-up install planned} live-swap {Resource pack swap planned} other {Run planned}}} countdown {{kind, select, update {Updating soon} restart {Restarting soon} backup {Backing up soon} down {Taking down soon} start {Starting soon} restore {Restoring soon} recreate {Recreating soon} deploy {Deploying soon} remove-plugin {Removing the plugin soon} switch-mode {Switching the {@terms.game-mode} soon} install {Installing soon} live-swap {Swapping the resource pack soon} other {Running soon}}} stopping {{kind, select, update {Update: stopping} restart {Restart: stopping} backup {Backup: stopping} down {Take-down: stopping} start {Start: stopping} restore {Restore: stopping} recreate {Recreate: stopping} deploy {Deploy: stopping} remove-plugin {Plugin removal: stopping} switch-mode {New {@terms.game-mode}: stopping} install {Start-up install: stopping} live-swap {Resource pack swap: stopping} other {Run: stopping}}} backing-up {{kind, select, backup {Backup: saving the volumes} update {Update: backing up} other {{kind, select, update {Update: backing up} restart {Restart: backing up} backup {Backup: backing up} down {Take-down: backing up} start {Start: backing up} restore {Restore: backing up} recreate {Recreate: backing up} deploy {Deploy: backing up} remove-plugin {Plugin removal: backing up} switch-mode {New {@terms.game-mode}: backing up} install {Start-up install: backing up} live-swap {Resource pack swap: backing up} other {Run: backing up}}}}} installing {{kind, select, update {Installing the update} restore {Restoring the archive} recreate {Recreating the containers} deploy {Deploying pulled images} remove-plugin {Removing the plugin} switch-mode {Switching the {@terms.game-mode}} install {Installing what is missing} live-swap {Sending the resource pack} other {{kind, select, update {Update: installing} restart {Restart: installing} backup {Backup: installing} down {Take-down: installing} start {Start: installing} restore {Restore: installing} recreate {Recreate: installing} deploy {Deploy: installing} remove-plugin {Plugin removal: installing} switch-mode {New {@terms.game-mode}: installing} install {Start-up install: installing} live-swap {Resource pack swap: installing} other {Run: installing}}}}} starting {{kind, select, update {Update: starting} restart {Restart: starting} backup {Backup: starting} down {Take-down: starting} start {Start: starting} restore {Restore: starting} recreate {Recreate: starting} deploy {Deploy: starting} remove-plugin {Plugin removal: starting} switch-mode {New {@terms.game-mode}: starting} install {Start-up install: starting} live-swap {Resource pack swap: starting} other {Run: starting}}} verifying {{kind, select, update {Update: verifying} restart {Restart: verifying} backup {Backup: verifying} down {Take-down: verifying} start {Start: verifying} restore {Restore: verifying} recreate {Recreate: verifying} deploy {Deploy: verifying} remove-plugin {Plugin removal: verifying} switch-mode {New {@terms.game-mode}: verifying} install {Start-up install: verifying} live-swap {Resource pack swap: verifying} other {Run: verifying}}} done {{kind, select, update {Update finished} restart {Restart finished} backup {Backup finished} down {Take-down finished} start {Start finished} restore {Restore finished} recreate {Recreate finished} deploy {Deploy finished} remove-plugin {Plugin removal finished} switch-mode {New {@terms.game-mode} in place} install {Start-up install finished} live-swap {Resource pack swap finished} other {Run finished}}} nothing-to-do {{kind, select, update {Nothing to update} restart {Nothing to restart} backup {Nothing to back up} down {Nothing to take down} start {Nothing to start} restore {Nothing to restore} recreate {Nothing to recreate} deploy {Nothing to deploy} remove-plugin {No plugin to remove} switch-mode {Nothing to switch} install {Nothing to install} live-swap {No resource pack to swap} other {Nothing to do}}} failed {The {kind, select, update {update} restart {restart} backup {backup} down {take-down} start {start} restore {restore} recreate {recreate} deploy {deploy} remove-plugin {plugin removal} switch-mode {{@terms.game-mode} switch} install {start-up install} live-swap {resource pack swap} other {run}} failed} cancelled {{kind, select, update {Update cancelled} restart {Restart cancelled} backup {Backup cancelled} down {Take-down cancelled} start {Start cancelled} restore {Restore cancelled} recreate {Recreate cancelled} deploy {Deploy cancelled} remove-plugin {Plugin removal cancelled} switch-mode {New {@terms.game-mode} cancelled} install {Start-up install cancelled} live-swap {Resource pack swap cancelled} other {Run cancelled}}} other {{stage}}}
run.outcome={outcome, select, done {done} skipped {skipped} warning {warning} failed {failed} other {{outcome}}}
run.step-kind={kind, select, runtime {Read the runtime} scope {Set the scope} resolve {Look up versions} hand-over {Hand over the run} room-check {Check the room on the disk} prune {Prune archives} dump-database {Dump the database} standby-up {Start the standby} countdown {Count down} players-moved {Move the {@terms.player, n=2}} stop {Stop} save-volume {Save the volume} hold {Hold down} unhold {Release the hold} migrate {Migrate the database} install {Install} restore {Restore} start {Start} verify {Wait until healthy} players-back {Bring the {@terms.player, n=2} back} standby-down {Stop the standby} cleanup {Remove unused images} offsite-copy {Copy the backup off the host} other {{kind}}}
run.step-on={kind, select, save-volume {Save {service}} restore {Restore {service}} other {{step} on {service}}}
run.reason={reason, select, unreachable {The container runtime did not answer.} unexpected {steward-agent failed. Its log names the cause.} cancelled {The run was cancelled.} interrupted {steward-agent stopped while it waited.} no-container {No container exists.} refused {Docker or the tool refused. The run log holds the answer.} not-healthy {No healthy report came in time.} unverified-stop {The stop went through, but its end could not be read.} players-stayed {Some {@terms.player, n=2} were still online.} players-unknown {There is no recent {@terms.player, n=1} count.} players-lost {Fewer {@terms.player, n=2} came back than were moved out.} no-room {There is not enough room on the disk.} tool-failed {The tool failed.} no-repository {There is no offsite repository.} refused-local-build {The run would replace a local build.} released-meanwhile {A newer release appeared in the meantime.} older-release {The newest release is older than steward-agent.} held {This service is held down.} not-in-scope {This is outside the run's scope.} nothing-held {Nothing is held down.} unnamed {The request names nothing.} never-down {This service is never taken down.} self {steward-agent never recreates itself.} unknown {This stack has nothing of that name.} not-a-volume {No backup saves this volume.} no-volumes {There is no volume to back up.} nothing-to-remove {There is nothing to remove.} not-saved {The backup before the restore was not saved, so nothing was put back.} left-down {Only part of the volume was put back, so its services stay down.} source-failed {A source did not answer.} not-in-release {The release does not hold this, so the installed file stays.} unclaimed {No artefact claims this jar.} unverifiable {No registry answered for the image.} local-build {The image was built on this host.} foreign-newer {The registry has a newer image.} velocity-ahead {The newest Velocity is newer than the API the proxy is built against.} missing-secret {A secret is missing. Run ./nordtal.sh update on the host.} protocol-mismatch {The standby runs a different Minecraft version from the server it stands in for.} other {{reason}}}
