# admin, English only: what an admin reads of the network. Steward's page and the admin channel render these; a
# value is never markup, and a text carries no markdown, so the page shows it as Discord does.

# The journal: one line per action, its values typed, rendered when somebody reads it.
journal.action={action, select, admin-root {First admin} grant-admin {Admin granted} revoke-admin {Admin revoked} enforce-pack {Pack enforced} exempt-pack {Pack exempted} grant-access {Access granted} revoke-access {Access revoked} set-playtime {Play time set} link {Account linked} unlink {Account unlinked} settle {Payment settled} set-phase {Phase changed} set-launch {Opening set} set-smp-start {Paid time set} register-key {Security key added} held-key {Security key used} rename-key {Security key renamed} remove-key {Security key removed} add-authenticator {Authenticator app added} used-authenticator {Authenticator app used} remove-authenticator {Authenticator app removed} forget-factors {Security reset} web-push-subscribe {Push on} web-push-unsubscribe {Push off} web-push-test {Push tested} set-alert-preference {Alert preference} console {Console} save-settings {Settings saved} save-messages {Texts saved} add-plugin {Plugin added} remove-plugin {Plugin removed} request-run {Run asked for} cancel-run {Run cancelled} download-backup {Backup downloaded} announce {Announcement} complete-objective {Objective completed} unlock-milestone {Milestone unlocked} start-game {{@terms.hunger-games} started} unanchored-grant {No {@terms.season} start} link-codes-exhausted {Too many wrong codes} set-aura {Aura set} set-spins {Spins set} remove-stack {Stack removed} service-down {Service down} backup-stale {Backups not current} disk-full {Disk full} memory-full {Memory full} image-drift {Older images} pack-dead {Resource pack down} run-failed {Run failed} payment-needs-look {Payment needs a look} link-refused {Payment link refused} link-failed {Link failed} purchase-failed {Purchase failed} dm-not-delivered {Direct message not delivered} role-not-changed {Role not changed} role-ambiguous {Role ambiguous} role-not-created {Role not created} lock-not-kept {Lock not kept} lock-without-channel {Lock without channel} other {{action}}}
journal.admin-root=Signed in as the first admin.
journal.grant-admin=Made an admin.
journal.revoke-admin={count, plural, =0 {Removed the admin role.} other {Removed the admin role, and from {below} below.}}
journal.enforce-pack=Requires the resource pack again.
journal.exempt-pack=Exempted from the resource pack.
journal.grant-access=Granted {days, plural, one {# day} other {# days}} of {@terms.access} until {until, instant, date}.
journal.revoke-access=Revoked {grants, plural, one {# grant} other {# grants}} of {@terms.access}.
journal.set-playtime=Set the play time to {seconds, duration, short}.
journal.link=Linked a Minecraft account with a code.
journal.unlink={selfService, select, true {Unlinked their own Minecraft account.} other {Unlinked the Minecraft account.}}
journal.settle=Payment {reference}: {received} for {ordered, plural, one {# day} other {# days}}. Granted {days, plural, one {# day} other {# days}}, donated {donation}. Matched by {matched, select, tab {tab} reference {reference} other {{matched}}}.
journal.settle-by-hand=Booked payment {reference} by hand for {ordered, plural, one {# day} other {# days}}. Granted {days, plural, one {# day} other {# days}}, donated {donation}.
journal.set-phase=Phase {from} to {to}.
journal.set-phase-because=Phase {from} to {to}: {reason}
journal.set-launch=The {@terms.network} opens {to}.
journal.clear-launch=Cleared the opening date.
journal.set-smp-start=Paid time starts {to}. {movedGrants, plural, one {# grant} other {# grants}} moved.
journal.clear-smp-start=Cleared the start of paid time.
journal.register-key=Added the security key "{label}".
journal.held-key-for={unlocked, select, true {Unlocked} other {Held}} the security key "{label}" for a step-up of {hold, duration, long}.
journal.rename-key=Renamed a security key to "{label}".
journal.remove-key=Removed the security key "{label}", {left, plural, =0 {none left} other {# left}}.
journal.add-authenticator=Added an authenticator app.
journal.used-authenticator=Used the authenticator app for a step-up of {hold, duration, long}.
journal.remove-authenticator=Removed the authenticator app, {keys, plural, =0 {no security key} one {# security key} other {# security keys}} left.
journal.forget-every-factor=Cleared {keys, plural, one {# security key} other {# security keys}}{authenticator, select, true {, the authenticator app} other {}} and {sessions, plural, one {# session} other {# sessions}} on the host.
journal.web-push-subscribe=Push alerts on for this browser.
journal.web-push-unsubscribe=Push alerts off for this browser.
journal.web-push-test=Sent a test push for {alert}.
journal.set-alert-preference={enabled, select, true {Turned {alert} alerts on by {channel}.} other {Turned {alert} alerts off by {channel}.}}
journal.console=Typed "{command}" into the console of {service}.
journal.save-settings=Saved {group} of {service}.
journal.save-messages=Saved the texts of {bundle}.
journal.add-plugin=Added {artifact} to {service}.
journal.remove-plugin=Requested run {run, number, plain} to remove {artifact} from {service}.
journal.request-run={count, plural, =0 {Requested run {run, number, plain}, a {kind}, for the whole {@terms.network}.} other {Requested run {run, number, plain}, a {kind}, for {services}.}}
journal.request-restore=Requested run {run, number, plain}, a restore of the backup {archive}.
journal.cancel-run=Cancelled run {run, number, plain}, a {kind}.
journal.download-backup=Downloaded the backup {archive}, {size}.
journal.download-backup-unsized=Downloaded the backup {archive}, which was pruned during the download.
journal.announce=Announced in {languages}.
journal.complete-objective=Completed the {@terms.objective, n=1} {objective}.
journal.set-aura=Set the aura to {aura}.
journal.set-spins=Set the {@terms.extra-spin, n=2} to {spins}.
journal.remove-stack=Removed {amount, number} {item} from an inventory.
journal.unlock-milestone=Unlocked the {@terms.milestone, n=1} {milestone}.
journal.start-game=Started the {@terms.hunger-games}.
journal.unanchored-grant=Access starts at {from, instant, datetime}, not at the {@terms.smp} opening. Set the date in Steward under Season.
journal.link-codes-exhausted=Refused linking for the rest of the hour.

# A run, as the journal, the actions feed and the update feed name it.
run.kind={kind, select, update {Update} backup {Backup} restart {Restart} down {Take down} start {Start} recreate {Recreate} deploy {Deploy} restore {Restore} remove-plugin {Remove plugin} install {Start-up install} other {{kind}}}
run.status={status, select, pending {waiting} running {running} done {done} failed {failed} cancelled {cancelled} other {{status}}}
run.title={stage, select, resolving {{kind, select, update {Working out what is new} other {{kind, select, update {Update} restart {Restart} backup {Backup} down {Take-down} start {Start} restore {Restore} recreate {Recreate} deploy {Deploy} remove-plugin {Plugin removal} install {Start-up install} other {Run}} requested}}} planned {{kind, select, update {What is new} other {{kind, select, update {Update} restart {Restart} backup {Backup} down {Take-down} start {Start} restore {Restore} recreate {Recreate} deploy {Deploy} remove-plugin {Plugin removal} install {Start-up install} other {Run}} planned}}} countdown {{kind, select, update {Updating shortly} restart {Restarting shortly} backup {Backing up shortly} down {Taking down shortly} start {Starting shortly} restore {Restoring shortly} recreate {Recreating shortly} deploy {Deploying shortly} remove-plugin {Removing the plugin shortly} install {Installing shortly} other {Running shortly}}} stopping {Stopping the servers for the {kind, select, update {update} restart {restart} backup {backup} down {take-down} start {start} restore {restore} recreate {recreate} deploy {deploy} remove-plugin {plugin removal} install {start-up install} other {run}}} backing-up {{kind, select, backup {Saving the volumes} update {Saving the volumes before the update} other {Saving the volumes before the {kind, select, update {update} restart {restart} backup {backup} down {take-down} start {start} restore {restore} recreate {recreate} deploy {deploy} remove-plugin {plugin removal} install {start-up install} other {run}}}}} installing {{kind, select, update {Installing the update} restore {Restoring the archive} recreate {Recreating the containers} deploy {Recreating the containers from pulled images} remove-plugin {Removing the plugin} install {Installing what is missing} other {Running the {kind, select, update {update} restart {restart} backup {backup} down {take-down} start {start} restore {restore} recreate {recreate} deploy {deploy} remove-plugin {plugin removal} install {start-up install} other {run}}}}} starting {Starting the servers after the {kind, select, update {update} restart {restart} backup {backup} down {take-down} start {start} restore {restore} recreate {recreate} deploy {deploy} remove-plugin {plugin removal} install {start-up install} other {run}}} verifying {Waiting for the servers to start after the {kind, select, update {update} restart {restart} backup {backup} down {take-down} start {start} restore {restore} recreate {recreate} deploy {deploy} remove-plugin {plugin removal} install {start-up install} other {run}}} done {{kind, select, update {Update} restart {Restart} backup {Backup} down {Take-down} start {Start} restore {Restore} recreate {Recreate} deploy {Deploy} remove-plugin {Plugin removal} install {Start-up install} other {Run}} finished} nothing-to-do {{kind, select, update {Nothing to update} restart {Nothing to restart} backup {Nothing to back up} down {Nothing to take down} start {Nothing to start} restore {Nothing to restore} recreate {Nothing to recreate} deploy {Nothing to deploy} remove-plugin {No plugin to remove} install {Nothing to install} other {Nothing to do}}} failed {The {kind, select, update {update} restart {restart} backup {backup} down {take-down} start {start} restore {restore} recreate {recreate} deploy {deploy} remove-plugin {plugin removal} install {start-up install} other {run}} failed} cancelled {{kind, select, update {Update} restart {Restart} backup {Backup} down {Take-down} start {Start} restore {Restore} recreate {Recreate} deploy {Deploy} remove-plugin {Plugin removal} install {Start-up install} other {Run}} cancelled} other {{stage}}}
run.outcome={outcome, select, done {done} skipped {skipped} warning {warning} failed {failed} other {{outcome}}}
run.step-kind={kind, select, runtime {Runtime} scope {Scope} resolve {Resolve} hand-over {Hand over} room-check {Room check} prune {Prune} dump-database {Dump the database} standby-up {Standby up} countdown {Countdown} players-moved {Players moved} stop {Stop} save-volume {Save a volume} hold {Hold} unhold {Release the hold} migrate {Migrate} install {Install} restore {Restore} start {Start} verify {Verify} players-back {Players back} standby-down {Standby down} cleanup {Cleanup} offsite-copy {Offsite copy} other {{kind}}}
run.reason={reason, select, unreachable {the container runtime did not answer} unexpected {steward-agent failed, its log says how} cancelled {cancelled} interrupted {steward-agent stopped while it waited} no-container {no container} refused {refused, the run log has the answer} not-healthy {not healthy in time} unverified-stop {stopped, but how it ended could not be read} players-stayed {{@terms.player, n=2} were still on} players-unknown {no recent {@terms.player, n=1} count} no-room {not enough room on the disk} tool-failed {the tool failed} no-repository {no offsite repository} refused-local-build {a local build would be replaced} released-meanwhile {a newer release appeared meanwhile} older-release {the newest release is older than steward-agent} held {held down} not-in-scope {not in the request} nothing-held {nothing is held down} unnamed {the request names nothing} never-down {never taken down} self {steward-agent never recreates itself} unknown {not in this stack} not-a-volume {not a volume a backup saves} no-volumes {no volume to back up} nothing-to-remove {nothing to remove} not-saved {not saved first, so nothing was put back} left-down {half put back, so it stays down} source-failed {a source did not answer} not-in-release {not in the release, the installed file stays} unclaimed {a jar no artefact claims} unverifiable {no registry answered for its image} local-build {built on this host} foreign-newer {the registry has a newer image} velocity-ahead {the newest Velocity is newer than the API the proxy is built against} missing-secret {a secret is missing, ./nordtal.sh update on the host adds it} other {{reason}}}
run.exit-code=exit code {code, number, plain}
run.image={artefact} {image, select, pulled {pulled} kept {kept} other {{image}}}
run.artefact={artefact}
run.players={moved, number} {@terms.player, n=moved} moved from {from} to {to}, {returned, number} back
run.images-removed={images, plural, one {# image} other {# images}} removed, {freed} freed
run.cache-freed=build cache {freed} freed
run.room={needed} needed, {free} free
run.offsite=snapshot {snapshot}, {added} added
run.archive-saved={file}, {size} in {took, duration, short}{verified, select, true {} other {, stop not verified}}
run.archive-pruned={file}, {rule, select, retention {no retention rule keeps it} over-budget {over the disk budget} other {{rule}}}
run.moved={artefact} {from} → {to}
run.version={artefact} {version}

# An alert: its title and the lines below it, which a lock screen, the admin channel and Steward's page render.
alert.level={level, select, ok {all clear} warn {needs a look} down {down} other {{level}}}
alert.words={text}
alert.clear={type, select, service {Every service runs again} drift {The images match the registry again} pack {The resource pack answers again} backup {The backups are current again} disk {The disk is below its threshold again} memory {Memory use is below its threshold again} other {All clear}}
alert.several=Several at once: {subjects}
alert.run=Run {run, number, plain}.
alert.step={kind}: {why}
alert.step-on={kind} {service}: {why}
alert.no-services=Docker lists no services
alert.not-running={service} is not running
alert.unhealthy={service} is unhealthy
alert.health-fails={service} is running, but its healthcheck fails.
alert.restarting={service} restarts
alert.restarted-by-docker={service} restarted {count, plural, one {once} other {# times}} since it was started. Its server exited and Docker started it again within the last hour. Its log says why.
alert.docker-state={service}: Docker reports the state {state}.
alert.failed-once={service} failed
alert.exit-code={service} exited with code {code, number, plain}.
alert.older-image={services} {count, plural, one {runs} other {run}} an older image than the registry has
alert.not-compared=The images were not compared
alert.dead-pack=The resource pack does not answer
alert.offered-pack=The proxy offers {url}. Every joining {@terms.player, n=1} fails to download it.
alert.no-backup=There is no finished backup
alert.no-dump=There is no database dump
alert.no-archive={volume}: there is no archive yet
alert.old-dump=The newest database dump is too old
alert.old-archive={volume}: the newest archive is too old
alert.no-offsite=No backup has been copied off this host
alert.old-offsite=The newest backup copied off this host is too old
alert.missing={subject}: there is none yet.
alert.age={subject}: the newest is {hours, plural, one {# hour} other {# hours}} old. The limit is {limit, plural, one {# hour} other {# hours}}.
alert.disk=The disk is over its threshold
alert.disk-use=The disk is {percent, number, plain} % full. The threshold is {threshold, number, plain} %.
alert.memory=Memory use is over its threshold
alert.memory-use=Memory is {percent, number, plain} % used. The threshold is {threshold, number, plain} %.
alert.payment=A payment needs a look
alert.unknown-reference=Payment {payment} ({amount}) has the reference {reference}, which no request has.
alert.not-open=Payment {payment} ({amount}) arrived on {reference}, which is {status}. Nothing was booked. Grant the {@terms.access} by hand if it is genuine.
alert.claimed=Payment {payment} ({amount}) was matched to {reference}, but another request has claimed it. Nothing was granted. Grant the {@terms.access} by hand if the payment is genuine.
alert.no-tier=Payment {payment} ({amount}) on {reference} covers no tier. Nothing was booked. The request stays open until it expires. Grant the {@terms.access} by hand if the payer should have it.
alert.role-ambiguous=Several roles are called {name}
alert.none-adopted=The bot uses none of them until only one is left.
alert.role-not-created=The {name} role could not be created
alert.lock-without-channel=The onboarding lock is on without an onboarding channel
alert.nobody-locked=Nobody is locked until the onboarding group names its channel.
alert.lock-not-kept=Channels are not closed to the lock role
alert.failed-in={channel}: {error}
alert.role-not-changed={given, select, true {The {role} role was not given} other {The {role} role was not taken}}
alert.failed-for={person}: {error}
alert.dm=A direct message was not delivered
alert.to=To {person}.
alert.link-failed=A link failed
alert.purchase-failed=A purchase failed
alert.link-refused=bunq refused a payment link
alert.refused={reference}: {refusal, select, not-configured {steward-bunq has no bunq key.} unreachable {steward-bunq did not answer.} bad-request {bunq refused the request, for example an amount above its limit.} unauthorized {bunq did not accept the key.} forbidden {bunq refused this action on the account.} not-found {bunq does not know the monetary account.} too-many-requests {bunq limited the request rate.} bunq-error {bunq reported an error.} other {bunq refused for a reason Steward has no name for.}} Steward's log holds bunq's own answer.

# A note: a card the bot posts to the admin channel for later, without a mention.

# A subsystem's own answer is a value, as it came, and a size is in binary units.
report.words={text}
report.size={amount, number} {unit, select, b {B} kib {KiB} mib {MiB} gib {GiB} other {TiB}}
# Why the resolver could not say what a run would do; a source's own answer is a value, as it came.
report.release-unread=could not read the latest release of {repo}: {error}
report.release-without-jar=release {release} has no {artefact} jar
report.release-jar-without-digest=release {release} has {jar} without a sha256 digest, so it is not installed
report.release-without-pack=release {release} has no pack zip
report.release-without-sha-1=release {release} has {zip} but no SHA-1 file for it
report.sha-1-unread=could not read {file}: {error}
report.no-build={artefact} has no stable build for Minecraft {minecraft} on {loader}, and Steward installs none for another version
report.no-source=no source answered for {artefact}
report.not-mounted={directory} is not mounted in this container
report.no-database=no database, so what the proxy sends is unknown
report.proxy-pack-unread=could not read the proxy's pack: {error}
report.proxy-without-pack=the proxy has no pack yet
report.proxy-pack-without-sha-1=the proxy's pack has no SHA-1
report.velocity-ahead=Velocity {version} is ahead of the API {api} the proxy is built against
