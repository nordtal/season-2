alert.run=Run {run, number, plain}.
alert.no-services=Docker returned no services
alert.not-running={service} is not running
alert.unhealthy={service} is unhealthy
alert.health-fails=It is running, but its healthcheck fails.
alert.docker-state=Docker reports the state {state}.
alert.older-image={services} {count, plural, one {runs} other {run}} an older image than the registry has
alert.not-compared=The images were not compared
alert.no-backup=There is no finished backup
alert.only-started=Only started ones (.partial).
alert.no-dump=There is no database dump
alert.dump-matters=The worlds and configurations are saved, the accesses and payments are not.
alert.no-archive=There is no volume archive
alert.old-dump=The newest database dump is {hours, plural, one {# hour} other {# hours}} old
