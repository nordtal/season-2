server.milestone-not-active={@terms.milestone, n=1} {key} ist nicht aktiv. Nur {active} lässt sich freischalten.
server.wrong-phase=Ein Spiel startet nur im Start-Event. Das {@terms.network} ist in {phase}.
server.no-game=Kein Spiel ist zur Anmeldung offen.
server.wrong-state=Das Spiel lässt sich im Zustand {state} nicht starten.
server.below-hard-minimum=Der Start braucht mindestens {minimum, plural, one {eine teilnehmende Person} other {# Teilnehmende}}. Angemeldet {count, plural, one {ist #} other {sind #}}.
server.below-soft-minimum=Nur {count, plural, one {eine teilnehmende Person ist} other {# Teilnehmende sind}} angemeldet, weniger als die empfohlenen {minimum}. Bestätige, um trotzdem zu starten.
server.not-here=Dein {@terms.player, n=1} ist nicht auf diesem Server.
server.not-delivered=Discord hat die Direktnachricht nicht zugestellt. Der Bot kann dir nur schreiben, solange deine Direktnachrichten offen sind.
server.settings-refused={service} würde mit dieser Änderung nicht starten. {rule, select, required {{setting} darf nicht leer sein.} positive {{setting} muss größer als null sein.} not-negative {{setting} darf nicht negativ sein.} at-least {{setting} muss mindestens {value} sein.} at-most {{setting} darf höchstens {value} sein.} above {{setting} muss größer als {value} sein.} entries {{setting} braucht genau {value} Einträge.} most-entries {{setting} hat mehr als {value} Einträge.} longest {Ein Text in {setting} ist länger als {value} Zeichen.} unique {{setting} enthält {value} zweimal.} ascending {{setting} muss aufsteigend geordnet sein.} corners {Ein Bereich in {setting} hat eine Max-Ecke unter seiner Min-Ecke.} known {{setting} nennt {value}, das es auf diesem Server nicht gibt.} track {Die {@terms.milestone, n=2} in {setting} lassen sich nicht lesen.} objective-names {In {setting} nennt das {@terms.objective, n=1} {value} etwas, das es auf diesem Server nicht gibt.} other {{setting} ist nicht gültig. Den Grund nennt das Log des Servers.}}
server.stack-changed=Der Platz hält diesen Stapel nicht mehr. Lade das Inventar neu.
server.not-editable=Für diesen {@terms.player, n=1} gibt es auf diesem Server gerade keinen Survival-Stand zum Bearbeiten, oder ein anderer Editor davon ist offen. Versuch es gleich noch einmal.

