season.launch-in-the-past=Das {@terms.network} kann nicht in der Vergangenheit öffnen. {at} ist vorbei. Das Datum entfernst du mit `{clear}`.
season.smp-start-in-the-past=Die bezahlte Zeit kann nicht in der Vergangenheit beginnen. {at} ist vorbei. Das Datum entfernst du mit `{clear}`.
season.launch-after-smp-start=Das {@terms.network} würde am {at} öffnen, die bezahlte Zeit beginnt aber am {smp}. Verschiebe zuerst den SMP-Start oder entferne ihn.
season.smp-running=Die {@terms.season} ist schon in der {@terms.smp}, die bezahlte Zeit läuft also. Ein neues Startdatum würde gespielte Tage schenken oder ungespielte nehmen. Ändere es nur von Hand in der Datenbank, wenn du sicher bist.
season.smp-start-before-launch=Die bezahlte Zeit würde am {at} beginnen, das {@terms.network} öffnet aber erst am {launch}. Niemand könnte die Tage dazwischen nutzen.

server.no-active-milestone=Kein {@terms.milestone, n=1} ist aktiv.
