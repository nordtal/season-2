# database, Deutsch.

update.run-open=Lauf #{id, number, plain} ist noch {status} ({kind}).
update.already-held=Schon heruntergefahren: {services}.

season.launch-in-the-past=Das Netzwerk kann nicht in der Vergangenheit öffnen. {at} ist schon vorbei; mit `{clear}` wird das Datum entfernt.
season.smp-start-in-the-past=Bezahlte Zeit kann nicht in der Vergangenheit beginnen. {at} ist schon vorbei; mit `{clear}` wird das Datum entfernt.
season.launch-after-smp-start=Das Netzwerk würde am {at} öffnen, nachdem die bezahlte Zeit am {smp} beginnt. Verschiebe zuerst den SMP-Start oder entferne ihn.
season.smp-running=Die Season ist schon im SMP, die bezahlte Zeit läuft also gerade. Ein anderes Startdatum würde jemandem gespielte Tage schenken oder ungespielte nehmen. Ändere es von Hand in der Datenbank, wenn du dir sicher bist.
season.smp-start-before-launch=Die bezahlte Zeit würde am {at} beginnen, bevor das Netzwerk am {launch} öffnet. Die Tage dazwischen könnte niemand nutzen.

server.no-active-milestone=Kein Meilenstein ist aktiv, also kann nichts vom Pfad abgeschlossen werden.
server.no-such-objective={key} ist kein offenes Ziel des aktiven Meilensteins.
server.milestone-not-active=Meilenstein {key} ist nicht der aktive; nur {active} kann freigeschaltet werden.
server.wrong-phase=Ein Spiel startet nur während des Start-Events; das Netzwerk ist in {phase}.
server.no-game=Kein Spiel ist zur Anmeldung offen.
server.wrong-state=Das Spiel kann aus seinem jetzigen Zustand ({state}) nicht gestartet werden.
server.below-hard-minimum=Zum Start braucht es mindestens {minimum, plural, one {eine teilnehmende Person} other {# Teilnehmende}}, angemeldet {count, plural, one {ist #} other {sind #}}.
server.below-soft-minimum=Nur {count, plural, one {eine teilnehmende Person ist} other {# Teilnehmende sind}} angemeldet, weniger als die empfohlenen {minimum}. Bestätige, um trotzdem zu starten.
server.not-here=Dein Spieler ist nicht mehr auf diesem Server, also wurde die Vorschau nicht gezeigt.
server.not-delivered=Discord hat die Direktnachricht nicht zugestellt; der Bot kann dir nur schreiben, solange deine Direktnachrichten offen sind.

player.card=<emphasis>{player.name, name, plain}</emphasis>{role, select, admin { <glyph:admin>} donor { <glyph:donor-star>} other {}}<newline>{crest} <muted>Prestige {tier, number}</muted><newline><muted>{playtime, duration} gespielt</muted>

announcement.words={text}
announcement.milestone={milestone.name} ist geschafft.
announcement.milestone.border={milestone.name} ist geschafft - die Grenze wächst.
announcement.milestone.nether={milestone.name} ist geschafft - der Nether steht offen.
announcement.milestone.end={milestone.name} ist geschafft - das Ende steht offen.
