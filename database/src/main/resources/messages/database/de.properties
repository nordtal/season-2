# database, Deutsch.

update.run-open=Lauf #{id, number, plain} ({kind}) ist noch {status}.
update.already-held=Schon heruntergefahren: {services}.

season.launch-in-the-past=Das Netzwerk kann nicht in der Vergangenheit öffnen. {at} ist vorbei. Das Datum entfernst du mit `{clear}`.
season.smp-start-in-the-past=Die bezahlte Zeit kann nicht in der Vergangenheit beginnen. {at} ist vorbei. Das Datum entfernst du mit `{clear}`.
season.launch-after-smp-start=Das Netzwerk würde am {at} öffnen, die bezahlte Zeit beginnt aber am {smp}. Verschiebe zuerst den SMP-Start oder entferne ihn.
season.smp-running=Die Season ist schon im SMP, die bezahlte Zeit läuft also. Ein neues Startdatum würde gespielte Tage schenken oder ungespielte nehmen. Ändere es nur von Hand in der Datenbank, wenn du sicher bist.
season.smp-start-before-launch=Die bezahlte Zeit würde am {at} beginnen, das Netzwerk öffnet aber erst am {launch}. Niemand könnte die Tage dazwischen nutzen.

server.no-active-milestone=Kein Meilenstein ist aktiv.
server.no-such-objective={key} ist kein offenes Ziel des aktiven Meilensteins.
server.milestone-not-active=Meilenstein {key} ist nicht aktiv. Nur {active} lässt sich freischalten.
server.wrong-phase=Ein Spiel startet nur im Start-Event. Das Netzwerk ist in {phase}.
server.no-game=Kein Spiel ist zur Anmeldung offen.
server.wrong-state=Das Spiel lässt sich im Zustand {state} nicht starten.
server.below-hard-minimum=Der Start braucht mindestens {minimum, plural, one {eine teilnehmende Person} other {# Teilnehmende}}. Angemeldet {count, plural, one {ist #} other {sind #}}.
server.below-soft-minimum=Nur {count, plural, one {eine teilnehmende Person ist} other {# Teilnehmende sind}} angemeldet, weniger als die empfohlenen {minimum}. Bestätige, um trotzdem zu starten.
server.not-here=Du bist nicht mehr auf diesem Server. Die Vorschau wurde nicht gezeigt.
server.not-delivered=Discord hat die Direktnachricht nicht zugestellt. Der Bot kann dir nur schreiben, solange deine Direktnachrichten offen sind.
server.settings-refused={service} würde mit dieser Änderung nicht starten: {detail}

player.card=<emphasis>{player.name, name, plain}</emphasis>{role, select, admin { <glyph:admin>} donor { <glyph:donor-star>} other {}}<newline>{crest} <muted>Prestige {tier, number}</muted><newline><muted>{playtime, duration} gespielt</muted>

