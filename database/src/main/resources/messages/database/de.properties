server.milestone-not-active={@terms.milestone, n=1} {key} ist nicht aktiv. Nur {active} lässt sich freischalten.
server.wrong-phase=Ein Spiel startet nur im Start-Event. Das {@terms.network} ist in {phase}.
server.no-game=Kein Spiel ist zur Anmeldung offen.
server.wrong-state=Das Spiel lässt sich im Zustand {state} nicht starten.
