# database, English: the fallback for every other language, so keep it complete.
#
# What a refused write tells whoever asked for it: Steward, a command or a scheduled run. And the card a
# player's name shows in game, which every server and the proxy draw from what they hold of the player. And the
# announcements the bot posts.

update.run-open=Run #{id, number, plain} is still {status} ({kind}).
update.already-held=Already down: {services}.

season.launch-in-the-past=The network cannot open in the past. {at} has already happened; use `{clear}` if you meant to take the date away instead.
season.smp-start-in-the-past=Paid access cannot start running in the past. {at} has already happened; use `{clear}` if you meant to take the date away instead.
season.launch-after-smp-start=The network would open on {at}, after paid access starts running on {smp}. Move the SMP start first, or clear it.
season.smp-running=The season is already in SMP, so paid time is being used up right now. Moving the start date would hand somebody days they have played or take away days they have not. Change it in the database by hand if you are certain.
season.smp-start-before-launch=Paid access would start running on {at}, before the network opens on {launch}. Nobody could use the days in between.

server.no-active-milestone=No milestone is active, so nothing of the track can be closed.
server.no-such-objective={key} is not an open objective of the active milestone.
server.milestone-not-active=Milestone {key} is not the active one; only {active} can be unlocked.
server.wrong-phase=A game only starts during the start event; the network is in {phase}.
server.no-game=No game is open for registration.
server.wrong-state=The game cannot be started from its current state ({state}).
server.below-hard-minimum=At least {minimum} participants are needed to start, and {count} are registered.
server.below-soft-minimum=Only {count} participants are registered, below the recommended {minimum}. Confirm to start anyway.

# The card a player's name shows on hover in game: their role, their crest and its tier, and how long they have played.
player.card=<emphasis>{player.name, name, plain}</emphasis>{role, select, admin { <glyph:admin>} donor { <glyph:donor-star>} other {}}<newline>{crest} <muted>Prestige {tier, number}</muted><newline><muted>Played for {playtime, duration}</muted>

# Into the Discord announcement channels, which the bot renders per language: no glyphs. An admin's words are posted
# as written, markdown included.
announcement.words={text}
announcement.milestone={milestone.name} is complete.
announcement.milestone.border={milestone.name} is complete - the border grows.
announcement.milestone.nether={milestone.name} is complete - the Nether is open.
announcement.milestone.end={milestone.name} is complete - the End is open.
