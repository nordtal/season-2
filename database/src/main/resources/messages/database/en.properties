# database, English: the fallback for every other language, so keep it complete.
#
# What a refused write tells whoever asked for it: Steward, a command or a scheduled run. And the card a
# player's name shows in game, which every server and the proxy draw from what they hold of the player. And the
# announcements the bot posts.

update.run-open=Run #{id, number, plain} ({kind}) is still {status}.
update.already-held=Already down: {services}.

season.launch-in-the-past=The network cannot open in the past. {at} has passed. To remove the date, use `{clear}`.
season.smp-start-in-the-past=Paid access cannot start in the past. {at} has passed. To remove the date, use `{clear}`.
season.launch-after-smp-start=The network would open on {at}, after paid access starts on {smp}. Move the SMP start first, or clear it.
season.smp-running=The season is already in SMP, so paid time is running. A new start date would add or remove days that players used. Change it in the database by hand only if you are sure.
season.smp-start-before-launch=Paid access would start on {at}, before the network opens on {launch}. Nobody could use the days in between.

server.no-active-milestone=No milestone is active.
server.no-such-objective={key} is not an open objective of the active milestone.
server.milestone-not-active=Milestone {key} is not active. Only {active} can be unlocked.
server.wrong-phase=A game starts only during the start event. The network is in {phase}.
server.no-game=No game is open for registration.
server.wrong-state=The game cannot start in its current state ({state}).
server.below-hard-minimum=The start needs at least {minimum, plural, one {# participant} other {# participants}}. {count, plural, one {# is} other {# are}} registered.
server.below-soft-minimum=Only {count, plural, one {# participant is} other {# participants are}} registered, below the recommended {minimum}. Confirm to start anyway.
server.not-here=Your player is not on this server, so no preview was shown.
server.not-delivered=Discord did not deliver the direct message. The bot can write to you only while your direct messages are open.
server.settings-refused={service} would not start with this change: {detail}
server.stack-changed=The slot no longer holds this stack. Load the inventory again.

# The card a player's name shows on hover in game: their role, their crest and its tier, and how long they have played.
player.card=<emphasis>{player.name, name, plain}</emphasis>{role, select, admin { <glyph:admin>} donor { <glyph:donor-star>} other {}}<newline>{crest} <muted>Prestige {tier, number}</muted><newline><muted>Played for {playtime, duration}</muted>

# Into the Discord announcement channels, which the bot renders per language: no glyphs. An admin's words are posted
# as written, markdown included.
announcement.words={text}
announcement.milestone={milestone.name} is complete.
announcement.milestone.border={milestone.name} is complete. The border grows.
announcement.milestone.nether={milestone.name} is complete. The Nether is open.
announcement.milestone.end={milestone.name} is complete. The End is open.
