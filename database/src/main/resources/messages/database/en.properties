# database, English: the fallback for every other language, so keep it complete.
#
# What a refused write tells whoever asked for it: Steward, a command or a scheduled run. And the card a
# player's name shows in game, which every server and the proxy draw from what they hold of the player.

update.run-open=Run #{id, number, plain} ({kind}) is still {status}.
update.already-held=Already down: {services}.

season.launch-in-the-past=The {@terms.network} cannot open in the past. {at} has passed. To remove the date, use `{clear}`.
season.smp-start-in-the-past=Paid {@terms.access} cannot start in the past. {at} has passed. To remove the date, use `{clear}`.
season.launch-after-smp-start=The {@terms.network} would open on {at}, after paid {@terms.access} starts on {smp}. Move the {@terms.smp} start first, or clear it.
season.smp-running=The {@terms.season} is already in {@terms.smp}, so paid time is running. A new start date would add or remove days that {@terms.player, n=2} used. Change it in the database by hand only if you are sure.
season.smp-start-before-launch=Paid {@terms.access} would start on {at}, before the {@terms.network} opens on {launch}. Nobody could use the days in between.

server.no-active-milestone=No {@terms.milestone, n=1} is active.
server.no-such-objective={key} is not an open {@terms.objective, n=1} of the active {@terms.milestone, n=1}.
server.milestone-not-active=Milestone {key} is not active. Only {active} can be unlocked.
server.wrong-phase=A game starts only during the start event. The {@terms.network} is in {phase}.
server.no-game=No game is open for registration.
server.wrong-state=The game cannot start in its current state ({state}).
server.below-hard-minimum=The start needs at least {minimum, number} {@terms.participant, n=minimum}. {count, plural, one {# is} other {# are}} registered.
server.below-soft-minimum=Only {count, plural, one {# {@terms.participant, n=count} is} other {# {@terms.participant, n=count} are}} registered, below the recommended {minimum}. Confirm to start anyway.
server.not-here=Your {@terms.player, n=1} is not on this server.
server.not-delivered=Discord did not deliver the direct message. The bot can write to you only while your direct messages are open.
server.settings-refused={service} would not start with this change. {rule, select, required {{setting} must not be empty.} positive {{setting} must be greater than zero.} not-negative {{setting} must not be negative.} at-least {{setting} must be at least {value}.} at-most {{setting} must be at most {value}.} above {{setting} must be greater than {value}.} entries {{setting} must have exactly {value} entries.} most-entries {{setting} has more than {value} entries.} longest {A text in {setting} is longer than {value} characters.} unique {{setting} holds {value} twice.} ascending {{setting} must be in ascending order.} corners {A box in {setting} has a max corner below its min corner.} known {{setting} names {value}, which this server does not have.} track {The {@terms.milestone, n=2} in {setting} cannot be read.} objective-names {In {setting}, the {@terms.objective, n=1} {value} names something this server does not have.} other {{setting} is not valid. The server's log names the reason.}}
server.stack-changed=The slot no longer holds this stack. Load the inventory again.
server.not-editable=This server has no Survival state of this {@terms.player, n=1} to edit right now, or another editor of it is open. Try again in a moment.

# The card a player's name shows on hover in game: their role, their crest and its tier, and how long they have played.
player.card=<emphasis>{player.name, name, plain}</emphasis>{role, select, admin { <glyph:admin>} donor { <glyph:donor-star>} other {}}<newline>{crest} <muted>Prestige {tier, number}</muted><newline><muted>Played for {playtime, duration}</muted>
