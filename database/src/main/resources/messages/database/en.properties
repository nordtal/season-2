# database, English: the fallback for every other language, so keep it complete.
#
# What a refused write tells whoever asked for it: Steward, a command or a scheduled run. And the card a
# player's name shows in game, which every server and the proxy draw from what they hold of the player.

update.run-open=Run #{id, number, plain} ({kind}) is still {status, select, pending {waiting} other {{status}}}.
update.already-held=Already offline: {services}.

season.launch-in-the-past=The start date {at} is in the past. Current time: {now}.
season.already-launched=The {@terms.season} has been open since {at}.
season.not-set=Set a start date for the {@terms.season} first.
season.not-launched=The {@terms.season} has not started yet.

server.no-active-milestone=No {@terms.milestone, n=1} is active.
server.no-such-objective=Objective {key} is not open in the active {@terms.milestone, n=1}.
server.milestone-not-active=Milestone {key} is not active. Only {active} can be unlocked.
server.no-game=No game is accepting registrations.
server.wrong-state=Cannot start the game from state {state}.
server.below-hard-minimum=Registered: {count, number} {@terms.participant, n=count}. At least {minimum, number} are required.
server.below-soft-minimum=Registered: {count, number} {@terms.participant, n=count}. Recommended minimum: {minimum}. Confirm to start anyway.
server.not-here=Your linked {@terms.player, n=1} is not on this server.
server.not-delivered=The Discord direct message could not be delivered. Allow direct messages from the bot and try again.
server.settings-refused={service} would not start with this change. {rule, select, required {{setting} must not be empty.} positive {{setting} must be greater than zero.} not-negative {{setting} must not be negative.} at-least {{setting} must be at least {value}.} at-most {{setting} must be at most {value}.} above {{setting} must be greater than {value}.} entries {{setting} must have exactly {value} entries.} most-entries {{setting} has more than {value} entries.} longest {A text in {setting} is longer than {value} characters.} unique {{setting} contains {value} more than once.} ascending {{setting} must be sorted in ascending order.} known {{setting} names {value}, which this server does not have.} track {The {@terms.milestone, n=2} in {setting} cannot be read.} objective-names {In {setting}, the {@terms.objective, n=1} {value} names something this server does not have.} other {{setting} is invalid.}}
server.stack-changed=This slot no longer contains that stack. Reload the inventory.
server.not-editable=No Survival inventory is available for this {@terms.player, n=1}, or another editor is using it. Try again in a moment.
server.no-block-in-sight=Your {@terms.player, n=1} is not looking at a block within 64 blocks. Go closer, look at the block, then try again.
server.no-area-draft=Your {@terms.player, n=1} holds no area draft. Choose Edit in the game first.
server.hotbar-full=Your {@terms.player, n=1} has no free hotbar slot for the area editor. Free one, then try again.
server.wrong-world=Your {@terms.player, n=1} is not in the world of this draft. Move to that world, then try again.

# The card a player's name shows on hover in game: their role, their crest and its tier, and how long they have played.
player.card=<emphasis>{player.name, name, plain}</emphasis>{role, select, admin { <glyph:admin>} donor { <glyph:donor-star>} other {}}<newline>{crest} <muted>Prestige {tier, number}</muted><newline><muted>Played for {playtime, duration}</muted>
