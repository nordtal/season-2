# Runs the Discord bot on its own, against its own PostgreSQL.
#
# The same file is meant for the test deploy and for production - the only difference is what is
# in .env. Nothing in here carries a value: every setting arrives as an environment variable, and
# `docker compose config` will refuse to start if a required one is missing rather than falling
# back to something plausible.
#
#   cp .env.example .env      # fill it in; .env is gitignored and must never be committed
#   ../gradlew :discord-bot:shadowJar
#   docker build -t "$BOT_IMAGE" --build-arg JAR=build/libs/discord-bot-<version>.jar .
#   docker compose --profile db up -d
#
# The image is pulled, not built here, so that a production host can run the released
# ghcr.io/nordtal/discord-bot:<version> without a checkout. See README.md.
#
# THE DATABASE IS OPTIONAL. `--profile db` (or COMPOSE_PROFILES=db in .env) brings up a PostgreSQL
# alongside the bot; without it only the bot starts and NORDTAL_DATABASE_JDBC_URL is expected to
# point at a database that already exists. The bot is also the process that applies the schema, so
# an empty database is all it needs.

services:

  postgres:
    profiles: ["db"]
    # The version every integration test in this repository runs against.
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      # The proxy and the Paper plugins read the same database, so this port has to be reachable
      # from their host - but it binds to loopback until POSTGRES_BIND says otherwise, because a
      # PostgreSQL on 0.0.0.0 with a password from a .env file is a bad first day.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    image: ${BOT_IMAGE:?set BOT_IMAGE in .env, e.g. ghcr.io/nordtal/discord-bot:2.0.0}
    # The bot fails fast and exits on a bad config, an unreachable database or a rejected Discord
    # token. Restarting is right for the last two and a crash loop for the first - the log line
    # names the file and the setting, so read the log before assuming the container is at fault.
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}

      # --- database.yml --------------------------------------------------------------------
      # The hostname 'postgres' is this compose's own service. Point the URL somewhere else and
      # the db profile becomes unnecessary.
      NORDTAL_DATABASE_JDBC_URL: ${NORDTAL_DATABASE_JDBC_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nordtal}}
      NORDTAL_DATABASE_USERNAME: ${NORDTAL_DATABASE_USERNAME:-${POSTGRES_USER:-nordtal}}
      NORDTAL_DATABASE_PASSWORD: ${NORDTAL_DATABASE_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD or NORDTAL_DATABASE_PASSWORD in .env}}
      NORDTAL_DATABASE_MAXIMUM_POOL_SIZE: ${NORDTAL_DATABASE_MAXIMUM_POOL_SIZE:-}
      NORDTAL_DATABASE_LOG_SQL: ${NORDTAL_DATABASE_LOG_SQL:-}

      # --- bot.yml -------------------------------------------------------------------------
      NORDTAL_BOT_TOKEN: ${NORDTAL_BOT_TOKEN:?set NORDTAL_BOT_TOKEN in .env}
      NORDTAL_BOT_BUNQ_API_KEY: ${NORDTAL_BOT_BUNQ_API_KEY:?set NORDTAL_BOT_BUNQ_API_KEY in .env}
      NORDTAL_BOT_BUNQ_ACCOUNT_ID: ${NORDTAL_BOT_BUNQ_ACCOUNT_ID:?set NORDTAL_BOT_BUNQ_ACCOUNT_ID in .env}
      NORDTAL_BOT_BUNQ_ENVIRONMENT: ${NORDTAL_BOT_BUNQ_ENVIRONMENT:?SANDBOX or PRODUCTION}
      # NORDTAL_BOT_BUNQ_CONTEXT_PATH is set by the image and points into the bunq volume below.

      # --- access.yml ----------------------------------------------------------------------
      NORDTAL_ACCESS_GUILD_ID: ${NORDTAL_ACCESS_GUILD_ID:?set NORDTAL_ACCESS_GUILD_ID in .env}
      NORDTAL_ACCESS_ROLES_ACCESS: ${NORDTAL_ACCESS_ROLES_ACCESS:?}
      NORDTAL_ACCESS_ROLES_DONOR: ${NORDTAL_ACCESS_ROLES_DONOR:?}
      NORDTAL_ACCESS_ROLES_ADMIN: ${NORDTAL_ACCESS_ROLES_ADMIN:?}
      NORDTAL_ACCESS_ROLES_ADMIN_PING: ${NORDTAL_ACCESS_ROLES_ADMIN_PING:?}
      NORDTAL_ACCESS_CHANNELS_ADMIN: ${NORDTAL_ACCESS_CHANNELS_ADMIN:?}
      # A JSON array - the list is the only source for the language roles and channels. Verified
      # 2026-08-31 against jcore 3.0.0: a list of nested specs does come through the environment,
      # and the keys inside it are the kebab-case config keys, not the Java method names.
      NORDTAL_ACCESS_LANGUAGES: ${NORDTAL_ACCESS_LANGUAGES:?}
      # Optional. Empty means "use what is in the file", which is 30/60/90 at 3/5/7 EUR.
      NORDTAL_ACCESS_TIERS: ${NORDTAL_ACCESS_TIERS:-}
      NORDTAL_ACCESS_DONATION_CENTS: ${NORDTAL_ACCESS_DONATION_CENTS:-}
      NORDTAL_ACCESS_PAYMENT_POLL_INTERVAL_SECONDS: ${NORDTAL_ACCESS_PAYMENT_POLL_INTERVAL_SECONDS:-}
      NORDTAL_ACCESS_PAYMENT_REQUEST_TTL_HOURS: ${NORDTAL_ACCESS_PAYMENT_REQUEST_TTL_HOURS:-}
      # Leave this empty on a fresh database. The first start stamps its own instant into
      # bot_setting and no later start ever rewrites it; setting it here only overrides what is
      # read, it does not replace what is stored.
      NORDTAL_ACCESS_PAYMENT_WATERMARK: ${NORDTAL_ACCESS_PAYMENT_WATERMARK:-}
      NORDTAL_ACCESS_PAYMENT_RECENT_PAYMENT_COUNT: ${NORDTAL_ACCESS_PAYMENT_RECENT_PAYMENT_COUNT:-}
      NORDTAL_ACCESS_EXPIRY_REMINDER_LEAD_DAYS: ${NORDTAL_ACCESS_EXPIRY_REMINDER_LEAD_DAYS:-}
      NORDTAL_ACCESS_ROLE_RECONCILE_INTERVAL_MINUTES: ${NORDTAL_ACCESS_ROLE_RECONCILE_INTERVAL_MINUTES:-}
    volumes:
      # jcore writes a defaults file on first start, so this has to be writable. Every value above
      # overrides the file without ever being written into it, so the volume holds no secrets.
      - bot-config:/app/config
      # The bunq API context. bunq binds a context to the device it was registered from, so this
      # must be created on the host that will use it - never copied over from a laptop.
      - bunq-context:/app/bunq
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres-data:
  bot-config:
  bunq-context:
