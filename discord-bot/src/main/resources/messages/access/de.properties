# Season 2 access bot - Deutsch. Read as UTF-8, so umlauts belong here literally rather than as
# \uXXXX escapes. A key missing here falls back to en.properties.

# ---------------------------------------------------------------- die Beitragsnachricht
contribution.title=Zugang zu nordtal
contribution.body=Um auf nordtal zu spielen, brauchst du einen Zugangszeitraum. Kauf ihn hier - er \
  gehört zu deinem Discord-Account, und der damit verknüpfte Minecraft-Account darf spielen, \
  solange er läuft.
contribution.prices=Preise
contribution.tier-line={days} Tage - {price}
contribution.donation=Optional: leg {amount} drauf und behalte dauerhaft die Spender-Rolle.
contribution.renew=Wenn du kaufst, während dein Zugang noch läuft, wird der neue Zeitraum hinten \
  angehängt. Frühzeitig verlängern kostet dich also keine bezahlte Zeit.
contribution.button=Zugang kaufen

# ---------------------------------------------------------------- die Verknüpfungsnachricht
link.title=Minecraft-Account verknüpfen
link.body=Verbinde dich einmal mit dem Server. Du wirst mit einem Code getrennt; gib diesen Code \
  hier ein, um deinen Minecraft-Account mit diesem Discord-Account zu verknüpfen.
link.unlink-hint=Schon verknüpft und willst einen anderen Account verknüpfen? Nutze zuerst /unlink \
  - das wirkt sofort.
link.button=Code eingeben

# ---------------------------------------------------------------- das Verknüpfungs-Modal
link.modal.title=Account verknüpfen
link.modal.code-label=Code
link.modal.code-placeholder=Der Code vom Login-Bildschirm
link.success=Dein Minecraft-Account ist jetzt verknüpft. Du kannst dich auf dem Server anmelden.
link.invalid-code=Dieser Code ist falsch oder abgelaufen. Verbinde dich erneut mit dem Server, um \
  einen neuen zu bekommen.
link.already-linked=Du hast bereits einen Minecraft-Account verknüpft. Nutze zuerst /unlink, wenn \
  du einen anderen verknüpfen willst.
link.failed=Beim Verknüpfen deines Accounts ist etwas schiefgelaufen. Ein Admin wurde informiert; \
  bitte versuch es in ein paar Minuten noch einmal.

# ---------------------------------------------------------------- /unlink
unlink.success=Dein Minecraft-Account wurde getrennt.
unlink.none=Du hast keinen verknüpften Minecraft-Account.

# ---------------------------------------------------------------- der Kaufablauf
purchase.choose=Für wie lange möchtest du Zugang?
purchase.option={days} Tage - {price}
purchase.summary=**{days} Tage Zugang** für {price}.
purchase.summary.donation=Inklusive {donation} Spende, die dir dauerhaft die Spender-Rolle gibt.
purchase.summary.total=Gesamt: **{total}**
purchase.button.confirm=Zahlungslink holen
purchase.button.change=Ändern
purchase.button.donation.add={amount} spenden
purchase.button.donation.remove=Spende entfernen
purchase.link=Zahle **{total}** hier: {url}
purchase.link.reference=Verwendungszweck **{reference}**. Bitte nicht ändern - daran erkennen wir, \
  dass die Zahlung zu dir gehört.
purchase.link.ttl=Der Link ist {hours} Stunden gültig.
purchase.gone=Dieser Kauf ist nicht mehr offen. Starte einen neuen über den Knopf im Kanal.
purchase.tier-gone=Diese Option gibt es nicht mehr. Fang neu an, um die aktuellen Preise zu sehen.
purchase.failed=Beim Erstellen des Zahlungslinks ist etwas schiefgelaufen. Ein Admin wurde \
  informiert; bitte versuch es in ein paar Minuten noch einmal.

# ---------------------------------------------------------------- Direktnachrichten
dm.granted=Dein Zugang läuft bis **{until}**. Viel Spaß auf nordtal.
dm.granted.short=Du hast {paid} gezahlt, das reicht für **{days} Tage**. Dein Zugang läuft bis \
  **{until}**.
dm.donor=Danke für die Spende - die Spender-Rolle bleibt dir.
dm.expiring=Dein Zugang zu nordtal läuft am **{until}** ab, in {days} Tagen. Kauf im \
  Beitragskanal nach, dann wird die Zeit hinten angehängt.
dm.expired=Dein Zugang zu nordtal ist abgelaufen. Du kannst jederzeit im Beitragskanal einen neuen \
  Zeitraum kaufen.
dm.granted.admin=Ein Admin hat dir **{days} Tage** Zugang gegeben. Er läuft bis **{until}**.
dm.revoked=Dein Zugang zu nordtal wurde von einem Admin entzogen.

# ---------------------------------------------------------------- öffentlich
public.donation={user} hat {amount} gespendet. Danke!

# ---------------------------------------------------------------- die Hunger-Games-Registrierungsnachricht
register.title=Für die Hunger Games registrieren
register.body=Tretet zum Startevent der Saison an. Wählt einen Teamnamen (3-15 Zeichen) und ladet \
  optional einen Partner ein. Ist der Partner beim Countdown nie eingeloggt gewesen, spielt das \
  Team stattdessen solo, mit voller Gesundheit.
register.button=Registrieren

# ---------------------------------------------------------------- das Registrierungs-Modal
register.modal.title=Team registrieren
register.modal.name-label=Teamname
register.modal.name-placeholder=3-15 Zeichen
register.success=Team **{name}** ist registriert. Du kannst unten einen Partner einladen, oder \
  einfach so antreten.
register.invalid-name=Ein Teamname hat 3-15 Zeichen. Versuch es erneut über den Registrieren-Knopf.
register.name-taken=Dieser Name ist schon vergeben. Versuch es erneut über den Registrieren-Knopf.
register.already-registered=Du bist für dieses Event bereits registriert.
register.failed=Beim Registrieren deines Teams ist etwas schiefgelaufen. Ein Admin wurde informiert; \
  bitte versuch es in ein paar Minuten noch einmal.
register.invite-button=Partner einladen

# ---------------------------------------------------------------- einen Partner einladen
register.invite.picker-placeholder=Wen möchtest du einladen?
register.invite.pick=Wen möchtest du einladen?
register.invite.sent=Einladung an {partner} gesendet. Sie muss angenommen werden, bevor euer Team \
  vollständig ist.
register.invite.not-owner=Du musst zuerst dein eigenes Team registrieren, bevor du jemanden \
  einladen kannst.
register.invite.team-full=Dein Team hat bereits einen Partner.
register.invite.pending=Du hast schon eine offene Einladung. Warte auf eine Antwort, bevor du eine \
  weitere schickst.
register.invite.cannot-invite-self=Du kannst dich nicht selbst einladen.
register.invite.target-unavailable=Dieser Account kann nicht eingeladen werden - er ist ein Bot, \
  oder bereits für dieses Event registriert.
register.invite.dm=Du wurdest zu Team **{team}** für die Hunger Games eingeladen.
register.invite.accept=Annehmen
register.invite.decline=Ablehnen
register.invite.accepted=Du bist jetzt in Team **{team}**.
register.invite.declined=Du hast die Einladung zu Team **{team}** abgelehnt.
register.invite.no-longer-pending=Diese Einladung ist nicht mehr offen.
register.invite.owner-notified-accepted={player} hat deine Einladung angenommen. Team **{team}** \
  ist vollständig.
register.invite.owner-notified-declined={player} hat deine Einladung zu Team **{team}** abgelehnt.
