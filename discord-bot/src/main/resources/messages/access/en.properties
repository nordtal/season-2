status.pre-launch.minutes=Opens in {minutes} min
status.pre-launch.imminent=Opens any moment
status.pre-launch.unknown=Opening date to come
status.pre-event={teams, plural, one {# team} other {# teams}} registered
status.start-event={teams, plural, one {# team} other {# teams}} left | {players} alive
status.smp={players, plural, one {# player} other {# players}}
status.maintenance=Maintenance

