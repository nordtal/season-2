link.invalid-code=That code is wrong or expired. Join the server again to get a new code.
link.already-linked=A Minecraft account is already linked. Run /unlink to link another one.
link.failed=Linking failed. An admin knows. Try again in a few minutes.

# the onboarding: the welcome in the onboarding channel, in the default language only
onboarding.welcome.title=Welcome to Nordtal
onboarding.welcome.lead=Choose your language and your region. Then every channel opens.
onboarding.welcome.steps-heading=Steps
onboarding.welcome.steps=**Language** → **region** → done
onboarding.welcome.choose=Choose your language

# the answer to a language, in it and to the member alone
onboarding.region.title=Your region
onboarding.region.lead=Choose the region you play from. Nordtal shows every time in its time zone.
onboarding.region.choose=Choose your region

# the message in the change channel: each language has its own box and button
onboarding.change.title=Language and region
onboarding.change.heading=Change
onboarding.change.how=**{button}** → language and region, at any time
onboarding.change.button=Change

# the dialog the change button opens
onboarding.modal.title=Language and region
onboarding.modal.language=Language
onboarding.modal.region=Region

# the answer to a choice, in the dialog or in the onboarding channel
onboarding.saved=Saved: **{language}**, **{region}**.
onboarding.failed=Saving failed. An admin knows. Try again in a few minutes.

# /unlink
unlink.success=Your Minecraft account is unlinked.
unlink.none=No Minecraft account is linked to you.

# the purchase flow
purchase.choose=How long do you want access?
purchase.option={days, plural, one {# day} other {# days}}: {price}
purchase.summary=**{days, plural, one {# day} other {# days}} of access** for {price}.
purchase.summary.donation=This includes a donation of {donation}. It gives you the permanent donor role.
purchase.summary.total=Total: **{total}**
purchase.button.confirm=Get the payment link
purchase.button.change=Change
purchase.button.donation.add=Add a {amount} donation
purchase.button.donation.remove=Remove the donation
purchase.link=Pay **{total}** here: {url}
purchase.link.reference=Reference: **{reference}**. Keep the reference in the payment description.
purchase.link.ttl=The link expires {until, instant, relative}.
purchase.link.pending=The payment link is being created. This message updates when it is ready.
purchase.link.refused={passes, select, true {The bank did not answer. Use the button in the channel to try again in a few minutes.} other {The payment link could not be created. An admin knows. Use the button in the channel to start again.}}
purchase.link.slow=The payment link is still missing. Your reference is **{reference}**. Send it to an admin.
purchase.gone=This purchase is closed. Use the button in the channel to start a new one.
purchase.tier-gone=This option no longer exists. Start again to see the current prices.
purchase.failed=Creating the payment link failed. An admin knows. Try again in a few minutes.

# direct messages
dm.granted=Your access lasts until **{until}**. Have fun on Nordtal.
dm.granted.short=You paid {paid} for **{days, plural, one {# day} other {# days}}**. Your access lasts until **{until}**.
