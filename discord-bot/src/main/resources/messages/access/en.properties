# ---------------------------------------------------------------- guessing at codes
# A link code is four characters. That is only safe because this cap exists: five wrong codes an
# hour per Discord account (access.yml#link-code-attempts-per-hour). The wording deliberately does
# not say how many are left or when the hour is up - somebody grinding codes should learn as little
# as possible from the answer, and somebody who mistyped theirs only needs to know to come back.
link.too-many=Too many wrong codes. Try again later.

# ---------------------------------------------------------------- the status channel name
# These are CHANNEL NAMES, not messages: the bot renames one channel per language and never posts
# in it (access.yml, languages[].status-channel). Three rules follow from that.
#
# 1. KEEP THEM SHORT. Discord cuts a channel name at 100 characters and the sidebar cuts it much
#    earlier than that.
# 2. KEEP THEM COARSE. The channel is renamed only when the rendered text changes, and Discord
#    allows two renames per ten minutes per channel. A placeholder that moves every minute would
#    spend that budget on the first minute of every hour. This is why the hours line carries no
#    minutes, and why the minutes line only ever shows a multiple of ten.
# 3. A voice channel keeps the name exactly as written; a text channel is lower-cased and has its
#    spaces turned into hyphens by Discord. Both work - the second just looks different from this.
status.pre-launch.days=Opens in {days}d {hours}h
status.pre-launch.hours=Opens in {hours}h
status.pre-launch.minutes=Opens in {minutes} min
status.pre-launch.imminent=Opens any moment
status.pre-launch.unknown=Opening date to come
status.pre-event={teams} teams registered
status.start-event={teams} teams left | {players} alive
status.smp={players} players
status.maintenance=Maintenance
