dm.expiring=Your access ends **{until, instant, relative}** ({until}). Buy more in {channel} to extend it.
dm.expired=Your access has ended. Buy a new period in {channel} to join again.
# Stands in for {channel} when the language has no contribution channel configured.
dm.channel=the contribution channel
dm.granted.admin=An admin gave you **{days, plural, one {# day} other {# days}}** of access. It lasts until **{until}**.
dm.revoked=An admin revoked your access to Nordtal.

# public
public.donation={user.name} donated {amount}. Thank you!

# the managed hunger games register message
