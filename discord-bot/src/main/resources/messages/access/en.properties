# Access bot, English: the fallback for every other language, so keep it complete.
# Parameters are named in braces; an unmatched placeholder stays visible in the text.

# ---------------------------------------------------------------- the managed contribution message
contribution.title=Access
contribution.donation-heading=Donation
contribution.renew-heading=Renewal
contribution.prices=Prices
contribution.tier-line=**{price}** {days, plural, one {# day} other {# days}}
contribution.donation=+{amount} → permanent donor role
contribution.renew=*adds on, no paid time lost*
contribution.button=Buy access

# ---------------------------------------------------------------- the managed link message
link.title=Account link
link.steps-heading=Steps
link.steps=Join the server → get a code → **{button}**
link.switch-heading=Other account
link.switch-account=/unlink → link again
link.button=Enter my code

# ---------------------------------------------------------------- the link modal
link.modal.title=Link your account
link.modal.code-label=Code
link.modal.code-placeholder=The code shown on the login screen
link.success=Your Minecraft account is now linked. You can log in to the server.
link.invalid-code=That code is wrong or has expired. Log in to the server again to get a new one.
link.already-linked=You already have a Minecraft account linked. Use /unlink first if you want to \
  link a different one.
link.failed=Something went wrong while linking your account. An admin has been told; please try \
  again in a few minutes.

# ---------------------------------------------------------------- /unlink
unlink.success=Your Minecraft account has been unlinked.
unlink.none=You do not have a Minecraft account linked.

# ---------------------------------------------------------------- the purchase flow
purchase.choose=How long do you want access for?
purchase.option={days, plural, one {# day} other {# days}} - {price}
purchase.summary=**{days, plural, one {# day} other {# days}} of access** for {price}.
purchase.summary.donation=Including a {donation} donation, which grants the permanent donor role.
purchase.summary.total=Total: **{total}**
purchase.button.confirm=Get the payment link
purchase.button.change=Change
purchase.button.donation.add=Add a {amount} donation
purchase.button.donation.remove=Remove the donation
purchase.link=Pay **{total}** here: {url}
purchase.link.reference=Reference **{reference}**. Do not change the description - it is how the \
  payment finds its way back to you.
purchase.link.ttl=The link expires {until, instant, relative}.
purchase.link.pending=Your payment link is being created. This message fills itself in as soon \
  as it is ready.
purchase.link.refused=The payment link could not be created. An admin has been told. Start again \
  from the button in the channel to try once more.
purchase.link.slow=The payment link is still not here. Your reference is **{reference}** - give an \
  admin that one and nothing is lost.
purchase.gone=That purchase is no longer open. Start a new one from the button in the channel.
purchase.tier-gone=That option is not on offer any more. Start again to see the current prices.
purchase.failed=Something went wrong while creating the payment link. An admin has been told; \
  please try again in a few minutes.

# ---------------------------------------------------------------- direct messages
dm.granted=Your access is active until **{until}**. Have fun on nordtal.
dm.granted.short=You paid {paid}, which covers **{days, plural, one {# day} other {# days}}**. Your access is active until \
  **{until}**.
dm.donor=Thank you for the donation - the donor role is yours to keep.
dm.expiring=Your access to nordtal runs out **{until, instant, relative}** ({until}). Buy more in {channel} to add time \
  to the end of it.
dm.expired=Your access to nordtal has run out. Buy a new period in {channel} whenever you want to \
  come back.
# Stands in for {channel} when the language has no contribution channel configured.
dm.channel=the contribution channel
dm.granted.admin=An admin granted you **{days, plural, one {# day} other {# days}}** of access. It is active until **{until}**.
dm.revoked=Your access to nordtal was revoked by an admin.

# ---------------------------------------------------------------- public
public.donation={user.name} donated {amount}. Thank you!

# ---------------------------------------------------------------- the managed hunger games register message
# Registering needs a linked account, not access.
register.title=Hunger Games
register.team-heading=Team
register.team=1\u20132 players
register.name-heading=Name
register.name=3\u201315 characters
register.partner-heading=No-show
register.partner=*duo → solo, full health*
register.button=Register

# ---------------------------------------------------------------- the register modal
register.modal.title=Register your team
register.modal.name-label=Team name
register.modal.name-placeholder=3-15 characters
register.success=Team **{name}** is registered. You can invite one partner below, or just show up.
register.invalid-name=A team name is 3-15 characters. Try again from the Register button.
register.name-taken=That name is already taken. Try again from the Register button.
register.already-registered=You are already registered for this event.
register.closed=Registration is closed while a game is under way. It opens again once the game is over.
register.failed=Something went wrong while registering your team. An admin has been told; please \
  try again in a few minutes.
register.invite-button=Invite a partner

# ---------------------------------------------------------------- inviting a partner
register.invite.picker-placeholder=Choose who to invite
register.invite.pick=Who do you want to invite?
register.invite.sent=Invitation sent to {partner.name}. They have to accept before your team is complete.
register.invite.not-owner=You have to register your own team before you can invite anyone.
register.invite.team-full=Your team already has a partner.
register.invite.pending=You already have an invitation out. Wait for an answer before sending another.
register.invite.cannot-invite-self=You cannot invite yourself.
register.invite.target-unavailable=That account cannot be invited - it is a bot, or already \
  registered for this event.
register.invite.dm=You have been invited to join team **{team.name}** for the hunger games start event.
register.invite.accept=Accept
register.invite.decline=Decline
register.invite.accepted=You are now on team **{team.name}**.
register.invite.declined=You declined the invitation to team **{team.name}**.
register.invite.no-longer-pending=That invitation is no longer pending.
register.invite.owner-notified-accepted={player.name} accepted your invitation. Team **{team.name}** is complete.
register.invite.owner-notified-declined={player.name} declined your invitation to team **{team.name}**.

# ---------------------------------------------------------------- guessing at codes
# Deliberately silent about attempts left or when the hour ends, so guessing codes teaches nothing.
link.too-many=Too many wrong codes. Try again later.

# ---------------------------------------------------------------- the status channel name
# Channel names, not messages: keep them short (100 characters) and coarse (two renames per ten minutes).
