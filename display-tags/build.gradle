import xyz.jpenilla.runtask.task.AbstractRun

plugins {
	id 'java'
	id("xyz.jpenilla.run-paper") version "3.1.0"
	id("com.gradleup.shadow") version "9.6.1"
	id("com.diffplug.spotless") version "8.10.3"
	id("net.ltgt.errorprone") version "5.1.1" apply false
}

group = 'eu.nordtal'
version = '2.2.0'

repositories {
	mavenCentral()
	maven { url = "https://repo.papermc.io/repository/maven-public/" }
	maven { url = "https://repo.codemc.io/repository/maven-releases/" }
	maven { url = "https://repo.extendedclip.com/releases/" }
	maven { url = "https://jitpack.io" } // TAB-API and jcore
}

dependencies {
	compileOnly("io.papermc.paper:paper-api:26.2.build.120-stable")
	compileOnly("com.github.retrooper:packetevents-spigot:2.13.0")
	compileOnly("me.clip:placeholderapi:2.12.3")
	compileOnly("com.github.NEZNAMY:TAB-API:6.1.2")

	implementation(project(":api"))

	// Only eu.nordtal.jcore.config is used here, so jcore's JDBI/HikariCP/Flyway persistence layer is excluded below.
	implementation("com.github.nordtal:jcore:4.2.1") {
		exclude group: "org.jdbi"
		exclude group: "com.zaxxer"
		exclude group: "org.flywaydb"
		exclude group: "org.postgresql"
		exclude group: "org.apache.commons"
		exclude group: "commons-io"
	}

	// Paper resolves gson and snakeyaml itself from its libraries/ directory, so these stay compileOnly and out of the shaded jar; see the shadowJar block.
	compileOnly("com.google.code.gson:gson:2.14.0")
	compileOnly("org.yaml:snakeyaml:2.6")

	testImplementation(platform("org.junit:junit-bom:6.0.0"))
	testImplementation("org.junit.jupiter:junit-jupiter")
	testImplementation("com.tngtech.archunit:archunit-junit6:1.5.1")
	testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks {
	runServer {
		minecraftVersion("26.2")
		downloadPlugins {
			modrinth("packetevents", "2.13.0+spigot")
			hangar("PlaceholderAPI", "2.12.3")
			// TAB publishes several Modrinth versions numbered "6.1.2"; the id pins the 26.2 build.
			modrinth("tab-was-taken", "Za7G9fdJ")
		}
	}

	// shadowJar takes over the plain artifact name, so the thin jar moves out of the way to avoid a collision in build/libs.
	jar {
		archiveClassifier.set("thin")
	}

	shadowJar {
		// Gson, SnakeYAML and slf4j-api come from Paper at runtime; a bundled slf4j-api resolves no provider next to Paper's and silently drops logging.
		dependencies {
			exclude(dependency("com.google.code.gson:gson"))
			exclude(dependency("org.yaml:snakeyaml"))
			exclude(dependency("org.slf4j:slf4j-api"))
		}

		archiveClassifier.set("")
	}

	build {
		dependsOn(shadowJar)
	}
}

def targetJavaVersion = 25
java {
	def javaVersion = JavaVersion.toVersion(targetJavaVersion)
	sourceCompatibility = javaVersion
	targetCompatibility = javaVersion
	if (JavaVersion.current() <javaVersion) {
		toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'

	if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
		options.release.set(targetJavaVersion)
	}
}

tasks.withType(AbstractRun.class).configureEach {
	javaLauncher = javaToolchains.launcherFor {
		vendor = JvmVendorSpec.JETBRAINS
		languageVersion = JavaLanguageVersion.of(25)
	}
	jvmArgs("-XX:+AllowEnhancedClassRedefinition")
}

processResources {
	def props = [version: version]
	inputs.properties props
	filteringCharset 'UTF-8'
	filesMatching('paper-plugin.yml') {
		expand props
	}
}

// A source file Git ignores compiles here but does not exist on a fresh checkout, so the local build and CI would otherwise be two different programs.
allprojects { proj ->
	proj.plugins.withId('java') {
		def repositoryRoot = rootProject.layout.projectDirectory.asFile
		def sourceDirectories = proj.sourceSets.collect {
			it.allSource.srcDirs
		}.flatten()

		def checkSourcesTracked = proj.tasks.register('checkSourcesTracked') {
			group = 'verification'
			description = 'Fails when a source file is ignored by Git and therefore missing from the repository.'

			// .gitignore, the global ignore file and the index are inputs no task can declare, so there is no honest up-to-date check here.
			outputs.upToDateWhen { false }

			doLast {
				if (!new File(repositoryRoot, '.git').exists()) {
					return
				}
				def pathspecs = sourceDirectories.findAll { it.directory }
				.collect { dir ->
					repositoryRoot.toPath().relativize(dir.toPath()).collect {
						it.toString()
					}.join('/')
				}
				.sort()
				if (pathspecs.isEmpty()) {
					return
				}

				// Untracked and ignored: a tracked file that happens to match an ignore rule is still in the repository, which is all this cares about.
				def command = [
					'git',
					'ls-files',
					'--others',
					'--ignored',
					'--exclude-standard',
					'-z',
					'--'
				] + pathspecs
				def out = new StringBuilder()
				def err = new StringBuilder()
				def process = command.execute(null as List, repositoryRoot)
				process.waitForProcessOutput(out, err)
				if (process.exitValue() != 0) {
					throw new GradleException("`${command.join(' ')}` failed with exit code ${process.exitValue()}:\n${err}")
				}

				def ignored = out.toString().split('\u0000').findAll {
					!it.trim().isEmpty()
				}
				if (!ignored.isEmpty()) {
					throw new GradleException(
					"Git ignores these files, so they are not in the repository:\n" +
					ignored.collect { "    $it" }.join('\n') + "\n\n" +
					"They sit under a source directory of ${proj.path}, so this build sees them and a\n" +
					"build from a fresh checkout does not. Find the rule with\n" +
					"    git check-ignore -v <path>\n" +
					"and anchor it in .gitignore (`/*/run/`, never a bare `run/`), then `git add` the files.")
				}
			}
		}

		proj.tasks.named('check') { dependsOn(checkSourcesTracked) }
	}
}

// CONVENTIONS.md, as far as a tool can check it: `conventions.comments` enforces the comment and tracker-ID rules, `conventions.enforced` every rule.
def flag = { String name ->
	providers.gradleProperty(name).map {
		it.toBoolean()
	}.getOrElse(false)
}
def conventionsEnforced = flag('conventions.enforced')
def commentsEnforced = conventionsEnforced || flag('conventions.comments')

spotless {
	java {
		target('src/*/java/**/*.java', 'api/src/*/java/**/*.java')
		palantirJavaFormat('2.99.0')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	groovyGradle {
		target('*.gradle', 'api/*.gradle')
		greclipse()
	}
}

allprojects { proj ->
	proj.plugins.withId('java') {
		proj.apply plugin: 'checkstyle'
		proj.apply plugin: 'net.ltgt.errorprone'

		proj.dependencies {
			compileOnly('org.jspecify:jspecify:1.0.1')
			errorprone('com.google.errorprone:error_prone_core:2.50.0')
			errorprone('com.uber.nullaway:nullaway:0.14.2')
		}

		proj.checkstyle {
			toolVersion = '14.1.0'
			configFile = rootProject.file('config/checkstyle/checkstyle.xml')
			maxWarnings = 0
			ignoreFailures = !commentsEnforced
			showViolations = commentsEnforced
			configProperties = [
				apiDocSeverity: proj.path == ':api' ? 'error' : 'ignore',
				codeSeverity: conventionsEnforced ? 'error' : 'ignore',
			]
		}
		proj.tasks.named('checkstyleTest', Checkstyle) {
			configProperties = proj.checkstyle.configProperties + [apiDocSeverity: 'ignore']
		}

		proj.tasks.withType(JavaCompile).configureEach { task ->
			task.options.errorprone {
				enabled = conventionsEnforced
				disableWarningsInGeneratedCode = true
				// CONVENTIONS.md allows a doc comment of tags only when the name and tags say everything.
				disable('MissingSummary')
				check('NullAway', task.name == 'compileJava'
						? net.ltgt.gradle.errorprone.CheckSeverity.ERROR
						: net.ltgt.gradle.errorprone.CheckSeverity.OFF)
				option('NullAway:AnnotatedPackages', 'eu.nordtal')
			}
			if (conventionsEnforced) {
				task.options.compilerArgs.add('-Werror')
			}
		}

		proj.tasks.withType(Test).configureEach {
			useJUnitPlatform()
			systemProperty('conventions.enforced', conventionsEnforced)
		}
	}
}

// Issue-tracker IDs never go into the repository; the pattern lists every prefix the trackers used.
def trackerIdPattern = ~/\b(steward|season-2-ops|season-2-ingame|season-2-community|workspace)\/\d+\b|\bNT\d+-\d+\b/

def checkNoTrackerIds = tasks.register('checkNoTrackerIds') {
	group = 'verification'
	description = 'Fails when a tracked file mentions an issue-tracker ID.'
	outputs.upToDateWhen { false }
	def root = rootProject.layout.projectDirectory.asFile
	doLast {
		if (!new File(root, '.git').exists()) {
			return
		}
		def out = new StringBuilder()
		def process = ['git', 'ls-files', '-z'].execute(null as List, root)
		process.waitForProcessOutput(out, new StringBuilder())
		def hits = []
		out.toString().split('\u0000').findAll { !it.isBlank() }.each { path ->
			def file = new File(root, path)
			if (!file.file || file.length() > 1_000_000) {
				return
			}
			def text = file.getText('UTF-8')
			if (text.contains('\u0000')) {
				return
			}
			text.readLines().eachWithIndex { line, index ->
				def match = line =~ trackerIdPattern
				if (match.find()) {
					hits << "    ${path}:${index + 1}: ${match.group()}"
				}
			}
		}
		if (hits.isEmpty()) {
			return
		}
		if (commentsEnforced) {
			throw new GradleException("Issue-tracker IDs in the repository:\n" + hits.join('\n'))
		}
		logger.lifecycle("${hits.size()} issue-tracker IDs, not yet enforced.")
	}
}

tasks.named('check') { dependsOn(checkNoTrackerIds) }
