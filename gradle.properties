# Single source of truth for the version of every season 2 artifact; a release tags `v<this>`.
version=0.99.0
group=eu.nordtal

# The season number: the compose project nordtal-s<n>, the repository nordtal/season-<n>, the env file season-<n>.env.
# `forkSeason --to=<n>` rewrites every other spelling, and `checkSeasonNames` fails on one that disagrees.
season=2

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
# The wheel's turn holds every variant it tries in memory; on Gradle 9.9 the parallel build outgrows the default 512 MiB.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

conventions.root.comments=true
