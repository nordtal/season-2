# Every external version used anywhere in this build lives here.
[versions]
# Paper dropped the -R0.1-SNAPSHOT suffix with the 26.x version scheme.
paper = "26.2.build.121-stable"
# Tracks the build Fill ships in the 4.0.0 family the proxy follows.
velocity = "4.2.0"
# :display-tags compiles against these; the servers install PacketEvents, the other two are optional.
packetevents = "2.13.0"
placeholderapi = "2.12.3"
tab-api = "6.1.2"
jda = "6.7.0"
bunq = "1.28.0.6"
# steward-bunq compiles a patched bunq SDK class against OkHttp; the SDK, built on OkHttp 3, runs on this through it.
okhttp = "5.5.0"
guava = "33.7.2-jre"
logback = "1.6.5"
adventure = "5.2.0"
lombok = "1.18.48"
annotations = "26.1.0"
postgresql = "42.7.13"
# :common takes JDBI and HikariCP compileOnly; each process declares them once.
jdbi = "3.55.0"
hikaricp = "7.1.0"
# Tests apply the real migration files with it; at runtime only steward-agent migrates.
flyway = "13.9.0"
# API only; :common never binds a backend.
slf4j = "2.0.20"
# The postgresql module only; its junit-jupiter module targets JUnit 5.
testcontainers = "1.21.4"
# In-memory filesystem for ownership tests, which a real one only allows as root.
jimfs = "1.3.2"
# :common's tests parse the font files with it. Paper's version, never shaded.
gson = "2.14.0"
# Tests read compose.yml with it. Paper's version, never shaded.
snakeyaml = "2.7"
# The web layer of steward and steward-agent; its JSON mapper is gson, as in :spec.
javalin = "7.2.3"
# Downloads a private Node under build/ for the frontend build.
node = "7.1.0"
# In :steward only, since it pulls Jackson; no maintained Jackson-free WebAuthn library exists.
webauthn = "2.10.0"
# compileOnly in :steward, only so the `JsonProcessingException` webauthn declares resolves.
jackson = "2.22.3"
# :steward's tests write authenticator answers; the version webauthn brings at runtime.
cbor = "4.5.6"
junit = "6.1.3"
shadow = "9.6.1"
runpaper = "3.1.0"
# Web Push for :steward; needs only the Kotlin runtime, no Bouncy Castle.
webpush = "1.3.0"
# The tools that check CONVENTIONS.md.
spotless = "8.10.3"
palantir-java-format = "2.99.0"
ktlint = "1.8.0"
checkstyle = "14.1.0"
errorprone-plugin = "5.1.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
jspecify = "1.0.1"
archunit = "1.5.1"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
packetevents = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
tab-api = { module = "com.github.NEZNAMY:TAB-API", version.ref = "tab-api" }
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
bunq-sdk = { module = "com.github.bunq:sdk_java", version.ref = "bunq" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
postgresql-driver = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
jdbi-core = { module = "org.jdbi:jdbi3-core", version.ref = "jdbi" }
jdbi-sqlobject = { module = "org.jdbi:jdbi3-sqlobject", version.ref = "jdbi" }
jdbi-postgres = { module = "org.jdbi:jdbi3-postgres", version.ref = "jdbi" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
webauthn-server-core = { module = "com.yubico:webauthn-server-core", version.ref = "webauthn" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
cbor = { module = "com.upokecenter:cbor", version.ref = "cbor" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
jimfs = { module = "com.google.jimfs:jimfs", version.ref = "jimfs" }
webpush = { module = "com.interaso:webpush", version.ref = "webpush" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
archunit-junit6 = { module = "com.tngtech.archunit:archunit-junit6", version.ref = "archunit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
# What :common's access API needs at runtime; :common takes it compileOnly, so every consumer must add it.
access-persistence = ["jdbi-core", "jdbi-sqlobject", "jdbi-postgres", "hikaricp", "slf4j-api"]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "runpaper" }
node = { id = "com.github.node-gradle.node", version.ref = "node" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
