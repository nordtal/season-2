# Every external version used anywhere in this build lives here.
# Verified 2026-08-29 against the publishing repository's maven-metadata.xml — re-check before bumping.
[versions]
# Paper dropped the -R0.1-SNAPSHOT suffix with the 26.x version scheme.
paper = "26.2.build.121-stable"
# velocity-api 4.1.1 is compiled for Java 25 and ships the @Plugin annotation processor
# that generates velocity-plugin.json.
velocity = "4.1.1"
# SimpleCloud's API is published only to repo.simplecloud.app/snapshots and is still 0.1.0.
# It must stay compileOnly and must never be shaded — the simplecloud-api platform plugin
# provides it at runtime.
simplecloud = "0.1.0-platform.54-dev.1.1-770dcc6"
# jcore is published from github.com/nordtal/jcore via JitPack; the coordinate version is the
# git tag. Only payments-bot uses it — see CLAUDE.md before adding it to a plugin.
# 2.0.0 dropped Hibernate/Morphia for JDBI 3 + HikariCP + Flyway on PostgreSQL and no longer
# exports a logging backend, so consumers declare logback themselves.
# 3.0.0 replaced the JSON config loader with commented YAML (a vendored, hardened Spec) and
# dropped jackson-databind entirely, adding gson and snakeyaml instead. Verified 2026-08-30.
jcore = "3.0.0"
jda = "6.0.0-rc.4"
bunq = "1.28.0.6"
guava = "33.6.0-jre"
logback = "1.5.18"
adventure = "5.2.0"
lombok = "1.18.40"
annotations = "26.0.2"
# PostgreSQL JDBC driver. jcore already carries it as a runtime dependency; payments-bot
# declares it so the version is visible here rather than implied by jcore's POM.
postgresql = "42.7.13"
# JDBI, HikariCP and Flyway are pinned to exactly what jcore 3.0.0 depends on (checked against
# jcore's build.gradle.kts on 2026-08-30). :common needs the first two directly for the access
# API and must NOT pull jcore in to get them - a Paper plugin cannot carry the bot's ~33 MB
# dependency block. Keeping the versions identical means the bot, which has both on its
# classpath, resolves one copy rather than two.
jdbi = "3.54.0"
hikaricp = "7.1.0"
# Flyway is a test-only dependency of :common: the access schema is owned by payments-bot's
# db/migration and applied there by jcore's Database, but :common's integration tests apply the
# same migration themselves so they test the real DDL rather than a copy.
flyway = "13.4.0"
# slf4j-api only - :common never binds a backend. jdbi3-core pulls the same artifact transitively;
# it is declared so the version is visible here.
slf4j = "2.0.18"
# Testcontainers: only the postgresql module, driven manually from @BeforeAll. The
# junit-jupiter module is deliberately not used - it is built against JUnit 5 and this
# repo is on the JUnit 6 BOM.
testcontainers = "1.21.4"
junit = "6.0.0"
shadow = "9.6.1"
runpaper = "3.1.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
simplecloud-api = { module = "app.simplecloud.api:api", version.ref = "simplecloud" }
jcore = { module = "com.github.nordtal:jcore", version.ref = "jcore" }
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
bunq-sdk = { module = "com.github.bunq:sdk_java", version.ref = "bunq" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
postgresql-driver = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
jdbi-core = { module = "org.jdbi:jdbi3-core", version.ref = "jdbi" }
jdbi-sqlobject = { module = "org.jdbi:jdbi3-sqlobject", version.ref = "jdbi" }
jdbi-postgres = { module = "org.jdbi:jdbi3-postgres", version.ref = "jdbi" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
# The runtime stack the access API in :common needs. :common itself declares these compileOnly,
# so a module that never touches the database stays a 20 KB jar. Every consumer of
# eu.nordtal.s2.common.access adds this bundle - and gets a NoClassDefFoundError at runtime if it
# forgets, which is the deliberate trade for not shading 3 MB into plugins that have no use for it.
access-persistence = ["jdbi-core", "jdbi-sqlobject", "jdbi-postgres", "hikaricp", "slf4j-api"]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "runpaper" }
