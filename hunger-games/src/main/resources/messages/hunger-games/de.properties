# hunger-games - Deutsch. Fehlt ein Schlüssel hier, fällt er auf Englisch zurück; siehe en.properties.
#
# Parameter sind benannt und in geschweiften Klammern geschrieben, ersetzt durch
# eu.nordtal.s2.common.message.Messages. Siehe docs/hunger-games.md für das Konzept.

# ---------------------------------------------------------------- /hg start
hg.start.countdown=<#b08a4a>Das Spiel beginnt in <white>{seconds}</white> Sekunden.</#b08a4a> <gray>Bleib an deiner Position.</gray>
hg.start.released=<#8ba888>Los!</#8ba888> <gray>Friendly Fire ist aktiv. Du bist für \
  <white>{seconds}</white> Sekunden vor anderen Spielern geschützt.</gray>

# ---------------------------------------------------------------- lobby / ready
hg.lobby.broadcast=<gray>Die Hunger Games starten, sobald alle bereit sind. \
  <white>{ready}</white>/<white>{total}</white> Teams bereit.</gray> <_link>
hg.lobby.ready-link=<#8ba888>[Ich habe die Regeln gelesen und bin bereit]</#8ba888>
hg.lobby.ready-set=<#8ba888>Du bist als bereit markiert.</#8ba888>
hg.lobby.not-registered=<#a8888b>Du bist nicht für die Hunger Games registriert.</#a8888b> <gray>Es gibt \
  also nichts als bereit zu markieren - registriere dich zuerst in Discord.</gray>
# Written and translated, deliberately NOT sent to players (decided 2026-09-01). LobbyMaps
# logs a missing map to the console instead: the file is an operator's mistake, not a
# player's, and the map frames are simply blank until it is fixed. Kept here because the
# decision could go the other way once the lobby is actually built.
hg.lobby.map-missing=Das Lobby-Kartenbild für deine Sprache konnte nicht geladen werden; die \
  Kartenanzeige ist bis zur Ergänzung nicht verfügbar.

# ---------------------------------------------------------------- ready-status command

# ---------------------------------------------------------------- teams / colours
hg.team.demoted=<#b08a4a>Der Partner deines Teams ist vor dem Countdown nie beigetreten.</#b08a4a> \
  <gray><white>{team}</white> spielt nun solo mit vollen Herzen weiter.</gray>

# ---------------------------------------------------------------- loot
hg.loot.refill=<#8ba888>Die Beute an allen erreichbaren Punkten wurde aufgefüllt!</#8ba888>
# Written and translated, deliberately NOT sent to players (decided 2026-09-01). LootRefill
# skips a point the border has cut off in silence, because at four refills a game and a
# shrinking border this would become one line per lost point per refill. Kept for the case
# where the rehearsal shows players cannot tell a lost point from an unlucky one.
hg.loot.point-lost=Der Beutepunkt "{label}" wurde von der Grenze abgeschnitten und ist verloren.

# ---------------------------------------------------------------- border
hg.border.shrink-started=<#b08a4a>Die Grenze schrumpft!</#b08a4a> <gray>Sie erreicht <white>{target}</white> Blöcke in <white>{seconds}</white> Sekunden.</gray>
hg.border.passive-shrink-started=<#b08a4a>Es ist eine Weile nichts passiert</#b08a4a> <gray>- die Grenze \
  beginnt eine langsame, stetige Verkleinerung.</gray>

# ---------------------------------------------------------------- winning / ceremony
hg.win.player=<#b08a4a>{icon}</#b08a4a> <#b08a4a><bold><white>{winner}</white> hat die Hunger Games gewonnen!</bold></#b08a4a>
hg.win.tie-broken=<#b08a4a>Die letzten beiden Überlebenden sind im selben Moment gestorben.</#b08a4a> \
  <gray><white>{winner}</white> gewinnt durch die Kill-Wertung (<white>{winnerKills}</white> zu <white>{loserKills}</white> Kills).</gray>
hg.win.no-winner=<#a8888b>Die letzten beiden Überlebenden sind im selben Moment mit gleich vielen \
  Kills (<white>{kills}</white> je) gestorben.</#a8888b> <gray>Diesmal gibt es keinen Sieger.</gray>
hg.win.same-team-final-two=<#b08a4a>Die letzten beiden Überlebenden sind im selben Team.</#b08a4a> \
  <gray>Friendly Fire war von Anfang an aktiv - ihr müsst jetzt gegeneinander antreten.</gray>
hg.ceremony.header=<#b08a4a>--- Hunger-Games-Auswertung ---</#b08a4a>
hg.ceremony.no-winner=<gray>Kein Sieger in diesem Spiel.</gray>
hg.ceremony.kills=<gray><white>{player}</white> - <white>{kills}</white> Kills</gray>
hg.ceremony.footer=<gray>Der Admin schaltet die Phase auf <white>SMP</white>, sobald es soweit ist.</gray>

# ---------------------------------------------------------------- HUD
hg.hud.players=Lebend {alive}  Tot {dead}
hg.hud.loot=Nächste Auffüllung in {time}
hg.hud.loot-none=Keine weiteren Auffüllungen geplant
hg.hud.border-shrinking={time} verbleibend, {distance}m bis zum Schließen
hg.hud.border-stable=Grenze stabil

# ---------------------------------------------------------------- /hg reload

# ---------------------------------------------------------------- Tabliste
# Absichtlich OHNE Präfix und Byte für Byte identisch mit smp und limbo: die Tabliste ist die eine
# Fläche, die ein Spieler unverändert über alle drei Server mitnimmt - drei Fassungen davon wären
# drei Fassungen eines Bildes. TabListTest in :common hält die drei zusammen. Die Komposition steht
# in eu.nordtal.s2.common.hud.TabList; {logo} ist Glyphs.LOGO_HEIGHT_32, ein Private-Use-Codepoint,
# der absichtlich nicht in dieser Datei steht. MiniMessage, also ist <newline> der Zeilenumbruch.
tab.header=<newline>{logo}<newline><#4a63d8>nordtal.eu</#4a63d8> <dark_gray>|</dark_gray> <white>Staffel 2</white><newline>
tab.footer=<newline><gray>{online}<dark_gray>/</dark_gray>{max} online</gray><newline><#4a63d8>nordtal.eu</#4a63d8>
