# hunger-games, Deutsch. Ein fehlender Schlüssel fällt auf en.properties zurück.
# Parameter in geschweiften Klammern ersetzt eu.nordtal.season.messages.Messages.

# /hg start
hg.start.countdown=<warn>Das Spiel startet in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} \
  other {Sekunden}}.</warn> <muted>Bleib, wo du bist.</muted>
hg.start.released=<good>Los!</good> <muted>Friendly Fire ist an. Andere Spieler können dich \
  <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}} lang nicht \
  verletzen.</muted>

# lobby / ready
hg.lobby.rules=<brand><bold>Regeln der Hunger Games</bold></brand> <newline><muted>Spiel fair, egal ob du \
  gewinnst oder verlierst. Wer als Letzter überlebt, gewinnt die Runde.</muted>
hg.lobby.broadcast=<muted>Die Hunger Games starten, sobald alle Teams bereit sind. \
  <emphasis>{ready}</emphasis>/<emphasis>{total}</emphasis> {total, plural, one {Team} other {Teams}} \
  bereit.</muted> <action:confirm><good>[Ich habe die Regeln gelesen und bin bereit]</good></action>
hg.lobby.ready-set=<good>Du bist bereit.</good>
hg.lobby.not-registered=<bad>Du bist nicht für die Hunger Games registriert.</bad> <muted>Registriere dich \
  zuerst in Discord.</muted>

# teams / colours
hg.team.demoted=<warn>Dein Teampartner ist vor dem Countdown nicht beigetreten.</warn> \
  <muted><emphasis>{team.name}</emphasis> spielt allein mit vollen Herzen weiter.</muted>

# loot
hg.loot.refill=<good>Die Beute ist an allen erreichbaren Punkten aufgefüllt.</good>

# border
hg.border.shrink-started=<warn>Die Grenze schrumpft.</warn> <muted>Sie erreicht \
  <emphasis>{target}</emphasis> Blöcke in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} \
  other {Sekunden}}.</muted>
hg.border.passive-shrink-started=<warn>Lange ist nichts passiert.</warn> <muted>Die Grenze schrumpft jetzt \
  langsam.</muted>

# winning / ceremony
hg.win.player=<accent><glyph:announce></accent> <accent><bold><emphasis>{winner.name}</emphasis> hat die Hunger Games gewonnen!</bold></accent>
hg.win.tie-broken=<warn>Die letzten beiden Überlebenden sind im selben Moment gestorben.</warn> \
  <muted><emphasis>{winner.name}</emphasis> gewinnt mit mehr Kills (<emphasis>{winnerKills}</emphasis> zu \
  <emphasis>{loserKills}</emphasis>).</muted>
hg.win.no-winner=<bad>Die letzten beiden Überlebenden sind im selben Moment mit gleich vielen Kills \
  (<emphasis>{kills}</emphasis> je) gestorben.</bad> <muted>Diesmal gewinnt niemand.</muted>
hg.win.same-team-final-two=<warn>Die letzten beiden Überlebenden sind im selben Team.</warn> <muted>Friendly \
  Fire ist an. Ihr kämpft jetzt gegeneinander.</muted>
hg.ceremony.header=<accent><bold>Hunger-Games-Auswertung</bold></accent>
hg.ceremony.no-winner=<muted>Niemand hat dieses Spiel gewonnen.</muted>
hg.ceremony.kills=<muted><emphasis>{player.name}</emphasis>: <emphasis>{kills}</emphasis> {kills, plural, one {Kill} other {Kills}}</muted>
hg.ceremony.footer=<muted>Ein Admin schaltet als Nächstes die Phase auf <emphasis>SMP</emphasis>.</muted>

# HUD
hg.hud.alive=Lebend {alive}
hg.hud.dead=Tot {dead}
hg.hud.loot=Nächste Auffüllung in {time, duration, clock}
hg.hud.loot-none=Keine Auffüllungen mehr
hg.hud.border-shrinking=Noch {time, duration, clock}, {distance}m bis zum Schließen
hg.hud.border-stable=Grenze stabil

# Ein Körper, getötet während sein Besitzer offline ist; Vanilla schreibt dafür keine Todesmeldung.
hg.death.body=<bad><glyph:death></bad> <muted>{player.name} wurde offline eliminiert.</muted>
hg.death.body.by=<bad><glyph:death></bad> <muted>{player.name} wurde offline von {killer.name} \
  eliminiert.</muted>

# Antworten auf der Konsole
hg.admin.started=Die Hunger Games starten. {count, plural, one {# Teilnehmer wird zu seinem Spawn-Turm} \
  other {# Teilnehmer werden zu ihren Spawn-Türmen}} teleportiert.
hg.admin.ready-header=Team-Bereitschaft:
hg.admin.ready-line={team.name}: {ready, select, true {bereit} other {nicht bereit}}
