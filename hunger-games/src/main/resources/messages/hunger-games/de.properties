# hunger-games, Deutsch. Ein fehlender Schlüssel fällt auf en.properties zurück.
# Parameter in geschweiften Klammern ersetzt eu.nordtal.season.messages.Messages.

# /hg start
hg.start.countdown=<warn>Das Spiel beginnt in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}}.</warn> <muted>Bleib an deiner Position.</muted>
hg.start.released=<good>Los!</good> <muted>Friendly Fire ist aktiv. Du bist für \
  <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}} vor anderen Spielern geschützt.</muted>

# lobby / ready
hg.lobby.broadcast=<muted>Die Hunger Games starten, sobald alle bereit sind. \
  <emphasis>{ready}</emphasis>/<emphasis>{total}</emphasis> {total, plural, one {Team} other {Teams}} bereit.</muted> <action:confirm><good>[Ich habe die Regeln gelesen und bin bereit]</good></action>
hg.lobby.ready-set=<good>Du bist als bereit markiert.</good>
hg.lobby.not-registered=<bad>Du bist nicht für die Hunger Games registriert.</bad> <muted>Es gibt \
  also nichts als bereit zu markieren. Registriere dich zuerst in Discord.</muted>
# Nur in der Konsole: eine fehlende Karte ist ein Fehler des Betreibers, die Rahmen bleiben leer.
hg.lobby.map-missing=Das Lobby-Kartenbild für deine Sprache konnte nicht geladen werden; die \
  Kartenanzeige ist bis zur Ergänzung nicht verfügbar.

# teams / colours
hg.team.demoted=<warn>Der Partner deines Teams ist vor dem Countdown nie beigetreten.</warn> \
  <muted><emphasis>{team.name}</emphasis> spielt nun solo mit vollen Herzen weiter.</muted>

# loot
hg.loot.refill=<good>Die Beute an allen erreichbaren Punkten wurde aufgefüllt!</good>
# Nur in der Konsole: sonst wäre das eine Zeile pro verlorenem Punkt und Auffüllung.
hg.loot.point-lost=Der Beutepunkt "{label}" wurde von der Grenze abgeschnitten und ist verloren.

# border
hg.border.shrink-started=<warn>Die Grenze schrumpft!</warn> <muted>Sie erreicht <emphasis>{target}</emphasis> Blöcke in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}}.</muted>
hg.border.passive-shrink-started=<warn>Es ist eine Weile nichts passiert</warn> <muted>Die Grenze \
  beginnt eine langsame, stetige Verkleinerung.</muted>

# winning / ceremony
hg.win.player=<accent><glyph:announce></accent> <accent><bold><emphasis>{winner.name}</emphasis> hat die Hunger Games gewonnen!</bold></accent>
hg.win.tie-broken=<warn>Die letzten beiden Überlebenden sind im selben Moment gestorben.</warn> \
  <muted><emphasis>{winner.name}</emphasis> gewinnt durch die Kill-Wertung (<emphasis>{winnerKills}</emphasis> zu <emphasis>{loserKills}</emphasis> Kills).</muted>
hg.win.no-winner=<bad>Die letzten beiden Überlebenden sind im selben Moment mit gleich vielen \
  Kills (<emphasis>{kills}</emphasis> je) gestorben.</bad> <muted>Diesmal gibt es keinen Sieger.</muted>
hg.win.same-team-final-two=<warn>Die letzten beiden Überlebenden sind im selben Team.</warn> \
  <muted>Friendly Fire war von Anfang an aktiv: ihr müsst jetzt gegeneinander antreten.</muted>
hg.ceremony.header=<accent><bold>Hunger-Games-Auswertung</bold></accent>
hg.ceremony.no-winner=<muted>Kein Sieger in diesem Spiel.</muted>
hg.ceremony.kills=<muted><emphasis>{player.name}</emphasis>: <emphasis>{kills}</emphasis> {kills, plural, one {Kill} other {Kills}}</muted>
hg.ceremony.footer=<muted>Der Admin schaltet die Phase auf <emphasis>SMP</emphasis>, sobald es soweit ist.</muted>

# HUD
hg.hud.alive=Lebend {alive}
hg.hud.dead=Tot {dead}
hg.hud.loot=Nächste Auffüllung in {time, duration, clock}
hg.hud.loot-none=Keine weiteren Auffüllungen geplant
hg.hud.border-shrinking={time, duration, clock} verbleibend, {distance}m bis zum Schließen
hg.hud.border-stable=Grenze stabil

# Tabliste
tab.footer=<newline><muted>{online}<faint>/</faint>{max} online</muted><newline><brand>nordtal.eu</brand>

# Ein Körper, getötet während sein Besitzer offline ist; Vanilla schreibt dafür keine Todesmeldung.
hg.death.body=<bad><glyph:death></bad> <muted>{player.name} wurde im Offline-Zustand ausgeschieden.</muted>
hg.death.body.by=<bad><glyph:death></bad> <muted>{player.name} wurde von {killer.name} im Offline-Zustand ausgeschieden.</muted>

# Antworten auf der Konsole
hg.admin.started=Das Hunger-Games-Event startet! {count, plural, one {# Teilnehmer wird zu seinem \
  Spawn-Turm} other {# Teilnehmer werden zu ihren Spawn-Türmen}} teleportiert.
hg.admin.ready-header=Team-Bereitschaft:
hg.admin.ready-line={team.name}: {ready, select, true {bereit} other {nicht bereit}}
