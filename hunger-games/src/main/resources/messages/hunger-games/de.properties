# hunger-games - Deutsch. Fehlt ein Schlüssel hier, fällt er auf Englisch zurück; siehe en.properties.
#
# Parameter sind benannt und in geschweiften Klammern geschrieben, ersetzt durch
# eu.nordtal.s2.common.message.Messages. Siehe docs/hunger-games.md für das Konzept.

# ---------------------------------------------------------------- /hg start
hg.start.not-admin=Du hast keine Berechtigung, die Hunger Games zu starten.
hg.start.no-game=Es ist gerade kein Hunger-Games-Event registriert.
hg.start.wrong-state=Das Event kann in seinem aktuellen Zustand ({state}) nicht gestartet werden.
hg.start.below-hard-minimum=Es werden mindestens {minimum} Teilnehmer benötigt - darunter teilt \
  die Grenzverkleinerung durch null. Nur {count} sind registriert und anwesend.
hg.start.below-soft-minimum=Nur {count} Teilnehmer sind registriert und anwesend, unter dem \
  empfohlenen Minimum von {minimum}. Führe "/hg start confirm" innerhalb von {seconds} Sekunden \
  aus, um trotzdem zu starten.
hg.start.confirm-expired=Das Bestätigungsfenster ist abgelaufen. Führe "/hg start" erneut aus.
hg.start.started=Das Hunger-Games-Event startet! {count} Teilnehmer werden zu ihren Spawn-Türmen \
  teleportiert.
hg.start.countdown=Das Spiel beginnt in {seconds} Sekunden. Bleib an deiner Position.
hg.start.released=Los! Friendly Fire ist aktiv. Du bist für {seconds} Sekunden vor anderen \
  Spielern geschützt.

# ---------------------------------------------------------------- lobby / ready
hg.lobby.broadcast=Die Hunger Games starten, sobald alle bereit sind. {ready}/{total} Teams \
  bereit. {link}
hg.lobby.ready-link=[Ich habe die Regeln gelesen und bin bereit]
hg.lobby.ready-set=Du bist als bereit markiert.
hg.lobby.not-registered=Du bist nicht für die Hunger Games registriert, es gibt also nichts als \
  bereit zu markieren. Registriere dich zuerst in Discord.
# Written and translated, deliberately NOT sent to players (decided 2026-09-01). LobbyMaps
# logs a missing map to the console instead: the file is an operator's mistake, not a
# player's, and the map frames are simply blank until it is fixed. Kept here because the
# decision could go the other way once the lobby is actually built.
hg.lobby.map-missing=Das Lobby-Kartenbild für deine Sprache konnte nicht geladen werden; die \
  Kartenanzeige ist bis zur Ergänzung nicht verfügbar.

# ---------------------------------------------------------------- ready-status command
hg.ready-status.header=Team-Bereitschaft:
hg.ready-status.line={team} - {status}
hg.ready-status.ready=bereit
hg.ready-status.not-ready=nicht bereit

# ---------------------------------------------------------------- teams / colours
hg.team.demoted=Der Partner deines Teams ist vor dem Countdown nie beigetreten. {team} spielt nun \
  solo mit vollen Herzen weiter.

# ---------------------------------------------------------------- loot
hg.loot.refill=Die Beute an allen erreichbaren Punkten wurde aufgefüllt!
# Written and translated, deliberately NOT sent to players (decided 2026-09-01). LootRefill
# skips a point the border has cut off in silence, because at four refills a game and a
# shrinking border this would become one line per lost point per refill. Kept for the case
# where the rehearsal shows players cannot tell a lost point from an unlucky one.
hg.loot.point-lost=Der Beutepunkt "{label}" wurde von der Grenze abgeschnitten und ist verloren.

# ---------------------------------------------------------------- border
hg.border.shrink-started=Die Grenze schrumpft! Sie erreicht {target} Blöcke in {seconds} Sekunden.
hg.border.passive-shrink-started=Es ist eine Weile nichts passiert - die Grenze beginnt eine \
  langsame, stetige Verkleinerung.

# ---------------------------------------------------------------- winning / ceremony
hg.win.player=<bold>{winner}</bold> hat die Hunger Games gewonnen!
hg.win.tie-broken=Die letzten beiden Überlebenden sind im selben Moment gestorben. {winner} \
  gewinnt durch die Kill-Wertung ({winnerKills} zu {loserKills} Kills).
hg.win.no-winner=Die letzten beiden Überlebenden sind im selben Moment mit gleich vielen Kills \
  ({kills} je) gestorben. Diesmal gibt es keinen Sieger.
hg.win.same-team-final-two=Die letzten beiden Überlebenden sind im selben Team. Friendly Fire war \
  von Anfang an aktiv - ihr müsst jetzt gegeneinander antreten.
hg.ceremony.header=--- Hunger-Games-Auswertung ---
hg.ceremony.no-winner=Kein Sieger in diesem Spiel.
hg.ceremony.kills={player} - {kills} Kills
hg.ceremony.footer=Der Admin schaltet die Phase auf SMP, sobald es soweit ist.

# ---------------------------------------------------------------- HUD
hg.hud.players=Lebend {alive}  Tot {dead}
hg.hud.loot=Nächste Auffüllung in {time}
hg.hud.loot-none=Keine weiteren Auffüllungen geplant
hg.hud.border-shrinking={time} verbleibend, {distance}m bis zum Schließen
hg.hud.border-stable=Grenze stabil

# ---------------------------------------------------------------- /hg reload
hg.admin.reloaded=Die Nachrichten und sounds.yml wurden neu geladen. config.yml wird absichtlich \
  nicht neu gelesen: ein laufendes Spiel ist eine laufende Uhr.
hg.admin.reload-failed=Es konnte nicht alles neu geladen werden; was fehlschlug, bleibt \
  unverändert. Welche Hälfte und warum, steht in der Konsole.

# ---------------------------------------------------------------- Tabliste
# Absichtlich OHNE Präfix und Byte für Byte identisch mit smp und limbo: die Tabliste ist die eine
# Fläche, die ein Spieler unverändert über alle drei Server mitnimmt - drei Fassungen davon wären
# drei Fassungen eines Bildes. TabListTest in :common hält die drei zusammen. Die Komposition steht
# in eu.nordtal.s2.common.hud.TabList; {logo} ist Glyphs.LOGO_HEIGHT_32, ein Private-Use-Codepoint,
# der absichtlich nicht in dieser Datei steht. MiniMessage, also ist <newline> der Zeilenumbruch.
tab.header=<newline>{logo}<newline><gray>nordtal.eu</gray> <dark_gray>|</dark_gray> <white>Staffel 2</white><newline>
tab.footer=<newline><gray>{online}<dark_gray>/</dark_gray>{max} online</gray><newline><dark_gray>nordtal.eu</dark_gray>
