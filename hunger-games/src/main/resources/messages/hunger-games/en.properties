# hunger-games, English. The fallback for every other language, so keep it complete.
# Parameters in braces are substituted by eu.nordtal.season.messages.Messages.

# /hg start
hg.start.countdown=<warn>The game begins in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn> <muted>Hold your position.</muted>
hg.start.released=<good>Go!</good> <muted>Friendly fire is on. You are protected from other \
  players for <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</muted>

# lobby / ready
hg.lobby.broadcast=<muted>The hunger games start once everybody is ready. \
  <emphasis>{ready}</emphasis>/<emphasis>{total}</emphasis> {total, plural, one {team} other {teams}} ready.</muted> <action:confirm><good>[I have read the rules and I am ready]</good></action>
hg.lobby.ready-set=<good>You are marked as ready.</good>
hg.lobby.not-registered=<bad>You are not registered for the hunger games.</bad> <muted>There is \
  nothing to mark ready. Register in Discord first.</muted>
# Console only: a missing map is an operator's mistake, and the frames stay blank until it is fixed.
hg.lobby.map-missing=The lobby map image for your language could not be loaded; the map display \
  is unavailable until it is added.

# teams / colours
hg.team.demoted=<warn>Your team's partner never joined before the countdown.</warn> \
  <muted><emphasis>{team.name}</emphasis> continues as a solo team with full hearts.</muted>

# loot
hg.loot.refill=<good>Loot has been restocked at all reachable points!</good>
# Console only: otherwise this is one line per lost point per refill.
hg.loot.point-lost=The loot point "{label}" has been cut off by the border and is gone.

# border
hg.border.shrink-started=<warn>The border is shrinking!</warn> <muted>It will reach \
  <emphasis>{target}</emphasis> blocks in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</muted>
hg.border.passive-shrink-started=<warn>Nothing has happened for a while</warn> <muted>The border \
  begins a slow, steady shrink.</muted>

# winning / ceremony
hg.win.player=<accent><glyph:announce></accent> <accent><bold><emphasis>{winner.name}</emphasis> has won the hunger games!</bold></accent>
hg.win.tie-broken=<warn>The last two survivors died at the same moment.</warn> <muted><emphasis>{winner.name}</emphasis> \
  wins on the kill tiebreaker (<emphasis>{winnerKills}</emphasis> {winnerKills, plural, one {kill} other {kills}} to <emphasis>{loserKills}</emphasis>).</muted>
hg.win.no-winner=<bad>The last two survivors died at the same moment with equal kills \
  (<emphasis>{kills}</emphasis> each).</bad> <muted>There is no winner this time.</muted>
hg.win.same-team-final-two=<warn>The last two survivors are on the same team.</warn> <muted>Friendly \
  fire has been on from the start; you must now face each other.</muted>
hg.ceremony.header=<accent><bold>Hunger Games evaluation</bold></accent>
hg.ceremony.no-winner=<muted>No winner this game.</muted>
hg.ceremony.kills=<muted><emphasis>{player.name}</emphasis>: <emphasis>{kills}</emphasis> {kills, plural, one {kill} other {kills}}</muted>
hg.ceremony.footer=<muted>The admin will switch the phase to <emphasis>SMP</emphasis> when ready.</muted>

# HUD
hg.hud.alive=Alive {alive}
hg.hud.dead=Dead {dead}
hg.hud.loot=Next refill in {time, duration, clock}
hg.hud.loot-none=No more refills scheduled
hg.hud.border-shrinking={time, duration, clock} left, {distance}m to close
hg.hud.border-stable=Border stable

# tab list
tab.footer=<newline><muted>{online}<faint>/</faint>{max} online</muted><newline><brand>nordtal.eu</brand>

# A body killed while its owner is offline; vanilla writes no death message for it.
hg.death.body=<bad><glyph:death></bad> <muted>{player.name} was eliminated while offline.</muted>
hg.death.body.by=<bad><glyph:death></bad> <muted>{player.name} was eliminated by {killer.name} while offline.</muted>

# the console's answers
hg.admin.started=The hunger games event is starting! {count, plural, one {# participant is being \
  teleported to their spawn tower} other {# participants are being teleported to their spawn towers}}.
hg.admin.ready-header=Team readiness:
hg.admin.ready-line={team.name}: {ready, select, true {ready} other {not ready}}
