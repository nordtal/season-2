# hunger-games, English. The fallback for every other language, so keep it complete.
# Parameters in braces are substituted by eu.nordtal.season.messages.Messages.

# /hg start
hg.start.countdown=<warn>The game starts in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} \
  other {seconds}}.</warn> <muted>Stay where you are.</muted>
hg.start.released=<good>Go!</good> <muted>Friendly fire is on. Other players cannot hurt you for \
  <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</muted>

# lobby / ready
hg.lobby.rules=<brand><bold>Hunger Games rules</bold></brand> <newline><muted>Play fair, whether you win or \
  lose. The last survivor wins the round.</muted>
hg.lobby.broadcast=<muted>The Hunger Games start when all teams are ready. \
  <emphasis>{ready}</emphasis>/<emphasis>{total}</emphasis> {total, plural, one {team} other {teams}} \
  ready.</muted> <action:confirm><good>[I have read the rules and I am ready]</good></action>
hg.lobby.ready-set=<good>You are ready.</good>
hg.lobby.not-registered=<bad>You are not registered for the Hunger Games.</bad> <muted>Register in Discord \
  first.</muted>

# teams / colours
hg.team.demoted=<warn>Your partner did not join before the countdown.</warn> \
  <muted><emphasis>{team.name}</emphasis> plays alone with full hearts.</muted>

# loot
hg.loot.refill=<good>Loot is restocked at all reachable points.</good>

# border
hg.border.shrink-started=<warn>The border is shrinking.</warn> <muted>It reaches \
  <emphasis>{target}</emphasis> blocks in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} \
  other {seconds}}.</muted>
hg.border.passive-shrink-started=<warn>Nothing has happened for a while.</warn> <muted>The border starts to \
  shrink slowly.</muted>

# winning / ceremony
hg.win.player=<accent><glyph:announce></accent> <accent><bold><emphasis>{winner.name}</emphasis> has won the \
  Hunger Games!</bold></accent>
hg.win.tie-broken=<warn>The last two survivors died at the same moment.</warn> \
  <muted><emphasis>{winner.name}</emphasis> wins with more kills (<emphasis>{winnerKills}</emphasis> \
  {winnerKills, plural, one {kill} other {kills}} to <emphasis>{loserKills}</emphasis>).</muted>
hg.win.no-winner=<bad>The last two survivors died at the same moment with equal kills \
  (<emphasis>{kills}</emphasis> each).</bad> <muted>There is no winner this time.</muted>
hg.win.same-team-final-two=<warn>The last two survivors are on the same team.</warn> <muted>Friendly fire is \
  on. You fight each other now.</muted>
hg.ceremony.header=<accent><bold>Hunger Games evaluation</bold></accent>
hg.ceremony.no-winner=<muted>Nobody won this game.</muted>
hg.ceremony.kills=<muted><emphasis>{player.name}</emphasis>: <emphasis>{kills}</emphasis> {kills, plural, one {kill} other {kills}}</muted>
hg.ceremony.footer=<muted>An admin switches the phase to <emphasis>SMP</emphasis> next.</muted>

# HUD
hg.hud.alive=Alive {alive}
hg.hud.dead=Dead {dead}
hg.hud.loot=Next refill in {time, duration, clock}
hg.hud.loot-none=No more refills
hg.hud.border-shrinking={time, duration, clock} left, {distance}m to close
hg.hud.border-stable=Border stable

# A body killed while its owner is offline; vanilla writes no death message for it.
hg.death.body=<bad><glyph:death></bad> <muted>{player.name} was eliminated while offline.</muted>
hg.death.body.by=<bad><glyph:death></bad> <muted>{player.name} was eliminated by {killer.name} while offline.</muted>

# the console's answers
hg.admin.started=The Hunger Games start. {count, plural, one {# participant is teleported to their spawn \
  tower} other {# participants are teleported to their spawn towers}}.
hg.admin.ready-header=Team readiness:
hg.admin.ready-line={team.name}: {ready, select, true {ready} other {not ready}}
