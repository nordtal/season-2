# hunger-games, English. The fallback for every other language, so keep it complete.
# Parameters in braces are substituted by eu.nordtal.s2.messages.Messages.

# ---------------------------------------------------------------- /hg start
hg.start.countdown=<#b08a4a>The game begins in <white>{seconds}</white> seconds.</#b08a4a> <gray>Hold your position.</gray>
hg.start.released=<#8ba888>Go!</#8ba888> <gray>Friendly fire is on. You are protected from other \
  players for <white>{seconds}</white> seconds.</gray>

# ---------------------------------------------------------------- lobby / ready
hg.lobby.broadcast=<gray>The hunger games start once everybody is ready. \
  <white>{ready}</white>/<white>{total}</white> teams ready.</gray> <_link>
hg.lobby.ready-link=<#8ba888>[I have read the rules and I am ready]</#8ba888>
hg.lobby.ready-set=<#8ba888>You are marked as ready.</#8ba888>
hg.lobby.not-registered=<#a8888b>You are not registered for the hunger games.</#a8888b> <gray>There is \
  nothing to mark ready - register in Discord first.</gray>
# Console only: a missing map is an operator's mistake, and the frames stay blank until it is fixed.
hg.lobby.map-missing=The lobby map image for your language could not be loaded; the map display \
  is unavailable until it is added.

# ---------------------------------------------------------------- teams / colours
hg.team.demoted=<#b08a4a>Your team's partner never joined before the countdown.</#b08a4a> \
  <gray><white>{team.name}</white> continues as a solo team with full hearts.</gray>

# ---------------------------------------------------------------- loot
hg.loot.refill=<#8ba888>Loot has been restocked at all reachable points!</#8ba888>
# Console only: otherwise this is one line per lost point per refill.
hg.loot.point-lost=The loot point "{label}" has been cut off by the border and is gone.

# ---------------------------------------------------------------- border
hg.border.shrink-started=<#b08a4a>The border is shrinking!</#b08a4a> <gray>It will reach \
  <white>{target}</white> blocks in <white>{seconds}</white> seconds.</gray>
hg.border.passive-shrink-started=<#b08a4a>Nothing has happened for a while</#b08a4a> <gray>- the border \
  begins a slow, steady shrink.</gray>

# ---------------------------------------------------------------- winning / ceremony
hg.win.player=<#b08a4a>{icon}</#b08a4a> <#b08a4a><bold><white>{winner.name}</white> has won the hunger games!</bold></#b08a4a>
hg.win.tie-broken=<#b08a4a>The last two survivors died at the same moment.</#b08a4a> <gray><white>{winner.name}</white> \
  wins on the kill tiebreaker (<white>{winnerKills}</white> kills to <white>{loserKills}</white>).</gray>
hg.win.no-winner=<#a8888b>The last two survivors died at the same moment with equal kills \
  (<white>{kills}</white> each).</#a8888b> <gray>There is no winner this time.</gray>
hg.win.same-team-final-two=<#b08a4a>The last two survivors are on the same team.</#b08a4a> <gray>Friendly \
  fire has been on from the start - you must now face each other.</gray>
hg.ceremony.header=<#b08a4a>--- Hunger Games evaluation ---</#b08a4a>
hg.ceremony.no-winner=<gray>No winner this game.</gray>
hg.ceremony.kills=<gray><white>{player.name}</white> - <white>{kills}</white> kills</gray>
hg.ceremony.footer=<gray>The admin will switch the phase to <white>SMP</white> when ready.</gray>

# ---------------------------------------------------------------- HUD
hg.hud.players=Alive {alive}  Dead {dead}
hg.hud.loot=Next refill in {time}
hg.hud.loot-none=No more refills scheduled
hg.hud.border-shrinking={time} left, {distance}m to close
hg.hud.border-stable=Border stable

# ---------------------------------------------------------------- tab list
# tab.header is byte-identical on all three servers (TabListTest); {logo} is Glyphs.LOGO_HEIGHT_32.
tab.header=<newline>{logo}<newline><#4a63d8>nordtal.eu</#4a63d8> <dark_gray>|</dark_gray> <white>Season 2</white><newline>
tab.footer=<newline><gray>{online}<dark_gray>/</dark_gray>{max} online</gray><newline><#4a63d8>nordtal.eu</#4a63d8>

# A body killed while its owner is offline; vanilla writes no death message for it.
hg.death.body=<#a8888b>{icon}</#a8888b> <gray><_player> was eliminated while offline.</gray>
hg.death.body.by=<#a8888b>{icon}</#a8888b> <gray><_player> was eliminated by <_killer> while offline.</gray>

# ---------------------------------------------------------------- the console's answers
hg.admin.started=The hunger games event is starting! {count} participants are being teleported to \
  their spawn towers.
hg.admin.ready-header=Team readiness:
hg.admin.ready-line={team.name} - {status}
hg.admin.ready=ready
hg.admin.not-ready=not ready
