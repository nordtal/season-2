# hunger-games - English. This file is the fallback for every other language: a key that is
# missing here shows up on screen as the key itself, so keep it complete.
#
# Parameters are named and written in braces, substituted by eu.nordtal.s2.common.message.Messages.
# See docs/hunger-games.md for the concept every message here belongs to.

# ---------------------------------------------------------------- /hg start
hg.start.not-admin=You do not have permission to start the hunger games.
hg.start.no-game=There is no hunger games event registered right now.
hg.start.wrong-state=The event cannot be started from its current state ({state}).
hg.start.below-hard-minimum=At least {minimum} participants are required to start - the border \
  step divides by zero below that. Only {count} are registered and present.
hg.start.below-soft-minimum=Only {count} participants are registered and present, below the \
  recommended minimum of {minimum}. Run "/hg start confirm" within {seconds} seconds to start \
  anyway.
hg.start.confirm-expired=The confirmation window has passed. Run "/hg start" again.
hg.start.started=The hunger games event is starting! {count} participants are being teleported to \
  their spawn towers.
hg.start.countdown=The game begins in {seconds} seconds. Hold your position.
hg.start.released=Go! Friendly fire is on. You are protected from other players for {seconds} \
  seconds.

# ---------------------------------------------------------------- lobby / ready
hg.lobby.broadcast=The hunger games start once everybody is ready. {ready}/{total} teams ready. \
  {link}
hg.lobby.ready-link=[I have read the rules and I am ready]
hg.lobby.ready-set=You are marked as ready.
hg.lobby.not-registered=You are not registered for the hunger games, so there is nothing to mark \
  ready. Register in Discord first.
# Written and translated, deliberately NOT sent to players (decided 2026-09-01). LobbyMaps
# logs a missing map to the console instead: the file is an operator's mistake, not a
# player's, and the map frames are simply blank until it is fixed. Kept here because the
# decision could go the other way once the lobby is actually built.
hg.lobby.map-missing=The lobby map image for your language could not be loaded; the map display \
  is unavailable until it is added.

# ---------------------------------------------------------------- ready-status command
hg.ready-status.header=Team readiness:
hg.ready-status.line={team} - {status}
hg.ready-status.ready=ready
hg.ready-status.not-ready=not ready

# ---------------------------------------------------------------- teams / colours
hg.team.demoted=Your team's partner never joined before the countdown. {team} continues as a solo \
  team with full hearts.

# ---------------------------------------------------------------- loot
hg.loot.refill=Loot has been restocked at all reachable points!
# Written and translated, deliberately NOT sent to players (decided 2026-09-01). LootRefill
# skips a point the border has cut off in silence, because at four refills a game and a
# shrinking border this would become one line per lost point per refill. Kept for the case
# where the rehearsal shows players cannot tell a lost point from an unlucky one.
hg.loot.point-lost=The loot point "{label}" has been cut off by the border and is gone.

# ---------------------------------------------------------------- border
hg.border.shrink-started=The border is shrinking! It will reach {target} blocks in {seconds} \
  seconds.
hg.border.passive-shrink-started=Nothing has happened for a while - the border begins a slow, \
  steady shrink.

# ---------------------------------------------------------------- winning / ceremony
hg.win.player=<bold>{winner}</bold> has won the hunger games!
hg.win.tie-broken=The last two survivors died at the same moment. {winner} wins on the kill \
  tiebreaker ({winnerKills} kills to {loserKills}).
hg.win.no-winner=The last two survivors died at the same moment with equal kills ({kills} each). \
  There is no winner this time.
hg.win.same-team-final-two=The last two survivors are on the same team. Friendly fire has been on \
  from the start - you must now face each other.
hg.ceremony.header=--- Hunger Games evaluation ---
hg.ceremony.no-winner=No winner this game.
hg.ceremony.kills={player} - {kills} kills
hg.ceremony.footer=The admin will switch the phase to SMP when ready.

# ---------------------------------------------------------------- HUD
hg.hud.players=Alive {alive}  Dead {dead}
hg.hud.loot=Next refill in {time}
hg.hud.loot-none=No more refills scheduled
hg.hud.border-shrinking={time} left, {distance}m to close
hg.hud.border-stable=Border stable

# ---------------------------------------------------------------- /hg reload
hg.admin.reloaded=The message bundles and sounds.yml were reloaded. config.yml is deliberately \
  not re-read: a running game is a running clock.
hg.admin.reload-failed=Not everything could be reloaded; whatever failed is unchanged. The \
  console says which half and why.

# ---------------------------------------------------------------- tab list
# Deliberately UNPREFIXED and byte-identical to smp's and limbo's: the tab list is one surface a
# player carries unchanged across all three servers, so three versions of it would be three
# versions of one picture. TabListTest in :common asserts the three agree. The composition is
# eu.nordtal.s2.common.hud.TabList; {logo} is Glyphs.LOGO_HEIGHT_32, a private-use code point that
# deliberately does not live in this file. MiniMessage, so <newline> is how a line break is written.
tab.header=<newline>{logo}<newline><gray>nordtal.eu</gray> <dark_gray>|</dark_gray> <white>Season 2</white><newline>
tab.footer=<newline><gray>{online}<dark_gray>/</dark_gray>{max} online</gray><newline><dark_gray>nordtal.eu</dark_gray>
