# Deutsche Texte des Warteraums, als UTF-8 gelesen. Ein fehlender Schlüssel fällt auf en.properties zurück.
# Ein Titel mit mehr als 40 Zeichen wird verkleinert.

# Das Resource-Pack des Spielers lädt.
limbo.wait.pack.title=<emphasis>Resource-Pack lädt</emphasis>
limbo.wait.pack.subtitle=<muted>Beim ersten Mal dauert es länger.</muted>

# Der Server der Phase ist nicht registriert oder antwortet nicht.
limbo.wait.backend.title=<accent>Warten auf den Server</accent>
limbo.wait.backend.subtitle=<muted>Du wirst verbunden, sobald er läuft.</muted>

# Ein Update läuft.
limbo.wait.update.title=<accent>Update läuft</accent>
limbo.wait.update.subtitle=<muted>Du wirst erneut verbunden, sobald es fertig ist.</muted>

# Der Server wurde ohne Update gestoppt.
limbo.wait.held.title=<accent>Der Server ist gestoppt</accent>
limbo.wait.held.subtitle=<muted>Du wirst erneut verbunden, sobald er läuft.</muted>

# Der Spieler wartet auf seinen Platz in der Schlange zum SMP.
limbo.wait.queue.title=<accent>Du bist gleich dran</accent>
limbo.wait.queue.subtitle=<muted>Der Server lässt einen Spieler nach dem anderen herein.</muted>

# Das Netzwerk ist in Wartung.
limbo.wait.maintenance.title=<brand>Nordtal</brand> <accent>ist in Wartung</accent>
limbo.wait.maintenance.subtitle=<muted>Bleib hier. Auf Discord steht, wann sie endet.</muted>

# Der Proxy hat noch keinen Grund gesendet.
limbo.wait.unknown.title=<emphasis>Einen Moment</emphasis>
limbo.wait.unknown.subtitle=<muted>Du wirst mit dem Netzwerk verbunden.</muted>

# Die Tabliste zeigt kein {online}/{max}, darum weicht dieser Text ab.
tab.footer=<newline><faint>Du wirst mit dem Netzwerk verbunden</faint>
