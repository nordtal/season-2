# limbo - Deutsch. Wird als UTF-8 gelesen, Umlaute gehören also direkt hierhin und nicht als
# \uXXXX-Escapes. Ein Schlüssel, der hier fehlt, fällt auf en.properties zurück.
#
# Beide Zeilen kurz halten: ein Titel wird groß und zentriert gezeichnet und bei Überlänge so weit
# verkleinert, bis er passt - auf einem schwarzen Bildschirm sieht das kaputt aus, nicht klein.

# ---------------------------------------------------------------- das Pack lädt
limbo.wait.pack.title=<white>Resource-Pack wird geladen</white>
limbo.wait.pack.subtitle=<gray>Nur beim ersten Mal dauert es kurz.</gray>

# ---------------------------------------------------------------- der Server der Phase ist nicht oben
limbo.wait.backend.title=<#b08a4a>Warten auf den Server</#b08a4a>
limbo.wait.backend.subtitle=<gray>Du wirst automatisch hinübergeschoben.</gray>

# ---------------------------------------------------------------- Wartung
limbo.wait.maintenance.title=<#4a63d8>nordtal</#4a63d8> <#b08a4a>ist in Wartung</#b08a4a>
limbo.wait.maintenance.subtitle=<gray>Bleib hier - auf Discord steht, wann es weitergeht.</gray>

# ---------------------------------------------------------------- der Proxy hat noch nichts gesagt
limbo.wait.unknown.title=<white>Einen Moment</white>
limbo.wait.unknown.subtitle=<gray>Du wirst gleich weitergeleitet.</gray>

# ---------------------------------------------------------------- /limbo reload
# Kein Titel: diese zwei gehen an den, der den Befehl ausgeführt hat - in der Praxis die Konsole.

# ---------------------------------------------------------------- Tabliste
# tab.header ist Byte für Byte identisch mit smp und hunger-games: die Tabliste ist die eine Fläche,
# die ein Spieler unverändert über alle drei Server mitnimmt. TabListTest in :common hält das fest.
# {logo} ist Glyphs.LOGO_HEIGHT_32, ein Private-Use-Codepoint, der absichtlich nicht hier steht.
#
# tab.footer ist die EINE der drei, die abweicht, und zwar mit Absicht. Hier ist jeder vor jedem
# versteckt, die Liste darüber trägt also genau einen Namen - den des Lesers - und "12/60 online"
# stünde direkt über einer Liste mit einem Eintrag. {online} und {max} werden übergeben und nicht
# benutzt; das ist der ganze Unterschied.
tab.header=<newline>{logo}<newline><#4a63d8>nordtal.eu</#4a63d8> <dark_gray>|</dark_gray> <white>Staffel 2</white><newline>
tab.footer=<newline><dark_gray>Du wirst mit dem Netzwerk verbunden</dark_gray>
