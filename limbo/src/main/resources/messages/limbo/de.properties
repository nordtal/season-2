# limbo, Deutsch. Als UTF-8 gelesen; ein fehlender Schlüssel fällt auf en.properties zurück.
# Beide Zeilen kurz halten: ein zu langer Titel wird verkleinert und sieht auf Schwarz kaputt aus.

# ---------------------------------------------------------------- das Pack lädt
limbo.wait.pack.title=<white>Resource-Pack wird geladen</white>
limbo.wait.pack.subtitle=<gray>Nur beim ersten Mal dauert es kurz.</gray>

# ---------------------------------------------------------------- der Server der Phase ist nicht oben
limbo.wait.backend.title=<#b08a4a>Warten auf den Server</#b08a4a>
limbo.wait.backend.subtitle=<gray>Du wirst automatisch hinübergeschoben.</gray>

# ---------------------------------------------------------------- ein Update läuft
limbo.wait.update.title=<#b08a4a>Update läuft</#b08a4a>
limbo.wait.update.subtitle=<gray>Gleich geht es automatisch weiter.</gray>

# ---------------------------------------------------------------- absichtlich gestoppt
limbo.wait.held.title=<#b08a4a>Der Server ist gestoppt</#b08a4a>
limbo.wait.held.subtitle=<gray>Jemand arbeitet daran. Du kommst automatisch zurück, sobald er läuft.</gray>

# ---------------------------------------------------------------- Wartung
limbo.wait.maintenance.title=<#4a63d8>nordtal</#4a63d8> <#b08a4a>ist in Wartung</#b08a4a>
limbo.wait.maintenance.subtitle=<gray>Bleib hier - auf Discord steht, wann es weitergeht.</gray>

# ---------------------------------------------------------------- der Proxy hat noch nichts gesagt
limbo.wait.unknown.title=<white>Einen Moment</white>
limbo.wait.unknown.subtitle=<gray>Du wirst gleich weitergeleitet.</gray>

# ---------------------------------------------------------------- Tabliste
# tab.header ist auf allen drei Servern Byte für Byte gleich (TabListTest); {logo} ist Glyphs.LOGO_HEIGHT_32.
# tab.footer weicht absichtlich ab: die Liste zeigt nur den Leser, also kein {online}/{max}.
tab.header=<newline>{logo}<newline><#4a63d8>nordtal.eu</#4a63d8> <dark_gray>|</dark_gray> <white>Staffel 2</white><newline>
tab.footer=<newline><dark_gray>Du wirst mit dem Netzwerk verbunden</dark_gray>
