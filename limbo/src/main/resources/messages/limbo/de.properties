# limbo, Deutsch. Als UTF-8 gelesen; ein fehlender Schlüssel fällt auf en.properties zurück.
# Beide Zeilen kurz halten: ein zu langer Titel wird verkleinert und sieht auf Schwarz kaputt aus.

# ---------------------------------------------------------------- das Pack lädt
limbo.wait.pack.title=<emphasis>Resource-Pack wird geladen</emphasis>
limbo.wait.pack.subtitle=<muted>Nur beim ersten Mal dauert es kurz.</muted>

# ---------------------------------------------------------------- der Server der Phase ist nicht oben
limbo.wait.backend.title=<accent>Warten auf den Server</accent>
limbo.wait.backend.subtitle=<muted>Du wirst automatisch hinübergeschoben.</muted>

# ---------------------------------------------------------------- ein Update läuft
limbo.wait.update.title=<accent>Update läuft</accent>
limbo.wait.update.subtitle=<muted>Gleich geht es automatisch weiter.</muted>

# ---------------------------------------------------------------- absichtlich gestoppt
limbo.wait.held.title=<accent>Der Server ist gestoppt</accent>
limbo.wait.held.subtitle=<muted>Jemand arbeitet daran. Du kommst automatisch zurück, sobald er läuft.</muted>

# ---------------------------------------------------------------- Wartung
limbo.wait.maintenance.title=<brand>nordtal</brand> <accent>ist in Wartung</accent>
limbo.wait.maintenance.subtitle=<muted>Bleib hier - auf Discord steht, wann es weitergeht.</muted>

# ---------------------------------------------------------------- der Proxy hat noch nichts gesagt
limbo.wait.unknown.title=<emphasis>Einen Moment</emphasis>
limbo.wait.unknown.subtitle=<muted>Du wirst gleich weitergeleitet.</muted>

# ---------------------------------------------------------------- Tabliste
