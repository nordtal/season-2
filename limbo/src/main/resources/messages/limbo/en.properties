# limbo, English. The fallback for every other language, so keep it complete.
# The whole interface of this server: one title and one subtitle per WaitReason (see LimboMessages).
# Keep both lines short: a long title is scaled down, which on a black screen reads as broken.

# The ordinary state of every login.
limbo.wait.pack.title=<white>Loading the resource pack</white>
limbo.wait.pack.subtitle=<gray>Only the first time takes a moment.</gray>

# The phase's server is not registered or not answering; it resolves itself when it comes up.
limbo.wait.backend.title=<#b08a4a>Waiting for the server</#b08a4a>
limbo.wait.backend.subtitle=<gray>You will be moved across automatically.</gray>

# After an update countdown; nobody has to reconnect, the sweep releases them once healthy.
limbo.wait.update.title=<#b08a4a>Update in progress</#b08a4a>
limbo.wait.update.subtitle=<gray>You will be moved back automatically.</gray>

# Stopped on purpose, not by an update, so there is no time to promise.
limbo.wait.held.title=<#b08a4a>The server is stopped</#b08a4a>
limbo.wait.held.subtitle=<gray>Somebody is working on it. You go back automatically when it is up.</gray>

# The one wait that does not end on its own, so it has to be worth reading for a while.
limbo.wait.maintenance.title=<#4a63d8>nordtal</#4a63d8> <#b08a4a>is under maintenance</#b08a4a>
limbo.wait.maintenance.subtitle=<gray>Stay here - Discord says when it is over.</gray>

# Before the proxy's message arrives, because a black screen with no text looks like a crash.
limbo.wait.unknown.title=<white>One moment</white>
limbo.wait.unknown.subtitle=<gray>Getting you onto the network.</gray>

# tab.header is byte-identical on all three servers (TabListTest); {logo} is Glyphs.LOGO_HEIGHT_32.
# tab.footer differs on purpose: the list holds only the reader, so it shows no {online}/{max}.
tab.header=<newline>{logo}<newline><#4a63d8>nordtal.eu</#4a63d8> <dark_gray>|</dark_gray> <white>Season {season.number}</white><newline>
tab.footer=<newline><dark_gray>Connecting you to the network</dark_gray>
