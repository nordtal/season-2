# English texts of the waiting room, and the fallback for every other language.
# Each WaitReason has a title and a subtitle (see LimboMessages).
# A title longer than 40 characters is scaled down.

# The player's resource pack is loading.
limbo.wait.pack.title=<emphasis>Loading the resource pack</emphasis>
limbo.wait.pack.subtitle=<muted>The first load takes longer.</muted>

# The server of the phase is not registered or does not answer.
limbo.wait.backend.title=<accent>Waiting for the server</accent>
limbo.wait.backend.subtitle=<muted>You will be connected as soon as it is up.</muted>

# An update is running.
limbo.wait.update.title=<accent>Update running</accent>
limbo.wait.update.subtitle=<muted>You will be reconnected when it is finished.</muted>

# The server was stopped without an update.
limbo.wait.held.title=<accent>The server is stopped</accent>
limbo.wait.held.subtitle=<muted>You will be reconnected as soon as it runs.</muted>

# The network is in maintenance.
limbo.wait.maintenance.title=<brand>Nordtal</brand> <accent>is in maintenance</accent>
limbo.wait.maintenance.subtitle=<muted>Stay here. Discord says when it ends.</muted>

# The proxy has sent no reason yet.
limbo.wait.unknown.title=<emphasis>One moment</emphasis>
limbo.wait.unknown.subtitle=<muted>You will be connected to the network.</muted>

# The tab list shows no {online}/{max}.
tab.footer=<newline><faint>You will be connected to the network</faint>
