# limbo - English. This file is the fallback for every other language: a key that is missing here
# shows up on screen as the key itself, so keep it complete.
#
# THIS FILE IS THE ENTIRE USER INTERFACE OF THIS SERVER. There is no chat, no world and no other
# player - one title and one subtitle, which is what these eight lines are.
#
# The key names come from eu.nordtal.s2.common.limbo.WaitReason: limbo.wait.<reason>.title and
# .subtitle, with <reason> the enum constant lowercased. Adding a reason there means adding two
# lines here and in every other language.
#
# Keep both lines SHORT. A title is drawn large and centred, and a long one is scaled down until it
# fits, which on a black screen reads as broken rather than as small.

# ---------------------------------------------------------------- the pack is downloading
# The ordinary state of every single login, and the reason this server exists at all.
limbo.wait.pack.title=<white>Loading the resource pack</white>
limbo.wait.pack.subtitle=<gray>Only the first time takes a moment.</gray>

# ---------------------------------------------------------------- the phase's backend is not up
# An accident rather than a decision: the server for the current phase is not registered on the
# proxy, or is not answering. It resolves itself the moment that server comes up.
limbo.wait.backend.title=<#b08a4a>Waiting for the server</#b08a4a>
limbo.wait.backend.subtitle=<gray>You will be moved across automatically.</gray>

# ---------------------------------------------------------------- the network is in MAINTENANCE
# The one reason that does not end on its own. Decided 2026-08-31: maintenance HOLDS a linked
# member here rather than refusing them, so this text has to be worth reading for a while.
limbo.wait.maintenance.title=<#4a63d8>nordtal</#4a63d8> <#b08a4a>is under maintenance</#b08a4a>
limbo.wait.maintenance.subtitle=<gray>Stay here - Discord says when it is over.</gray>

# ---------------------------------------------------------------- the proxy has not said why yet
# The first fraction of a second of every login, before the proxy's message arrives - and, if it
# never arrives, the sign that there is no network-control on the proxy at all. It exists because a
# black screen with no text on it is what a crash looks like.
limbo.wait.unknown.title=<white>One moment</white>
limbo.wait.unknown.subtitle=<gray>Getting you onto the network.</gray>

# ---------------------------------------------------------------- /limbo reload
# Not a title: these two go to whoever ran the command, which in practice is the console.

# ---------------------------------------------------------------- tab list
# tab.header is byte-identical to smp's and hunger-games': the tab list is the one surface a player
# carries unchanged across all three servers. TabListTest in :common asserts that. {logo} is
# Glyphs.LOGO_HEIGHT_32, a private-use code point that deliberately does not live in this file.
#
# tab.footer is the ONE of the three that differs, on purpose. Everybody here is hidden from
# everybody else, so the list above it holds exactly one name - the reader's - and "12/60 online"
# would sit directly over a list of one. {online} and {max} are passed and go unused; that is the
# whole difference.
tab.header=<newline>{logo}<newline><#4a63d8>nordtal.eu</#4a63d8> <dark_gray>|</dark_gray> <white>Season 2</white><newline>
tab.footer=<newline><dark_gray>Connecting you to the network</dark_gray>
