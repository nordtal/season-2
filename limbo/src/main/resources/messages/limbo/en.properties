# limbo, English. The fallback for every other language, so keep it complete.
# The whole interface of this server: one title and one subtitle per WaitReason (see LimboMessages).
# Keep both lines short: a long title is scaled down, which on a black screen reads as broken.

# The ordinary state of every login.
limbo.wait.pack.title=<emphasis>Loading the resource pack</emphasis>
limbo.wait.pack.subtitle=<muted>Only the first time takes a moment.</muted>

# The phase's server is not registered or not answering; it resolves itself when it comes up.
limbo.wait.backend.title=<accent>Waiting for the server</accent>
limbo.wait.backend.subtitle=<muted>You will be moved across automatically.</muted>

# After an update countdown; nobody has to reconnect, the sweep releases them once healthy.
limbo.wait.update.title=<accent>Update in progress</accent>
limbo.wait.update.subtitle=<muted>You will be moved back automatically.</muted>

# Stopped on purpose, not by an update, so there is no time to promise.
limbo.wait.held.title=<accent>The server is stopped</accent>
limbo.wait.held.subtitle=<muted>Somebody is working on it. You go back automatically when it is up.</muted>

# The one wait that does not end on its own, so it has to be worth reading for a while.
limbo.wait.maintenance.title=<brand>nordtal</brand> <accent>is under maintenance</accent>
limbo.wait.maintenance.subtitle=<muted>Stay here - Discord says when it is over.</muted>

# Before the proxy's message arrives, because a black screen with no text looks like a crash.
limbo.wait.unknown.title=<emphasis>One moment</emphasis>
limbo.wait.unknown.subtitle=<muted>Getting you onto the network.</muted>

# tab.footer differs on purpose: the list holds only the reader, so it shows no {online}/{max}.
tab.footer=<newline><faint>Connecting you to the network</faint>
