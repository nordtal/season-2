# check, English only: what the one validator says is wrong with a text.
# A brace or a backslash meant as a character is written \\{, \\} and \\\\ here.

# A text that cannot be read; the character counts from 1.
check.syntax.closes-nothing=a \\} has no matching opening brace; write \\\\\\} to show it as a character (at character {at})
check.syntax.case-never-closed=a plural or select case is missing its closing \\} (at character {at})
check.syntax.opens-nothing=a \\{ does not start a placeholder; write \\\\\\{ to show it as a character (at character {at})
check.syntax.kind-missing=a kind is missing after {name}, (at character {at})
check.syntax.style-missing=a style is missing after {name}, {kind}, (at character {at})
check.syntax.choice-never-closed=\\{{name} is missing its closing brace (at character {at})
check.syntax.case-unnamed=a case of \\{{name}\\} needs a case name before its \\{ (at character {at})
check.syntax.case-twice=\\{{name}\\} defines the case {case} more than once (at character {at})
check.syntax.other-missing=\\{{name}\\} requires an other case (at character {at})
check.syntax.choice-in-argument=a plural or select cannot appear inside a tag's argument (at character {at})
check.syntax.attribute-missing=\\{{name} has no attribute after the dot (at character {at})
check.syntax.comma-after-name=expected , after the placeholder's name (at character {at})
check.syntax.comma-before-cases=expected , before the cases (at character {at})
check.syntax.value-not-closed=expected \\} to close \\{{name} (at character {at})
check.syntax.case-not-opened=expected \\{ to open the case {case} (at character {at})
check.syntax.block-unnamed=a \\{@ does not name a building block (at character {at})
check.syntax.binding-incomplete=a binding of \\{@{block}\\} must use value=name (at character {at})
check.syntax.binding-twice=\\{@{block}\\} binds {name} more than once (at character {at})
check.syntax.block-not-closed=expected \\} to close \\{@{block} (at character {at})
check.syntax.block-in-argument=a building block cannot appear inside a tag's argument (at character {at})

check.value.unknown=this message offers {offered}, not \\{{name}\\}
check.value.no-kind=the kind in \\{{name}, {kind}\\} is not {kinds, list, or}
check.value.other-kind=\\{{name}\\} is a {kind}, not a {written}
check.value.no-style=\\{{name}\\} is a {kind}, which has the style {styles, list, or}, not {style}
check.value.styleless=\\{{name}\\} is a {kind} and takes no style {style}
check.value.plural-on=\\{{name}, plural\\} needs a number, not a {kind}
check.value.select-on=\\{{name}, select\\} needs a choice, not a {kind}
check.value.plural-case=\\{{name}, plural\\} has the case {case}, but a plural case is =n, {cases, list, or}
check.value.unshown=the text never shows {role}, which is passed to this message

check.block.unknown=\\{@{block}\\} does not name a building block
check.block.no-value=the building block {block} offers {offered, list, and}, not {name}
check.block.unbound=the building block {block} needs {name}, and this message offers {offered, list, and}
check.block.other-kind=the building block {block} shows {name} as a {kind}, and it is given a {given}
check.block.no-case=the building block {block} has no {constant} for {name}, only {cases, list, or}

check.tag.never-closed=<{tag}> is missing its closing tag
check.tag.packaged-colour=a packaged text names a colour by its tone ({tones}), not as <{tag}>
check.tag.unknown=<{tag}> is not an allowed tag
check.tag.unknown-action=this message offers the actions {actions}, not <action:{action}>
check.tag.value-in-argument=only a hover text or a click's target takes a value such as \\{{name}\\}, not <{tag}>'s argument
check.tag.unquoted-value=\\{{name}\\} stands in <{tag}>'s argument without quotes around it
check.tag.closes-nothing=</{tag}> closes nothing
check.tag.link-shows-address=a link shows a name, not its address \\{{name}\\}, which goes in a hover text
check.tag.line-break-on-one-line=<{tag}> shows as a space where the text is shown on one line
check.tag.closes-other=</{tag}> closes <{tag}> while <{open}> is still open

check.synonym={word} is a synonym of the game term {term}: write \\{@terms.{term}\\}

check.too-long=the example text has {length} characters; this display allows {limit}
