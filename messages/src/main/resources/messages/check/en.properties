# check, English only: what the one validator says is wrong with a text.
# A brace or a backslash meant as a character is written \\{, \\} and \\\\ here.

# A text that cannot be read; the character counts from 1.
check.syntax.closes-nothing=write \\\\\\} for a \\} that closes nothing (at character {at})
check.syntax.case-never-closed=a case of a plural or select is never closed with \\} (at character {at})
check.syntax.opens-nothing=write \\\\\\{ for a \\{ that opens no placeholder (at character {at})
check.syntax.kind-missing=a kind is missing after {name}, (at character {at})
check.syntax.style-missing=a style is missing after {name}, {kind}, (at character {at})
check.syntax.choice-never-closed=\\{{name} is never closed (at character {at})
check.syntax.case-unnamed=a case of \\{{name}\\} needs a name before its \\{ (at character {at})
check.syntax.case-twice=\\{{name}\\} has the case {case} twice (at character {at})
check.syntax.other-missing=\\{{name}\\} needs an other case (at character {at})
check.syntax.choice-in-argument=a plural or select cannot stand inside a tag's argument (at character {at})
check.syntax.attribute-missing=\\{{name} names no attribute after its dot (at character {at})
check.syntax.comma-after-name=expected , after the placeholder's name (at character {at})
check.syntax.comma-before-cases=expected , before the cases (at character {at})
check.syntax.value-not-closed=expected \\} to close \\{{name} (at character {at})
check.syntax.case-not-opened=expected \\{ to open the case {case} (at character {at})

check.value.unknown=this message offers {offered}, not \\{{name}\\}
check.value.no-kind=the kind in \\{{name}, {kind}\\} is not {kinds, list, or}
check.value.other-kind=\\{{name}\\} is a {kind}, not a {written}
check.value.no-style=\\{{name}\\} is a {kind}, which has the style {styles, list, or}, not {style}
check.value.styleless=\\{{name}\\} is a {kind} and takes no style {style}
check.value.plural-on=\\{{name}, plural\\} needs a number, not a {kind}
check.value.select-on=\\{{name}, select\\} needs a choice, not a {kind}
check.value.plural-case=\\{{name}, plural\\} has the case {case}, but a plural case is =n, {cases, list, or}
check.value.unshown=the text never shows {role}, which the message is given

check.tag.never-closed=<{tag}> is never closed
check.tag.packaged-colour=a packaged text names a colour by its tone ({tones}), not as <{tag}>
check.tag.unknown=<{tag}> is no tag a text may use
check.tag.unknown-action=this message offers the actions {actions}, not <action:{action}>
check.tag.value-in-argument=only a hover text or a click's target takes a value such as \\{{name}\\}, not <{tag}>'s argument
check.tag.unquoted-value=\\{{name}\\} stands in <{tag}>'s argument without quotes around it
check.tag.closes-nothing=</{tag}> closes nothing
check.tag.link-shows-address=a link shows a name, not its address \\{{name}\\}, which goes in a hover text
check.tag.line-break-on-one-line=<{tag}> shows as a space where the text is shown on one line
check.tag.closes-other=</{tag}> closes <{tag}> while <{open}> is still open

check.synonym=write the game term {term} as the terms bundle names it, not {word}

check.too-long=with its examples the text has {length} characters, and its place fits {limit}
