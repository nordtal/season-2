# values, English: the words values are shown with, in every process beneath its own bundles.
# A value without one shows its kind's replacement word below, never its placeholder.
values.missing.text=something
values.missing.number=?
values.missing.duration=a while
values.missing.instant=some time
values.missing.money=an amount
values.missing.list=nothing
values.missing.name=someone
values.missing.mention=someone
values.missing.item=something
values.missing.glyph=
values.missing.choice=?
values.missing.message=something

# A duration shows its two largest units, joined like the last two items of a list.
values.duration.days={n, plural, one {# day} other {# days}}
values.duration.hours={n, plural, one {# hour} other {# hours}}
values.duration.minutes={n, plural, one {# minute} other {# minutes}}
values.duration.seconds={n, plural, one {# second} other {# seconds}}
values.duration.short.days={n}d
values.duration.short.hours={n}h
values.duration.short.minutes={n}m
values.duration.short.seconds={n}s

# The items before the last are joined with a comma.
values.list.and={rest} and {last}
values.list.or={rest} or {last}

values.choice.yes=yes
values.choice.no=no

# Who did something: a person as a mention, anyone else as the word for their kind.
values.actor={kind, select, person {{person}} steward {Steward} host {the host} bot {the bot} other {{kind}}}

# The service a text names, at the start of a sentence; another one by its compose name.
values.service={what, select, network {The whole network} smp {The SMP} limbo {The waiting room} hunger-games {Hunger Games} proxy {The network} other {{service}}}
values.occasion={occasion, select, update {The update} recreate {The restart} backup {The backup} other {The maintenance}}
values.phase={phase, select, pre-launch {Before launch} pre-event {Before the event} start-event {Event start} smp {Season running} maintenance {Maintenance} other {{phase}}}
