# ---------------------------------------------------------------- /network reload
# gate.yml, pack.yml, network.yml und database.yml werden NICHT neu gelesen - warum, steht in
# NetworkCommand.

# ------------------------------------------------------------ private Nachrichten
#
# /msg, /whisper und /r, vom Proxy getragen, damit ein Gespräch einen Serverwechsel überlebt.
# ZWEI ZEILEN PRO NACHRICHT, jede in der Sprache dessen, der sie liest.
#
# <_message> ist der Text der anderen Person, als KOMPONENTE eingesetzt: er läuft nie durch den
# MiniMessage-Parser, also kann jemand namens <red> keinen fremden Chat einfärben. Der Unterstrich
# unterscheidet einen Platz für eine Komponente von einem Auszeichnungs-Tag.
#
# {flag} und {admin} sind GLYPHEN aus Glyphs in :common, als Parameter eingesetzt - ein Zeichen aus
# dem Private-Use-Bereich steht nie in einer .properties-Datei. Beide liegen in minecraft:default
# und nennen deshalb keine Schrift; eine Glyphe aus einer der drei nordtal:-Schriften müsste das.
chat.msg.sent=<gray><italic>an {flag} <white>{name}</white>{admin}:</italic> <#d0d0d8><_message></#d0d0d8></gray>
chat.msg.received=<gray><italic>von {flag} <white>{name}</white>{admin}:</italic> <#d0d0d8><_message></#d0d0d8></gray>

