# network-control - Deutsch. Read as UTF-8, so umlauts belong here literally rather than as
# \uXXXX escapes. A key missing here falls back to en.properties.

# ---------------------------------------------------------------- nicht verknüpft
gate.not-linked=Verknüpfe zuerst deinen Minecraft-Account. Gib diesen Code im #link-Kanal auf \
  Discord ein: {code}
gate.not-linked.invite=Noch nicht auf dem Discord-Server? {invite}

# ---------------------------------------------------------------- kein Mitglied oder gebannt
gate.not-member=Du musst Mitglied des nordtal-Discord-Servers sein, um hier zu spielen.
gate.not-member.invite=Hier beitreten: {invite}

# ---------------------------------------------------------------- kein aktiver Zugang
gate.no-access=Du hast gerade keinen aktiven Zugang zu nordtal. Kauf einen Zeitraum im \
  Beitragskanal auf Discord.
gate.no-access.invite=Discord: {invite}

# ---------------------------------------------------------------- Wartung, nur Admins
gate.maintenance=nordtal ist gerade wegen Wartungsarbeiten geschlossen. Auf Discord steht, wann es \
  weitergeht.

# ---------------------------------------------------------------- Datenbank nicht erreichbar
gate.trouble=Wir haben gerade Probleme, das Zugangssystem zu erreichen. Bitte versuch es in ein \
  paar Minuten noch einmal.

# ---------------------------------------------------------------- Konfiguration kaputt
gate.misconfigured=nordtal ist vorübergehend nicht verfügbar: das Netzwerk ist falsch \
  konfiguriert und niemand kann hinein, bis ein Admin das behoben hat.

# ---------------------------------------------------------------- während der Sitzung
gate.expiry.warning=Dein Zugang zu nordtal läuft in {minutes} Minuten ab. Kauf im Beitragskanal \
  auf Discord nach, um weiterzuspielen.
gate.expiry.expired=Dein Zugang zu nordtal ist gerade abgelaufen. Kauf im Beitragskanal auf \
  Discord einen neuen Zeitraum, um weiterzuspielen.
