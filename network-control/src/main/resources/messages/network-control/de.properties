# network-control - Deutsch. Read as UTF-8, so umlauts belong here literally rather than as
# \uXXXX escapes. A key missing here falls back to en.properties.

# ---------------------------------------------------------------- nicht verknüpft
gate.not-linked=Verknüpfe zuerst deinen Minecraft-Account. Gib diesen Code im #link-Kanal auf \
  Discord ein: {code}
gate.not-linked.invite=Noch nicht auf dem Discord-Server? Besuch {invite}

# ---------------------------------------------------------------- kein Mitglied oder gebannt
gate.not-member=Du musst Mitglied des nordtal-Discord-Servers sein, um hier zu spielen.
gate.not-member.invite=Hier beitreten: {invite}

# ---------------------------------------------------------------- Verknüpfung während der Sitzung gelöst
gate.unlinked=Dein Minecraft-Account ist nicht mehr mit einem Discord-Account verknüpft. Verbinde \
  dich erneut, um einen neuen Verknüpfungscode zu bekommen.

# ---------------------------------------------------------------- kein aktiver Zugang
gate.no-access=Du hast gerade keinen aktiven Zugang zu nordtal. Kauf einen Zeitraum im \
  Beitragskanal auf Discord.
gate.no-access.invite=Discord: {invite}

# ---------------------------------------------------------------- Wartung, ohne Limbo zum Warten
# Nicht der normale Wartungsfall: seit 2026-08-31 kommt ein verknüpftes Mitglied während der Wartung
# herein und wartet in limbo. Dieser Bildschirm greift nur, wenn es keinen limbo-Server gibt.
gate.maintenance=nordtal ist gerade wegen Wartungsarbeiten geschlossen. Auf Discord steht, wann es \
  weitergeht.

# ---------------------------------------------------------------- Server der Phase fehlt
gate.no-server=nordtal ist gerade nicht erreichbar: der Server für die aktuelle Phase ist nicht \
  verfügbar. Das muss ein Admin beheben - bitte versuch es später noch einmal.

# ---------------------------------------------------------------- Datenbank nicht erreichbar
gate.trouble=Wir haben gerade Probleme, das Zugangssystem zu erreichen. Bitte versuch es in ein \
  paar Minuten noch einmal.

# ---------------------------------------------------------------- Konfiguration kaputt
gate.misconfigured=nordtal ist vorübergehend nicht verfügbar: das Netzwerk ist falsch \
  konfiguriert und niemand kann hinein, bis ein Admin das behoben hat.

# ---------------------------------------------------------------- /phase, der Notfallbefehl
phase.current=Das Netzwerk ist in {phase}.
phase.current.unread=Das Netzwerk konnte seit dem Start dieses Proxys nicht gelesen werden und \
  gilt deshalb als {phase}. In diesem Zustand kommt niemand außer Admins herein.
phase.unknown=Unbekannte Phase: {value}. Eine von: {phases}
phase.changed=Saisonphase gewechselt: {previous} -> {current}. Der Wechsel steht im Audit-Log und \
  jeder Prozess übernimmt ihn innerhalb von dreißig Sekunden.
phase.unchanged=Das Netzwerk war bereits in {phase}. Der Wechsel wurde trotzdem im Audit-Log \
  festgehalten.
phase.failed=Die Phase konnte nicht gewechselt werden - die Datenbank hat den Schreibvorgang \
  nicht angenommen. Wenn die Datenbank selbst ausgefallen ist, hilft kein Befehl; letztes Mittel \
  ist ein UPDATE auf die season_phase-Zeile von Hand.

# ---------------------------------------------------------------- während der Sitzung
gate.expiry.warning=Dein Zugang zu nordtal läuft in {minutes} Minuten ab. Kauf im Beitragskanal \
  auf Discord nach, um weiterzuspielen.
gate.expiry.expired=Dein Zugang zu nordtal ist gerade abgelaufen. Kauf im Beitragskanal auf \
  Discord einen neuen Zeitraum, um weiterzuspielen.

# ---------------------------------------------------------------- die Resource-Pack-Station
pack.prompt=nordtal braucht sein Resource-Pack: Tab-Liste, Namensschilder, Tafeln und das ganze \
  HUD werden damit gezeichnet.
pack.declined=Ohne das nordtal-Resource-Pack kannst du hier nicht spielen. Verbinde dich erneut \
  und nimm es an - es sind ein paar Megabyte und es zeichnet Namensschilder, Tafeln und HUD.
pack.failed-download=Das nordtal-Resource-Pack konnte nicht heruntergeladen werden. Das liegt \
  meistens an der Verbindung - bitte verbinde dich gleich noch einmal.
pack.invalid-url=Das nordtal-Resource-Pack ist gerade nicht erreichbar. Das muss ein Admin \
  beheben - bitte versuch es später noch einmal.
pack.timeout=Dein Client hat auf das Resource-Pack-Angebot nie geantwortet, deshalb können wir \
  dich nicht hereinlassen. Verbinde dich erneut, um es noch einmal zu versuchen.

# ---------------------------------------------------------------- der Neustart-Countdown
# Diese Zeilen sehen alle im Netzwerk, egal wo sie gerade sind - Limbo, Hunger Games oder SMP. Nur
# der Proxy sieht jeden Spieler, deshalb liegt der Countdown dort und nicht in dem Plugin, dessen
# /smp update restart ihn meistens auslöst. Ein Neustart aus Discord wird mit denselben Zeilen
# angekündigt.
#
# {seconds} ist, was WIRKLICH noch übrig ist, nicht die angefragte Zahl: der Countdown wird
# gepollt, spricht also womöglich zuerst bei 57 statt bei 60 - und 60 wäre dort um drei Sekunden
# gelogen.
restart.countdown=Das gesamte Netzwerk startet in {seconds} Sekunden neu. Du fliegst raus - komm \
  direkt wieder, es dauert etwa eine Minute.
restart.now=Neustart läuft. Bis gleich.
restart.cancelled=Der Neustart wurde abgeblasen. Es passiert nichts.
# Der Neustart lief bis null und kam dann nicht zustande - Arcane nicht erreichbar, Token abgelehnt.
# Absichtlich nicht dieselbe Zeile wie 'abgeblasen': das eine hat jemand entschieden, das andere
# ist schiefgegangen, und wer eben noch einen Countdown gelesen hat, merkt den Unterschied.
restart.failed=Der Neustart hat nicht geklappt. Du bleibst drin - es wird noch mal versucht.

# ---------------------------------------------------------------- Netzwerk ist voll
gate.full=nordtal ist gerade voll - {online} von {max} Spielern sind drauf. Versuch es in ein paar \
  Minuten nochmal, es loggt sich ständig jemand aus.

# ---------------------------------------------------------------- vor der Eröffnung
gate.pre-launch.buy=nordtal hat noch nicht eröffnet. Du kannst deinen ersten Monat aber schon jetzt \
  im Beitragskanal auf Discord kaufen - dann gehört dir die SMP, sobald das Event vorbei ist.
gate.pre-launch.ready=nordtal hat noch nicht eröffnet. Bei dir ist alles fertig: Account verknüpft, \
  Zugang bezahlt. Wir sehen uns beim Start.

gate.countdown=Das Netzwerk öffnet in {countdown}.
gate.countdown.unknown=Ein Eröffnungstermin steht noch nicht fest - schau auf Discord.

# ---------------------------------------------------------------- wie ein Countdown gelesen wird
countdown.days={days} Tagen {hours} Stunden
countdown.hours={hours} Stunden {minutes} Minuten
countdown.minutes={minutes} Minuten
countdown.imminent=jedem Moment

# ---------------------------------------------------------------- was der Server-Browser zeigt
motd.misconfigured=<red>nordtal ist falsch konfiguriert</red><newline><gray>Niemand kann joinen, bis ein Admin das behoben hat.</gray>
