# network-control - English. This file is the fallback for every other language: a key that is
# missing here shows up on screen as the key itself, so keep it complete.
#
# Parameters are named and written in braces, substituted by eu.nordtal.s2.common.message.Messages.

# ---------------------------------------------------------------- not linked
# The player's language is not known yet - the account is unknown - so this key is looked up once
# in English and once in German and both are shown together. Keep this line short: it has to fit
# on a disconnect screen next to its German counterpart.
gate.not-linked=<#b08a4a>Link your Minecraft account first.</#b08a4a> <gray>Type this code in the #link channel on Discord: <white>{code}</white></gray>
gate.not-linked.invite=<gray>Not on the Discord server yet? Visit <white>{invite}</white></gray>

# ---------------------------------------------------------------- not a member, or banned
gate.not-member=<#a8888b>You need to be a member of the <#4a63d8>nordtal</#4a63d8> <#a8888b>Discord server to play here.</#a8888b>
gate.not-member.invite=<gray>Join here: <white>{invite}</white></gray>

# ---------------------------------------------------------------- unlinked while already connected
# /unlink in Discord is self-service, so an account can stop being linked mid-session. There is no
# link code here - issuing one is a database write, and this is not a login. Rejoining gets them one.
gate.unlinked=<#a8888b>Your Minecraft account is no longer linked to a Discord account.</#a8888b> \
  <gray>Join again to get a new link code.</gray>

# ---------------------------------------------------------------- no active access
gate.no-access=<#a8888b>You do not have active access to <#4a63d8>nordtal</#4a63d8> <#a8888b>right now.</#a8888b> \
  <gray>Buy a period in the contribution channel on Discord.</gray>
gate.no-access.invite=<gray>Discord: <white>{invite}</white></gray>

# ---------------------------------------------------------------- maintenance, with no limbo to wait in
# NOT the ordinary maintenance path: a linked member is admitted during MAINTENANCE and held in
# limbo, where that server shows the waiting message. This screen is the fallback for a limbo server
# the proxy does not have registered. Shown in the player's own language - by this point the account
# is linked, so discord_user.locale is known.
gate.maintenance=<#4a63d8>nordtal</#4a63d8> <#b08a4a>is closed for maintenance right now.</#b08a4a> <gray>Watch Discord for when it is back.</gray>

# ---------------------------------------------------------------- the phase's backend is missing
# gate.yml's server names do not match velocity.toml. A config error, not a player error.
gate.no-server=<#a8888b>The server for the current phase is not available.</#a8888b> <gray>An admin has \
  to fix this - please try again later.</gray>

# ---------------------------------------------------------------- the database is unreachable
gate.trouble=<#a8888b>We are having trouble reaching the access system right now.</#a8888b> <gray>Please \
  try again in a few minutes.</gray>

# ---------------------------------------------------------------- the configuration is broken
# The fail-closed screen (deploy/README.md#troubleshooting). Bilingual like the
# unlinked one, and for a stronger version of the same reason: the database that holds every
# player's language is exactly what a broken database.yml cannot reach.
gate.misconfigured=<#a8888b>The network is misconfigured.</#a8888b> <gray>Nobody can be let in until an \
  admin has fixed it.</gray>

# ---------------------------------------------------------------- /phase, the emergency command
#
# Its keys are NOT here. /phase exists on this proxy and in the Discord bot, and the two share one
# bundle in :commands, loaded underneath this file. See messages/commands/en.properties.
#
# A key of the same name written here would win over the shared one. That is the mechanism, not a
# bug - it is how this surface would reword a shared line for chat - but do it deliberately, and
# never as a way of "adding" a phase message.

# ---------------------------------------------------------------- mid-session
gate.expiry.warning=<#b08a4a>Your access runs out in <white>{minutes}</white> minutes.</#b08a4a> <gray>Buy \
  more in the contribution channel on Discord to keep playing.</gray>
gate.expiry.expired=<#a8888b>Your access has just run out.</#a8888b> <gray>Buy a new period in the \
  contribution channel on Discord to keep playing.</gray>

# ---------------------------------------------------------------- the resource pack station
# Every login passes through limbo, where the proxy offers the pack from pack.yml. The prompt is
# the line inside the client's own pack dialog; the rest are disconnect screens.
#
# The offer is FORCED, which on 1.17+ means the client itself refuses to play without the pack and
# Velocity kicks a decliner with its own generic text. Our screens land because PackStation
# disconnects first, from inside the awaited status event - see pack.yml#force.
pack.prompt=<#4a63d8>nordtal</#4a63d8> <gray>needs its resource pack: the tab list, the nametags, the \
  boards and the whole HUD are drawn with it.</gray>
pack.declined=<#a8888b>You need the resource pack to play here.</#a8888b> <gray>Join again and accept \
  it - it is a few megabytes and it is what draws the nametags, the boards and the HUD.</gray>
pack.failed-download=<#a8888b>The resource pack could not be downloaded.</#a8888b> <gray>That is usually \
  a connection problem - please join again in a moment.</gray>
# A config error, and it hits every player at once. The text still has to make sense to a player.
pack.invalid-url=<#a8888b>The resource pack is not reachable right now.</#a8888b> <gray>An admin has to \
  fix this - please try again later.</gray>
pack.timeout=<#a8888b>Your client never answered the resource pack offer.</#a8888b> <gray>We cannot let \
  you in - join again to try once more.</gray>

# ---------------------------------------------------------------- the restart countdown
# Everybody on the network sees these, wherever they are - limbo, Hunger Games or the SMP. The
# proxy is the only process that sees every player, which is why the countdown lives there and not
# in the plugin whose /smp update restart usually starts it. A restart asked for in Discord is
# announced by exactly the same lines.
#
# {seconds} is what is ACTUALLY left, not the number somebody asked for: the countdown is polled,
# so it may first speak at 57 rather than 60, and saying 60 there would be a lie by three seconds.
restart.countdown=<#b08a4a>The whole network restarts in <white>{seconds}</white> seconds.</#b08a4a> \
  <gray>You will be disconnected - come straight back, it takes about a minute.</gray>
# The last ten seconds, once a second, as a subtitle rather than as chat. The number
# alone: a sentence in the middle of the screen every second is unreadable, and the
# chat lines above have already said what is happening.
restart.tick=<#b08a4a>{seconds}</#b08a4a>
restart.now=<#b08a4a>Restarting now.</#b08a4a> <gray>See you in a minute.</gray>
restart.cancelled=<#8ba888>The restart was called off.</#8ba888> <gray>Nothing is happening.</gray>
# The countdown ran out and the restart then did not happen - an unreachable Arcane, a refused
# token. Deliberately not the same line as 'called off': one of those is a decision somebody took
# and the other went wrong, and somebody who has just watched a countdown can tell.
restart.failed=<#a8888b>The restart did not go through.</#a8888b> <gray>You are staying - it will be tried again.</gray>

# ---------------------------------------------------------------- the network is full
# NETWORK_MAX_PLAYERS is reached and this player is not an admin. It is the proxy that refuses, and
# it is the only thing that should: the Paper backends carry the same number, and the one login they
# would refuse for fullness - an admin's, because admins are exempt here - is let through on the
# backend itself (common's FullServerAdmission). "Server full" from a backend is therefore a bug.
gate.full=<#b08a4a><#4a63d8>nordtal</#4a63d8> <#b08a4a>is full right now - <white>{online}</white> of \
  <white>{max}</white> players are on.</#b08a4a> <gray>Try again in a few minutes; somebody logs off all the time.</gray>

# ---------------------------------------------------------------- before the network has opened
# The three PRE_LAUNCH screens. An unlinked player gets gate.not-linked as everywhere else, with
# the countdown line appended; these two are for players who are already linked. The difference
# between them is a purchase, not a permission - see GateOutcome.
gate.pre-launch.buy=<#4a63d8>nordtal</#4a63d8> <#b08a4a>has not opened yet.</#b08a4a> <gray>You can already \
  buy your first month in the contribution channel on Discord - then the SMP is yours the moment the event is over.</gray>
gate.pre-launch.ready=<#4a63d8>nordtal</#4a63d8> <#b08a4a>has not opened yet.</#b08a4a> <gray>You are all \
  set: your account is linked and your access is paid for. See you at the start.</gray>

# The countdown line, appended to every PRE_LAUNCH screen. {countdown} is one of the five lines
# below, already rendered.
gate.countdown=<gray>The network opens in <white>{countdown}</white>.</gray>
gate.countdown.unknown=<gray>No opening date has been announced yet - watch Discord.</gray>

# ---------------------------------------------------------------- how a countdown reads
# Deliberately coarse. A server browser refreshes on its own schedule and a disconnect screen is
# read once, so a value counting seconds would be wrong by the time anybody looked at it.
countdown.days={days} days {hours} hours
countdown.hours={hours} hours {minutes} minutes
countdown.minutes={minutes} minutes
# The instant has passed and nobody has switched the phase yet. Deliberately not "0 minutes", and
# deliberately not negative: the date was an announcement, and the switch is a decision somebody
# still has to take.
countdown.imminent=any moment now

# ---------------------------------------------------------------- what the server browser shows
# The MOTD for the fail-closed case, and the only one that does not come from network.yml - because
# a broken network.yml is one of the ways to get here. It comes off the classpath, which is the one
# thing still readable when the configuration is what is wrong.
motd.misconfigured=<#4a63d8><bold>nordtal.eu</bold></#4a63d8><newline><#a8888b>Misconfigured - nobody can join until an admin has fixed it.</#a8888b>

# --- the two season dates, set from the proxy (the emergency path; Discord is the normal one) ---
# Times are typed and shown in one fixed zone - see SeasonDates. An admin never writes an offset.

# ---------------------------------------------------------------- /network reload
# gate.yml, pack.yml, network.yml and database.yml are NOT re-read - see NetworkCommand for why.

# ---------------------------------------------------------------- private messages
#
# /msg, /whisper and /r, carried by the proxy so that a conversation survives somebody crossing to
# another backend. TWO LINES PER MESSAGE, each rendered in the language of the person reading it.
#
# <_message> is the other person's own text, inserted as a COMPONENT: it never passes through the
# MiniMessage parser at all, so a player called <red> cannot colour somebody else's chat and a
# player who types a tag sees their tag. The underscore is what tells a component slot apart from a
# style tag, and what lets the bundle test hold both languages to the same set of them.
#
# {flag} and {admin} are GLYPHS out of :common's Glyphs, substituted as parameters - a private-use
# character is never written into a .properties file. Both live in minecraft:default, so neither
# names a font; a glyph from one of the three nordtal: fonts would have to.
#
# There is deliberately no arrow character here. The shape is also deliberately not the shape of
# ordinary chat: a whisper that reads like public chat is a whisper somebody answers in public.
chat.msg.sent=<gray><italic>to {flag} <white>{name}</white>{admin}:</italic> <#d0d0d8><_message></#d0d0d8></gray>
chat.msg.received=<gray><italic>from {flag} <white>{name}</white>{admin}:</italic> <#d0d0d8><_message></#d0d0d8></gray>

# ---------------------------------------------------------------- /discord and /rules
#
# Two commands that only print. The text is here rather than in :commands' shared bundle because it
# wants a clickable link and a colour, and that bundle is read in Discord too. {invite} is
# gate.yml#discord-invite-url - the same string every login screen uses, so a re-issued invite is
# re-issued once.
#
# <newline> is how a bundle value becomes several chat lines.

info.discord=<gray>The nordtal Discord is where access, languages and the hunger games registration \
  live.</gray><newline><click:open_url:'{invite}'><#4a63d8><underlined>{invite}</underlined></#4a63d8></click>

# THE RULES ARE NOT WRITTEN YET, and this text says so on purpose. A /rules that answered with
# something plausible is a /rules nobody would check again, so the placeholder is loud rather than
# tidy. Replacing it is an edit to this file and needs no release; see todo.md A10.
info.rules=<red><bold>PLACEHOLDER - THE RULES HAVE NOT BEEN WRITTEN YET.</bold></red><newline><gray>Nothing on this screen is a rule. Ask in Discord until this says something \
  else:</gray><newline><click:open_url:'{invite}'><#4a63d8><underlined>{invite}</underlined></#4a63d8></click>
