# network-control - English. This file is the fallback for every other language: a key that is
# missing here shows up on screen as the key itself, so keep it complete.
#
# Parameters are named and written in braces, substituted by eu.nordtal.s2.common.message.Messages.
# See docs/access-system.md for what each disconnect screen is for.

# ---------------------------------------------------------------- not linked
# The player's language is not known yet - the account is unknown - so this key is looked up once
# in English and once in German and both are shown together. Keep this line short: it has to fit
# on a disconnect screen next to its German counterpart.
gate.not-linked=Link your Minecraft account first. Type this code in the #link channel on Discord: {code}
gate.not-linked.invite=Not on the Discord server yet? Visit {invite}

# ---------------------------------------------------------------- not a member, or banned
gate.not-member=You need to be a member of the nordtal Discord server to play here.
gate.not-member.invite=Join here: {invite}

# ---------------------------------------------------------------- unlinked while already connected
# /unlink in Discord is self-service, so an account can stop being linked mid-session. There is no
# link code here - issuing one is a database write, and this is not a login. Rejoining gets them one.
gate.unlinked=Your Minecraft account is no longer linked to a Discord account. Join again to get a \
  new link code.

# ---------------------------------------------------------------- no active access
gate.no-access=You do not have active access to nordtal right now. Buy a period in the \
  contribution channel on Discord.
gate.no-access.invite=Discord: {invite}

# ---------------------------------------------------------------- maintenance, with no limbo to wait in
# NOT the ordinary maintenance path. Since 2026-08-31 a linked member is admitted during MAINTENANCE
# and held in limbo, where the waiting message is shown by that server. This screen is the fallback
# for a limbo server the proxy does not have registered - the "disconnect" half of the either/or
# docs/season-phases.md used to leave open, kept for the one case where holding them is impossible.
# Shown in the player's own language: by this point the account is linked, so discord_user.locale is
# known - see GateMessages#maintenance.
gate.maintenance=nordtal is closed for maintenance right now. Watch Discord for when it is back.

# ---------------------------------------------------------------- the phase's backend is missing
# gate.yml's server names do not match velocity.toml. A config error, not a player error.
gate.no-server=nordtal is not reachable right now: the server for the current phase is not \
  available. An admin has to fix this - please try again later.

# ---------------------------------------------------------------- the database is unreachable
gate.trouble=We are having trouble reaching the access system right now. Please try again in a \
  few minutes.

# ---------------------------------------------------------------- the configuration is broken
# The fail-closed screen (deploy/README.md#troubleshooting). Bilingual like the
# unlinked one, and for a stronger version of the same reason: the database that holds every
# player's language is exactly what a broken database.yml cannot reach.
gate.misconfigured=nordtal is temporarily unavailable: the network is misconfigured and nobody \
  can be let in until an admin has fixed it.

# ---------------------------------------------------------------- /phase, the emergency command
phase.current=The network is in {phase}.
phase.current.unread=The network has not been readable since this proxy started, so it is being \
  treated as {phase}. Nobody but an admin can join in that state.
phase.unknown=Unknown phase: {value}. One of: {phases}
phase.changed=Season phase switched: {previous} -> {current}. It is written to the audit log and \
  every process picks it up within thirty seconds.
phase.unchanged=The network was already in {phase}. The switch was recorded in the audit log \
  anyway.
phase.failed=The phase could not be switched - the database did not accept the write. If the \
  database itself is down, no command can fix this; the last resort is an UPDATE on the \
  season_phase row by hand.

# ---------------------------------------------------------------- mid-session
gate.expiry.warning=Your access to nordtal runs out in {minutes} minutes. Buy more in the \
  contribution channel on Discord to keep playing.
gate.expiry.expired=Your access to nordtal has just run out. Buy a new period in the contribution \
  channel on Discord to keep playing.

# ---------------------------------------------------------------- the resource pack station
# Every login passes through limbo, where the proxy offers the pack from pack.yml. The prompt is
# the line inside the client's own pack dialog; the rest are disconnect screens.
#
# The offer is FORCED, which on 1.17+ means the client itself refuses to play without the pack and
# Velocity kicks a decliner with its own generic text. Our screens land because PackStation
# disconnects first, from inside the awaited status event - see pack.yml#force.
pack.prompt=nordtal needs its resource pack: the tab list, the nametags, the boards and the whole \
  HUD are drawn with it.
pack.declined=You need the nordtal resource pack to play here. Join again and accept it - it is \
  a few megabytes and it is what draws the nametags, the boards and the HUD.
pack.failed-download=The nordtal resource pack could not be downloaded. That is usually a \
  connection problem - please join again in a moment.
# A config error, and it hits every player at once. The text still has to make sense to a player.
pack.invalid-url=The nordtal resource pack is not reachable right now. An admin has to fix this - \
  please try again later.
pack.timeout=Your client never answered the resource pack offer, so we cannot let you in. Join \
  again to try once more.

# ---------------------------------------------------------------- the restart countdown
# Everybody on the network sees these, wherever they are - limbo, Hunger Games or the SMP. The
# proxy is the only process that sees every player, which is why the countdown lives there and not
# in the plugin whose /smp update restart usually starts it. A restart asked for in Discord is
# announced by exactly the same lines.
#
# {seconds} is what is ACTUALLY left, not the number somebody asked for: the countdown is polled,
# so it may first speak at 57 rather than 60, and saying 60 there would be a lie by three seconds.
restart.countdown=The whole network restarts in {seconds} seconds. You will be disconnected - \
  come straight back, it takes about a minute.
restart.now=Restarting now. See you in a minute.
restart.cancelled=The restart was called off. Nothing is happening.
# The countdown ran out and the restart then did not happen - an unreachable Arcane, a refused
# token. Deliberately not the same line as 'called off': one of those is a decision somebody took
# and the other went wrong, and somebody who has just watched a countdown can tell.
restart.failed=The restart did not go through. You are staying - it will be tried again.

# ---------------------------------------------------------------- the network is full
# NETWORK_MAX_PLAYERS is reached and this player is not an admin. It is the proxy that refuses,
# not a backend: since 2026-09-03 the Paper servers are configured far above any network limit
# (BACKEND_MAX_PLAYERS), so "Server full" from a backend would be a bug rather than this message.
gate.full=nordtal is full right now - {online} of {max} players are on. Try again in a few \
  minutes; somebody logs off all the time.

# ---------------------------------------------------------------- before the network has opened
# The three PRE_LAUNCH screens. An unlinked player gets gate.not-linked as everywhere else, with
# the countdown line appended; these two are for players who are already linked. The difference
# between them is a purchase, not a permission - see GateOutcome.
gate.pre-launch.buy=nordtal has not opened yet. You can already buy your first month in the \
  contribution channel on Discord - then the SMP is yours the moment the event is over.
gate.pre-launch.ready=nordtal has not opened yet. You are all set: your account is linked and your \
  access is paid for. See you at the start.

# The countdown line, appended to every PRE_LAUNCH screen. {countdown} is one of the five lines
# below, already rendered.
gate.countdown=The network opens in {countdown}.
gate.countdown.unknown=No opening date has been announced yet - watch Discord.

# ---------------------------------------------------------------- how a countdown reads
# Deliberately coarse. A server browser refreshes on its own schedule and a disconnect screen is
# read once, so a value counting seconds would be wrong by the time anybody looked at it.
countdown.days={days} days {hours} hours
countdown.hours={hours} hours {minutes} minutes
countdown.minutes={minutes} minutes
# The instant has passed and nobody has switched the phase yet. Deliberately not "0 minutes", and
# deliberately not negative: the date was an announcement, and the switch is a decision somebody
# still has to take.
countdown.imminent=any moment now

# ---------------------------------------------------------------- what the server browser shows
# The MOTD for the fail-closed case, and the only one that does not come from network.yml - because
# a broken network.yml is one of the ways to get here. It comes off the classpath, which is the one
# thing still readable when the configuration is what is wrong.
motd.misconfigured=<red>nordtal is misconfigured</red><newline><gray>Nobody can join until an admin has fixed it.</gray>

# --- the two season dates, set from the proxy (the emergency path; Discord is the normal one) ---
# Times are typed and shown in one fixed zone - see SeasonDates. An admin never writes an offset.
phase.dates=The network opens: {launch}. Paid access starts running: {smpStart}. Times are {zone}.
phase.date.invalid=That is not a date. Type it as "{pattern}" in {zone} time - for example \
  "2026-10-01 18:00" - or "{clear}" to take the date away again.
phase.date.set={what} on {current} (was {previous}).
phase.date.unchanged={what} on {current}, which is what it already said.
phase.date.cleared=There is no date for {what} any more. Access bought from now on starts \
  immediately, and the bot warns on every such purchase.
phase.date.moved=Moved {grants} access period(s) belonging to {accounts} account(s) to match. \
  Stacked periods stay stacked and nobody's length changed.
phase.date.kept=The access already sold did not move - there is no date left to anchor it to.
phase.date.refused={reason}
phase.date.failed=The date could not be written - the database did not accept it. Nothing was \
  changed.
phase.date.what.launch=when the network opens
phase.date.what.smp-start=when paid access starts running

# ---------------------------------------------------------------- /network reload
# gate.yml, pack.yml, network.yml and database.yml are NOT re-read - see NetworkCommand for why.
network.reloaded=<gray>The message bundles were reloaded. The configuration files are deliberately \
  not re-read: every one of them is wired into something a running proxy cannot swap.</gray>
network.reload-failed=<red>The messages could not be reloaded; the running ones are unchanged. \
  The console says why.</red>
