# network-control - English. This file is the fallback for every other language: a key that is
# missing here shows up on screen as the key itself, so keep it complete.
#
# Parameters are named and written in braces, substituted by eu.nordtal.s2.common.message.Messages.
# See docs/access-system.md for what each disconnect screen is for.

# ---------------------------------------------------------------- not linked
# The player's language is not known yet - the account is unknown - so this key is looked up once
# in English and once in German and both are shown together. Keep this line short: it has to fit
# on a disconnect screen next to its German counterpart.
gate.not-linked=Link your Minecraft account first. Type this code in the #link channel on Discord: {code}
gate.not-linked.invite=Not on the Discord server yet? {invite}

# ---------------------------------------------------------------- not a member, or banned
gate.not-member=You need to be a member of the nordtal Discord server to play here.
gate.not-member.invite=Join here: {invite}

# ---------------------------------------------------------------- no active access
gate.no-access=You do not have active access to nordtal right now. Buy a period in the \
  contribution channel on Discord.
gate.no-access.invite=Discord: {invite}

# ---------------------------------------------------------------- the database is unreachable
gate.trouble=We are having trouble reaching the access system right now. Please try again in a \
  few minutes.

# ---------------------------------------------------------------- mid-session
gate.expiry.warning=Your access to nordtal runs out in {minutes} minutes. Buy more in the \
  contribution channel on Discord to keep playing.
gate.expiry.expired=Your access to nordtal has just run out. Buy a new period in the contribution \
  channel on Discord to keep playing.
