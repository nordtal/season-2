# paper-common - Deutsch. Wird als UTF-8 gelesen, Umlaute gehören also direkt hierhin und nicht als
# \uXXXX-Escapes. Ein Schlüssel, der hier fehlt, fällt auf en.properties zurück.
#
# DIE FÜNF ZEILEN, DIE JEDER PAPER-SERVER SCHREIBT. Warum sie hier stehen und nicht in smp, steht in
# en.properties.
#
# Jede Glyphe ist ein {parameter}, weil Glyphs die einzige Stelle im Repository ist, die einen
# Codepunkt nennt; die Icons sind absichtlich weiß gezeichnet, also ist die hier geschriebene Farbe
# die, die herauskommt. Ein <_name>-Tag ist ein Platz für etwas, das BEREITS eine Komponente ist und
# das Flachklopfen zu Text nicht überlebt.

system.chat.line=<_sender> <#4e5668>{separator}</#4e5668> <#d0d0d8><_message>

system.join=<#8ba888>{icon}</#8ba888> <gray><_player> ist da.</gray>
system.leave=<#a8888b>{icon}</#a8888b> <gray><_player> ist weg.</gray>

# Die Todeszeile, und in den Hunger Games ist sie der Kill-Feed. <_death> ist die Nachricht des
# Spiels selbst, als Komponente weitergereicht, damit sie jeder Client in der Sprache seines Lesers
# zeichnet - mit dem Namen des Mobs und der Waffe des Töters darin.
system.death=<#a8888b>{icon}</#a8888b> <gray><_death></gray>

system.advancement=<#b08a4a>{icon}</#b08a4a> <gray><_player> hat <white><_advancement></white> geschafft.</gray>
