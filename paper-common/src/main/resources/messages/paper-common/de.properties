# paper-common, Deutsch. Ein Schlüssel, der hier fehlt, fällt auf en.properties zurück.
#
# Eine Glyphe wird mit <glyph:name> genannt und nimmt den Ton um sie herum an.

system.chat.line={sender.name} <faint><glyph:separator></faint> <neutral>{message}</neutral>

system.join=<good><glyph:join></good> <muted>{player.name} ist da.</muted>
system.leave=<bad><glyph:leave></bad> <muted>{player.name} ist weg.</muted>

# Die Todeszeile, auch der Kill-Feed der Hunger Games. {death} ist die Zeile des Spiels selbst, damit
# jeder Client sie in der Sprache seines Lesers zeichnet.
system.death=<bad><glyph:death></bad> <muted>{death}</muted>

system.advancement=<accent><glyph:advancement></accent> <muted>{player.name} hat <emphasis>{advancement}</emphasis> geschafft.</muted>

# Ein Login, der abgelehnt wird, weil der Server nicht lesen kann, wer sich anmeldet. Nur auf Englisch:
# ohne die Identität gibt es keine Sprache.
login.database-unreachable=<bad>The server cannot reach its database right now.</bad> \
  <muted>Logging in would lose your progress. Please try again in a few minutes.</muted>

# Was ein Spieler über einen Befehl erfährt, den es für ihn nicht gibt.
command.unknown=Diesen Befehl gibt es nicht.

# Die Antworten, die die Admin-Aktionen jedes Servers teilen: Konsole und Steward lesen sie.
admin.confirm=Das lässt sich nicht rückgängig machen. Mit {command} confirm geht es weiter.
admin.failed=Das hat nicht geklappt, und nichts wurde geändert. Das Log sagt, warum.
admin.preview-shown=Deinem Spieler im Spiel gezeigt.
command.help.header={command} kennt diese:
command.help.line=\ \ {usage} - {what}
command.help.usage=Syntax: {usage}
command.help.what={what}

# Der Kopf der Tab-Liste, auf jedem Server derselbe: der Client behält ihn beim Serverwechsel.
tab.header=<newline><glyph:logo-large><newline><brand>nordtal.eu</brand> <faint>|</faint> <emphasis>Staffel {season.number}</emphasis><newline>
