# paper-common, Deutsch. Ein Schlüssel, der hier fehlt, fällt auf en.properties zurück.
#
# Jede Glyphe ist ein {parameter}; ein <_name>-Tag ist ein Platz für etwas, das bereits eine Komponente ist.

system.chat.line=<_sender> <#4e5668>{separator}</#4e5668> <#d0d0d8><_message>

system.join=<#8ba888>{icon}</#8ba888> <gray><_player> ist da.</gray>
system.leave=<#a8888b>{icon}</#a8888b> <gray><_player> ist weg.</gray>

# Die Todeszeile, auch der Kill-Feed der Hunger Games. <_death> ist die Nachricht des Spiels als
# Komponente, damit jeder Client sie in der Sprache seines Lesers zeichnet.
system.death=<#a8888b>{icon}</#a8888b> <gray><_death></gray>

system.advancement=<#b08a4a>{icon}</#b08a4a> <gray><_player> hat <white><_advancement></white> geschafft.</gray>

# Ein Login, der abgelehnt wird, weil der Server nicht lesen kann, wer sich anmeldet. Nur auf Englisch:
# ohne die Identität gibt es keine Sprache.
login.database-unreachable=<#a8888b>The server cannot reach its database right now.</#a8888b> \
  <gray>Logging in would lose your progress. Please try again in a few minutes.</gray>

# Was ein Spieler über einen Befehl erfährt, den es für ihn nicht gibt.
command.unknown=Diesen Befehl gibt es nicht.

# Die Antworten, die die Admin-Aktionen jedes Servers teilen: Konsole und Steward lesen sie.
admin.reloaded=Die Einstellungen und die Nachrichten wurden neu geladen.
admin.not-reloaded=Nicht alles wurde neu geladen, und was nicht geladen wurde, läuft weiter wie bisher: {problems}
admin.confirm=Das lässt sich nicht rückgängig machen. Mit {command} confirm geht es weiter.
admin.failed=Das hat nicht geklappt, und nichts wurde geändert. Das Log sagt, warum.
command.help.header={command} kennt diese:
command.help.line=\ \ {usage} - {what}
command.help.usage=Syntax: {usage}
command.help.what={what}
