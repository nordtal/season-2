# paper-common, English: the fallback for every other language, so keep it complete.
#
# The five lines every Paper server writes: chat, join, leave, death and advancement. A process loads
# this root underneath its own, so a server rewords one in its own bundle.
#
# A glyph is named by <glyph:name> and takes the tone around it. A player's name is drawn the way
# the server draws it: flag, colour and crest.

# The chat line: the speaker, a hairline rule, the message in the neutral tone so a name still stands out.
system.chat.line={sender.name} <faint><glyph:separator></faint> <neutral>{message}</neutral>

system.join=<good><glyph:join></good> <muted>{player.name} joined.</muted>
system.leave=<bad><glyph:leave></bad> <muted>{player.name} left.</muted>

# The death line, also the hunger games kill feed. {death} is the game's own line, so each client
# renders it in its reader's language.
system.death=<bad><glyph:death></bad> <muted>{death}</muted>

system.advancement=<accent><glyph:advancement></accent> <muted>{player.name} earned <emphasis>{advancement}</emphasis>.</muted>

# A login refused because the server cannot read who is logging in. English only by necessity: without
# the identity there is no language to read.
login.database-unreachable=<bad>The server cannot reach its database right now.</bad> \
  <muted>Logging in would lose your progress. Please try again in a few minutes.</muted>

# What a player is told about a command that does not exist for them.
command.unknown=That command does not exist.

# The answers every server's admin actions share: the console and Steward read them.
admin.confirm=This cannot be undone. Run {command} confirm to go ahead.
admin.failed=That did not work, and nothing was changed. The log says why.
admin.preview-shown=Shown to your player in game.
command.help.header={command} takes one of these:
command.help.line=\ \ {usage} - {what}
command.help.usage=Usage: {usage}
command.help.what={what}

# The tab list's header, the same on every server: the client keeps it across a server change.
tab.header=<newline><glyph:logo-large><newline><brand>nordtal.eu</brand> <faint>|</faint> <emphasis>Season {season.number}</emphasis><newline>
