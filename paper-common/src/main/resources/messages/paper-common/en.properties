# paper-common, English: the fallback for every other language, so keep it complete.
#
# The five lines every Paper server writes: chat, join, leave, death and advancement. A process loads
# this root underneath its own, so a server rewords one in its own bundle.
#
# Glyphs are {parameters}, drawn white so the colour here is the colour they come out. A <_name> tag
# is a slot for something that is already a component, such as the speaker's flag.

# The chat line: composition, hairline rule, message, in #d0d0d8 so a name or a number still stands out.
system.chat.line=<_sender> <#4e5668>{separator}</#4e5668> <#d0d0d8><_message>

system.join=<#8ba888>{icon}</#8ba888> <gray><_player> joined.</gray>
system.leave=<#a8888b>{icon}</#a8888b> <gray><_player> left.</gray>

# The death line, also the hunger games kill feed. <_death> is vanilla's own message as a component,
# so each client renders it in its reader's language.
system.death=<#a8888b>{icon}</#a8888b> <gray><_death></gray>

system.advancement=<#b08a4a>{icon}</#b08a4a> <gray><_player> earned <white><_advancement></white>.</gray>

# A login refused because the server cannot read who is logging in. English only by necessity: without
# the identity there is no language to read.
login.database-unreachable=<#a8888b>The server cannot reach its database right now.</#a8888b> \
  <gray>Logging in would lose your progress. Please try again in a few minutes.</gray>

# What a player is told about a command that does not exist for them.
command.unknown=That command does not exist.

# The answers every server's admin actions share: the console and Steward read them.
admin.reloaded=The settings and the message bundles were reloaded.
admin.not-reloaded=Not everything was reloaded, and what was not keeps running as it was: {problems}
admin.confirm=This cannot be undone. Run {command} confirm to go ahead.
admin.failed=That did not work, and nothing was changed. The log says why.
command.help.header={command} takes one of these:
command.help.line=\ \ {usage} - {what}
command.help.usage=Usage: {usage}
command.help.what={what}
