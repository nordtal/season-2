# paper-common - English. This file is the fallback for every other language: a key that is missing
# here shows up on screen as the key itself, so keep it complete.
#
# THE FIVE LINES EVERY PAPER SERVER WRITES, and the reason they are here rather than in smp: they
# were smp's until 2026-09-09, and the hunger games - the season's flagship event, the one every
# player attends at the same moment - had vanilla chat, vanilla join and leave and vanilla death
# messages, in yellow, in one language, with no flag on anybody (finding 149).
#
# A process loads this root UNDERNEATH its own, the same way it loads messages/commands: later roots
# win, so a server that wants to reword one of these does it in its own bundle without editing this
# file. Nothing does today, and a key here that is silently shadowed is worth being deliberate
# about - it is the mechanism, not a bug.
#
# Every glyph is a {parameter} because Glyphs is the only place in this repository that names a code
# point; the icons are drawn white on purpose, so the colour written here is the colour they come
# out. A <_name> tag is a slot for something that is ALREADY a component and cannot survive being
# flattened to text - the speaker's flag and crest, vanilla's own death message, an advancement's
# title. The underscore is what tells them apart from a MiniMessage style tag at a glance.

# The chat line: composition, hairline rule, message. The message is #d0d0d8 rather than <white>:
# white is what a name and a number wear here, and a wall of chat in it makes every line shout as
# loudly as the one number somebody was looking for.
system.chat.line=<_sender> <#4e5668>{separator}</#4e5668> <#d0d0d8><_message>

system.join=<#8ba888>{icon}</#8ba888> <gray><_player> joined.</gray>
system.leave=<#a8888b>{icon}</#a8888b> <gray><_player> left.</gray>

# The death line, and on the hunger games it is the kill feed. <_death> is VANILLA's own message,
# kept as a component so that every reader's client renders it in that reader's language, with the
# mob's name and the killer's weapon in it. Fifty hand-written keys per language could not match
# that and would go stale on the next Minecraft release.
system.death=<#a8888b>{icon}</#a8888b> <gray><_death></gray>

system.advancement=<#b08a4a>{icon}</#b08a4a> <gray><_player> earned <white><_advancement></white>.</gray>
