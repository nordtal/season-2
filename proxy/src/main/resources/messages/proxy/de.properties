motd.misconfigured=<#4a63d8><bold>nordtal.eu</bold></#4a63d8><newline><#a8888b>Falsch konfiguriert - niemand kann joinen, bis ein Admin das behoben hat.</#a8888b>

# --- die beiden Season-Daten, vom Proxy aus gesetzt (Notweg; der normale Weg ist Discord) ---

# ---------------------------------------------------------------- /network reload
# gate.yml, pack.yml, network.yml und database.yml werden NICHT neu gelesen - warum, steht in
# NetworkCommand.

# ------------------------------------------------------------ private Nachrichten
#
# /msg, /whisper und /r, vom Proxy getragen, damit ein Gespräch einen Serverwechsel überlebt.
# ZWEI ZEILEN PRO NACHRICHT, jede in der Sprache dessen, der sie liest.
#
# <_message> ist der Text der anderen Person, als KOMPONENTE eingesetzt: er läuft nie durch den
# MiniMessage-Parser, also kann jemand namens <red> keinen fremden Chat einfärben. Der Unterstrich
# unterscheidet einen Platz für eine Komponente von einem Auszeichnungs-Tag.
#
# {flag} und {admin} sind GLYPHEN aus Glyphs in :common, als Parameter eingesetzt - ein Zeichen aus
# dem Private-Use-Bereich steht nie in einer .properties-Datei. Beide liegen in minecraft:default
# und nennen deshalb keine Schrift; eine Glyphe aus einer der drei nordtal:-Schriften müsste das.
chat.msg.sent=<gray><italic>an {flag} <white>{name}</white>{admin}:</italic> <#d0d0d8><_message></#d0d0d8></gray>
chat.msg.received=<gray><italic>von {flag} <white>{name}</white>{admin}:</italic> <#d0d0d8><_message></#d0d0d8></gray>

# Die Sätze, die die drei Befehle sagen, wenn nichts zugestellt werden kann, und die drei, die
# sagen, wofür sie da sind. Sie standen bis season-2-ops/155 im gemeinsamen Bündel von :commands -
# seitdem sind /msg, /whisper und /r natives Brigadier in diesem Modul, und ein Schlüssel, den
# ausserhalb des Proxys niemand rendert, gehört in das Bündel des Proxys.

command.describe.msg=Schickt eine private Zeile an jemanden, egal wo im Netzwerk. Vanillas eigener \
  Befehl erreicht nur den Server, auf dem du gerade stehst.
command.describe.whisper=Dasselbe wie /msg, unter dem Namen, den die Hälfte der Leute tippt.
command.describe.r=Antwortet dem, der dir zuletzt geschrieben hat, oder dem, dem du zuletzt \
  geschrieben hast. Nichts davon wird gespeichert: ein Neustart des Netzwerks vergisst es.
chat.no-partner=Dir hat noch niemand geschrieben, und du hast niemandem geschrieben - es gibt also \
  niemanden zu antworten. Nimm /msg mit dem Namen.
chat.msg.self=Du kannst dir nicht selbst schreiben. Was auch immer du sagen wolltest - du \
  weißt es schon.
chat.failed=Das ist nicht durchgegangen. Es wurde nichts zugestellt und nichts gespeichert.

# ---------------------------------------------------------------- /discord und /rules
#
# Zwei Befehle, die nur etwas ausgeben. Der Text steht hier und nicht im geteilten Bundle von
# :commands, weil er einen anklickbaren Link und Farbe will und jenes Bundle auch in Discord
# gelesen wird. {invite} ist gate.yml#discord-invite-url - dieselbe Zeichenkette, die jeder
# Login-Bildschirm benutzt.

info.discord=<gray>Im nordtal-Discord laufen Zugang, Sprachen und die Anmeldung zu den Hunger \
  Games.</gray><newline><click:open_url:'{invite}'><#4a63d8><underlined>{invite}</underlined></#4a63d8></click>

# DIE REGELN SIND NOCH NICHT GESCHRIEBEN, und dieser Text sagt das absichtlich. Ein /rules, das
# etwas Plausibles antwortet, ist ein /rules, das niemand noch einmal prüft. Ersetzen ist eine
# Änderung an dieser Datei und braucht kein Release.
#
# Eine Ausnahme steht schon jetzt, vor dem Rest (season-2-ingame/21, Till 2026-09-15): ein Grab ist
# für jeden offen, nicht nur für den, dem es gehört, und das steht hier, weil eine Mechanik, die
# Leute gegeneinander aufbringt, vorher sichtbar sein muss und nicht erst hinterher erklärt wird.
info.rules=<red><bold>PLATZHALTER - DIE REGELN SIND NOCH NICHT GESCHRIEBEN.</bold></red><newline><gray>Nichts auf diesem Bildschirm ist eine Regel, mit einer Ausnahme, die schon gilt: Ein Grab \
  ist offen für jeden - wer zuerst da ist, behält, was darin liegt.</gray><newline><gray>Frag im \
  Discord, bis der Rest etwas anderes steht:</gray><newline><click:open_url:'{invite}'><#4a63d8><underlined>{invite}</underlined></#4a63d8></click>
