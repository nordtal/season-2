# proxy, Deutsch. Als UTF-8 gelesen; ein fehlender Schlüssel fällt auf en.properties zurück.

# ---------------------------------------------------------------- nicht verknüpft
gate.not-linked=<warn>Verknüpfe zuerst deinen Minecraft-Account.</warn> <muted>Gib diesen Code im \
  #link-Kanal auf Discord ein: <emphasis>{code}</emphasis></muted>
gate.not-linked.invite=<muted>Noch nicht auf dem Discord-Server? Besuch <emphasis>{invite}</emphasis></muted>

# ---------------------------------------------------------------- kein Mitglied oder gebannt
gate.not-member=<bad>Du musst Mitglied des</bad> <brand>nordtal</brand><bad>-Discord-Servers sein, um hier zu spielen.</bad>
gate.not-member.invite=<muted>Hier beitreten: <emphasis>{invite}</emphasis></muted>

# ---------------------------------------------------------------- Verknüpfung während der Sitzung gelöst
gate.unlinked=<bad>Dein Minecraft-Account ist nicht mehr mit einem Discord-Account verknüpft.</bad> \
  <muted>Verbinde dich erneut, um einen neuen Verknüpfungscode zu bekommen.</muted>

# ---------------------------------------------------------------- kein aktiver Zugang
gate.no-access=<bad>Du hast gerade keinen aktiven Zugang zu</bad> <brand>nordtal</brand><bad>.</bad> \
  <muted>Kauf einen Zeitraum im Beitragskanal auf Discord.</muted>
gate.no-access.invite=<muted>Discord: <emphasis>{invite}</emphasis></muted>

# ---------------------------------------------------------------- Wartung, ohne Limbo zum Warten
# Nur wenn es keinen limbo-Server gibt; sonst wartet ein Mitglied während der Wartung in limbo.
gate.maintenance=<brand>nordtal</brand> <warn>ist gerade wegen Wartungsarbeiten geschlossen.</warn> \
  <muted>Auf Discord steht, wann es weitergeht.</muted>

# ---------------------------------------------------------------- Server der Phase fehlt
gate.no-server=<bad>Der Server für die aktuelle Phase ist nicht verfügbar.</bad> <muted>Das muss \
  ein Admin beheben - bitte versuch es später noch einmal.</muted>

# ---------------------------------------------------------------- Datenbank nicht erreichbar
gate.trouble=<bad>Wir haben gerade Probleme, das Zugangssystem zu erreichen.</bad> <muted>Bitte \
  versuch es in ein paar Minuten noch einmal.</muted>

# Verbindung zum Server verloren
# Niemand hat etwas entschieden, also gibt es nichts zu zitieren; diese Zeile ist die ganze Erklärung.
gate.connection-lost=<bad>Die Verbindung zum Server ist abgerissen.</bad> <muted>Du bist zurück \
  im Warteraum und wirst wieder hinübergeschickt, sobald er antwortet.</muted>

# ---------------------------------------------------------------- Konfiguration kaputt
gate.misconfigured=<bad>Das Netzwerk ist falsch konfiguriert.</bad> <muted>Niemand kann hinein, \
  bis ein Admin das behoben hat.</muted>

# ---------------------------------------------------------------- der Proxy wird gleich bewegt
gate.restarting=<brand>nordtal</brand> <warn>startet gerade neu.</warn> <muted>Versuch es gleich \
  noch einmal - es geht nichts verloren, die Server laufen weiter.</muted>

# ---------------------------------------------------------------- während der Sitzung
gate.expiry.warning=<warn>Dein Zugang läuft in <emphasis>{minutes}</emphasis> {minutes, plural, one {Minute} other {Minuten}} ab.</warn> <muted>Kauf \
  im Beitragskanal auf Discord nach, um weiterzuspielen.</muted>
gate.expiry.expired=<bad>Dein Zugang ist gerade abgelaufen.</bad> <muted>Kauf im Beitragskanal auf \
  Discord einen neuen Zeitraum, um weiterzuspielen.</muted>

# ---------------------------------------------------------------- die Resource-Pack-Station
pack.prompt=<brand>nordtal</brand> <muted>braucht sein Resource-Pack: Tab-Liste, Namensschilder, \
  Tafeln und das ganze HUD werden damit gezeichnet.</muted>
pack.declined=<bad>Ohne das Resource-Pack kannst du hier nicht spielen.</bad> <muted>Verbinde dich \
  erneut und nimm es an - es sind ein paar Megabyte und es zeichnet Namensschilder, Tafeln und HUD.</muted>
pack.failed-download=<bad>Das Resource-Pack konnte nicht heruntergeladen werden.</bad> <muted>Das \
  liegt meistens an der Verbindung - bitte verbinde dich gleich noch einmal.</muted>
pack.invalid-url=<bad>Das Resource-Pack ist gerade nicht erreichbar.</bad> <muted>Das muss ein \
  Admin beheben - bitte versuch es später noch einmal.</muted>
pack.timeout=<bad>Dein Client hat auf das Resource-Pack-Angebot nie geantwortet.</bad> <muted>Wir \
  können dich deshalb nicht hereinlassen - verbinde dich erneut, um es noch einmal zu versuchen.</muted>

# ---------------------------------------------------------------- der Neustart-Countdown
# Alle im Netzwerk sehen diese Zeilen; ein Lauf aus Discord wird genauso angekündigt.
# {seconds} ist die tatsächlich verbleibende Zeit. <emphasis>{what}</emphasis> ist der Dienst oder das Netzwerk und steht am Satzanfang.
restart.countdown.update=<warn><emphasis>{what}</emphasis> wird in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}} aktualisiert.</warn>
restart.countdown.recreate=<warn><emphasis>{what}</emphasis> startet in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}} neu.</warn>
restart.countdown.backup=<warn><emphasis>{what}</emphasis> wird in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}} gesichert.</warn>
restart.countdown.down=<warn><emphasis>{what}</emphasis> geht in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}} für eine Wartung offline.</warn>
# Der Fall ohne Warteraum: niemand wird aufgefangen, und die Zeile sagt das.
restart.countdown.maintenance=<warn>nordtal geht in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}} für eine Wartung offline.</warn>

# Die zweite Hälfte jeder Ansage, in derselben Zeile: was gleich mit dir passiert.
restart.fate.reconnect=<muted>Du siehst kurz einen Ladebildschirm und spielst danach weiter.</muted>
restart.fate.waiting-room=<muted>Du wartest so lange im Warteraum und kommst von allein zurück.</muted>
restart.fate.disconnect=<muted>Du fliegst raus - komm direkt wieder, es dauert etwa eine Minute.</muted>

# Die Namen, die ein Spieler benutzt. Ein Dienst ohne eigene Zeile erscheint unter seinem Compose-Namen.
restart.what.network=Das gesamte Netzwerk
restart.what.smp=Die SMP
restart.what.limbo=Der Warteraum
restart.what.hunger-games=Hunger Games
restart.what.proxy=Das Netzwerk

# Der Anlass als Hauptwort, für die beiden Zeilen, die sagen, dass etwas NICHT stattfindet.
restart.occasion.update=Die Aktualisierung
restart.occasion.recreate=Der Neustart
restart.occasion.backup=Die Sicherung
restart.occasion.down=Die Wartung
restart.occasion.maintenance=Die Wartung
# Die letzten zehn Sekunden als Untertitel, einmal pro Sekunde: nur die Zahl.
restart.tick=<accent>{seconds}</accent>
restart.now.update=<warn><emphasis>{what}</emphasis> wird jetzt aktualisiert.</warn>
restart.now.recreate=<warn><emphasis>{what}</emphasis> startet jetzt neu.</warn>
restart.now.backup=<warn><emphasis>{what}</emphasis> wird jetzt gesichert.</warn>
restart.now.down=<warn><emphasis>{what}</emphasis> geht jetzt offline.</warn>
restart.now.maintenance=<warn>nordtal geht jetzt offline.</warn>
restart.cancelled=<good>{occasion} wurde abgeblasen.</good> <muted>Es passiert nichts.</muted>
# Der Countdown lief ab und der Lauf scheiterte; bewusst nicht dieselbe Zeile wie abgeblasen.
restart.failed=<bad>{occasion} hat nicht geklappt.</bad> <muted>Du bleibst drin - es wird noch mal versucht.</muted>

# Einmal pro Countdown, nur für Spielende während eines Proxy-Tauschs: Sprachchat überlebt ihn nicht.
restart.voice=<muted>Der Sprachchat setzt für den Moment des Wechsels aus und kommt von selbst zurück.</muted>

# der Rückweg
# Aus dem Warteraum eine Chatzeile; vom Standby-Proxy Chat und ein gezählter Untertitel.
return.waiting-room=<good><emphasis>{what}</emphasis> ist wieder da.</good> <muted>Du wirst jetzt zurückgeschoben.</muted>
return.countdown=<good>Das Netzwerk ist wieder da.</good> <muted>Du wirst in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}} zurückverbunden.</muted>
return.now=<good>Du wirst jetzt zurückverbunden.</good>

# ---------------------------------------------------------------- Netzwerk ist voll
gate.full=<brand>nordtal</brand> <warn>ist gerade voll - <emphasis>{online}</emphasis> von \
  <emphasis>{max}</emphasis> Spielern sind drauf.</warn> <muted>Versuch es in ein paar Minuten nochmal, es loggt sich ständig jemand aus.</muted>

# ---------------------------------------------------------------- vor der Eröffnung
gate.pre-launch.buy=<brand>nordtal</brand> <warn>hat noch nicht eröffnet.</warn> <muted>Du kannst \
  deinen ersten Monat aber schon jetzt im Beitragskanal auf Discord kaufen - dann gehört dir die SMP, sobald das Event vorbei ist.</muted>
gate.pre-launch.ready=<brand>nordtal</brand> <warn>hat noch nicht eröffnet.</warn> <muted>Bei dir \
  ist alles fertig: Account verknüpft, Zugang bezahlt. Wir sehen uns beim Start.</muted>

gate.countdown=<muted>Das Netzwerk öffnet in <emphasis>{countdown}</emphasis>.</muted>
gate.countdown.unknown=<muted>Ein Eröffnungstermin steht noch nicht fest - schau auf Discord.</muted>

# ---------------------------------------------------------------- wie ein Countdown gelesen wird
countdown.days={days, plural, one {# Tag} other {# Tagen}} {hours, plural, one {# Stunde} other {# Stunden}}
countdown.hours={hours, plural, one {# Stunde} other {# Stunden}} {minutes, plural, one {# Minute} other {# Minuten}}
countdown.minutes={minutes, plural, one {# Minute} other {# Minuten}}
countdown.imminent=jedem Moment
# Kein Eröffnungstermin gesetzt. Reiner Text ohne Tags, siehe en.properties.
countdown.unknown=noch nicht angekündigt

# ---------------------------------------------------------------- was der Server-Browser zeigt
# Was die Serverliste in jeder Phase zeigt, in der Sprache des Netzwerks: ein Ping hat keinen Leser.
# Der Client zeichnet die Liste, bevor er das Pack hat, also gehört hier keine Glyphe hin.
motd.pre-launch=<brand><bold>nordtal.eu</bold></brand><newline><muted>{season.name} öffnet in <emphasis>{list.countdown}</emphasis></muted>
motd.pre-event=<brand><bold>nordtal.eu</bold></brand><newline><muted>Hunger Games: <emphasis>{list.hgParticipants}</emphasis> Spieler in <emphasis>{list.hgTeams}</emphasis> {list.hgTeams, plural, one {Team} other {Teams}}</muted>
motd.start-event=<brand><bold>nordtal.eu</bold></brand><newline><muted>Hunger Games: <emphasis>{list.hgAlive}</emphasis> von <emphasis>{list.hgParticipants}</emphasis> leben noch</muted>
motd.smp=<brand><bold>nordtal.eu</bold></brand><newline><muted>{season.name} läuft - <emphasis>{list.smpMilestonesDone}</emphasis> von <emphasis>{list.smpMilestones}</emphasis> Meilensteinen geschafft</muted>
motd.maintenance=<brand><bold>nordtal.eu</bold></brand><newline><muted>Wartung - gleich zurück, die Staffel geht weiter</muted>
motd.misconfigured=<brand><bold>nordtal.eu</bold></brand><newline><bad>Falsch konfiguriert - niemand kann joinen, bis ein Admin das behoben hat.</bad>

# ------------------------------------------------------------ private Nachrichten
# /msg, /whisper und /r, vom Proxy getragen; zwei Zeilen pro Nachricht, jede in der Sprache des Lesers.
# {message} ist eine Komponente und läuft nie durch MiniMessage. {flag} und {admin} sind Glyphen aus Glyphs.
chat.msg.sent=<muted><italic>an {flag} <emphasis>{partner.name}</emphasis>{admin}:</italic> <neutral>{message}</neutral></muted>
chat.msg.received=<muted><italic>von {flag} <emphasis>{partner.name}</emphasis>{admin}:</italic> <neutral>{message}</neutral></muted>

# Was die drei Befehle sagen, wenn nichts zugestellt werden kann, und wofür sie da sind.

command.describe.msg=Schickt eine private Zeile an jemanden, egal wo im Netzwerk. Vanillas eigener \
  Befehl erreicht nur den Server, auf dem du gerade stehst.
command.describe.whisper=Dasselbe wie /msg, unter dem Namen, den die Hälfte der Leute tippt.
command.describe.r=Antwortet dem, der dir zuletzt geschrieben hat, oder dem, dem du zuletzt \
  geschrieben hast. Nichts davon wird gespeichert: ein Neustart des Netzwerks vergisst es.
chat.no-partner=Dir hat noch niemand geschrieben, und du hast niemandem geschrieben - es gibt also \
  niemanden zu antworten. Nimm /msg mit dem Namen.
chat.msg.self=Du kannst dir nicht selbst schreiben. Was auch immer du sagen wolltest - du \
  weißt es schon.
chat.failed=Das ist nicht durchgegangen. Es wurde nichts zugestellt und nichts gespeichert.

# ---------------------------------------------------------------- /discord und /rules
# {invite} ist gate#discord-invite-url.

info.discord=<muted>Im nordtal-Discord laufen Zugang, Sprachen und die Anmeldung zu den Hunger \
  Games.</muted><newline><click:open_url:'{invite}'><brand><underlined>{invite}</underlined></brand></click>

# Die Regeln sind noch nicht geschrieben, und der Text sagt das absichtlich. Ersetzen braucht kein Release.
# Dass ein Grab für jeden offen ist, steht schon hier, damit es vorher sichtbar ist.
info.rules=<bad><bold>PLATZHALTER - DIE REGELN SIND NOCH NICHT GESCHRIEBEN.</bold></bad><newline><muted>Nichts auf diesem Bildschirm ist eine Regel, mit einer Ausnahme, die schon gilt: Ein Grab \
  ist offen für jeden - wer zuerst da ist, behält, was darin liegt.</muted><newline><muted>Frag im \
  Discord, bis der Rest etwas anderes steht:</muted><newline><click:open_url:'{invite}'><brand><underlined>{invite}</underlined></brand></click>

command.unknown=Diesen Befehl gibt es nicht.
command.player-offline=Auf diesem Server ist niemand mit diesem Namen online. Gesucht wird nach \
  dem genauen Namen, und nur unter denen, die gerade hier sind.
command.help.usage=Syntax: {usage}
command.help.what={what}
command.not-from-console=Dieser Befehl lässt sich nicht von der Konsole ausführen. Er hält fest, \
  wer die Entscheidung getroffen hat, und die Konsole ist niemand Bestimmtes - führe ihn im Spiel \
  oder in Discord aus.
