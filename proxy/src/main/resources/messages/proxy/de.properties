# Deutsche Texte des Proxys. Die Datei wird als UTF-8 gelesen. Ein fehlender Schlüssel fällt auf en.properties zurück.

# nicht verknüpft
gate.not-linked=<warn>Verknüpfe zuerst deinen Minecraft-Account.</warn> <muted>Gib diesen Code im \
  #link-Kanal auf Discord ein: <emphasis>{code}</emphasis></muted>
gate.not-linked.invite=<muted>Du bist noch nicht auf dem Discord-Server. Tritt hier bei: <emphasis>{invite}</emphasis></muted>

# kein Mitglied oder gebannt
gate.not-member=<bad>Du musst Mitglied des</bad> <brand>Nordtal</brand><bad>-Discord-Servers sein, um hier zu spielen.</bad>
gate.not-member.invite=<muted>Tritt dem Server hier bei: <emphasis>{invite}</emphasis></muted>

# Verknüpfung während der Sitzung gelöst
gate.unlinked=<bad>Dein Minecraft-Account ist nicht mehr mit einem Discord-Account verknüpft.</bad> \
  <muted>Verbinde dich erneut, um einen neuen Verknüpfungscode zu bekommen.</muted>

# kein aktiver Zugang
gate.no-access=<bad>Du hast gerade keinen aktiven Zugang zu</bad> <brand>Nordtal</brand><bad>.</bad> \
  <muted>Kauf einen Zeitraum im Beitragskanal auf Discord.</muted>
gate.no-access.invite=<muted>Tritt dem Discord-Server hier bei: <emphasis>{invite}</emphasis></muted>

# Wartung, ohne Limbo zum Warten
# Der Proxy zeigt diesen Text nur, wenn kein limbo-Server registriert ist. Sonst wartet ein Mitglied in limbo.
gate.maintenance=<brand>Nordtal</brand> <warn>ist wegen Wartung geschlossen.</warn> \
  <muted>Auf Discord steht, wann es wieder öffnet.</muted>

# Server der Phase fehlt
gate.no-server=<bad>Der Server für die aktuelle Phase ist nicht verfügbar.</bad> <muted>Ein \
  Admin muss das beheben. Versuch es später noch einmal.</muted>

# Datenbank nicht erreichbar
gate.trouble=<bad>Das Zugangssystem ist gerade nicht erreichbar.</bad> <muted>Versuch \
  es in ein paar Minuten noch einmal.</muted>

# Verbindung zum Server verloren
# Keine Person hat etwas entschieden, also gibt es nichts zu zitieren. Dieser Text ist die ganze Erklärung.
gate.connection-lost=<bad>Die Verbindung zum Server ist abgebrochen.</bad> <muted>Du bist zurück \
  im Warteraum. Du kehrst zum Server zurück, sobald er antwortet.</muted>

# Konfiguration kaputt
gate.misconfigured=<bad>Die Einstellungen des Netzwerks sind falsch.</bad> <muted>Niemand kann \
  beitreten, bis ein Admin sie korrigiert.</muted>

# der Proxy wird gleich bewegt
gate.restarting=<brand>Nordtal</brand> <warn>startet neu.</warn> <muted>Versuch es gleich \
  noch einmal. Es geht nichts verloren, und die Server laufen weiter.</muted>

# während der Sitzung
gate.expiry.warning=<warn>Dein Zugang endet in <emphasis>{minutes}</emphasis> {minutes, plural, one {Minute} other {Minuten}}.</warn> <muted>Kauf \
  im Beitragskanal auf Discord nach, um weiterzuspielen.</muted>
gate.expiry.expired=<bad>Dein Zugang ist abgelaufen.</bad> <muted>Kauf im Beitragskanal auf \
  Discord einen neuen Zeitraum, um weiterzuspielen.</muted>

# die Resource-Pack-Station
pack.prompt=<brand>Nordtal</brand> <muted>braucht sein Resource-Pack. Das Pack zeichnet die \
  Tab-Liste, die Namensschilder, die Tafeln und das ganze HUD.</muted>
pack.declined=<bad>Ohne das Resource-Pack kannst du hier nicht spielen.</bad> <muted>Verbinde dich \
  erneut und nimm es an. Es ist ein paar Megabyte groß und zeichnet Namensschilder, Tafeln und HUD.</muted>
pack.failed-download=<bad>Das Resource-Pack konnte nicht heruntergeladen werden.</bad> <muted>Meistens \
  liegt das an der Verbindung. Verbinde dich gleich noch einmal.</muted>
pack.invalid-url=<bad>Das Resource-Pack ist gerade nicht erreichbar.</bad> <muted>Ein \
  Admin muss das beheben. Versuch es später noch einmal.</muted>
pack.timeout=<bad>Dein Client hat nicht auf das Resource-Pack-Angebot geantwortet.</bad> <muted>Ohne \
  Antwort kannst du nicht beitreten. Verbinde dich erneut, um es noch einmal zu versuchen.</muted>

# der Neustart-Countdown
# Alle Spieler im Netzwerk sehen diese Texte. Ein Lauf aus Discord wird genauso angekündigt.
# {seconds} ist die tatsächlich verbleibende Zeit. <emphasis>{what}</emphasis> ist der Dienst oder das Netzwerk und steht am Satzanfang.
restart.countdown.update=<warn><emphasis>{what}</emphasis> wird in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}} aktualisiert.</warn>
restart.countdown.recreate=<warn><emphasis>{what}</emphasis> startet in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}} neu.</warn>
restart.countdown.backup=<warn><emphasis>{what}</emphasis> wird in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}} gesichert.</warn>
restart.countdown.down=<warn><emphasis>{what}</emphasis> wird in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}} für eine Wartung gestoppt.</warn>
# Das ist der Fall ohne Warteraum: Kein Server hält die Spieler während des Stopps.
restart.countdown.maintenance=<warn>Nordtal wird in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}} für eine Wartung gestoppt.</warn>

# Die zweite Hälfte jeder Ansage, in derselben Zeile. Sie sagt, was mit dem Spieler passiert.
restart.fate.reconnect=<muted>Du siehst kurz einen Ladebildschirm und spielst danach weiter.</muted>
restart.fate.waiting-room=<muted>Du wartest im Warteraum und kommst automatisch zurück.</muted>
restart.fate.disconnect=<muted>Der Server trennt dich. Der Stopp dauert etwa eine Minute. Komm sofort wieder.</muted>

# Die Namen, die Spieler für einen Dienst benutzen. Ein Dienst ohne eigenen Text erscheint unter seinem Compose-Namen.
restart.what.network=Das gesamte Netzwerk
restart.what.smp=Die SMP
restart.what.limbo=Der Warteraum
restart.what.hunger-games=Hunger Games
restart.what.proxy=Das Netzwerk
restart.what.other={service}

# Der Anlass als Hauptwort, für die beiden Texte, die sagen, dass der Anlass nicht stattfindet.
restart.occasion.update=Die Aktualisierung
restart.occasion.recreate=Der Neustart
restart.occasion.backup=Die Sicherung
restart.occasion.down=Die Wartung
restart.occasion.maintenance=Die Wartung
# In den letzten zehn Sekunden zeigt der Untertitel einmal pro Sekunde nur die Zahl.
restart.tick=<accent>{seconds}</accent>
restart.now.update=<warn><emphasis>{what}</emphasis> wird jetzt aktualisiert.</warn>
restart.now.recreate=<warn><emphasis>{what}</emphasis> startet jetzt neu.</warn>
restart.now.backup=<warn><emphasis>{what}</emphasis> wird jetzt gesichert.</warn>
restart.now.down=<warn><emphasis>{what}</emphasis> wird jetzt gestoppt.</warn>
restart.now.maintenance=<warn>Nordtal wird jetzt gestoppt.</warn>
restart.cancelled=<good>{occasion} wurde abgesagt.</good> <muted>Es passiert nichts.</muted>
# Der Countdown ist abgelaufen und der Lauf ist danach gescheitert. Der Text unterscheidet sich absichtlich vom Text für abgesagt.
restart.failed=<bad>{occasion} ist fehlgeschlagen.</bad> <muted>Du bleibst auf dem Server. Nordtal versucht es noch einmal.</muted>

# Der Proxy zeigt diesen Text einmal pro Countdown, nur Spielern, die beim Tausch des Proxys online sind, weil der Sprachchat den Tausch nicht übersteht.
restart.voice=<muted>Der Sprachchat setzt während des Wechsels kurz aus und kehrt von selbst zurück.</muted>

# der Rückweg
# Beim Verlassen des Warteraums erscheint eine Chatzeile. Beim Verlassen des Standby-Proxys erscheinen eine Chatzeile und ein zählender Untertitel.
return.waiting-room=<good><emphasis>{what}</emphasis> ist wieder da.</good> <muted>Du kehrst jetzt dorthin zurück.</muted>
return.countdown=<good>Das Netzwerk ist wieder da.</good> <muted>Du verbindest dich in <emphasis>{seconds}</emphasis> {seconds, plural, one {Sekunde} other {Sekunden}} neu.</muted>
return.now=<good>Du verbindest dich jetzt neu.</good>

# Netzwerk ist voll
gate.full=<brand>Nordtal</brand> <warn>ist voll: <emphasis>{online}</emphasis> von \
  <emphasis>{max}</emphasis> Spielern sind online.</warn> <muted>Oft verlässt jemand das Netzwerk. Versuch es in ein paar Minuten noch einmal.</muted>

# vor der Eröffnung
gate.pre-launch.buy=<brand>Nordtal</brand> <warn>hat noch nicht eröffnet.</warn> <muted>Du kannst \
  deinen ersten Monat jetzt im Beitragskanal auf Discord kaufen. Dein Zugang zur SMP beginnt, wenn das Event vorbei ist.</muted>
gate.pre-launch.ready=<brand>Nordtal</brand> <warn>hat noch nicht eröffnet.</warn> <muted>Dein Account \
  ist verknüpft und dein Zugang ist bezahlt. Du musst nichts mehr tun. Verbinde dich, sobald das Netzwerk öffnet.</muted>

gate.countdown=<muted>Das Netzwerk öffnet in <emphasis>{countdown}</emphasis>.</muted>
gate.countdown.unknown=<muted>Nordtal hat noch keinen Eröffnungstermin bekannt gegeben. Schau auf Discord nach Neuigkeiten.</muted>

# wie ein Countdown gelesen wird
countdown.days={days, plural, one {# Tag} other {# Tagen}} {hours, plural, one {# Stunde} other {# Stunden}}
countdown.hours={hours, plural, one {# Stunde} other {# Stunden}} {minutes, plural, one {# Minute} other {# Minuten}}
countdown.minutes={minutes, plural, one {# Minute} other {# Minuten}}
countdown.imminent=jedem Moment
# Es ist kein Eröffnungstermin gesetzt. Der Wert ist reiner Text ohne Tags, siehe en.properties.
countdown.unknown=noch nicht angekündigt

# was der Server-Browser zeigt
# Diese Texte erscheinen in jeder Phase in der Serverliste, in der Sprache des Netzwerks, weil ein Ping keinen Leser hat.
# Der Client zeichnet die Liste, bevor er das Resource-Pack hat, darum enthalten die Texte keine Glyphe.
motd.pre-launch=<brand><bold>nordtal.eu</bold></brand><newline><muted>{season.name} öffnet in <emphasis>{list.countdown}</emphasis></muted>
motd.pre-event=<brand><bold>nordtal.eu</bold></brand><newline><muted>Hunger Games hat <emphasis>{list.hgParticipants}</emphasis> Spieler in <emphasis>{list.hgTeams}</emphasis> {list.hgTeams, plural, one {Team} other {Teams}}</muted>
motd.start-event=<brand><bold>nordtal.eu</bold></brand><newline><muted>In Hunger Games leben noch <emphasis>{list.hgAlive}</emphasis> von <emphasis>{list.hgParticipants}</emphasis> Spielern</muted>
motd.smp=<brand><bold>nordtal.eu</bold></brand><newline><muted>{season.name} läuft. Es sind <emphasis>{list.smpMilestonesDone}</emphasis> von <emphasis>{list.smpMilestones}</emphasis> {list.smpMilestones, plural, one {Meilenstein} other {Meilensteinen}} geschafft</muted>
motd.maintenance=<brand><bold>nordtal.eu</bold></brand><newline><muted>Die Wartung endet bald. Die Staffel geht weiter</muted>
motd.misconfigured=<brand><bold>nordtal.eu</bold></brand><newline><bad>Einstellungen falsch. Niemand kann beitreten, bis ein Admin sie korrigiert.</bad>

# private Nachrichten
# Der Proxy trägt /msg, /whisper und /r, damit ein Gespräch einen Serverwechsel übersteht.
# Jede Nachricht zeigt zwei Zeilen, jede in der Sprache des Lesers. {message} ist eine Komponente, die der Parser nie liest.
# {flag} und {admin} sind Glyphen aus Glyphs.
chat.msg.sent=<muted><italic>an {flag} <emphasis>{partner.name}</emphasis>{admin}:</italic> <neutral>{message}</neutral></muted>
chat.msg.received=<muted><italic>von {flag} <emphasis>{partner.name}</emphasis>{admin}:</italic> <neutral>{message}</neutral></muted>

# Diese Texte beschreiben die drei Befehle und sagen, warum ein Befehl nichts sendet.

command.describe.msg=/msg schickt eine private Zeile an einen Spieler irgendwo im Netzwerk. Der \
  Vanilla-Befehl erreicht nur den Server, auf dem du stehst.
command.describe.whisper=/whisper ist ein anderer Name für /msg.
command.describe.r=/r antwortet dem Spieler, der dir zuletzt geschrieben hat, oder dem Spieler, dem du zuletzt \
  geschrieben hast. Das Netzwerk speichert keinen der beiden Namen, darum vergisst ein Neustart sie.
chat.no-partner=Dir hat niemand geschrieben, und du hast niemandem geschrieben, darum hat /r \
  niemanden zum Antworten. Nutze /msg mit dem Namen eines Spielers.
chat.msg.self=Du kannst dir nicht selbst schreiben.
chat.failed=Die Nachricht wurde nicht gesendet. Es wurde nichts zugestellt oder gespeichert.

# /discord und /rules
# {invite} ist gate#discord-invite-url.

info.discord=<muted>Auf dem Nordtal-Discord-Server regelst du Zugang, Sprache und die Anmeldung zu den Hunger \
  Games.</muted><newline><click:open_url:'{invite}'><hover:show_text:'{invite}'><brand><underlined>Zum Nordtal-Discord</underlined></brand></hover></click>

# Die Regeln des Netzwerks: höchstens drei Sätze, in beiden Sprachen dieselben. {invite} ist gate#discord-invite-url.
info.rules=<brand><bold>Regeln des Netzwerks</bold></brand> \
  <newline><muted>Wir spielen unter Freunden, darum gibt es eine Regel: Behandle jeden Spieler anständig, spiel fair \
  und nutze PvP auf der SMP nur, wenn beide Seiten es wollen. Stell Fragen auf \
  Discord:</muted> \
  <newline><click:open_url:'{invite}'><hover:show_text:'{invite}'><brand><underlined>Zum Nordtal-Discord</underlined></brand></hover></click>

command.unknown=Diesen Befehl gibt es nicht.
command.player-offline=Auf diesem Server ist kein Spieler mit diesem Namen online. Die Suche gilt \
  für den genauen Namen und nur für Spieler, die gerade auf diesem Server sind.
command.help.usage=Nutze den Befehl so: {usage}
command.help.what={what}
command.not-from-console=Die Konsole kann diesen Befehl nicht ausführen. Der Befehl hält fest, \
  wer die Entscheidung getroffen hat, und die Konsole ist keine Person. Führe ihn im Spiel \
  oder auf Discord aus.
