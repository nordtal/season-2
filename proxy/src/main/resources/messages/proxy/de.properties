  #link-Kanal auf Discord ein: <white>{code}</white></gray>
gate.not-linked.invite=<gray>Noch nicht auf dem Discord-Server? Besuch <white>{invite}</white></gray>

# ---------------------------------------------------------------- kein Mitglied oder gebannt
gate.not-member=<#a8888b>Du musst Mitglied des <#4a63d8>nordtal</#4a63d8><#a8888b>-Discord-Servers sein, um hier zu spielen.</#a8888b>
gate.not-member.invite=<gray>Hier beitreten: <white>{invite}</white></gray>

# ---------------------------------------------------------------- Verknüpfung während der Sitzung gelöst
gate.unlinked=<#a8888b>Dein Minecraft-Account ist nicht mehr mit einem Discord-Account verknüpft.</#a8888b> \
  <gray>Verbinde dich erneut, um einen neuen Verknüpfungscode zu bekommen.</gray>

# ---------------------------------------------------------------- kein aktiver Zugang
gate.no-access=<#a8888b>Du hast gerade keinen aktiven Zugang zu <#4a63d8>nordtal</#4a63d8><#a8888b>.</#a8888b> \
  <gray>Kauf einen Zeitraum im Beitragskanal auf Discord.</gray>
gate.no-access.invite=<gray>Discord: <white>{invite}</white></gray>

# ---------------------------------------------------------------- Wartung, ohne Limbo zum Warten
# Nicht der normale Wartungsfall: seit 2026-08-31 kommt ein verknüpftes Mitglied während der Wartung
# herein und wartet in limbo. Dieser Bildschirm greift nur, wenn es keinen limbo-Server gibt.
gate.maintenance=<#4a63d8>nordtal</#4a63d8> <#b08a4a>ist gerade wegen Wartungsarbeiten geschlossen.</#b08a4a> \
  <gray>Auf Discord steht, wann es weitergeht.</gray>

# ---------------------------------------------------------------- Server der Phase fehlt
gate.no-server=<#a8888b>Der Server für die aktuelle Phase ist nicht verfügbar.</#a8888b> <gray>Das muss \
  ein Admin beheben - bitte versuch es später noch einmal.</gray>

# ---------------------------------------------------------------- Datenbank nicht erreichbar
gate.trouble=<#a8888b>Wir haben gerade Probleme, das Zugangssystem zu erreichen.</#a8888b> <gray>Bitte \
  versuch es in ein paar Minuten noch einmal.</gray>

# ---------------------------------------------------------------- Verbindung zum Server verloren
# season-2-ops/20: Die Verbindung ist abgerissen, niemand hat etwas entschieden - es gibt also
# nichts zu zitieren. Diese Zeile ist die ganze Erklärung für den Aufenthalt im Warteraum.
gate.connection-lost=<#a8888b>Die Verbindung zum Server ist abgerissen.</#a8888b> <gray>Du bist zurück \
  im Warteraum und wirst wieder hinübergeschickt, sobald er antwortet.</gray>

# ---------------------------------------------------------------- Konfiguration kaputt
gate.misconfigured=<#a8888b>Das Netzwerk ist falsch konfiguriert.</#a8888b> <gray>Niemand kann hinein, \
  bis ein Admin das behoben hat.</gray>

# ---------------------------------------------------------------- der Proxy wird gleich bewegt
gate.restarting=<#4a63d8>nordtal</#4a63d8> <#b08a4a>startet gerade neu.</#b08a4a> <gray>Versuch es gleich \
  noch einmal - es geht nichts verloren, die Server laufen weiter.</gray>

# ---------------------------------------------------------------- /phase, der Notfallbefehl
#
# Die Schlüssel stehen seit dem 2026-09-04 nicht mehr hier. /phase gibt es auf diesem Proxy und im
# Discord-Bot, und beide sagten unterschiedliche Sätze, weil sie zwei Bundles hatten; sie teilen
# sich jetzt eins, in :commands, das unter dieser Datei geladen wird. Siehe
# messages/commands/de.properties.
#
# Ein gleichnamiger Schlüssel hier gewinnt gegen den geteilten. Das ist der Mechanismus und kein
# Fehler - so würde diese Oberfläche eine geteilte Zeile für den Chat umformulieren - aber tu es
# bewusst und nie, um eine Phasen-Meldung "hinzuzufügen".

# ---------------------------------------------------------------- während der Sitzung
gate.expiry.warning=<#b08a4a>Dein Zugang läuft in <white>{minutes}</white> Minuten ab.</#b08a4a> <gray>Kauf \
  im Beitragskanal auf Discord nach, um weiterzuspielen.</gray>
gate.expiry.expired=<#a8888b>Dein Zugang ist gerade abgelaufen.</#a8888b> <gray>Kauf im Beitragskanal auf \
  Discord einen neuen Zeitraum, um weiterzuspielen.</gray>

# ---------------------------------------------------------------- die Resource-Pack-Station
pack.prompt=<#4a63d8>nordtal</#4a63d8> <gray>braucht sein Resource-Pack: Tab-Liste, Namensschilder, \
  Tafeln und das ganze HUD werden damit gezeichnet.</gray>
pack.declined=<#a8888b>Ohne das Resource-Pack kannst du hier nicht spielen.</#a8888b> <gray>Verbinde dich \
  erneut und nimm es an - es sind ein paar Megabyte und es zeichnet Namensschilder, Tafeln und HUD.</gray>
pack.failed-download=<#a8888b>Das Resource-Pack konnte nicht heruntergeladen werden.</#a8888b> <gray>Das \
  liegt meistens an der Verbindung - bitte verbinde dich gleich noch einmal.</gray>
pack.invalid-url=<#a8888b>Das Resource-Pack ist gerade nicht erreichbar.</#a8888b> <gray>Das muss ein \
  Admin beheben - bitte versuch es später noch einmal.</gray>
pack.timeout=<#a8888b>Dein Client hat auf das Resource-Pack-Angebot nie geantwortet.</#a8888b> <gray>Wir \
  können dich deshalb nicht hereinlassen - verbinde dich erneut, um es noch einmal zu versuchen.</gray>

# ---------------------------------------------------------------- der Neustart-Countdown
# Diese Zeilen sehen alle im Netzwerk, egal wo sie gerade sind - Limbo, Hunger Games oder SMP. Nur
# der Proxy sieht jeden Spieler, deshalb liegt der Countdown dort und nicht in dem Plugin, dessen
# /smp update restart ihn meistens auslöst. Ein Neustart aus Discord wird mit denselben Zeilen
# angekündigt.
#
# {seconds} ist, was WIRKLICH noch übrig ist, nicht die angefragte Zahl: der Countdown wird
# gepollt, spricht also womöglich zuerst bei 57 statt bei 60 - und 60 wäre dort um drei Sekunden
# gelogen.
# ---------------------------------------------------------------- fünf Anlässe, nicht einer
# season-2-ops/118. Bis zum 2026-09-20 sagte jede Ansage dasselbe - "das gesamte Netzwerk startet
# neu" - und das stimmte in einem von fünf Fällen. Till: "Die Countdowns und Warnungen sollten alle
# passend zur tatsächlichen jeweiligen Aktion sein."
#
# {what} ist der Dienst, um den es geht, oder das ganze Netzwerk, wenn es mehr als einer ist. Es
# steht am Satzanfang, deshalb sind die Namen unten groß geschrieben.
restart.countdown.update=<#b08a4a>{what} wird in <white>{seconds}</white> Sekunden aktualisiert.</#b08a4a>
restart.countdown.recreate=<#b08a4a>{what} startet in <white>{seconds}</white> Sekunden neu.</#b08a4a>
restart.countdown.backup=<#b08a4a>{what} wird in <white>{seconds}</white> Sekunden gesichert.</#b08a4a>
restart.countdown.down=<#b08a4a>{what} geht in <white>{seconds}</white> Sekunden für eine Wartung offline.</#b08a4a>
# Der Fall ohne Warteraum. Hier gibt es nichts, was jemanden auffängt - das gehört gesagt und nicht
# verschwiegen, denn ein Countdown, der einen Warteraum verspricht, wäre eine Lüge mit sechzig
# Sekunden Vorlauf.
restart.countdown.maintenance=<#b08a4a>nordtal geht in <white>{seconds}</white> Sekunden für eine Wartung offline.</#b08a4a>

# Die zweite Hälfte jeder Ansage: was gleich mit DIR passiert. Steht in der Zeile hinter dem Satz
# oben. Wen ein Lauf gar nicht betrifft, bekommt keine dieser Zeilen - es gibt nichts zu sagen.
restart.fate.reconnect=<gray>Du siehst kurz einen Ladebildschirm und spielst danach weiter.</gray>
restart.fate.waiting-room=<gray>Du wartest so lange im Warteraum und kommst von allein zurück.</gray>
restart.fate.disconnect=<gray>Du fliegst raus - komm direkt wieder, es dauert etwa eine Minute.</gray>

# Die Namen, die ein Spieler benutzt. Ein Dienst ohne eigene Zeile erscheint unter seinem
# Compose-Namen: hässlich und richtig - "das Netzwerk" wäre ein viel größeres Versprechen.
restart.what.network=<white>Das gesamte Netzwerk</white>
restart.what.smp=<white>Die SMP</white>
restart.what.limbo=<white>Der Warteraum</white>
restart.what.hunger-games=<white>Hunger Games</white>
restart.what.proxy=<white>Das Netzwerk</white>

# Der Anlass als Hauptwort, für die beiden Zeilen, die sagen, dass etwas NICHT stattfindet.
restart.occasion.update=Die Aktualisierung
restart.occasion.recreate=Der Neustart
restart.occasion.backup=Die Sicherung
restart.occasion.down=Die Wartung
restart.occasion.maintenance=Die Wartung
# Die letzten zehn Sekunden, einmal pro Sekunde, als Untertitel statt im Chat. Nur die
# Zahl - ein ganzer Satz mitten im Bild, jede Sekunde neu, ist nicht lesbar.
restart.tick=<#b08a4a>{seconds}</#b08a4a>
restart.now.update=<#b08a4a>{what} wird jetzt aktualisiert.</#b08a4a>
restart.now.recreate=<#b08a4a>{what} startet jetzt neu.</#b08a4a>
restart.now.backup=<#b08a4a>{what} wird jetzt gesichert.</#b08a4a>
restart.now.down=<#b08a4a>{what} geht jetzt offline.</#b08a4a>
restart.now.maintenance=<#b08a4a>nordtal geht jetzt offline.</#b08a4a>
restart.cancelled=<#8ba888>{occasion} wurde abgeblasen.</#8ba888> <gray>Es passiert nichts.</gray>
# Der Neustart lief bis null und kam dann nicht zustande - Docker-Socket weg, ein Container fehlt.
# Absichtlich nicht dieselbe Zeile wie 'abgeblasen': das eine hat jemand entschieden, das andere
# ist schiefgegangen, und wer eben noch einen Countdown gelesen hat, merkt den Unterschied.
restart.failed=<#a8888b>{occasion} hat nicht geklappt.</#a8888b> <gray>Du bleibst drin - es wird noch mal versucht.</gray>

# ---------------------------------------------------------------- der Rueckweg (season-2-ops/118)
# Alles oben wird auf dem Hinweg gesagt. Till, 2026-09-20: "Beim Zuruecktransferieren soll ebenfalls
# eine Mitteilung kommen" - und die beiden Rueckwege wiegen nicht gleich. Aus dem Warteraum reicht
# eine Chatzeile, weil dort nichts unterbrochen wird. Vom Standby-Proxy zurueck ist Chat UND ein
# gezaehlter Untertitel, weil der Spieler die ganze Zeit auf dem SMP stand.
return.waiting-room=<#8ba888>{what} ist wieder da.</#8ba888> <gray>Du wirst jetzt zurückgeschoben.</gray>
return.countdown=<#8ba888>Das Netzwerk ist wieder da.</#8ba888> <gray>Du wirst in <white>{seconds}</white> Sekunden zurückverbunden.</gray>
return.now=<#8ba888>Du wirst jetzt zurückverbunden.</#8ba888>

# ---------------------------------------------------------------- Netzwerk ist voll
gate.full=<#4a63d8>nordtal</#4a63d8> <#b08a4a>ist gerade voll - <white>{online}</white> von \
  <white>{max}</white> Spielern sind drauf.</#b08a4a> <gray>Versuch es in ein paar Minuten nochmal, es loggt sich ständig jemand aus.</gray>

