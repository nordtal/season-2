# The English texts of the proxy. They are the fallback for every other language, so they are complete.
# Arguments are named in braces.

# Both languages together, since the language is not known yet.
gate.not-linked=<warn>Link your Minecraft account first.</warn> <muted>Enter this code in the #link channel on Discord: <emphasis>{code}</emphasis></muted>
gate.not-linked.invite=<muted>You are not on the Discord server yet? Join: <emphasis>{invite}</emphasis></muted>

gate.not-member=<bad>Join the</bad> <brand>Nordtal</brand> <bad>Discord server to play here.</bad>
gate.not-member.invite=<muted>Join here: <emphasis>{invite}</emphasis></muted>

gate.unlinked=<bad>Your Minecraft account is no longer linked to a Discord account.</bad> <muted>Join again to get a new code.</muted>

gate.no-access=<bad>You have no access to</bad> <brand>Nordtal</brand> <bad>right now.</bad> <muted>Buy a period in the contribution channel on Discord.</muted>
gate.no-access.invite=<muted>Discord: <emphasis>{invite}</emphasis></muted>

# Shown only when no limbo server is registered.
gate.maintenance=<brand>Nordtal</brand> <warn>is closed for maintenance.</warn> <muted>Discord says when it opens again.</muted>

gate.no-server=<bad>The server for the current phase is not available.</bad> <muted>An admin has to fix this. Try again later.</muted>

gate.trouble=<bad>The access check is not available.</bad> <muted>Try again in a few minutes.</muted>

gate.connection-lost=<bad>The connection to the server was lost.</bad> <muted>You are in the waiting room. You join the server again when it answers.</muted>

# Both languages together, since a broken database group cannot reach anyone's language.
gate.misconfigured=<bad>The network is misconfigured.</bad> <muted>Nobody can join until an admin fixes it.</muted>

gate.restarting=<brand>Nordtal</brand> <warn>is restarting.</warn> <muted>Try again in a moment.</muted>

gate.expiry.warning=<warn>Your access ends in <emphasis>{minutes}</emphasis> {minutes, plural, one {minute} other {minutes}}.</warn> <muted>Buy more in the contribution channel on Discord.</muted>
gate.expiry.expired=<bad>Your access has ended.</bad> <muted>Buy a new period in the contribution channel on Discord.</muted>

pack.prompt=<brand>Nordtal</brand> <muted>needs its resource pack for the tab list, nametags, boards and HUD.</muted>
pack.declined=<bad>You need the resource pack to play here.</bad> <muted>Join again and accept it.</muted>
pack.failed-download=<bad>The resource pack download failed.</bad> <muted>Join again in a moment.</muted>
pack.invalid-url=<bad>The resource pack is not available.</bad> <muted>An admin has to fix this. Try again later.</muted>
pack.timeout=<bad>Your client did not answer the resource pack request.</bad> <muted>Join again.</muted>

# {seconds} is the time left. {what} opens the sentence.
restart.countdown.update=<warn><emphasis>{what}</emphasis> is being updated in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
restart.countdown.recreate=<warn><emphasis>{what}</emphasis> restarts in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
restart.countdown.backup=<warn><emphasis>{what}</emphasis> is being backed up in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
restart.countdown.down=<warn><emphasis>{what}</emphasis> goes down for maintenance in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
restart.countdown.maintenance=<warn>Nordtal goes down for maintenance in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>

# Each of these follows an announcement on the same line.
restart.fate.reconnect=<muted>You see a loading screen and then play on.</muted>
restart.fate.waiting-room=<muted>You wait in the waiting room and return on your own.</muted>
restart.fate.disconnect=<muted>The game disconnects you. Join again after about a minute.</muted>

# A service with no line of its own appears under its compose name.
restart.what.network=The whole network
restart.what.smp=The SMP
restart.what.limbo=The waiting room
restart.what.hunger-games=Hunger Games
restart.what.proxy=The network
restart.what.other={service}

restart.occasion.update=The update
restart.occasion.recreate=The restart
restart.occasion.backup=The backup
restart.occasion.down=The maintenance
restart.occasion.maintenance=The maintenance
# The subtitle of the last ten seconds is the number alone.
restart.tick=<accent>{seconds}</accent>
restart.now.update=<warn><emphasis>{what}</emphasis> is being updated now.</warn>
restart.now.recreate=<warn><emphasis>{what}</emphasis> is restarting now.</warn>
restart.now.backup=<warn><emphasis>{what}</emphasis> is being backed up now.</warn>
restart.now.down=<warn><emphasis>{what}</emphasis> is going down now.</warn>
restart.now.maintenance=<warn>Nordtal is going down now.</warn>
restart.cancelled=<good>{occasion} is cancelled.</good> <muted>Nothing happens.</muted>
restart.failed=<bad>{occasion} failed.</bad> <muted>You stay here. It is tried again.</muted>

restart.voice=<muted>Voice chat stops for a moment and then starts again.</muted>

return.moved-out=<accent><emphasis>{what}</emphasis> restarts.</accent> <muted>You wait in the waiting room and return on your own.</muted>
return.waiting-room=<good><emphasis>{what}</emphasis> is back.</good> <muted>You join it now.</muted>
return.countdown=<good>The network is back.</good> <muted>You reconnect in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</muted>
return.now=<good>You reconnect now.</good>

gate.full=<brand>Nordtal</brand> <warn>is full.</warn> <muted><emphasis>{online}</emphasis> of <emphasis>{max}</emphasis> {max, plural, one {player is} other {players are}} online. Try again in a few minutes.</muted>

gate.pre-launch.buy=<brand>Nordtal</brand> <warn>has not opened yet.</warn> <muted>Buy your first period in the contribution channel on Discord. You get access to the SMP when the event ends.</muted>
gate.pre-launch.ready=<brand>Nordtal</brand> <warn>has not opened yet.</warn> <muted>Your account is linked and your access is paid. See you at the start.</muted>

# {countdown} is one of the countdown lines below.
gate.countdown=<muted>The network opens in <emphasis>{countdown}</emphasis>.</muted>
gate.countdown.unknown=<muted>The opening date is not announced yet. Watch Discord.</muted>

countdown.days={days, plural, one {# day} other {# days}} {hours, plural, one {# hour} other {# hours}}
countdown.hours={hours, plural, one {# hour} other {# hours}} {minutes, plural, one {# minute} other {# minutes}}
countdown.minutes={minutes, plural, one {# minute} other {# minutes}}
countdown.imminent=any moment now
# No tags here: the text is inserted before MiniMessage parses it.
countdown.unknown=not announced yet

# The client draws the server list before it has the resource pack, so these texts hold no glyph.
motd.pre-launch=<brand><bold>nordtal.eu</bold></brand><newline><muted>{season.name} opens in <emphasis>{list.countdown}</emphasis></muted>
motd.pre-event=<brand><bold>nordtal.eu</bold></brand><newline><muted>Hunger Games: <emphasis>{list.hgParticipants}</emphasis> {list.hgParticipants, plural, one {player} other {players}} in <emphasis>{list.hgTeams}</emphasis> {list.hgTeams, plural, one {team} other {teams}}</muted>
motd.start-event=<brand><bold>nordtal.eu</bold></brand><newline><muted>Hunger Games: <emphasis>{list.hgAlive}</emphasis> of <emphasis>{list.hgParticipants}</emphasis> still alive</muted>
motd.smp=<brand><bold>nordtal.eu</bold></brand><newline><muted>{season.name} is running. <emphasis>{list.smpMilestonesDone}</emphasis> of <emphasis>{list.smpMilestones}</emphasis> {list.smpMilestones, plural, one {milestone} other {milestones}} done.</muted>
motd.maintenance=<brand><bold>nordtal.eu</bold></brand><newline><muted>The network is down for maintenance.</muted>
motd.misconfigured=<brand><bold>nordtal.eu</bold></brand><newline><bad>The network is misconfigured. Nobody can join.</bad>

# {message} is a component and is never parsed. {flag} and {admin} are glyphs.
chat.msg.sent=<muted><italic>to {flag} <emphasis>{partner.name}</emphasis>{admin}:</italic> <neutral>{message}</neutral></muted>
chat.msg.received=<muted><italic>from {flag} <emphasis>{partner.name}</emphasis>{admin}:</italic> <neutral>{message}</neutral></muted>

# These texts hold no tags, since the refusal's tone paints them.
command.describe.msg=This command sends a private message to a player on the network.
command.describe.whisper=This command does the same as /msg.
command.describe.r=This command answers the player who wrote to you last or whom you wrote to last.
chat.no-partner=Nobody has written to you yet. Use /msg with a name.
chat.msg.self=You cannot write to yourself.
chat.failed=The message was not delivered.

# {invite} is the invite URL of the Discord server. <newline> starts a new chat line.
info.discord=<muted>Manage your access, language and Hunger Games registration in the Nordtal Discord.</muted><newline><click:open_url:'{invite}'><hover:show_text:'{invite}'><brand><underlined>Join the Nordtal Discord</underlined></brand></hover></click>

info.rules=<brand><bold>Network rules</bold></brand> <newline><muted>Treat everyone decently and play fair. Use PvP on the SMP only when both sides agree. Ask questions on Discord:</muted> <newline><click:open_url:'{invite}'><hover:show_text:'{invite}'><brand><underlined>Join the Nordtal Discord</underlined></brand></hover></click>

command.unknown=That command does not exist.
command.player-offline=No player with that name is online on this server.
command.help.usage=Usage: {usage}
command.help.what={what}
command.not-from-console=The console cannot run this command. Run it in game or in Discord.
