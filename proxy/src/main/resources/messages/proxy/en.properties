# proxy, English. The fallback for every other language, so keep it complete.
# Arguments are named in braces.

# not linked
# Shown in English and German together, since the language is not known yet.
gate.not-linked=<warn>Link your Minecraft account first.</warn> <muted>Type this code in the #link channel on Discord: <emphasis>{code}</emphasis></muted>
gate.not-linked.invite=<muted>Not on the Discord server yet? Visit <emphasis>{invite}</emphasis></muted>

gate.not-member=<bad>You need to be a member of the</bad> <brand>Nordtal</brand> <bad>Discord server to play here.</bad>
gate.not-member.invite=<muted>Join here: <emphasis>{invite}</emphasis></muted>

gate.unlinked=<bad>Your Minecraft account is no longer linked to a Discord account.</bad> \
  <muted>Join again to get a new link code.</muted>

gate.no-access=<bad>You do not have active access to</bad> <brand>Nordtal</brand> <bad>right now.</bad> \
  <muted>Buy a period in the contribution channel on Discord.</muted>
gate.no-access.invite=<muted>Discord: <emphasis>{invite}</emphasis></muted>

# Shown only when no limbo server is registered.
gate.maintenance=<brand>Nordtal</brand> <warn>is closed for maintenance.</warn> <muted>Watch Discord for when it is back.</muted>

gate.no-server=<bad>The server for the current phase is not available.</bad> <muted>An admin has \
  to fix this. Try again later.</muted>

gate.trouble=<bad>The access system is not reachable.</bad> <muted>Try again in a few minutes.</muted>

gate.connection-lost=<bad>The connection to the server was lost.</bad> <muted>You are back in \
  the waiting room and will be sent over again when the server answers.</muted>

# Bilingual, since a broken database group cannot reach anyone's language.
gate.misconfigured=<bad>The network is misconfigured.</bad> <muted>Nobody can join until an \
  admin has fixed it.</muted>

gate.restarting=<brand>Nordtal</brand> <warn>is restarting.</warn> <muted>Try again \
  in a moment. The servers stay up.</muted>

gate.expiry.warning=<warn>Your access runs out in <emphasis>{minutes}</emphasis> {minutes, plural, one {minute} other {minutes}}.</warn> <muted>Buy \
  more in the contribution channel on Discord to keep playing.</muted>
gate.expiry.expired=<bad>Your access has run out.</bad> <muted>Buy a new period in the \
  contribution channel on Discord to keep playing.</muted>

pack.prompt=<brand>Nordtal</brand> <muted>needs its resource pack for the tab list, the nametags, the \
  boards and the HUD.</muted>
pack.declined=<bad>You need the resource pack to play here.</bad> <muted>Join again and accept \
  it.</muted>
pack.failed-download=<bad>The resource pack could not be downloaded.</bad> <muted>Join again in a moment.</muted>
pack.invalid-url=<bad>The resource pack is not reachable.</bad> <muted>An admin has to \
  fix this. Try again later.</muted>
pack.timeout=<bad>Your client did not answer the resource pack offer.</bad> <muted>Join again to try once more.</muted>

# {seconds} is the time left. {what} opens the sentence.
restart.countdown.update=<warn><emphasis>{what}</emphasis> is being updated in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
restart.countdown.recreate=<warn><emphasis>{what}</emphasis> restarts in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
restart.countdown.backup=<warn><emphasis>{what}</emphasis> is being backed up in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
restart.countdown.down=<warn><emphasis>{what}</emphasis> goes down for maintenance in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
restart.countdown.maintenance=<warn>Nordtal goes down for maintenance in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>

# The second half of every announcement, on the same line.
restart.fate.reconnect=<muted>You see a loading screen and then play on.</muted>
restart.fate.waiting-room=<muted>You wait in the waiting room and come back on your own.</muted>
restart.fate.disconnect=<muted>You are disconnected. Join again in about a minute.</muted>

# A service with no line of its own appears under its compose name.
restart.what.network=The whole network
restart.what.smp=The SMP
restart.what.limbo=The waiting room
restart.what.hunger-games=Hunger Games
restart.what.proxy=The network
restart.what.other={service}

restart.occasion.update=The update
restart.occasion.recreate=The restart
restart.occasion.backup=The backup
restart.occasion.down=The maintenance
restart.occasion.maintenance=The maintenance
# The subtitle of the last ten seconds: the number alone.
restart.tick=<accent>{seconds}</accent>
restart.now.update=<warn><emphasis>{what}</emphasis> is being updated now.</warn>
restart.now.recreate=<warn><emphasis>{what}</emphasis> is restarting now.</warn>
restart.now.backup=<warn><emphasis>{what}</emphasis> is being backed up now.</warn>
restart.now.down=<warn><emphasis>{what}</emphasis> is going down now.</warn>
restart.now.maintenance=<warn>Nordtal is going down now.</warn>
restart.cancelled=<good>{occasion} was cancelled.</good> <muted>Nothing happens.</muted>
restart.failed=<bad>{occasion} failed.</bad> <muted>You stay. It will be tried again.</muted>

restart.voice=<muted>Voice chat drops out during the swap and comes back on its own.</muted>

return.waiting-room=<good><emphasis>{what}</emphasis> is back.</good> <muted>You are being moved over now.</muted>
return.countdown=<good>The network is back.</good> <muted>You are reconnected in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</muted>
return.now=<good>You are being reconnected now.</good>

gate.full=<brand>Nordtal</brand> <warn>is full: <emphasis>{online}</emphasis> of \
  <emphasis>{max}</emphasis> {max, plural, one {player is} other {players are}} on.</warn> <muted>Try again in a few minutes.</muted>

gate.pre-launch.buy=<brand>Nordtal</brand> <warn>has not opened yet.</warn> <muted>Buy \
  your first month in the contribution channel on Discord to have access to the SMP once the event is over.</muted>
gate.pre-launch.ready=<brand>Nordtal</brand> <warn>has not opened yet.</warn> <muted>Your account is linked \
  and your access is paid for. See you at the start.</muted>

# Appended to every pre-launch screen; {countdown} is one of the lines below.
gate.countdown=<muted>The network opens in <emphasis>{countdown}</emphasis>.</muted>
gate.countdown.unknown=<muted>The opening date is not announced yet. Watch Discord.</muted>

countdown.days={days, plural, one {# day} other {# days}} {hours, plural, one {# hour} other {# hours}}
countdown.hours={hours, plural, one {# hour} other {# hours}} {minutes, plural, one {# minute} other {# minutes}}
countdown.minutes={minutes, plural, one {# minute} other {# minutes}}
countdown.imminent=any moment now
# Plain text: it is substituted before MiniMessage parses.
countdown.unknown=not announced yet

# server list
# Each text is in the network's language and has no glyph, since the client draws the list before it has the pack.
motd.pre-launch=<brand><bold>nordtal.eu</bold></brand><newline><muted>{season.name} opens in <emphasis>{list.countdown}</emphasis></muted>
motd.pre-event=<brand><bold>nordtal.eu</bold></brand><newline><muted>Hunger Games: <emphasis>{list.hgParticipants}</emphasis> {list.hgParticipants, plural, one {player} other {players}} in <emphasis>{list.hgTeams}</emphasis> {list.hgTeams, plural, one {team} other {teams}}</muted>
motd.start-event=<brand><bold>nordtal.eu</bold></brand><newline><muted>Hunger Games: <emphasis>{list.hgAlive}</emphasis> of <emphasis>{list.hgParticipants}</emphasis> still alive</muted>
motd.smp=<brand><bold>nordtal.eu</bold></brand><newline><muted>{season.name} is running: <emphasis>{list.smpMilestonesDone}</emphasis> of <emphasis>{list.smpMilestones}</emphasis> {list.smpMilestones, plural, one {milestone} other {milestones}} done</muted>
motd.maintenance=<brand><bold>nordtal.eu</bold></brand><newline><muted>Maintenance: back shortly</muted>
motd.misconfigured=<brand><bold>nordtal.eu</bold></brand><newline><bad>Misconfigured: nobody can join until an admin has fixed it.</bad>

# private messages
# {message} is a component and is never parsed. {flag} and {admin} are glyphs.
chat.msg.sent=<muted><italic>to {flag} <emphasis>{partner.name}</emphasis>{admin}:</italic> <neutral>{message}</neutral></muted>
chat.msg.received=<muted><italic>from {flag} <emphasis>{partner.name}</emphasis>{admin}:</italic> <neutral>{message}</neutral></muted>

# No markup: a refusal is painted by its tone.
command.describe.msg=Sends a private message to a player anywhere on the network.
command.describe.whisper=The same as /msg.
command.describe.r=Answers the player who last wrote to you or whom you last wrote to.
chat.no-partner=Nobody has written to you yet. Use /msg with a name.
chat.msg.self=You cannot write to yourself.
chat.failed=The message was not delivered.

# {invite} is gate#discord-invite-url. <newline> splits a value into chat lines.
info.discord=<muted>The Nordtal Discord holds access, languages and the Hunger Games registration.</muted><newline><click:open_url:'{invite}'><hover:show_text:'{invite}'><brand><underlined>Join the Nordtal Discord</underlined></brand></hover></click>

info.rules=<brand><bold>Network rules</bold></brand> \
  <newline><muted>Treat everyone decently and play fair. Use PvP on the SMP only when both sides want it. Ask questions on Discord:</muted> \
  <newline><click:open_url:'{invite}'><hover:show_text:'{invite}'><brand><underlined>Join the Nordtal Discord</underlined></brand></hover></click>

command.unknown=That command does not exist.
command.player-offline=No player by that name is online on this server.
command.help.usage=Usage: {usage}
command.help.what={what}
command.not-from-console=The console cannot run that command. Run it in game or in Discord.
