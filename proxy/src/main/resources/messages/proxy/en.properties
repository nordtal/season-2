# English texts of the proxy. English is the fallback for every other language, so this file holds every key.
# An argument is written in braces, and eu.nordtal.season.messages.Messages substitutes it.

# not linked
# The text is shown in English and German together, because the player's language is not known yet. It is short.
gate.not-linked=<warn>Link your Minecraft account first.</warn> <muted>Type this code in the #link channel on Discord: <emphasis>{code}</emphasis></muted>
gate.not-linked.invite=<muted>You are not on the Discord server yet. Join here: <emphasis>{invite}</emphasis></muted>

# not a member, or banned
gate.not-member=<bad>You must be a member of the</bad> <brand>Nordtal</brand> <bad>Discord server to play here.</bad>
gate.not-member.invite=<muted>Join the server here: <emphasis>{invite}</emphasis></muted>

# unlinked while already connected
# The Discord command /unlink can end a link during a session. This text shows no link code, because rejoining issues one.
gate.unlinked=<bad>Your Minecraft account is no longer linked to a Discord account.</bad> \
  <muted>Join again to get a new link code.</muted>

# no active access
gate.no-access=<bad>You do not have active access to</bad> <brand>Nordtal</brand> <bad>right now.</bad> \
  <muted>Buy a period in the contribution channel on Discord.</muted>
gate.no-access.invite=<muted>Join the Discord server here: <emphasis>{invite}</emphasis></muted>

# maintenance, with no limbo to wait in
# The proxy shows this text only when no limbo server is registered. Otherwise a linked member waits in limbo. The text is shown in the player's language.
gate.maintenance=<brand>Nordtal</brand> <warn>is closed for maintenance.</warn> <muted>Check Discord to see when it opens again.</muted>

# the phase's backend is missing
# The server names of the gate group do not match velocity.toml. This is a configuration error, not a player error.
gate.no-server=<bad>The server for the current phase is not available.</bad> <muted>An admin must \
  fix this. Try again later.</muted>

# the database is unreachable
gate.trouble=<bad>The access system is not reachable right now.</bad> <muted>Try \
  again in a few minutes.</muted>

# the backend lost the connection
# No person made a decision, so there is nothing to quote. This text is the whole explanation.
gate.connection-lost=<bad>The connection to the server was lost.</bad> <muted>You are back in \
  the waiting room. You return to the server as soon as it answers.</muted>

# the configuration is broken
# This screen refuses every player. It is in English and German, because a broken database group cannot supply the player's language.
gate.misconfigured=<bad>The network settings are wrong.</bad> <muted>Nobody can join until an \
  admin fixes them.</muted>

# the proxy is about to be moved
# The proxy shows this text between the update that parks every player and the stop of the proxy. It names no duration.
gate.restarting=<brand>Nordtal</brand> <warn>is restarting.</warn> <muted>Try again \
  in a moment. Nothing is lost, and the servers stay up.</muted>

# mid-session
gate.expiry.warning=<warn>Your access ends in <emphasis>{minutes}</emphasis> {minutes, plural, one {minute} other {minutes}}.</warn> <muted>Buy \
  more in the contribution channel on Discord to keep playing.</muted>
gate.expiry.expired=<bad>Your access has ended.</bad> <muted>Buy a new period in the \
  contribution channel on Discord to keep playing.</muted>

# the resource pack station
# Every login passes limbo, which offers the proxy's pack. pack.prompt is the line of the pack dialog.
# The other texts are disconnect screens, sent before Velocity's own because the pack is required.
pack.prompt=<brand>Nordtal</brand> <muted>needs its resource pack. The pack draws the tab list, the \
  nametags, the boards and the whole HUD.</muted>
pack.declined=<bad>You need the resource pack to play here.</bad> <muted>Join again and accept \
  it. It is a few megabytes, and it draws the nametags, the boards and the HUD.</muted>
pack.failed-download=<bad>The resource pack could not be downloaded.</bad> <muted>This is usually \
  a connection problem. Join again in a moment.</muted>
# This is a configuration error, and it affects every player at once. A player must still be able to understand the text.
pack.invalid-url=<bad>The resource pack is not reachable right now.</bad> <muted>An admin must \
  fix this. Try again later.</muted>
pack.timeout=<bad>Your client did not answer the resource pack offer.</bad> <muted>Without an \
  answer you cannot join. Join again to try once more.</muted>

# the restart countdown
# Every player on the network sees these texts. A run requested in Discord is announced the same way.
# {seconds} is the time actually left. <emphasis>{what}</emphasis> is the service or the network and starts the sentence.
restart.countdown.update=<warn><emphasis>{what}</emphasis> is being updated in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
restart.countdown.recreate=<warn><emphasis>{what}</emphasis> restarts in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
restart.countdown.backup=<warn><emphasis>{what}</emphasis> is being backed up in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
restart.countdown.down=<warn><emphasis>{what}</emphasis> stops for maintenance in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
# This is the case with no waiting room: no server holds the players during the stop.
restart.countdown.maintenance=<warn>Nordtal stops for maintenance in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>

# The second half of every announcement, on the same line. It says what happens to the player.
restart.fate.reconnect=<muted>You see a loading screen, then you continue playing.</muted>
restart.fate.waiting-room=<muted>You wait in the waiting room and return automatically.</muted>
restart.fate.disconnect=<muted>The server disconnects you. The stop takes about a minute. Join again right away.</muted>

# The names that players use for a service. A service without a text of its own appears under its compose name.
restart.what.network=The whole network
restart.what.smp=The SMP
restart.what.limbo=The waiting room
restart.what.hunger-games=Hunger Games
restart.what.proxy=The network
restart.what.other={service}

# The occasion as a noun, used by the two texts that say the occasion is not happening.
restart.occasion.update=The update
restart.occasion.recreate=The restart
restart.occasion.backup=The backup
restart.occasion.down=The maintenance
restart.occasion.maintenance=The maintenance
# In the last ten seconds, once per second, the subtitle shows the number alone.
restart.tick=<accent>{seconds}</accent>
restart.now.update=<warn><emphasis>{what}</emphasis> is being updated now.</warn>
restart.now.recreate=<warn><emphasis>{what}</emphasis> is restarting now.</warn>
restart.now.backup=<warn><emphasis>{what}</emphasis> is being backed up now.</warn>
restart.now.down=<warn><emphasis>{what}</emphasis> stops now.</warn>
restart.now.maintenance=<warn>Nordtal stops now.</warn>
restart.cancelled=<good>{occasion} was cancelled.</good> <muted>Nothing happens.</muted>
# The countdown ended and then the run failed. The text differs from the cancelled text on purpose.
restart.failed=<bad>{occasion} failed.</bad> <muted>You stay on the server. Nordtal tries again.</muted>

# The proxy shows this text once per countdown, only to players who are online while the proxy is swapped, because voice chat does not survive the swap.
restart.voice=<muted>Voice chat stops for a moment during the switch and returns on its own.</muted>

# the way back
# Leaving the waiting room shows one chat line. Leaving the standby proxy shows a chat line and a subtitle that counts.
return.waiting-room=<good><emphasis>{what}</emphasis> is back.</good> <muted>You return to it now.</muted>
return.countdown=<good>The network is back.</good> <muted>You reconnect in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</muted>
return.now=<good>You reconnect now.</good>

# the network is full
# The network has reached its setting `players` and this player is not an admin. Only the proxy refuses a player because the network is full.
gate.full=<brand>Nordtal</brand> <warn>is full: <emphasis>{online}</emphasis> of \
  <emphasis>{max}</emphasis> {max, plural, one {player is} other {players are}} online.</warn> <muted>Players leave often. Try again in a few minutes.</muted>

# before the network has opened
# The PRE_LAUNCH texts for linked players. The two texts differ by whether the player has bought access (see GateOutcome).
gate.pre-launch.buy=<brand>Nordtal</brand> <warn>has not opened yet.</warn> <muted>You can buy \
  your first month now in the contribution channel on Discord. Your access to the SMP starts when the event is over.</muted>
gate.pre-launch.ready=<brand>Nordtal</brand> <warn>has not opened yet.</warn> <muted>Your account \
  is linked and your access is paid. You need to do nothing else. Join when the network opens.</muted>

# The proxy appends this text to every PRE_LAUNCH text. {countdown} is one of the countdown texts below.
gate.countdown=<muted>The network opens in <emphasis>{countdown}</emphasis>.</muted>
gate.countdown.unknown=<muted>Nordtal has announced no opening date yet. Check Discord for news.</muted>

# how a countdown reads
# These values are coarse on purpose. A player reads them once, and a counter in seconds would be out of date by then.
countdown.days={days, plural, one {# day} other {# days}} {hours, plural, one {# hour} other {# hours}}
countdown.hours={hours, plural, one {# hour} other {# hours}} {minutes, plural, one {# minute} other {# minutes}}
countdown.minutes={minutes, plural, one {# minute} other {# minutes}}
# The opening time has passed and nobody has switched the phase yet.
countdown.imminent=any moment now
# No launch date is set. This value is plain text: the proxy substitutes it before MiniMessage parses, so a tag would show as written.
countdown.unknown=not announced yet

# what the server browser shows
# The MOTD for a failed configuration, read from the classpath because a broken network group can cause that state.
# These texts show in the server browser in each phase, in the network's language, because a ping carries no reader.
# The client draws the list before it has the resource pack, so the texts contain no glyph.
# The first line is the brand in every phase.
motd.pre-launch=<brand><bold>nordtal.eu</bold></brand><newline><muted>{season.name} opens in <emphasis>{list.countdown}</emphasis></muted>
motd.pre-event=<brand><bold>nordtal.eu</bold></brand><newline><muted>Hunger Games has <emphasis>{list.hgParticipants}</emphasis> {list.hgParticipants, plural, one {player} other {players}} in <emphasis>{list.hgTeams}</emphasis> {list.hgTeams, plural, one {team} other {teams}}</muted>
motd.start-event=<brand><bold>nordtal.eu</bold></brand><newline><muted>In Hunger Games, <emphasis>{list.hgAlive}</emphasis> of <emphasis>{list.hgParticipants}</emphasis> {list.hgParticipants, plural, one {player is} other {players are}} still alive</muted>
motd.smp=<brand><bold>nordtal.eu</bold></brand><newline><muted>{season.name} is running. <emphasis>{list.smpMilestonesDone}</emphasis> of <emphasis>{list.smpMilestones}</emphasis> {list.smpMilestones, plural, one {milestone is} other {milestones are}} done</muted>
motd.maintenance=<brand><bold>nordtal.eu</bold></brand><newline><muted>Maintenance ends shortly. The season is not over</muted>
motd.misconfigured=<brand><bold>nordtal.eu</bold></brand><newline><bad>Settings are wrong. Nobody can join until an admin fixes them.</bad>

# private messages
# The proxy carries /msg, /whisper and /r, so a conversation survives a server change.
# Each message shows two lines, each in the reader's language. {message} is a component, and the parser never reads it.
# {flag} and {admin} are glyphs from Glyphs in :common, in the font minecraft:default, so neither names a font.
chat.msg.sent=<muted><italic>to {flag} <emphasis>{partner.name}</emphasis>{admin}:</italic> <neutral>{message}</neutral></muted>
chat.msg.received=<muted><italic>from {flag} <emphasis>{partner.name}</emphasis>{admin}:</italic> <neutral>{message}</neutral></muted>

# These texts describe each of the three commands and say why a command sends nothing.
# No markup: Tone paints a refusal, and a usage line is read back as plain text.

command.describe.msg=/msg sends one private line to a player anywhere on the network. \
  The vanilla command reaches only the server you are on.
command.describe.whisper=/whisper is another name for /msg.
command.describe.r=/r answers the player who last wrote to you or the player you last wrote to. \
  The network stores neither name, so a restart forgets them.
chat.no-partner=Nobody has written to you, and you have written to nobody, so /r has no one \
  to answer. Use /msg with a player's name.
chat.msg.self=You cannot write to yourself.
chat.failed=The message was not sent. Nothing was delivered or stored.

# /discord and /rules
# {invite} is gate#discord-invite-url.
# <newline> splits a value into several chat lines.

info.discord=<muted>You handle access, language and the registration for Hunger Games on the Nordtal Discord \
  server.</muted><newline><click:open_url:'{invite}'><hover:show_text:'{invite}'><brand><underlined>Join the Nordtal Discord</underlined></brand></hover></click>

# The network rules: three sentences at most, the same in both languages. {invite} is gate#discord-invite-url.
info.rules=<brand><bold>Network rules</bold></brand> \
  <newline><muted>We play among friends, so there is one rule: treat every player decently, \
  play fair, and use PvP on the SMP only when both sides want it. Ask questions on Discord:</muted> \
  <newline><click:open_url:'{invite}'><hover:show_text:'{invite}'><brand><underlined>Join the Nordtal Discord</underlined></brand></hover></click>

command.unknown=That command does not exist.
command.player-offline=No player with that name is online on this server. The lookup matches the \
  exact name and covers only the players on this server right now.
command.help.usage=Use the command like this: {usage}
command.help.what={what}
command.not-from-console=The console cannot run this command. The command records who made the \
  decision, and the console is not a person. Run it in the game or on Discord.
