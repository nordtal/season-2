# proxy, English. The fallback for every other language, so keep it complete.
# Parameters are named in braces and substituted by eu.nordtal.season.messages.Messages.

# not linked
# Shown in English and German together, since the language is not known yet; keep it short.
gate.not-linked=<warn>Link your Minecraft account first.</warn> <muted>Type this code in the #link channel on Discord: <emphasis>{code}</emphasis></muted>
gate.not-linked.invite=<muted>Not on the Discord server yet? Visit <emphasis>{invite}</emphasis></muted>

# not a member, or banned
gate.not-member=<bad>You need to be a member of the</bad> <brand>nordtal</brand> <bad>Discord server to play here.</bad>
gate.not-member.invite=<muted>Join here: <emphasis>{invite}</emphasis></muted>

# unlinked while already connected
# /unlink in Discord can end a link mid-session. No link code here; rejoining issues one.
gate.unlinked=<bad>Your Minecraft account is no longer linked to a Discord account.</bad> \
  <muted>Join again to get a new link code.</muted>

# no active access
gate.no-access=<bad>You do not have active access to</bad> <brand>nordtal</brand> <bad>right now.</bad> \
  <muted>Buy a period in the contribution channel on Discord.</muted>
gate.no-access.invite=<muted>Discord: <emphasis>{invite}</emphasis></muted>

# maintenance, with no limbo to wait in
# Only when no limbo server is registered; otherwise a linked member waits in limbo. Shown in their language.
gate.maintenance=<brand>nordtal</brand> <warn>is closed for maintenance right now.</warn> <muted>Watch Discord for when it is back.</muted>

# the phase's backend is missing
# the gate group's server names do not match velocity.toml. A config error, not a player error.
gate.no-server=<bad>The server for the current phase is not available.</bad> <muted>An admin has \
  to fix this. Please try again later.</muted>

# the database is unreachable
gate.trouble=<bad>We are having trouble reaching the access system right now.</bad> <muted>Please \
  try again in a few minutes.</muted>

# the backend lost the connection
# Nobody decided anything, so there is nothing to quote; this line is the whole explanation.
gate.connection-lost=<bad>The connection to the server was lost.</bad> <muted>You are back in \
  the waiting room and will be sent over again as soon as it answers.</muted>

# the configuration is broken
# The fail-closed screen, bilingual because a broken database group cannot reach anyone's language.
gate.misconfigured=<bad>The network is misconfigured.</bad> <muted>Nobody can be let in until an \
  admin has fixed it.</muted>

# the proxy is about to be moved
# Between an update parking everybody and the proxy stopping; it names no duration.
gate.restarting=<brand>nordtal</brand> <warn>is restarting right now.</warn> <muted>Try again \
  in a moment. Nothing is lost, the servers stay up.</muted>

# mid-session
gate.expiry.warning=<warn>Your access runs out in <emphasis>{minutes}</emphasis> {minutes, plural, one {minute} other {minutes}}.</warn> <muted>Buy \
  more in the contribution channel on Discord to keep playing.</muted>
gate.expiry.expired=<bad>Your access has just run out.</bad> <muted>Buy a new period in the \
  contribution channel on Discord to keep playing.</muted>

# the resource pack station
# Every login passes limbo, where the proxy's pack is offered. The prompt is the pack dialog's line;
# the rest are disconnect screens, sent before Velocity's own because the offer is forced.
pack.prompt=<brand>nordtal</brand> <muted>needs its resource pack: the tab list, the nametags, the \
  boards and the whole HUD are drawn with it.</muted>
pack.declined=<bad>You need the resource pack to play here.</bad> <muted>Join again and accept \
  it. It is a few megabytes and it is what draws the nametags, the boards and the HUD.</muted>
pack.failed-download=<bad>The resource pack could not be downloaded.</bad> <muted>That is usually \
  a connection problem. Please join again in a moment.</muted>
# A config error, and it hits every player at once. The text still has to make sense to a player.
pack.invalid-url=<bad>The resource pack is not reachable right now.</bad> <muted>An admin has to \
  fix this. Please try again later.</muted>
pack.timeout=<bad>Your client never answered the resource pack offer.</bad> <muted>We cannot let \
  you in. Join again to try once more.</muted>

# the restart countdown
# Everybody on the network sees these; a run asked for in Discord is announced the same way.
# {seconds} is what is actually left. <emphasis>{what}</emphasis> is the service or the network and opens the sentence.
restart.countdown.update=<warn><emphasis>{what}</emphasis> is being updated in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
restart.countdown.recreate=<warn><emphasis>{what}</emphasis> restarts in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
restart.countdown.backup=<warn><emphasis>{what}</emphasis> is being backed up in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
restart.countdown.down=<warn><emphasis>{what}</emphasis> goes down for maintenance in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>
# The case with no waiting room: nothing catches anybody, and the line says so.
restart.countdown.maintenance=<warn>nordtal goes down for maintenance in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</warn>

# The second half of every announcement, on the same line: what happens to you.
restart.fate.reconnect=<muted>You will see a loading screen and then carry straight on.</muted>
restart.fate.waiting-room=<muted>You will wait in the waiting room and come back on your own.</muted>
restart.fate.disconnect=<muted>You will be disconnected. Come straight back, it takes about a minute.</muted>

# The names a player uses. A service with no line of its own appears under its compose name.
restart.what.network=The whole network
restart.what.smp=The SMP
restart.what.limbo=The waiting room
restart.what.hunger-games=Hunger Games
restart.what.proxy=The network
restart.what.other={service}

# The occasion as a noun, for the two lines that say something is NOT happening.
restart.occasion.update=The update
restart.occasion.recreate=The restart
restart.occasion.backup=The backup
restart.occasion.down=The maintenance
restart.occasion.maintenance=The maintenance
# The last ten seconds, once a second, as a subtitle: the number alone.
restart.tick=<accent>{seconds}</accent>
restart.now.update=<warn><emphasis>{what}</emphasis> is being updated now.</warn>
restart.now.recreate=<warn><emphasis>{what}</emphasis> is restarting now.</warn>
restart.now.backup=<warn><emphasis>{what}</emphasis> is being backed up now.</warn>
restart.now.down=<warn><emphasis>{what}</emphasis> is going down now.</warn>
restart.now.maintenance=<warn>nordtal is going down now.</warn>
restart.cancelled=<good>{occasion} was called off.</good> <muted>Nothing is happening.</muted>
# The countdown ran out and the run then failed; deliberately not the same line as called off.
restart.failed=<bad>{occasion} did not go through.</bad> <muted>You are staying. It will be tried again.</muted>

# Once per countdown, only to somebody playing while the proxy itself is swapped: voice chat does not survive it.
restart.voice=<muted>Voice chat drops out for the moment of the swap and comes back on its own.</muted>

# the way back
# Out of the waiting room: one chat line. Off the standby proxy: chat and a counted subtitle.
return.waiting-room=<good><emphasis>{what}</emphasis> is back.</good> <muted>Moving you over now.</muted>
return.countdown=<good>The network is back.</good> <muted>You will be reconnected in <emphasis>{seconds}</emphasis> {seconds, plural, one {second} other {seconds}}.</muted>
return.now=<good>Reconnecting you now.</good>

# the network is full
# The network setting `players` is reached and this player is not an admin. Only the proxy refuses for fullness.
gate.full=<brand>nordtal</brand> <warn>is full right now: <emphasis>{online}</emphasis> of \
  <emphasis>{max}</emphasis> {max, plural, one {player is} other {players are}} on.</warn> <muted>Try again in a few minutes; somebody logs off all the time.</muted>

# before the network has opened
# The PRE_LAUNCH screens for linked players; the two differ by a purchase (see GateOutcome).
gate.pre-launch.buy=<brand>nordtal</brand> <warn>has not opened yet.</warn> <muted>You can already \
  buy your first month in the contribution channel on Discord, then the SMP is yours the moment the event is over.</muted>
gate.pre-launch.ready=<brand>nordtal</brand> <warn>has not opened yet.</warn> <muted>You are all \
  set: your account is linked and your access is paid for. See you at the start.</muted>

# Appended to every PRE_LAUNCH screen; {countdown} is one of the lines below.
gate.countdown=<muted>The network opens in <emphasis>{countdown}</emphasis>.</muted>
gate.countdown.unknown=<muted>No opening date has been announced yet. Watch Discord.</muted>

# how a countdown reads
# Deliberately coarse: these are read once, long after a seconds counter would be wrong.
countdown.days={days, plural, one {# day} other {# days}} {hours, plural, one {# hour} other {# hours}}
countdown.hours={hours, plural, one {# hour} other {# hours}} {minutes, plural, one {# minute} other {# minutes}}
countdown.minutes={minutes, plural, one {# minute} other {# minutes}}
# The instant has passed and nobody has switched the phase yet.
countdown.imminent=any moment now
# No launch date is set. Plain text: it is substituted before MiniMessage parses, so a tag would show literally.
countdown.unknown=not announced yet

# what the server browser shows
# The fail-closed MOTD, read from the classpath because a broken network group is one way to get here.
# What the server browser shows in each phase, in the network's language: a ping carries no reader.
# The client draws this list before it has the pack, so no glyph belongs here, and the first line is
# the brand on every phase.
motd.pre-launch=<brand><bold>nordtal.eu</bold></brand><newline><muted>{season.name} opens in <emphasis>{list.countdown}</emphasis></muted>
motd.pre-event=<brand><bold>nordtal.eu</bold></brand><newline><muted>Hunger Games: <emphasis>{list.hgParticipants}</emphasis> {list.hgParticipants, plural, one {player} other {players}} in <emphasis>{list.hgTeams}</emphasis> {list.hgTeams, plural, one {team} other {teams}}</muted>
motd.start-event=<brand><bold>nordtal.eu</bold></brand><newline><muted>Hunger Games: <emphasis>{list.hgAlive}</emphasis> of <emphasis>{list.hgParticipants}</emphasis> still alive</muted>
motd.smp=<brand><bold>nordtal.eu</bold></brand><newline><muted>{season.name} running: <emphasis>{list.smpMilestonesDone}</emphasis> of <emphasis>{list.smpMilestones}</emphasis> {list.smpMilestones, plural, one {milestone} other {milestones}} done</muted>
motd.maintenance=<brand><bold>nordtal.eu</bold></brand><newline><muted>Maintenance: back shortly, the season is not over</muted>
motd.misconfigured=<brand><bold>nordtal.eu</bold></brand><newline><bad>Misconfigured: nobody can join until an admin has fixed it.</bad>

# private messages
# /msg, /whisper and /r, carried by the proxy so a conversation survives a server change.
# Two lines per message, each in the reader's language. {message} is a component and never parsed.
# {flag} and {admin} are glyphs from :common's Glyphs in minecraft:default, so neither names a font.
chat.msg.sent=<muted><italic>to {flag} <emphasis>{partner.name}</emphasis>{admin}:</italic> <neutral>{message}</neutral></muted>
chat.msg.received=<muted><italic>from {flag} <emphasis>{partner.name}</emphasis>{admin}:</italic> <neutral>{message}</neutral></muted>

# What the three commands say when they cannot send anything, and what each is for.
# No markup: a refusal is painted by its Tone, and a usage line is read back as plain text.

command.describe.msg=Sends one private line to somebody, wherever on the network they are. \
  Vanilla's own only reaches the server you are standing on.
command.describe.whisper=The same as /msg, under the name half the players type.
command.describe.r=Answers whoever last wrote to you, or whoever you last wrote to. Nothing is \
  written down: a restart of the network forgets who that was.
chat.no-partner=Nobody has written to you yet, and you have written to nobody. So there is nobody \
  to answer. Use /msg with their name.
chat.msg.self=You cannot write to yourself. Whatever you were about to say, you already know it.
chat.failed=That did not go through. Nothing was delivered and nothing was kept.

# /discord and /rules
# {invite} is gate#discord-invite-url.
# <newline> splits a value into several chat lines.

info.discord=<muted>The nordtal Discord is where access, languages and the hunger games registration \
  live.</muted><newline><click:open_url:'{invite}'><brand><underlined>{invite}</underlined></brand></click>

# The network rules: short, and the same list in both languages. {invite} is gate#discord-invite-url.
info.rules=<brand><bold>Network rules</bold></brand> \
  <newline><emphasis>1.</emphasis> <muted>Be decent to everybody. No insults, no harassment.</muted> \
  <newline><emphasis>2.</emphasis> <muted>Play fair. No cheats, hacks or exploits; report a bug instead of using it.</muted> \
  <newline><emphasis>3.</emphasis> <muted>PvP on the SMP only while both sides agree.</muted> \
  <newline><emphasis>4.</emphasis> <muted>Do not break or take what is not yours. The one exception is a grave: it is open to \
  anyone, and whoever gets there first keeps what is in it.</muted> \
  <newline><muted>Unsure about something? Ask in Discord:</muted> \
  <newline><click:open_url:'{invite}'><brand><underlined>{invite}</underlined></brand></click>

command.unknown=That command does not exist.
command.player-offline=No player by that name is online on this server. The lookup is by exact \
  name and only covers who is here right now.
command.help.usage=Usage: {usage}
command.help.what={what}
command.not-from-console=That command cannot be run from the console. It records who took the \
  decision, and the console is nobody in particular. Run it in game or in Discord.
