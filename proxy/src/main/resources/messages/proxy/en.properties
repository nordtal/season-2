# proxy, English. The fallback for every other language, so keep it complete.
# Parameters are named in braces and substituted by eu.nordtal.s2.common.message.Messages.

# ---------------------------------------------------------------- not linked
# Shown in English and German together, since the language is not known yet; keep it short.
gate.not-linked=<#b08a4a>Link your Minecraft account first.</#b08a4a> <gray>Type this code in the #link channel on Discord: <white>{code}</white></gray>
gate.not-linked.invite=<gray>Not on the Discord server yet? Visit <white>{invite}</white></gray>

# ---------------------------------------------------------------- not a member, or banned
gate.not-member=<#a8888b>You need to be a member of the <#4a63d8>nordtal</#4a63d8> <#a8888b>Discord server to play here.</#a8888b>
gate.not-member.invite=<gray>Join here: <white>{invite}</white></gray>

# ---------------------------------------------------------------- unlinked while already connected
# /unlink in Discord can end a link mid-session. No link code here; rejoining issues one.
gate.unlinked=<#a8888b>Your Minecraft account is no longer linked to a Discord account.</#a8888b> \
  <gray>Join again to get a new link code.</gray>

# ---------------------------------------------------------------- no active access
gate.no-access=<#a8888b>You do not have active access to <#4a63d8>nordtal</#4a63d8> <#a8888b>right now.</#a8888b> \
  <gray>Buy a period in the contribution channel on Discord.</gray>
gate.no-access.invite=<gray>Discord: <white>{invite}</white></gray>

# ---------------------------------------------------------------- maintenance, with no limbo to wait in
# Only when no limbo server is registered; otherwise a linked member waits in limbo. Shown in their language.
gate.maintenance=<#4a63d8>nordtal</#4a63d8> <#b08a4a>is closed for maintenance right now.</#b08a4a> <gray>Watch Discord for when it is back.</gray>

# ---------------------------------------------------------------- the phase's backend is missing
# gate.yml's server names do not match velocity.toml. A config error, not a player error.
gate.no-server=<#a8888b>The server for the current phase is not available.</#a8888b> <gray>An admin has \
  to fix this - please try again later.</gray>

# ---------------------------------------------------------------- the database is unreachable
gate.trouble=<#a8888b>We are having trouble reaching the access system right now.</#a8888b> <gray>Please \
  try again in a few minutes.</gray>

# the backend lost the connection
# Nobody decided anything, so there is nothing to quote; this line is the whole explanation.
gate.connection-lost=<#a8888b>The connection to the server was lost.</#a8888b> <gray>You are back in \
  the waiting room and will be sent over again as soon as it answers.</gray>

# ---------------------------------------------------------------- the configuration is broken
# The fail-closed screen, bilingual because a broken database.yml cannot reach anyone's language.
gate.misconfigured=<#a8888b>The network is misconfigured.</#a8888b> <gray>Nobody can be let in until an \
  admin has fixed it.</gray>

# the proxy is about to be moved
# Between an update parking everybody and the proxy stopping; it names no duration.
gate.restarting=<#4a63d8>nordtal</#4a63d8> <#b08a4a>is restarting right now.</#b08a4a> <gray>Try again \
  in a moment - nothing is lost, the servers stay up.</gray>

# /phase, the emergency command
# The keys live in the shared bundle messages/commands/en.properties.
# A key of the same name here wins; never use that to add a phase message.

# ---------------------------------------------------------------- mid-session
gate.expiry.warning=<#b08a4a>Your access runs out in <white>{minutes}</white> minutes.</#b08a4a> <gray>Buy \
  more in the contribution channel on Discord to keep playing.</gray>
gate.expiry.expired=<#a8888b>Your access has just run out.</#a8888b> <gray>Buy a new period in the \
  contribution channel on Discord to keep playing.</gray>

# ---------------------------------------------------------------- the resource pack station
# Every login passes limbo, where the pack from pack.yml is offered. The prompt is the pack dialog's line;
# the rest are disconnect screens, sent before Velocity's own because the offer is forced.
pack.prompt=<#4a63d8>nordtal</#4a63d8> <gray>needs its resource pack: the tab list, the nametags, the \
  boards and the whole HUD are drawn with it.</gray>
pack.declined=<#a8888b>You need the resource pack to play here.</#a8888b> <gray>Join again and accept \
  it - it is a few megabytes and it is what draws the nametags, the boards and the HUD.</gray>
pack.failed-download=<#a8888b>The resource pack could not be downloaded.</#a8888b> <gray>That is usually \
  a connection problem - please join again in a moment.</gray>
# A config error, and it hits every player at once. The text still has to make sense to a player.
pack.invalid-url=<#a8888b>The resource pack is not reachable right now.</#a8888b> <gray>An admin has to \
  fix this - please try again later.</gray>
pack.timeout=<#a8888b>Your client never answered the resource pack offer.</#a8888b> <gray>We cannot let \
  you in - join again to try once more.</gray>

# the restart countdown
# Everybody on the network sees these; a run asked for in Discord is announced the same way.
# {seconds} is what is actually left. <what> is the service or the network and opens the sentence.
restart.countdown.update=<#b08a4a><what> is being updated in <white>{seconds}</white> seconds.</#b08a4a>
restart.countdown.recreate=<#b08a4a><what> restarts in <white>{seconds}</white> seconds.</#b08a4a>
restart.countdown.backup=<#b08a4a><what> is being backed up in <white>{seconds}</white> seconds.</#b08a4a>
restart.countdown.down=<#b08a4a><what> goes down for maintenance in <white>{seconds}</white> seconds.</#b08a4a>
# The case with no waiting room: nothing catches anybody, and the line says so.
restart.countdown.maintenance=<#b08a4a>nordtal goes down for maintenance in <white>{seconds}</white> seconds.</#b08a4a>

# The second half of every announcement, on the same line: what happens to you.
restart.fate.reconnect=<gray>You will see a loading screen and then carry straight on.</gray>
restart.fate.waiting-room=<gray>You will wait in the waiting room and come back on your own.</gray>
restart.fate.disconnect=<gray>You will be disconnected - come straight back, it takes about a minute.</gray>

# The names a player uses. A service with no line of its own appears under its compose name.
restart.what.network=<white>The whole network</white>
restart.what.smp=<white>The SMP</white>
restart.what.limbo=<white>The waiting room</white>
restart.what.hunger-games=<white>Hunger Games</white>
restart.what.proxy=<white>The network</white>

# The occasion as a noun, for the two lines that say something is NOT happening.
restart.occasion.update=The update
restart.occasion.recreate=The restart
restart.occasion.backup=The backup
restart.occasion.down=The maintenance
restart.occasion.maintenance=The maintenance
# The last ten seconds, once a second, as a subtitle: the number alone.
restart.tick=<#b08a4a>{seconds}</#b08a4a>
restart.now.update=<#b08a4a><what> is being updated now.</#b08a4a>
restart.now.recreate=<#b08a4a><what> is restarting now.</#b08a4a>
restart.now.backup=<#b08a4a><what> is being backed up now.</#b08a4a>
restart.now.down=<#b08a4a><what> is going down now.</#b08a4a>
restart.now.maintenance=<#b08a4a>nordtal is going down now.</#b08a4a>
restart.cancelled=<#8ba888><occasion> was called off.</#8ba888> <gray>Nothing is happening.</gray>
# The countdown ran out and the run then failed; deliberately not the same line as called off.
restart.failed=<#a8888b><occasion> did not go through.</#a8888b> <gray>You are staying - it will be tried again.</gray>

# Once per countdown, only to somebody playing while the proxy itself is swapped: voice chat does not survive it.
restart.voice=<gray>Voice chat drops out for the moment of the swap and comes back on its own.</gray>

# the way back
# Out of the waiting room: one chat line. Off the standby proxy: chat and a counted subtitle.
return.waiting-room=<#8ba888><what> is back.</#8ba888> <gray>Moving you over now.</gray>
return.countdown=<#8ba888>The network is back.</#8ba888> <gray>You will be reconnected in <white>{seconds}</white> seconds.</gray>
return.now=<#8ba888>Reconnecting you now.</#8ba888>

# ---------------------------------------------------------------- the network is full
# NETWORK_MAX_PLAYERS is reached and this player is not an admin. Only the proxy refuses for fullness.
gate.full=<#b08a4a><#4a63d8>nordtal</#4a63d8> <#b08a4a>is full right now - <white>{online}</white> of \
  <white>{max}</white> players are on.</#b08a4a> <gray>Try again in a few minutes; somebody logs off all the time.</gray>

# ---------------------------------------------------------------- before the network has opened
# The PRE_LAUNCH screens for linked players; the two differ by a purchase (see GateOutcome).
gate.pre-launch.buy=<#4a63d8>nordtal</#4a63d8> <#b08a4a>has not opened yet.</#b08a4a> <gray>You can already \
  buy your first month in the contribution channel on Discord - then the SMP is yours the moment the event is over.</gray>
gate.pre-launch.ready=<#4a63d8>nordtal</#4a63d8> <#b08a4a>has not opened yet.</#b08a4a> <gray>You are all \
  set: your account is linked and your access is paid for. See you at the start.</gray>

# Appended to every PRE_LAUNCH screen; {countdown} is one of the lines below, already rendered.
gate.countdown=<gray>The network opens in <white>{countdown}</white>.</gray>
gate.countdown.unknown=<gray>No opening date has been announced yet - watch Discord.</gray>

# ---------------------------------------------------------------- how a countdown reads
# Deliberately coarse: these are read once, long after a seconds counter would be wrong.
countdown.days={days} days {hours} hours
countdown.hours={hours} hours {minutes} minutes
countdown.minutes={minutes} minutes
# The instant has passed and nobody has switched the phase yet.
countdown.imminent=any moment now
# No launch date is set. Plain text: it is substituted before MiniMessage parses, so a tag would show literally.
countdown.unknown=not announced yet

# ---------------------------------------------------------------- what the server browser shows
# The fail-closed MOTD, read from the classpath because a broken network.yml is one way to get here.
motd.misconfigured=<#4a63d8><bold>nordtal.eu</bold></#4a63d8><newline><#a8888b>Misconfigured - nobody can join until an admin has fixed it.</#a8888b>

# --- the two season dates, set from the proxy (the emergency path; Discord is the normal one) ---
# Times are typed and shown in one fixed zone (see SeasonDates); an admin never writes an offset.

# ---------------------------------------------------------------- /network reload
# gate.yml, pack.yml, network.yml and database.yml are not re-read; NetworkCommand says why.

# ---------------------------------------------------------------- private messages
# /msg, /whisper and /r, carried by the proxy so a conversation survives a server change.
# Two lines per message, each in the reader's language. <_message> is a component and never parsed.
# {flag} and {admin} are glyphs from :common's Glyphs in minecraft:default, so neither names a font.
chat.msg.sent=<gray><italic>to {flag} <white>{partner.name}</white>{admin}:</italic> <#d0d0d8><_message></#d0d0d8></gray>
chat.msg.received=<gray><italic>from {flag} <white>{partner.name}</white>{admin}:</italic> <#d0d0d8><_message></#d0d0d8></gray>

# What the three commands say when they cannot send anything, and what each is for.
# No markup: a refusal is painted by its Tone, and a usage line is read back as plain text.

command.describe.msg=Sends one private line to somebody, wherever on the network they are. \
  Vanilla's own only reaches the server you are standing on.
command.describe.whisper=The same as /msg, under the name half the players type.
command.describe.r=Answers whoever last wrote to you, or whoever you last wrote to. Nothing is \
  written down: a restart of the network forgets who that was.
chat.no-partner=Nobody has written to you yet, and you have written to nobody - so there is nobody \
  to answer. Use /msg with their name.
chat.msg.self=You cannot write to yourself. Whatever you were about to say, you already know it.
chat.failed=That did not go through. Nothing was delivered and nothing was kept.

# /discord and /rules
# Here rather than in :commands because the text wants a link and colour. {invite} is gate.yml#discord-invite-url.
# <newline> splits a value into several chat lines.

info.discord=<gray>The nordtal Discord is where access, languages and the hunger games registration \
  live.</gray><newline><click:open_url:'{invite}'><#4a63d8><underlined>{invite}</underlined></#4a63d8></click>

# The rules are not written yet, and this text says so on purpose. Replacing it needs no release.
# That a grave is open to anyone is stated already, so it is visible before somebody hits it.
info.rules=<red><bold>PLACEHOLDER - THE RULES HAVE NOT BEEN WRITTEN YET.</bold></red><newline><gray>Nothing on this screen is a rule, with one exception that already stands: a grave is open to \
  anyone - whoever gets there first keeps what is in it.</gray><newline><gray>Ask in Discord until \
  the rest says something else:</gray><newline><click:open_url:'{invite}'><#4a63d8><underlined>{invite}</underlined></#4a63d8></click>
