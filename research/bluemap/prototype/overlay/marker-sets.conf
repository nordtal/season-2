# The `marker-sets` block of maps/nordtal.conf. A Nordtal plugin writes the same sets through BlueMapAPI.
marker-sets: {
  travel: {
    label: "Ballonstationen"
    toggleable: true
    default-hidden: false
    sorting: 0
    markers: {
      spawn-balloon: {
        type: "poi"
        position: { x: 0, y: 80, z: 0 }
        label: "Ballonstation Spawn"
        detail: "<div class='nordtal-popup'><b>Ballonstation Spawn</b><br>Ziele: Hafen, Nordwald</div>"
        icon: "nordtal/balloon.png"
        anchor: { x: 16, y: 16 }
        classes: [ "nordtal-icon" ]
        max-distance: 2000
      }
    }
  }
  areas: {
    label: "Schutzgebiete"
    markers: {
      spawn-area: {
        type: "shape"
        position: { x: 0, y: 70, z: 0 }
        label: "Spawn"
        detail: "<b>Spawn</b><br>Hier baut niemand."
        shape: [
          { x: -64, z: -64 }
          { x: 64, z: -64 }
          { x: 64, z: 64 }
          { x: -64, z: 64 }
        ]
        shape-y: 70
        line-width: 2
        line-color: { r: 74, g: 99, b: 216, a: 1.0 }
        fill-color: { r: 74, g: 99, b: 216, a: 0.15 }
      }
    }
  }
}
