pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}

rootProject.name = 'papermc-display-tags'

include 'api'

// Optional: resolve jcore from the local Maven repository instead of JitPack, for working on
// both repos at once before a jcore tag is pushed. Off by default.
//   (cd ../jcore && VERSION=3.0.0 sh gradlew publishToMavenLocal)
//   sh gradlew build -PuseLocalJcore
// JitPack rewrites jcore's group from eu.nordtal to com.github.nordtal, so the coordinate has to
// be swapped, not just the repository.
if (providers.gradleProperty("useLocalJcore").present) {
    gradle.beforeProject { project ->
        project.repositories.mavenLocal()
        project.configurations.configureEach {
            resolutionStrategy.dependencySubstitution {
                substitute module('com.github.nordtal:jcore') using module('eu.nordtal:jcore:3.0.0')
            }
        }
    }
}
