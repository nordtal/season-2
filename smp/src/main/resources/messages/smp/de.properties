# smp, Deutsch. Fehlt hier ein Schlüssel, fällt die Anzeige auf en.properties zurück.
# Parameter in geschweiften Klammern ersetzt eu.nordtal.season.messages.Messages.

# die Welten
smp.world.nordtal=Nordtal
smp.world.nether=Der Nether
smp.world.end=Das End

# Portale
smp.portal.nether-locked=<bad>Der Nether ist noch nicht offen.</bad> <muted>Ein Meilenstein schaltet ihn \
  frei. Die Zieltafel am Spawn zeigt, was noch fehlt.</muted>
smp.portal.end-locked=<bad>Das End ist noch nicht offen.</bad> <muted>Ein Meilenstein schaltet es frei. \
  Die Zieltafel am Spawn zeigt, was noch fehlt.</muted>

# Spawn-Schutz
smp.protect.denied=<bad>Das ist der Spawn-Bereich.</bad> <muted>Hier kannst du nichts bauen, abbauen oder \
  öffnen.</muted>

# das HUD
# Zeile 1 ist höchstens vier Wörter lang, weil 182 px die ganze Leiste sind.
smp.hud.milestone={milestone.name}
smp.hud.progress={percent}%
smp.hud.distance={blocks, plural, one {# Block} other {# Blöcke}}
# Ein Ziel in einer anderen Welt bekommt keinen Pfeil: die Peilung zeigt selbstbewusst irgendwohin.
smp.hud.navigate-other-world=in einer anderen Welt

# /navigate
smp.navigate.started=<muted>Der Pfeil zeigt auf <emphasis>{target}</emphasis>.</muted> <click:run_command:'/navigate cancel'><hover:show_text:'/navigate cancel'><brand><underlined>Abbrechen</underlined></brand></hover></click>
smp.navigate.arrived=<good>Du hast <emphasis>{target}</emphasis> erreicht.</good>
smp.navigate.world-spawn=Der Spawn dieser Welt
smp.navigate.last-death=Wo du zuletzt gestorben bist

# Orte
smp.poi.added=<muted>Der Ort <emphasis>"{name}"</emphasis> ist für alle auf der Karte.</muted>
smp.poi.removed=<muted>Der Ort <emphasis>"{name}"</emphasis> ist entfernt.</muted>
smp.poi.duplicate=<bad>Es gibt bereits einen Ort namens <emphasis>"{name}"</emphasis>.</bad>
smp.poi.not-found=<bad>Es gibt keinen Ort namens <emphasis>"{name}"</emphasis>.</bad>
smp.poi.not-yours=<bad>Nur wer den Ort angelegt hat, und Admins können ihn entfernen.</bad>
smp.poi.bad-name=<bad>Ein Ort braucht einen Namen mit höchstens <emphasis>{max}</emphasis> Zeichen.</bad>

# Reiner Text, kein MiniMessage: phrase() setzt das in command.help.line ein.
command.describe.poi.add=Legt an deiner Position einen Ort an. Alle können ihn ansteuern.
command.describe.poi.remove=Entfernt deinen Ort. Admins entfernen jeden.

# die Boards
smp.board.objective.title=<accent>Aktuelles Ziel</accent>
smp.board.objective.finished=<muted>Alle Meilensteine sind geschafft.</muted>
smp.board.objective.milestone=<emphasis>{milestone.name}</emphasis>
smp.board.objective.row=<muted>{objective} {bar} {amount}/{target}</muted>
smp.board.objective.row-done=<good>{objective} {bar} {amount}/{target}</good>
smp.board.aura.title=<accent>Aura</accent>
smp.board.aura.empty=<muted>Noch hat niemand Aura verdient.</muted>
smp.board.aura.row=<emphasis>{place}. {player.name, name, plain} {aura}</emphasis>
smp.board.aura.row-zero=<faint>{place}. {player.name, name, plain} {aura}</faint>

# weitere Fehler
smp.error.no-account-link=<bad>Dein Minecraft-Konto ist nicht mit Discord verknüpft.</bad> <muted>Verknüpfe \
  es zuerst in Discord.</muted>

# Aura
smp.aura.death=<muted>Ein Tod kostet dich <bad>{aura} Aura</bad>.</muted>
smp.aura.advancement=<good>+{aura} Aura</good> <muted>für diesen Fortschritt.</muted>

# Ziele
smp.objective.completed=<accent><glyph:announce></accent> <muted>Das Ziel <emphasis>"{objective}"</emphasis> ist geschafft. Alle, die geholfen haben, sind bezahlt.</muted>
# Die Namen der Meilensteine des Standard-Tracks; ein neuer in der Gruppe milestones bekommt seinen als Override.
smp.milestone.waiting=Warten
smp.milestone.departure=Aufbruch
smp.milestone.foothold=Fuß fassen
smp.milestone.settlement=Siedlung
smp.milestone.nether=Nether
smp.milestone.end=Ende
smp.milestone.expanse=Weite
smp.milestone.frontier=Grenzland

# "Schau nach oben" ist wörtlich: um jeden Spieler steigen Raketen.
smp.milestone.completed=<accent><glyph:announce></accent> <muted><emphasis>{milestone.name}</emphasis> ist abgeschlossen. Schau nach oben.</muted>

# Eigener Schlüssel: smp.milestone.* wird gegen den Bossbar-Font geprüft, ein Titel steht in minecraft:default.
smp.ceremony.title=<accent>{milestone.name}</accent>
smp.ceremony.subtitle=<muted>Ein Meilenstein ist geschafft.</muted>

# Die Namen, die Stewards Einstellungen für die Werte der Auswahlen der Gruppe milestones zeigen.
smp.settings.unlock.border=Grenze
smp.settings.unlock.nether=Nether
smp.settings.unlock.end=Ende
smp.settings.unlock.nothing=Nichts
smp.settings.objective-type.hand-in=Abgabe
smp.settings.objective-type.statistic=Statistik
smp.settings.objective-type.advancement=Fortschritt

# Gräber
smp.grave.experience=<muted>Du bekommst <emphasis>{experience}</emphasis> Erfahrung.</muted>
# In der Sprache der toten Person, denn das Hologramm hat keinen einzelnen Betrachter.
smp.grave.hologram=<muted>Verschwindet in <emphasis>{left, duration, short}</emphasis></muted>

# Duelle
smp.duel.waiting=<muted>Warte, bis jemand auf der anderen Seite steht.</muted>
smp.duel.queued=<warn>Alle Arenen sind belegt.</warn> <muted>Du stehst in der Warteschlange.</muted>
smp.duel.countdown=<accent>{seconds}...</accent>
smp.duel.go=<good>Los.</good>
smp.duel.won=<good>Du hast gewonnen.</good> <muted>+<emphasis>{aura}</emphasis> Aura.</muted>
smp.duel.lost=<bad>Du hast verloren.</bad> <muted>-<emphasis>{aura}</emphasis> Aura.</muted>
# Die Chatzeile trägt die Zahl; der Titel ist das, was man liest, ohne hinzuschauen.
smp.duel.won.title=<good>Gewonnen</good>
smp.duel.won.subtitle=<muted>+{aura} Aura</muted>
smp.duel.lost.title=<bad>Verloren</bad>
smp.duel.lost.subtitle=<muted>-{aura} Aura</muted>
smp.duel.interrupted=<muted>Das Duell wurde unterbrochen. Es ändert sich keine Aura.</muted>

# das Glücksrad
smp.wheel.won=<good>Das Rad gibt dir</good> <emphasis>{amount}x {item}</emphasis><muted>.</muted>
smp.wheel.none=<bad>Heute keine Spins mehr.</bad> <muted>Komm morgen wieder.</muted>
smp.wheel.none.one=<bad>Heute keine Spins mehr.</bad> <muted>Ein verdienter Spin wartet noch.</muted>
smp.wheel.none.many=<bad>Heute keine Spins mehr.</bad> <muted><emphasis>{extras}</emphasis> verdiente Spins \
  warten noch.</muted>
smp.wheel.available=<muted>Du hast gerade keinen Spin.</muted>
smp.wheel.available.one=<muted>Du hast einen Spin.</muted>
smp.wheel.available.many=<muted>Du hast <emphasis>{count}</emphasis> Spins.</muted>
smp.wheel.broken-prize=<bad>Das Rad hat einen unbekannten Preis gewählt.</bad> <muted>Sag einem Admin \
  Bescheid.</muted>

# der Spawn-NPC
smp.objectives.none=<muted>Es gibt gerade kein Ziel.</muted>
smp.objectives.npc-name=<accent>Nordtal</accent>
smp.handin.accepted=<good><emphasis>{amount}</emphasis> abgegeben.</good>
smp.handin.nothing-wanted=<bad>Dieses Ziel braucht keins dieser Items.</bad> <muted>Es wurde nichts \
  genommen.</muted>
smp.handin.nothing-credited=<bad>Das Ziel ist schon geschafft.</bad> <muted>Du hast deine Items \
  zurück.</muted>
