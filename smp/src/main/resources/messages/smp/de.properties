# "Schau nach oben" war bis zum 2026-09-04 eine Lüge - es gab keinen Titel, kein Feuerwerk und
# nichts am Himmel (Befund 50). Der Satz ist unverändert geblieben und stattdessen wahr geworden:
# um jeden Spieler steigen Raketen, wo immer er gerade steht.
# Die Anzeigenamen der acht Meilensteine des Standard-Tracks (DefaultTrack). Der Track selbst ist
# Konfiguration (milestones.yml) und trägt keine Namen; ein Meilenstein ohne Eintrag hier wird mit
# seinem Schlüssel angesagt - das war bis 2026-09-05 bei allen acht so ("waiting" als Titel).
# Ein neuer Meilenstein im YAML bekommt seinen Namen als Override in plugins/smp/messages/.
