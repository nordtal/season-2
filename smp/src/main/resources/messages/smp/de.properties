# smp, Deutsch. Fehlt hier ein Schlüssel, fällt die Anzeige auf en.properties zurück.
# Parameter in geschweiften Klammern ersetzt eu.nordtal.s2.messages.Messages.

# ---------------------------------------------------------------- die Welten
smp.world.nordtal=Nordtal
smp.world.nether=Der Nether
smp.world.end=Das End

# ---------------------------------------------------------------- der Ballon
smp.balloon.title=Wohin?
smp.balloon.open=<good>Klicken zum Reisen.</good>
smp.balloon.here=<faint>Du bist hier.</faint>
# Ein gesperrtes Ziel bleibt an seinem Platz, ausgegraut, mit dem Grund auf dem Item.
smp.balloon.locked=<bad>Gesperrt, bis die Gemeinschaft <emphasis>{milestone.name}</emphasis> abgeschlossen hat.</bad>
smp.balloon.locked-hint=<faint>Die Zieltafel am Spawn zeigt, wie weit es ist.</faint>
smp.balloon.card=<emphasis>{world}</emphasis>
smp.balloon.card-locked=<muted>{world}</muted>
smp.balloon.locked-unknown=ein späteres Ziel
smp.balloon.travelled=<muted>Der Ballon setzt dich in <emphasis>{world}</emphasis> ab.</muted>
smp.balloon.unavailable=<bad>Diese Welt ist gerade nicht geladen.</bad> <muted>Versuch es gleich noch einmal.</muted>

# ---------------------------------------------------------------- Portale
smp.portal.nether-locked=<bad>Der Nether ist noch nicht offen.</bad> <muted>Er wird durch ein Ziel \
  freigeschaltet, nicht durch Obsidian - die Zieltafel am Spawn zeigt, was noch fehlt.</muted>
smp.portal.end-inactive=<bad>Dieses Portal wird nie zünden.</bad> <muted>Ins End geht es mit dem \
  Ballon, sobald die Gemeinschaft es freigeschaltet hat.</muted>

# ---------------------------------------------------------------- Spawn-Schutz
smp.protect.denied=<bad>Das ist Spawn-Gebiet</bad> <muted>- hier wird nichts gebaut, abgebaut oder geöffnet.</muted>

# ---------------------------------------------------------------- das HUD
# Zeile 1 ist höchstens vier Wörter lang, weil 182 px die ganze Leiste sind.
smp.hud.milestone={milestone.name} - {percent}%
smp.hud.distance={blocks, plural, one {# Block} other {# Blöcke}}
# Ein Ziel in einer anderen Welt bekommt keinen Pfeil: die Peilung zeigt selbstbewusst irgendwohin.
smp.hud.navigate-other-world=in einer anderen Welt

# ---------------------------------------------------------------- /navigate
smp.navigate.title=Navigation
smp.navigate.stop=<bad>Navigation beenden</bad>
smp.navigate.stopped=<muted>Navigation ist aus.</muted>
smp.navigate.started=<muted>Navigation zu <emphasis>{target}</emphasis>.</muted>
smp.navigate.world-spawn=Der Spawn dieser Welt
smp.navigate.last-death=Wo du zuletzt gestorben bist
smp.navigate.at=<faint>{world} {x, number, plain} {y, number, plain} {z, number, plain}</faint>
smp.navigate.target=<emphasis>{target}</emphasis>
smp.navigate.click=<muted>Klicken, um dorthin zu laufen.</muted>
smp.navigate.stop-hint=<muted>Schaltet den Pfeil aus.</muted>
smp.navigate.previous-page=<muted>Vorherige Seite</muted>
smp.navigate.next-page=<muted>Nächste Seite</muted>

# Wird im Fenster in der 5-px-Schrift des Packs gezeichnet, also ohne MiniMessage (NavigatePanelTest).
smp.navigate.stop-button=Stopp
smp.navigate.distance={blocks} m
smp.navigate.other-world=andere Welt
smp.navigate.page={page}/{pages}

# ---------------------------------------------------------------- Orte
smp.poi.added=<muted>Der Ort <emphasis>"{name}"</emphasis> steht ab jetzt für alle auf der Karte.</muted>
smp.poi.removed=<muted><emphasis>"{name}"</emphasis> ist weg.</muted>
smp.poi.duplicate=<bad>Es gibt bereits einen Ort namens <emphasis>"{name}"</emphasis>.</bad>
smp.poi.not-found=<bad>Es gibt keinen Ort namens <emphasis>"{name}"</emphasis>.</bad>
smp.poi.not-yours=<bad>Nur wer den Ort angelegt hat oder ein Admin kann ihn entfernen.</bad>
smp.poi.bad-name=<bad>Ein Ort braucht einen Namen mit höchstens <emphasis>{max}</emphasis> Zeichen.</bad>

# Reiner Text, kein MiniMessage: phrase() setzt das in command.help.line ein.
command.describe.poi.add=Legt an der Stelle, an der du stehst, einen Ort an, den alle ansteuern können.
command.describe.poi.remove=Entfernt einen Ort - deinen eigenen, als Admin auch jeden anderen.

# ---------------------------------------------------------------- die Boards
smp.board.objective.title=<accent>Aktuelles Ziel</accent>
smp.board.objective.finished=<muted>Alle Ziele sind erreicht. Die Welt gehört euch.</muted>
smp.board.objective.milestone=<emphasis>{milestone.name}</emphasis>
smp.board.objective.row=<muted>{objective}  {bar}  {amount}/{target}</muted>
smp.board.objective.row-done=<good>{objective}  {bar}  {amount}/{target}</good>
smp.board.aura.title=<accent>Aura</accent>
smp.board.aura.empty=<muted>Noch hat niemand Aura verdient.</muted>
smp.board.aura.row=<emphasis>{place}. {player.name, name, plain}  {aura}</emphasis>
smp.board.aura.row-zero=<faint>{place}. {player.name, name, plain}  {aura}</faint>

# ---------------------------------------------------------------- weitere Fehler
smp.error.no-account-link=<bad>Dein Minecraft-Konto ist mit keinem Discord-Konto verknüpft.</bad> \
  <muted>Es gibt also nichts, dem das gutgeschrieben werden könnte - verknüpfe es zuerst in Discord.</muted>

# ---------------------------------------------------------------- Aura
smp.aura.death=<muted>Ein Tod kostet dich <bad>{aura} Aura</bad>.</muted>
smp.aura.advancement=<good>+{aura} Aura</good> <muted>für diesen Fortschritt.</muted>

# ---------------------------------------------------------------- Ziele
smp.objective.completed=<accent><glyph:announce></accent> <muted>Das Ziel <emphasis>"{objective}"</emphasis> ist geschafft. Alle, die geholfen haben, sind bezahlt.</muted>
# Die Namen der Meilensteine des Standard-Tracks; ein neuer in der Gruppe milestones bekommt seinen als Override.
smp.milestone.waiting=Warten
smp.milestone.departure=Aufbruch
smp.milestone.foothold=Fuß fassen
smp.milestone.settlement=Siedlung
smp.milestone.nether=Nether
smp.milestone.end=Ende
smp.milestone.expanse=Weite
smp.milestone.frontier=Grenzland

# In die Discord-Ankündigungskanäle als reiner Text (Announcer): keine Glyphen, kein Markup.
smp.announce.milestone={milestone.name} ist geschafft.
smp.announce.milestone.border={milestone.name} ist geschafft - die Grenze wächst.
smp.announce.milestone.nether={milestone.name} ist geschafft - der Nether steht offen.
smp.announce.milestone.end={milestone.name} ist geschafft - das Ende steht offen.

# "Schau nach oben" ist wörtlich: um jeden Spieler steigen Raketen.
smp.milestone.completed=<accent><glyph:announce></accent> <muted><emphasis>{milestone.name}</emphasis> ist abgeschlossen. Schau nach oben.</muted>

# Eigener Schlüssel: smp.milestone.* wird gegen den Bossbar-Font geprüft, ein Titel steht in minecraft:default.
smp.ceremony.title=<accent>{milestone.name}</accent>
smp.ceremony.subtitle=<muted>Ein Meilenstein ist geschafft.</muted>

# ---------------------------------------------------------------- Gräber
smp.grave.title=Grab
smp.grave.experience=<muted><emphasis>{experience}</emphasis> Erfahrung gehört dir.</muted>
# Der Name steht auf dem Kopf, nicht im Titel: ein Fenster für alle trüge sonst die Sprache des Ersten.
smp.grave.owner=<emphasis>{player.name}</emphasis>
smp.grave.owner-unknown=<emphasis>Jemand</emphasis>
smp.grave.died-at=<muted>Gestorben am {at, instant, date} bei {x, number, plain} {y, number, plain} {z, number, plain}</muted>
smp.grave.experience-tooltip=<emphasis>Erfahrung</emphasis>
smp.grave.experience-hint=<muted><emphasis>{experience}</emphasis> gibt es, sobald das letzte Item heraus ist.</muted>
smp.grave.take-all=<emphasis>Alles nehmen</emphasis>
smp.grave.take-all-hint=<muted>Ins Inventar; der Rest fällt vor dich.</muted>
# In der Sprache der toten Person, denn das Hologramm hat keinen einzelnen Betrachter.
smp.grave.hologram=<muted>Verfällt in <emphasis>{left, duration, short}</emphasis></muted>
# Wird im Fenster in der 5-px-Schrift des Packs gezeichnet, also ohne MiniMessage (GravePanelTest).
smp.grave.experience-line=+{experience} XP
smp.grave.take-all-button=Alles nehmen

# ---------------------------------------------------------------- Duelle
smp.duel.waiting=<muted>Warte, bis jemand auf der anderen Seite steht.</muted>
smp.duel.queued=<warn>Alle Arenen sind belegt.</warn> <muted>Du stehst in der Warteschlange.</muted>
smp.duel.countdown=<accent>{seconds}...</accent>
smp.duel.go=<good>Los.</good>
smp.duel.won=<good>Du hast gewonnen.</good> <muted>+<emphasis>{aura}</emphasis> Aura.</muted>
smp.duel.lost=<bad>Du hast verloren.</bad> <muted>-<emphasis>{aura}</emphasis> Aura.</muted>
# Die Chatzeile trägt die Zahl; der Titel ist das, was man liest, ohne hinzuschauen.
smp.duel.won.title=<good>Gewonnen</good>
smp.duel.won.subtitle=<muted>+{aura} Aura</muted>
smp.duel.lost.title=<bad>Verloren</bad>
smp.duel.lost.subtitle=<muted>-{aura} Aura</muted>
smp.duel.interrupted=<muted>Das Duell wurde unterbrochen, es wurde nichts verbucht.</muted>

