smp.board.aura.row=<white>{place}. {player.name}  {aura}</white>
smp.board.aura.row-zero=<dark_gray>{place}. {player.name}  {aura}</dark_gray>

# ---------------------------------------------------------------- weitere Fehler
smp.error.no-account-link=<#a8888b>Dein Minecraft-Konto ist mit keinem Discord-Konto verknüpft.</#a8888b> \
  <gray>Es gibt also nichts, dem das gutgeschrieben werden könnte - verknüpfe es zuerst in Discord.</gray>

# ---------------------------------------------------------------- Aura
smp.aura.death=<gray>Ein Tod kostet dich <#a8888b>{aura} Aura</#a8888b>.</gray>
smp.aura.advancement=<#8ba888>+{aura} Aura</#8ba888> <gray>für diesen Fortschritt.</gray>

# ---------------------------------------------------------------- Ziele
smp.objective.completed=<#b08a4a>{icon}</#b08a4a> <gray>Das Ziel <white>"{objective}"</white> ist geschafft. Alle, die geholfen haben, sind bezahlt.</gray>
# Die Namen der Meilensteine des Standard-Tracks; ein neuer in milestones.yml bekommt seinen als Override.
smp.milestone.waiting=Warten
smp.milestone.departure=Aufbruch
smp.milestone.foothold=Fuß fassen
smp.milestone.settlement=Siedlung
smp.milestone.nether=Nether
smp.milestone.end=Ende
smp.milestone.expanse=Weite
smp.milestone.frontier=Grenzland

# In die Discord-Ankündigungskanäle als reiner Text (Announcer): keine Glyphen, kein Markup.
smp.announce.milestone={milestone.name} ist geschafft.
smp.announce.milestone.border={milestone.name} ist geschafft - die Grenze wächst.
smp.announce.milestone.nether={milestone.name} ist geschafft - der Nether steht offen.
smp.announce.milestone.end={milestone.name} ist geschafft - das Ende steht offen.

# "Schau nach oben" ist wörtlich: um jeden Spieler steigen Raketen.
smp.milestone.completed=<#b08a4a>{icon}</#b08a4a> <gray><white>{milestone.name}</white> ist abgeschlossen. Schau nach oben.</gray>

# Eigener Schlüssel: smp.milestone.* wird gegen den Bossbar-Font geprüft, ein Titel steht in minecraft:default.
smp.ceremony.title=<#b08a4a>{milestone.name}</#b08a4a>
smp.ceremony.subtitle=<gray>Ein Meilenstein ist geschafft.</gray>

# ---------------------------------------------------------------- Gräber
smp.grave.title=Grab
smp.grave.experience=<gray><white>{experience}</white> Erfahrung gehört dir.</gray>
# Der Name steht auf dem Kopf, nicht im Titel: ein Fenster für alle trüge sonst die Sprache des Ersten.
smp.grave.owner=<white>{player.name}</white>
smp.grave.owner-unknown=<white>Jemand</white>
smp.grave.died-at=<gray>Gestorben am {date} bei {x} {y} {z}</gray>
smp.grave.experience-tooltip=<white>Erfahrung</white>
smp.grave.experience-hint=<gray><white>{experience}</white> gibt es, sobald das letzte Item heraus ist.</gray>
smp.grave.take-all=<white>Alles nehmen</white>
smp.grave.take-all-hint=<gray>Ins Inventar; der Rest fällt vor dich.</gray>
