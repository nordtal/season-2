# ---------------------------------------------------------------- /smp update
# Die zweite Oberfläche auf den Updater, für den Fall, dass Discord gerade nicht da ist, wo du
# bist. Dieses Plugin aktualisiert nichts: es schreibt eine Zeile in update_request und liest die
# Antwort zurück - dieselbe Zeile und derselben Bericht, den /update in Discord zeigt. Der Bericht
# selbst ist NICHT übersetzt: er ist der eigene Text des Updaters, einmal geschrieben von dem
# Prozess, der die Arbeit gemacht hat. Eine zweite Fassung davon wäre genau das, was irgendwann von
# der ersten abweicht.
smp.update.checking=<gray>Frage den Updater, was es Neues gibt. Einen Moment.</gray>
smp.update.installing=<#b08a4a>Installiere.</#b08a4a> <gray>Dabei werden ein Paper-Jar und sämtliche Plugins \
  geladen, das dauert ein paar Minuten. Neu gestartet wird dabei nichts.</gray>
# Nennt den Status mit Absicht: PENDING bedeutet hier genau eine Sache, nämlich dass der
# Updater-Container nicht läuft und niemand zuhört.
# Der Countdown IST die Bestätigung. Eine Chatzeile hat keinen Knopf zum Drücken, also wird
# stattdessen das ganze Netzwerk gewarnt und wer es getippt hat, hat eine Minute Zeit.
smp.update.restart-asked=<#b08a4a>Das gesamte Netzwerk startet in <white>{seconds}</white> Sekunden neu.</#b08a4a> \
  <gray>Alle Online werden heruntergezählt. Mit <white>/update restart cancel</white> stoppst du es.</gray>
smp.update.restart-cancelled=<#8ba888>Gestoppt.</#8ba888> <gray>Es wird nichts neu gestartet.</gray>
smp.update.restart-too-late=<#a8888b>Zu spät</#a8888b> <gray>- der Neustart hat schon begonnen.</gray>


# ---------------------------------------------------------------- Chat und die Systemzeilen
# Die vier Zeilen, die ein Spieler den ganzen Tag liest, plus die vor dem, was er sagt. Jede Glyphe
# ist ein {parameter}, weil Glyphs die einzige Stelle im Repository ist, die einen Codepunkt nennt;
# die Icons sind absichtlich weiß gezeichnet, also ist die hier geschriebene Farbe die, die
# herauskommt.
#
# Ein <_name>-Tag ist ein Platz für etwas, das BEREITS eine Komponente ist und das Flachklopfen zu
# Text nicht überlebt - Flagge und Wappen des Absenders, die Todesnachricht des Spiels selbst, der
# Titel eines Fortschritts. Der Unterstrich unterscheidet sie auf einen Blick von einem
# MiniMessage-Stil-Tag, und MessageBundlesTest hält beide Sprachen auf denselben Satz davon.
smp.chat.line=<_sender> <#4e5668>{separator}</#4e5668> <#d0d0d8><_message>
smp.system.join=<#8ba888>{icon}</#8ba888> <gray><_player> ist da.</gray>
smp.system.leave=<#a8888b>{icon}</#a8888b> <gray><_player> ist weg.</gray>
smp.system.death=<#a8888b>{icon}</#a8888b> <gray><_death></gray>
smp.system.advancement=<#b08a4a>{icon}</#b08a4a> <gray><_player> hat <white><_advancement></white> geschafft.</gray>

# Kopf- und Fußzeile der Tabliste. {logo} ist Glyphs.LOGO_HEIGHT_32 - ein Private-Use-Codepoint,
# der absichtlich nicht in dieser Datei steht; siehe PlayerSurfaces#sendTabListFrame. MiniMessage,
# also ist <newline> der Zeilenumbruch: ein .properties-Wert kann keinen echten tragen.
tab.header=<newline>{logo}<newline><#4a63d8>nordtal.eu</#4a63d8> <dark_gray>|</dark_gray> <white>Staffel 2</white><newline>
tab.footer=<newline><gray>{online}<dark_gray>/</dark_gray>{max} online</gray><newline><#4a63d8>nordtal.eu</#4a63d8>

# ---------------------------------------------------------------- /smp access
#
# Drei Zeilen, die ein Admin neben jemandem braucht, der nicht hereinkommt. Das ganze Bild ist
# /access-status in Discord; das hier ist die gekürzte Fassung, und die Zahlungszeile ist der Grund,
# warum es sie gibt - "hat nicht bezahlt" und "ist mitten im Bezahlen" sehen von außen gleich aus.
