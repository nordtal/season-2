# smp - Deutsch. Fehlt hier ein Schluessel, faellt die Anzeige auf en.properties zurueck.
#
# Parameter stehen in geschweiften Klammern und werden von
# eu.nordtal.s2.common.message.Messages ersetzt. Das Konzept dazu steht in docs/smp.md.

# ---------------------------------------------------------------- die Welten
smp.world.nordtal=Nordtal
smp.world.farm=Farmwelt
smp.world.nether=Der Nether
smp.world.end=Das End

# ---------------------------------------------------------------- der Ballon
smp.balloon.title=Wohin?
smp.balloon.open=Klicken zum Reisen.
smp.balloon.here=Du bist hier.
# Ein gesperrtes Ziel bleibt an seinem Platz, ausgegraut. Vor dem Ballon zu stehen ist genau der
# Moment, in dem jemand wissen will, warum der Nether noch nicht geht.
smp.balloon.locked=Gesperrt, bis die Gemeinschaft {milestone} abgeschlossen hat.
smp.balloon.locked-hint=Die Zieltafel am Spawn zeigt, wie weit es ist.
smp.balloon.locked-unknown=ein spaeteres Ziel
smp.balloon.travelled=Der Ballon setzt dich in {world} ab.
smp.balloon.unavailable=Diese Welt ist gerade nicht geladen. Versuch es gleich noch einmal.

# ---------------------------------------------------------------- die Farmwelt
smp.farm.warning=Die Farmwelt wird in {minutes} Minuten neu erzeugt. Alles darin ist danach weg - \
  Kisten, Graeber und Orte eingeschlossen.
smp.farm.moved=Die Farmwelt wurde neu erzeugt. Du bist zurueck in Nordtal.
smp.farm.postponed=Der Farmwelt-Reset verschiebt sich - die Welt von morgen ist noch nicht fertig \
  erzeugt. Es hat sich nichts geaendert.

# ---------------------------------------------------------------- Portale
smp.portal.nether-locked=Der Nether ist noch nicht offen. Er wird durch ein Ziel freigeschaltet, \
  nicht durch Obsidian - die Zieltafel am Spawn zeigt, was noch fehlt.
smp.portal.end-inactive=Dieses Portal wird nie zuenden. Ins End geht es mit dem Ballon, sobald die \
  Gemeinschaft es freigeschaltet hat.

# ---------------------------------------------------------------- Spawn-Schutz
smp.protect.denied=Das ist Spawn-Gebiet - hier wird nichts gebaut, abgebaut oder geoeffnet.

# ---------------------------------------------------------------- Fehler
# Nur auf Englisch, notgedrungen: beim Pre-Login gibt es noch keine Kontoverknuepfung, also auch
# keine Sprache - und was sie liefern wuerde, ist genau das, was ausgefallen ist.
smp.error.database-unreachable=The server cannot reach its database right now, so logging in would \
  lose your progress. Please try again in a few minutes.

# ---------------------------------------------------------------- das HUD
smp.hud.milestone={milestone} - {percent}%
smp.hud.distance={blocks} Bloecke
# Ein Ziel in einer anderen Welt bekommt keinen Pfeil: eine Peilung zwischen zwei Koordinaten-
# systemen, die nur die Zahlen gemeinsam haben, zeigt selbstbewusst irgendwohin.
smp.hud.navigate-other-world=in einer anderen Welt

# ---------------------------------------------------------------- /navigate
smp.navigate.title=Navigation
smp.navigate.stop=Navigation beenden
smp.navigate.stopped=Navigation ist aus.
smp.navigate.started=Navigation zu {target}.
smp.navigate.world-spawn=Der Spawn dieser Welt
smp.navigate.last-death=Wo du zuletzt gestorben bist
smp.navigate.at={world} {x} {y} {z}

# ---------------------------------------------------------------- Orte
smp.poi.added=Der Ort "{name}" steht ab jetzt fuer alle auf der Karte.
smp.poi.removed="{name}" ist weg.
smp.poi.duplicate=Es gibt bereits einen Ort namens "{name}".
smp.poi.not-found=Es gibt keinen Ort namens "{name}".
smp.poi.not-yours=Nur wer den Ort angelegt hat oder ein Admin kann ihn entfernen.
smp.poi.bad-name=Ein Ort braucht einen Namen mit hoechstens {max} Zeichen.

# ---------------------------------------------------------------- die Boards
smp.board.objective.title=Aktuelles Ziel
smp.board.objective.finished=Alle Ziele sind erreicht. Die Welt gehoert euch.
smp.board.aura.title=Aura
smp.board.aura.empty=Noch hat niemand Aura verdient.

# ---------------------------------------------------------------- weitere Fehler
smp.error.no-account-link=Dein Minecraft-Konto ist mit keinem Discord-Konto verknuepft, es gibt \
  also nichts, dem das gutgeschrieben werden koennte. Verknuepfe es zuerst in Discord.

# ---------------------------------------------------------------- Aura
smp.aura.death=Ein Tod kostet dich {aura} Aura.
smp.aura.advancement=+{aura} Aura fuer diesen Fortschritt.

# ---------------------------------------------------------------- Ziele
smp.objective.completed=Das Ziel "{objective}" ist geschafft. Alle, die geholfen haben, sind bezahlt.
smp.milestone.completed={milestone} ist abgeschlossen. Schau nach oben.

# ---------------------------------------------------------------- Graeber
smp.grave.title=Grab
smp.grave.experience={experience} Erfahrung gehoert dir.

# ---------------------------------------------------------------- Duelle
smp.duel.waiting=Warte, bis jemand auf der anderen Seite steht.
smp.duel.queued=Alle Arenen sind belegt. Du stehst in der Warteschlange.
smp.duel.countdown={seconds}...
smp.duel.go=Los.
smp.duel.won=Du hast gewonnen. +{aura} Aura.
smp.duel.lost=Du hast verloren. -{aura} Aura.
smp.duel.interrupted=Das Duell wurde unterbrochen, es wurde nichts verbucht.

# ---------------------------------------------------------------- das Glücksrad
smp.wheel.won=Das Rad gibt dir {amount}x {item}.
smp.wheel.none=Heute keine Drehs mehr. Du hast {extras} verdiente Dreh(s) uebrig.
smp.wheel.available=Du hast {count} Dreh(s).
smp.wheel.broken-prize=Das Rad ist auf einem Preis gelandet, den dieser Server nicht kennt. Sag einem Admin Bescheid.

# ---------------------------------------------------------------- /smp
smp.admin.reloaded=Der Milestone-Track wurde neu geladen.
smp.admin.farmreset=Die Farmwelt wird jetzt zurueckgesetzt.
smp.admin.no-active-milestone=Es ist kein Milestone aktiv, also kann kein Ziel abgeschlossen werden.
smp.admin.no-such-objective=Der aktive Milestone hat kein Ziel mit diesem Schluessel.
smp.admin.milestone-unlocked=Der Milestone wurde freigeschaltet.
smp.admin.player-offline=Dieser Spieler ist nicht online.
smp.admin.aura-changed=Die Aura wurde geaendert, der Grund ist festgehalten.
