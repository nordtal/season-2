# ---------------------------------------------------------------- Chat und die Systemzeilen
# Diese stehen als system.* im Bundle von :paper-common; ein gleichnamiger Schlüssel hier überschreibt ihn.

# {logo} ist Glyphs.LOGO_HEIGHT_32; <newline> ist der Zeilenumbruch, ein .properties-Wert kann keinen tragen.
tab.header=<newline>{logo}<newline><#4a63d8>nordtal.eu</#4a63d8> <dark_gray>|</dark_gray> <white>Staffel 2</white><newline>
tab.footer=<newline><gray>{online}<dark_gray>/</dark_gray>{max} online</gray><newline><#4a63d8>nordtal.eu</#4a63d8>

