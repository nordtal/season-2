# smp, Deutsch. Fehlt hier ein Schlüssel, fällt die Anzeige auf en.properties zurück.
# Parameter in geschweiften Klammern ersetzt eu.nordtal.s2.messages.Messages.

# ---------------------------------------------------------------- die Welten
smp.world.nordtal=Nordtal
smp.world.nether=Der Nether
smp.world.end=Das End

# ---------------------------------------------------------------- der Ballon
smp.balloon.title=Wohin?
smp.balloon.open=<#8ba888>Klicken zum Reisen.</#8ba888>
smp.balloon.here=<dark_gray>Du bist hier.</dark_gray>
# Ein gesperrtes Ziel bleibt an seinem Platz, ausgegraut, mit dem Grund auf dem Item.
smp.balloon.locked=<#a8888b>Gesperrt, bis die Gemeinschaft <white>{milestone.name}</white> abgeschlossen hat.</#a8888b>
smp.balloon.locked-hint=<dark_gray>Die Zieltafel am Spawn zeigt, wie weit es ist.</dark_gray>
smp.balloon.card=<white>{world}</white>
smp.balloon.card-locked=<gray>{world}</gray>
smp.balloon.locked-unknown=ein späteres Ziel
smp.balloon.travelled=<gray>Der Ballon setzt dich in <white>{world}</white> ab.</gray>
smp.balloon.unavailable=<#a8888b>Diese Welt ist gerade nicht geladen.</#a8888b> <gray>Versuch es gleich noch einmal.</gray>

# ---------------------------------------------------------------- Portale
smp.portal.nether-locked=<#a8888b>Der Nether ist noch nicht offen.</#a8888b> <gray>Er wird durch ein Ziel \
  freigeschaltet, nicht durch Obsidian - die Zieltafel am Spawn zeigt, was noch fehlt.</gray>
smp.portal.end-inactive=<#a8888b>Dieses Portal wird nie zünden.</#a8888b> <gray>Ins End geht es mit dem \
  Ballon, sobald die Gemeinschaft es freigeschaltet hat.</gray>

# ---------------------------------------------------------------- Spawn-Schutz
smp.protect.denied=<#a8888b>Das ist Spawn-Gebiet</#a8888b> <gray>- hier wird nichts gebaut, abgebaut oder geöffnet.</gray>

# ---------------------------------------------------------------- das HUD
# Zeile 1 ist höchstens vier Wörter lang, weil 182 px die ganze Leiste sind.
smp.hud.milestone={milestone.name} - {percent}%
smp.hud.distance={blocks} Blöcke
# Ein Ziel in einer anderen Welt bekommt keinen Pfeil: die Peilung zeigt selbstbewusst irgendwohin.
smp.hud.navigate-other-world=in einer anderen Welt

# ---------------------------------------------------------------- /navigate
smp.navigate.title=Navigation
smp.navigate.stop=<#a8888b>Navigation beenden</#a8888b>
smp.navigate.stopped=<gray>Navigation ist aus.</gray>
smp.navigate.started=<gray>Navigation zu <white>{target}</white>.</gray>
smp.navigate.world-spawn=Der Spawn dieser Welt
smp.navigate.last-death=Wo du zuletzt gestorben bist
smp.navigate.at=<dark_gray>{world} {x} {y} {z}</dark_gray>
smp.navigate.target=<white>{target}</white>
smp.navigate.click=<gray>Klicken, um dorthin zu laufen.</gray>
smp.navigate.stop-hint=<gray>Schaltet den Pfeil aus.</gray>
smp.navigate.previous-page=<gray>Vorherige Seite</gray>
smp.navigate.next-page=<gray>Nächste Seite</gray>

# Wird im Fenster in der 5-px-Schrift des Packs gezeichnet, also ohne MiniMessage (NavigatePanelTest).
smp.navigate.stop-button=Stopp
smp.navigate.distance={blocks} m
smp.navigate.other-world=andere Welt
smp.navigate.page={page}/{pages}

# ---------------------------------------------------------------- Orte
smp.poi.added=<gray>Der Ort <white>"{name}"</white> steht ab jetzt für alle auf der Karte.</gray>
smp.poi.removed=<gray><white>"{name}"</white> ist weg.</gray>
smp.poi.duplicate=<#a8888b>Es gibt bereits einen Ort namens <white>"{name}"</white>.</#a8888b>
smp.poi.not-found=<#a8888b>Es gibt keinen Ort namens <white>"{name}"</white>.</#a8888b>
smp.poi.not-yours=<#a8888b>Nur wer den Ort angelegt hat oder ein Admin kann ihn entfernen.</#a8888b>
smp.poi.bad-name=<#a8888b>Ein Ort braucht einen Namen mit höchstens <white>{max}</white> Zeichen.</#a8888b>

# Reiner Text, kein MiniMessage: phrase() setzt das in command.help.line ein.
command.describe.poi.add=Legt an der Stelle, an der du stehst, einen Ort an, den alle ansteuern können.
command.describe.poi.remove=Entfernt einen Ort - deinen eigenen, als Admin auch jeden anderen.

# ---------------------------------------------------------------- die Boards
smp.board.objective.title=<#b08a4a>Aktuelles Ziel</#b08a4a>
smp.board.objective.finished=<gray>Alle Ziele sind erreicht. Die Welt gehört euch.</gray>
smp.board.objective.milestone=<white>{milestone.name}</white>
smp.board.objective.row=<gray>{objective}  {bar}  {amount}/{target}</gray>
smp.board.objective.row-done=<#8ba888>{objective}  {bar}  {amount}/{target}</#8ba888>
smp.board.aura.title=<#b08a4a>Aura</#b08a4a>
