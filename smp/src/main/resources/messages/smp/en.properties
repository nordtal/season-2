# smp - English. This file is the fallback for every other language: a key that is missing here
# shows up on screen as the key itself, so keep it complete.
#
# Parameters are named and written in braces, substituted by eu.nordtal.s2.common.message.Messages.
# See docs/smp.md for the concept every message here belongs to.

# ---------------------------------------------------------------- the worlds
# Used in the balloon GUI and on HUD line 1. Names, not sentences.
smp.world.nordtal=Nordtal
smp.world.farm=Farm world
smp.world.nether=The Nether
smp.world.end=The End

# ---------------------------------------------------------------- the balloon
smp.balloon.title=Where to?
smp.balloon.open=Click to travel.
smp.balloon.here=You are here.
# A locked destination keeps its place in the grid, greyed. Standing at the balloon is exactly when
# somebody wants to know why the Nether is not available yet, so the reason is on the item.
smp.balloon.locked=Locked until the community finishes {milestone}.
smp.balloon.locked-hint=The objective board at the spawn shows how far along it is.
smp.balloon.locked-unknown=a later milestone
smp.balloon.travelled=The balloon sets you down in {world}.
smp.balloon.unavailable=That world is not loaded right now. Try again in a moment.

# ---------------------------------------------------------------- the farm world
smp.farm.warning=The farm world is regenerated in {minutes} minutes. Everything in it will be gone \
  - chests, graves and points of interest included.
smp.farm.moved=The farm world has been regenerated. You have been brought back to Nordtal.
# Sent to the people standing in the farm world when tomorrow's is not finished. They are the only
# ones affected, and they are the only ones told.
smp.farm.postponed=The farm world reset is postponed - tomorrow's world is not finished generating \
  yet. Nothing has changed.

# ---------------------------------------------------------------- portals
smp.portal.nether-locked=The Nether is not open yet. It is unlocked by a milestone, not by \
  obsidian - the objective board at the spawn shows what is left.
smp.portal.end-inactive=This portal will never activate. The End is entered by balloon, once the \
  community has unlocked it.

# ---------------------------------------------------------------- spawn protection
# Shown on the action bar rather than in chat: it fires on a misclick as often as on an attempt,
# and a chat line per misclick would be noise.
smp.protect.denied=This is spawn ground - nothing here can be built, broken or opened.

# ---------------------------------------------------------------- failures
# English only by necessity: at pre-login there is no account link yet, so there is no language to
# read - and the thing that would have told us is the thing that is broken.
smp.error.database-unreachable=The server cannot reach its database right now, so logging in would \
  lose your progress. Please try again in a few minutes.

# ---------------------------------------------------------------- the HUD
# Line 1, beside the dimension icon. Line 2 exists only while /navigate is on.
smp.hud.milestone={milestone} - {percent}%
smp.hud.distance={blocks} blocks
# A target in another world gets no arrow: a bearing between two coordinate systems that share
# nothing but their numbers would point somewhere confidently wrong.
smp.hud.navigate-other-world=in another world

# ---------------------------------------------------------------- /navigate
smp.navigate.title=Navigate
smp.navigate.stop=Stop navigating
smp.navigate.stopped=Navigation is off.
smp.navigate.started=Navigating to {target}.
smp.navigate.world-spawn=This world's spawn
smp.navigate.last-death=Where you last died
smp.navigate.at={world} {x} {y} {z}

# ---------------------------------------------------------------- points of interest
smp.poi.added=The point of interest "{name}" is on the map for everybody.
smp.poi.removed="{name}" is gone.
smp.poi.duplicate=There is already a point of interest called "{name}".
smp.poi.not-found=There is no point of interest called "{name}".
# POIs are public to see and to use; deleting is the one asymmetry.
smp.poi.not-yours=Only whoever created that point of interest, or an admin, can remove it.
smp.poi.bad-name=A point of interest needs a name of at most {max} characters.

# ---------------------------------------------------------------- the boards
smp.board.objective.title=Current objective
smp.board.objective.finished=Every milestone is finished. The world is yours.
smp.board.aura.title=Aura
smp.board.aura.empty=Nobody has earned any aura yet.

# ---------------------------------------------------------------- more failures
smp.error.no-account-link=Your Minecraft account is not linked to a Discord account, so there is \
  nothing to credit this to. Link it in Discord first.

# ---------------------------------------------------------------- aura
smp.aura.death=A death costs you {aura} aura.
smp.aura.advancement=+{aura} aura for that advancement.

# ---------------------------------------------------------------- objectives and milestones
smp.objective.completed=The objective "{objective}" is finished. Everybody who helped has been paid.
smp.milestone.completed={milestone} is complete. Look up.

# ---------------------------------------------------------------- graves
smp.grave.title=Grave
smp.grave.experience={experience} experience is yours.

# ---------------------------------------------------------------- duels
smp.duel.waiting=Waiting for somebody to step on the other side.
smp.duel.queued=Every arena is busy. You are in the queue.
smp.duel.countdown={seconds}...
smp.duel.go=Go.
smp.duel.won=You won. +{aura} aura.
smp.duel.lost=You lost. -{aura} aura.
# A duel that ends because the server is stopping costs nobody anything.
smp.duel.interrupted=The duel was interrupted and nothing was booked.

# ---------------------------------------------------------------- the wheel
smp.wheel.won=The wheel gives you {amount}x {item}.
smp.wheel.none=No spins left today. You have {extras} earned spin(s) waiting.
smp.wheel.available=You have {count} spin(s).
smp.wheel.broken-prize=The wheel landed on a prize this server does not know. Tell an admin.

# ---------------------------------------------------------------- /smp
smp.admin.reloaded=The milestone track was reloaded.
smp.admin.farmreset=Resetting the farm world now.
smp.admin.no-active-milestone=No milestone is active, so no objective can be completed.
smp.admin.no-such-objective=The active milestone has no objective by that key.
smp.admin.milestone-unlocked=The milestone was unlocked.
smp.admin.player-offline=That player is not online.
smp.admin.aura-changed=The aura was changed, and the reason was recorded.
