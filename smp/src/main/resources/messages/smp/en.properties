# ---------------------------------------------------------------- /smp update
# THE KEYS ARE NOT HERE ANY MORE, and neither is the command, since 2026-09-08. /smp update became
# /update, a root of its own on all five processes, so that it is not one tab-completion away from
# /smp - and its keys moved with it into :commands' shared bundle as update.*. This module loads
# that root underneath its own, so a key of the same name written here would win over the shared
# one, which is exactly what nobody wants: the whole point of the shared bundle is that the answer
# reads the same in game, on the proxy console and in Discord.
# The reasoning those keys carry moved too and is not repeated here. What is worth keeping in this
# file is only why there is nothing left in it: this plugin never updated anything. It writes a row
# into update_request and reads the answer back, and the report is the updater's own text, printed
# once by the process that did the work - a second rendering here is the thing that would
# eventually disagree with the first.


# ---------------------------------------------------------------- chat and the system lines
# THE FIVE KEYS ARE NOT HERE ANY MORE, since 2026-09-09. smp.chat.line and smp.system.* moved into
# :paper-common's own bundle as system.chat.line and system.*, because the hunger games needed the
# same five lines and had none of them (finding 149). This module loads that root underneath its
# own, so a key of the same name written here would win over the shared one - which is the
# mechanism and not a bug, but do it deliberately.
# See paper-common/src/main/resources/messages/paper-common/en.properties.

# The tab list's header and footer. {logo} is Glyphs.LOGO_HEIGHT_32 - a private-use code point that
# deliberately does not live in this file; see PlayerSurfaces#sendTabListFrame. MiniMessage, so
# <newline> is how a line break is written: a .properties value cannot carry a real one.
tab.header=<newline>{logo}<newline><#4a63d8>nordtal.eu</#4a63d8> <dark_gray>|</dark_gray> <white>Season 2</white><newline>
tab.footer=<newline><gray>{online}<dark_gray>/</dark_gray>{max} online</gray><newline><#4a63d8>nordtal.eu</#4a63d8>

# ---------------------------------------------------------------- /smp access
#
# Three lines an admin standing next to somebody who cannot get in actually needs. The full picture
# is /access-status in Discord; this is the shortened version, and the payment line is the one that
# pays for it existing - "has not paid" and "is halfway through paying" look identical from outside.
