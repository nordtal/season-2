# ---------------------------------------------------------------- spawn protection
# Shown on the action bar rather than in chat: it fires on a misclick as often as on an attempt,
# and a chat line per misclick would be noise.
smp.protect.denied=This is spawn ground - nothing here can be built, broken or opened.

# ---------------------------------------------------------------- failures
# English only by necessity: at pre-login there is no account link yet, so there is no language to
# read - and the thing that would have told us is the thing that is broken.
smp.error.database-unreachable=The server cannot reach its database right now, so logging in would \
  lose your progress. Please try again in a few minutes.

# ---------------------------------------------------------------- the HUD
# Line 1, beside the dimension icon. Line 2 exists only while /navigate is on.
# smp.hud.farm-warning takes line 1 over for eight seconds at each of the four reset warnings,
# keeping the dimension icon. Four words, because 182 px is the whole bar - the sentence is in
# smp.farm.warning, in chat, where it can be scrolled back to.
smp.hud.farm-warning=Farm reset in {minutes} min
smp.hud.milestone={milestone} - {percent}%
smp.hud.distance={blocks} blocks
# A target in another world gets no arrow: a bearing between two coordinate systems that share
# nothing but their numbers would point somewhere confidently wrong.
smp.hud.navigate-other-world=in another world

