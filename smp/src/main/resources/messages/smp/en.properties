# smp - English. This file is the fallback for every other language: a key that is missing here
# shows up on screen as the key itself, so keep it complete.
#
# Parameters are named and written in braces, substituted by eu.nordtal.s2.common.message.Messages.
# See docs/smp.md for the concept every message here belongs to.

# ---------------------------------------------------------------- the worlds
# Used in the balloon GUI and on HUD line 1. Names, not sentences.
smp.world.nordtal=Nordtal
smp.world.farm=Farm world
smp.world.nether=The Nether
smp.world.end=The End

# ---------------------------------------------------------------- the balloon
smp.balloon.title=Where to?
smp.balloon.open=Click to travel.
smp.balloon.here=You are here.
# A locked destination keeps its place in the grid, greyed. Standing at the balloon is exactly when
# somebody wants to know why the Nether is not available yet, so the reason is on the item.
smp.balloon.locked=Locked until the community finishes {milestone}.
smp.balloon.locked-hint=The objective board at the spawn shows how far along it is.
smp.balloon.locked-unknown=a later milestone
smp.balloon.travelled=The balloon sets you down in {world}.
smp.balloon.unavailable=That world is not loaded right now. Try again in a moment.

# ---------------------------------------------------------------- the farm world
smp.farm.warning=The farm world is regenerated in {minutes} minutes. Everything in it will be gone \
  - chests, graves and points of interest included.
smp.farm.moved=The farm world has been regenerated. You have been brought back to Nordtal.
# Sent to the people standing in the farm world when tomorrow's is not finished. They are the only
# ones affected, and they are the only ones told.
smp.farm.postponed=The farm world reset is postponed - tomorrow's world is not finished generating \
  yet. Nothing has changed.

# ---------------------------------------------------------------- portals
smp.portal.nether-locked=The Nether is not open yet. It is unlocked by a milestone, not by \
  obsidian - the objective board at the spawn shows what is left.
smp.portal.end-inactive=This portal will never activate. The End is entered by balloon, once the \
  community has unlocked it.

# ---------------------------------------------------------------- spawn protection
# Shown on the action bar rather than in chat: it fires on a misclick as often as on an attempt,
# and a chat line per misclick would be noise.
smp.protect.denied=This is spawn ground - nothing here can be built, broken or opened.

# ---------------------------------------------------------------- failures
# English only by necessity: at pre-login there is no account link yet, so there is no language to
# read - and the thing that would have told us is the thing that is broken.
smp.error.database-unreachable=The server cannot reach its database right now, so logging in would \
  lose your progress. Please try again in a few minutes.
