# ---------------------------------------------------------------- /smp update
# The second surface onto the updater, for when Discord is not where you are. This plugin does not
# update anything: it writes a row into update_request and reads the answer back, which is the same
# row and the same report /update in Discord shows. The report itself is NOT translated - it is the
# updater's own text, printed once by the process that did the work, and a second rendering of it
# here is exactly the thing that would eventually disagree with the first.
smp.update.checking=Asking the updater what is new. This takes a moment.
smp.update.installing=Installing. This downloads a Paper jar and every plugin, so give it a few \
  minutes. Nothing restarts when it is done.
# Names the state on purpose: PENDING here means one specific thing, which is that the updater
# container is not running and nothing is listening.
# The countdown IS the confirmation. A chat line has no button to press, so instead everybody on
# the network is warned and the person who typed it has a minute to change their mind.
smp.update.restart-asked=Restarting the whole network in {seconds} seconds. Everybody online is \
  being counted down. Type /smp update restart cancel to stop it.
smp.update.restart-cancelled=Stopped. Nothing is restarting.
smp.update.restart-too-late=Too late - the restart has already begun.


# ---------------------------------------------------------------- chat and the system lines
# The four lines a player reads all day, plus the one in front of what they say. Every glyph is a
# {parameter} because Glyphs is the only place in this repository that names a code point; the
# icons are drawn white on purpose, so the colour written here is the colour they come out.
#
# A <_name> tag is a slot for something that is ALREADY a component and cannot survive being
# flattened to text - the sender's flag and crest, vanilla's own death message, an advancement's
# title. The underscore is what tells them apart from a MiniMessage style tag at a glance, and
# MessageBundlesTest holds the two languages to the same set of them.
smp.chat.line=<_sender> <#4e5668>{separator}</#4e5668> <white><_message>
smp.system.join=<#8ba888>{icon}</#8ba888> <gray><_player> joined.</gray>
smp.system.leave=<#a8888b>{icon}</#a8888b> <gray><_player> left.</gray>
smp.system.death=<#a8888b>{icon}</#a8888b> <gray><_death></gray>
smp.system.advancement=<#b08a4a>{icon}</#b08a4a> <gray><_player> earned <white><_advancement></white>.</gray>

# The tab list's header and footer. {logo} is Glyphs.LOGO_HEIGHT_32 - a private-use code point that
# deliberately does not live in this file; see PlayerSurfaces#sendTabListFrame. MiniMessage, so
# <newline> is how a line break is written: a .properties value cannot carry a real one.
tab.header=<newline>{logo}<newline><gray>nordtal.eu</gray> <dark_gray>|</dark_gray> <white>Season 2</white><newline>
tab.footer=<newline><gray>{online}<dark_gray>/</dark_gray>{max} online</gray><newline><dark_gray>nordtal.eu</dark_gray>

# ---------------------------------------------------------------- /smp access
#
# Three lines an admin standing next to somebody who cannot get in actually needs. The full picture
# is /access-status in Discord; this is the shortened version, and the payment line is the one that
# pays for it existing - "has not paid" and "is halfway through paying" look identical from outside.
