# smp - English. This file is the fallback for every other language: a key that is missing here
# shows up on screen as the key itself, so keep it complete.
#
# Parameters are named and written in braces, substituted by eu.nordtal.s2.common.message.Messages.
# See docs/smp.md for the concept every message here belongs to.

# ---------------------------------------------------------------- the worlds
# Used in the balloon GUI and on HUD line 1. Names, not sentences.
smp.world.nordtal=Nordtal
smp.world.farm=Farm world
smp.world.nether=The Nether
smp.world.end=The End

# ---------------------------------------------------------------- the balloon
smp.balloon.title=Where to?
smp.balloon.open=<#8ba888>Click to travel.</#8ba888>
smp.balloon.here=<dark_gray>You are here.</dark_gray>
# A locked destination keeps its place in the grid, greyed. Standing at the balloon is exactly when
# somebody wants to know why the Nether is not available yet, so the reason is on the item.
smp.balloon.locked=<#a8888b>Locked until the community finishes <white>{milestone}</white>.</#a8888b>
smp.balloon.locked-hint=<dark_gray>The objective board at the spawn shows how far along it is.</dark_gray>
smp.balloon.card=<white>{world}</white>
smp.balloon.card-locked=<gray>{world}</gray>
smp.balloon.locked-unknown=a later milestone
smp.balloon.travelled=<gray>The balloon sets you down in <white>{world}</white>.</gray>
smp.balloon.unavailable=<#a8888b>That world is not loaded right now.</#a8888b> <gray>Try again in a moment.</gray>

# ---------------------------------------------------------------- the farm world
smp.farm.warning=<#b08a4a>The farm world is regenerated in <white>{minutes}</white> minutes.</#b08a4a> \
  <gray>Everything in it will be gone - chests, graves and points of interest included.</gray>
# The last of the four warnings is always the one-minute one, so the singular is not an edge
# case - it is the sentence every player reads every day.
smp.farm.warning.one=<#b08a4a>The farm world is regenerated in one minute.</#b08a4a> \
  <gray>Everything in it will be gone - chests, graves and points of interest included.</gray>
smp.farm.moved=<#b08a4a>The farm world has been regenerated.</#b08a4a> <gray>You have been brought back to <white>Nordtal</white>.</gray>
# Sent to the people standing in the farm world when tomorrow's is not finished. They are the only
# ones affected, and they are the only ones told.
smp.farm.postponed=<#b08a4a>The farm world reset is postponed.</#b08a4a> <gray>Tomorrow's world is not \
  finished generating yet. Nothing has changed.</gray>

# ---------------------------------------------------------------- portals
smp.portal.nether-locked=<#a8888b>The Nether is not open yet.</#a8888b> <gray>It is unlocked by a \
  milestone, not by obsidian - the objective board at the spawn shows what is left.</gray>
smp.portal.end-inactive=<#a8888b>This portal will never activate.</#a8888b> <gray>The End is entered by \
  balloon, once the community has unlocked it.</gray>

# ---------------------------------------------------------------- spawn protection
# Shown on the action bar rather than in chat: it fires on a misclick as often as on an attempt,
# and a chat line per misclick would be noise.
smp.protect.denied=<#a8888b>This is spawn ground</#a8888b> <gray>- nothing here can be built, broken or opened.</gray>

# ---------------------------------------------------------------- failures
# English only by necessity: at pre-login there is no account link yet, so there is no language to
# read - and the thing that would have told us is the thing that is broken.
smp.error.database-unreachable=<#a8888b>The server cannot reach its database right now.</#a8888b> \
  <gray>Logging in would lose your progress. Please try again in a few minutes.</gray>

# ---------------------------------------------------------------- the HUD
# Line 1, beside the dimension icon. Line 2 exists only while /navigate is on.
# smp.hud.farm-warning takes line 1 over for eight seconds at each of the four reset warnings,
# keeping the dimension icon. Four words, because 182 px is the whole bar - the sentence is in
# smp.farm.warning, in chat, where it can be scrolled back to.
smp.hud.farm-warning=Farm reset in {minutes} min
smp.hud.milestone={milestone} - {percent}%
smp.hud.distance={blocks} blocks
# A target in another world gets no arrow: a bearing between two coordinate systems that share
# nothing but their numbers would point somewhere confidently wrong.
smp.hud.navigate-other-world=in another world

# ---------------------------------------------------------------- /navigate
smp.navigate.title=Navigate
smp.navigate.stop=<#a8888b>Stop navigating</#a8888b>
smp.navigate.stopped=<gray>Navigation is off.</gray>
smp.navigate.started=<gray>Navigating to <white>{target}</white>.</gray>
smp.navigate.world-spawn=This world's spawn
smp.navigate.last-death=Where you last died
smp.navigate.at=<dark_gray>{world} {x} {y} {z}</dark_gray>
smp.navigate.target=<white>{target}</white>
smp.navigate.click=<gray>Click to walk there.</gray>
smp.navigate.stop-hint=<gray>Turns the arrow off.</gray>
smp.navigate.previous-page=<gray>Previous page</gray>
smp.navigate.next-page=<gray>Next page</gray>

# Drawn INSIDE the window, in the pack's five-pixel sheet - so these four carry no MiniMessage at
# all. MenuFont folds them to capitals and prints them character for character, which means a tag
# here would reach the player as the literal text <GRAY>. NavigatePanelTest#theRowKeysAreTagless pins that.
smp.navigate.stop-button=Stop
smp.navigate.distance={blocks} m
smp.navigate.other-world=another world
smp.navigate.page={page}/{pages}

