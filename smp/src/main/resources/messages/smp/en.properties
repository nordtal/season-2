# smp, English. The fallback for every other language, so keep it complete.
# Parameters in braces are substituted by eu.nordtal.s2.common.message.Messages.

# ---------------------------------------------------------------- the worlds
# Used in the balloon GUI and on HUD line 1. Names, not sentences.
smp.world.nordtal=Nordtal
smp.world.nether=The Nether
smp.world.end=The End

# ---------------------------------------------------------------- the balloon
smp.balloon.title=Where to?
smp.balloon.open=<#8ba888>Click to travel.</#8ba888>
smp.balloon.here=<dark_gray>You are here.</dark_gray>
# A locked destination keeps its place in the grid, greyed, with the reason on the item.
smp.balloon.locked=<#a8888b>Locked until the community finishes <white>{milestone.name}</white>.</#a8888b>
smp.balloon.locked-hint=<dark_gray>The objective board at the spawn shows how far along it is.</dark_gray>
smp.balloon.card=<white>{world}</white>
smp.balloon.card-locked=<gray>{world}</gray>
smp.balloon.locked-unknown=a later milestone
smp.balloon.travelled=<gray>The balloon sets you down in <white>{world}</white>.</gray>
smp.balloon.unavailable=<#a8888b>That world is not loaded right now.</#a8888b> <gray>Try again in a moment.</gray>

# ---------------------------------------------------------------- portals
smp.portal.nether-locked=<#a8888b>The Nether is not open yet.</#a8888b> <gray>It is unlocked by a \
  milestone, not by obsidian - the objective board at the spawn shows what is left.</gray>
smp.portal.end-inactive=<#a8888b>This portal will never activate.</#a8888b> <gray>The End is entered by \
  balloon, once the community has unlocked it.</gray>

# ---------------------------------------------------------------- spawn protection
# On the action bar rather than in chat: it fires on a misclick as often as on an attempt.
smp.protect.denied=<#a8888b>This is spawn ground</#a8888b> <gray>- nothing here can be built, broken or opened.</gray>

# ---------------------------------------------------------------- failures
# English only by necessity: at pre-login there is no account link yet, so no language to read.
smp.error.database-unreachable=<#a8888b>The server cannot reach its database right now.</#a8888b> \
  <gray>Logging in would lose your progress. Please try again in a few minutes.</gray>

# ---------------------------------------------------------------- the HUD
# Line 2 exists only while /navigate is on. Line 1 is four words at most, because 182 px is the whole bar.
smp.hud.milestone={milestone.name} - {percent}%
smp.hud.distance={blocks} blocks
# A target in another world gets no arrow: the bearing would point somewhere confidently wrong.
smp.hud.navigate-other-world=in another world

# ---------------------------------------------------------------- /navigate
smp.navigate.title=Navigate
smp.navigate.stop=<#a8888b>Stop navigating</#a8888b>
smp.navigate.stopped=<gray>Navigation is off.</gray>
smp.navigate.started=<gray>Navigating to <white>{target}</white>.</gray>
smp.navigate.world-spawn=This world's spawn
smp.navigate.last-death=Where you last died
smp.navigate.at=<dark_gray>{world} {x} {y} {z}</dark_gray>
smp.navigate.target=<white>{target}</white>
smp.navigate.click=<gray>Click to walk there.</gray>
smp.navigate.stop-hint=<gray>Turns the arrow off.</gray>
smp.navigate.previous-page=<gray>Previous page</gray>
smp.navigate.next-page=<gray>Next page</gray>

# Drawn inside the window in the pack's five-pixel sheet, so no MiniMessage (NavigatePanelTest).
smp.navigate.stop-button=Stop
smp.navigate.distance={blocks} m
smp.navigate.other-world=another world
smp.navigate.page={page}/{pages}

# ---------------------------------------------------------------- points of interest
smp.poi.added=<gray>The point of interest <white>"{name}"</white> is on the map for everybody.</gray>
smp.poi.removed=<gray><white>"{name}"</white> is gone.</gray>
smp.poi.duplicate=<#a8888b>There is already a point of interest called <white>"{name}"</white>.</#a8888b>
smp.poi.not-found=<#a8888b>There is no point of interest called <white>"{name}"</white>.</#a8888b>
# POIs are public to see and to use; deleting is the one asymmetry.
smp.poi.not-yours=<#a8888b>Only whoever created that point of interest, or an admin, can remove it.</#a8888b>
smp.poi.bad-name=<#a8888b>A point of interest needs a name of at most <white>{max}</white> characters.</#a8888b>

# Plain text, no MiniMessage: phrase() substitutes these into command.help.line.
command.describe.poi.add=Marks where you are standing as a point of interest everybody can navigate to.
command.describe.poi.remove=Removes a point of interest - your own, or anybody's if you are an admin.

# ---------------------------------------------------------------- the boards
smp.board.objective.title=<#b08a4a>Current objective</#b08a4a>
smp.board.objective.finished=<gray>Every milestone is finished. The world is yours.</gray>
smp.board.objective.milestone=<white>{milestone.name}</white>
smp.board.objective.row=<gray>{objective}  {bar}  {amount}/{target}</gray>
smp.board.objective.row-done=<#8ba888>{objective}  {bar}  {amount}/{target}</#8ba888>
smp.board.aura.title=<#b08a4a>Aura</#b08a4a>
smp.board.aura.empty=<gray>Nobody has earned any aura yet.</gray>
smp.board.aura.row=<white>{place}. {player.name}  {aura}</white>
smp.board.aura.row-zero=<dark_gray>{place}. {player.name}  {aura}</dark_gray>

# ---------------------------------------------------------------- more failures
smp.error.no-account-link=<#a8888b>Your Minecraft account is not linked to a Discord account.</#a8888b> \
  <gray>There is nothing to credit this to - link it in Discord first.</gray>

# ---------------------------------------------------------------- aura
smp.aura.death=<gray>A death costs you <#a8888b>{aura} aura</#a8888b>.</gray>
smp.aura.advancement=<#8ba888>+{aura} aura</#8ba888> <gray>for that advancement.</gray>
# /aura: no markup, since the asker's own line is told apart by the Tone the command paints.
smp.aura.own=You have {aura} aura, which puts you at number {rank} of {total}.
smp.aura.top=The {count} highest:
smp.aura.line={place}. {player.name} - {aura}
smp.aura.empty=Nobody has any aura yet, so there is no board to show.
smp.aura.unlinked=This Minecraft account has no Discord account linked, so it has no aura. Nobody \
  should be able to be here in that state - say so in Discord.
smp.aura.failed=Your aura could not be read - the database did not answer. Nothing is wrong with \
  your account.

# ---------------------------------------------------------------- /smp status
# Three keys rather than a bracketed plural, which BundleContinuationTest refuses.
smp.status.milestone=Current milestone: {milestone.name}, {percent} % done.
smp.status.finished=Every milestone is finished.
smp.status.unread=The milestones are still loading - ask again in a moment.
smp.status.online.none=Nobody is on the SMP right now.
smp.status.online.one=One player is on the SMP right now.
smp.status.online=There are {online} players on the SMP right now.
smp.status.failed=The status could not be read - the database did not answer.

# ---------------------------------------------------------------- the start event's head start
# Said once, on the winner's first join; the items are already in the inventory.
smp.headstart.granted=<#b08a4a>You won the start event.</#b08a4a> <gray>You carry <white>{aura}</white> aura \
  into the season, and the spoils are in your inventory.</gray>
smp.headstart.granted-aura-only=<#b08a4a>You won the start event.</#b08a4a> <gray>You carry <white>{aura}</white> aura into the season.</gray>

# ---------------------------------------------------------------- objectives and milestones
smp.objective.completed=<#b08a4a>{icon}</#b08a4a> <gray>The objective <white>"{objective}"</white> is finished. Everybody who helped has been paid.</gray>
# The default track's milestone names; a milestone added in milestones.yml gets its name as an override.
smp.milestone.waiting=Waiting
smp.milestone.departure=Departure
smp.milestone.foothold=Foothold
smp.milestone.settlement=Settlement
smp.milestone.nether=Nether
smp.milestone.end=End
smp.milestone.expanse=Expanse
smp.milestone.frontier=Frontier

# Into the Discord announcement channels as plain text (Announcer): no glyphs, no markup.
smp.announce.milestone={milestone.name} is complete.
smp.announce.milestone.border={milestone.name} is complete - the border grows.
smp.announce.milestone.nether={milestone.name} is complete - the Nether is open.
smp.announce.milestone.end={milestone.name} is complete - the End is open.

# "Look up" is literal: rockets go up around every player.
smp.milestone.completed=<#b08a4a>{icon}</#b08a4a> <gray><white>{milestone.name}</white> is complete. Look up.</gray>

# Its own key: smp.milestone.* is checked against the boss bar font, and a title renders in minecraft:default.
smp.ceremony.title=<#b08a4a>{milestone.name}</#b08a4a>
smp.ceremony.subtitle=<gray>A milestone is finished.</gray>

# ---------------------------------------------------------------- graves
smp.grave.title=Grave
smp.grave.experience=<gray><white>{experience}</white> experience is yours.</gray>
# The name is on the head, not the title: one window is shared, so a title would carry one opener's language.
smp.grave.owner=<white>{player.name}</white>
smp.grave.owner-unknown=<white>Somebody</white>
smp.grave.died-at=<gray>Died {date} at {x} {y} {z}</gray>
smp.grave.experience-tooltip=<white>Experience</white>
smp.grave.experience-hint=<gray><white>{experience}</white> is paid out when the last item is gone.</gray>
smp.grave.take-all=<white>Take everything</white>
smp.grave.take-all-hint=<gray>Into your inventory; the rest drops at your feet.</gray>
# In the dead player's language, since the hologram has no single viewer.
smp.grave.hologram=<gray>Decays in <white>{hours}h {minutes}m</white></gray>
smp.grave.hologram-seconds=<gray>Decays in <white>{seconds}s</white></gray>
# Drawn inside the window in the pack's five-pixel sheet, so no MiniMessage (GravePanelTest).
smp.grave.experience-line=+{experience} XP
smp.grave.take-all-button=Take all

# ---------------------------------------------------------------- duels
smp.duel.waiting=<gray>Waiting for somebody to step on the other side.</gray>
smp.duel.queued=<#b08a4a>Every arena is busy.</#b08a4a> <gray>You are in the queue.</gray>
smp.duel.countdown=<#b08a4a>{seconds}...</#b08a4a>
smp.duel.go=<#8ba888>Go.</#8ba888>
smp.duel.won=<#8ba888>You won.</#8ba888> <gray>+<white>{aura}</white> aura.</gray>
smp.duel.lost=<#a8888b>You lost.</#a8888b> <gray>-<white>{aura}</white> aura.</gray>
# The chat line carries the number; the title is what somebody reads without looking anywhere.
smp.duel.won.title=<#8ba888>Won</#8ba888>
smp.duel.won.subtitle=<gray>+{aura} aura</gray>
smp.duel.lost.title=<#a8888b>Lost</#a8888b>
smp.duel.lost.subtitle=<gray>-{aura} aura</gray>
# A duel that ends because the server is stopping costs nobody anything.
smp.duel.interrupted=<gray>The duel was interrupted and nothing was booked.</gray>

# ---------------------------------------------------------------- the wheel
smp.wheel.title=Wheel of Fortune
smp.wheel.won=<#8ba888>The wheel gives you</#8ba888> <white>{amount}x <lang:'{item}'></white><gray>.</gray>
smp.wheel.none=<#a8888b>No spins left today.</#a8888b> <gray>Come back tomorrow.</gray>
smp.wheel.none.one=<#a8888b>No spins left today,</#a8888b> <gray>but you still have one earned spin waiting.</gray>
smp.wheel.none.many=<#a8888b>No spins left today,</#a8888b> <gray>but you still have <white>{extras}</white> earned spins waiting.</gray>
smp.wheel.available=<gray>You have no spins right now.</gray>
smp.wheel.available.one=<gray>You have one spin.</gray>
smp.wheel.available.many=<gray>You have <white>{count}</white> spins.</gray>
smp.wheel.broken-prize=<#a8888b>The wheel landed on a prize this server does not know.</#a8888b> <gray>Tell an admin.</gray>
smp.wheel.hub=<white>Spins left: {spins}</white>
smp.wheel.hub-hint=<gray>Contributing <white>{percent} %</white> of an objective earns another one.</gray>
smp.wheel.again=<white>Spin again</white>
smp.wheel.again-hint=<gray>Uses one of the spins you have left.</gray>
smp.wheel.again-waiting=<gray>Spin again</gray>
smp.wheel.again-waiting-hint=<dark_gray>Wait for this one to finish.</dark_gray>
smp.wheel.again-none=<gray>Spin again</gray>
smp.wheel.again-none-hint=<dark_gray>That was your last spin. There is a free one every day.</dark_gray>
# Drawn inside the window in the pack's five-pixel sheet, so no MiniMessage (WheelPanelTest).
smp.wheel.spins-left={spins} spins left
smp.wheel.rule-top=One spin per
smp.wheel.rule-bottom={percent} % share
smp.wheel.again-button=Again

# ---------------------------------------------------------------- the spawn NPC
smp.objectives.title=Current objective
smp.objectives.none=<gray>Nothing is being worked on right now.</gray>
smp.objectives.done=<#8ba888>Finished.</#8ba888>
smp.objectives.click-to-hand-in=<#b08a4a>Click to hand items in.</#b08a4a>
# A statistic counts itself and an advancement is earned elsewhere, so neither has anything to click.
smp.objectives.counts-itself=<dark_gray>This one counts itself.</dark_gray>
smp.objectives.item=<white>{objective}</white>
smp.objectives.item-done=<#8ba888>{objective}</#8ba888>
smp.objectives.progress=<gray>{bar}  {amount}/{target}</gray>
smp.objectives.items=<dark_gray>{items}</dark_gray>
smp.objectives.heading=<white>{milestone.name}</white>
smp.objectives.heading-hint=<gray>{done} of {total} objectives finished.</gray>
smp.objectives.your-share=<dark_gray>Your share: {percent} % - {spins} extra spins on completion</dark_gray>
smp.objectives.share-tooltip=<white>What you have put in</white>
smp.objectives.share-line=<gray>{objective} <white>{percent} %</white></gray>
# "When they finish", not "earned": extra spins are granted when an objective completes.
smp.objectives.share-spins=<gray>That is <white>{spins}</white> extra wheel spins when they finish.</gray>
smp.objectives.share-empty-hint=<gray>Hand something in, or work on a statistic, and your share appears here.</gray>
# Drawn inside the window in the pack's five-pixel sheet, so no MiniMessage (ObjectivePanelTest).
smp.objectives.share={spins} extra spins
# Short, since the full wording runs into the page buttons.
smp.objectives.share-none=Not contributed yet
smp.objectives.previous-page=<gray>Previous objectives</gray>
smp.objectives.next-page=<gray>More objectives</gray>

smp.handin.title=Hand in
smp.handin.wanted=<white>What is wanted</white>
smp.handin.confirm=Hand in what is in this window
smp.handin.needed=<gray>Still needed: <white>{amount}</white> of <white>{items}</white></gray>
# Drawn inside the window in the pack's five-pixel sheet, so no MiniMessage (HandInPanelTest).
smp.handin.still-needed={amount} still needed
smp.handin.confirm-button=Hand in
smp.handin.accepted=<#8ba888>Handed in <white>{amount}</white>.</#8ba888> <gray>Thank you.</gray>
# Closing the window without confirming gives everything back, which is why nothing was taken here.
smp.handin.nothing-wanted=<#a8888b>Nothing in there is wanted for this objective.</#a8888b> <gray>Nothing was taken.</gray>
smp.handin.nothing-credited=<#a8888b>Nothing could be credited.</#a8888b> <gray>The objective was finished \
  while this window was open. Your items are back.</gray>

# ---------------------------------------------------------------- /update
# The keys are update.* in :commands' shared bundle; a key of the same name here would override it.

# ---------------------------------------------------------------- chat and the system lines
# These live in :paper-common's bundle as system.*; a key of the same name here overrides it.

# {logo} is Glyphs.LOGO_HEIGHT_32; <newline> is the line break, since a .properties value cannot carry one.
tab.header=<newline>{logo}<newline><#4a63d8>nordtal.eu</#4a63d8> <dark_gray>|</dark_gray> <white>Season 2</white><newline>
tab.footer=<newline><gray>{online}<dark_gray>/</dark_gray>{max} online</gray><newline><#4a63d8>nordtal.eu</#4a63d8>
