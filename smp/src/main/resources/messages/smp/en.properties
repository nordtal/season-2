# smp, English. The fallback for every other language, so keep it complete.
# Parameters in braces are substituted by eu.nordtal.s2.messages.Messages.

# ---------------------------------------------------------------- the worlds
# Used in the balloon GUI and on HUD line 1. Names, not sentences.
smp.world.nordtal=Nordtal
smp.world.nether=The Nether
smp.world.end=The End

# ---------------------------------------------------------------- the balloon
smp.balloon.title=Where to?
smp.balloon.open=<good>Click to travel.</good>
smp.balloon.here=<faint>You are here.</faint>
# A locked destination keeps its place in the grid, greyed, with the reason on the item.
smp.balloon.locked=<bad>Locked until the community finishes <emphasis>{milestone.name}</emphasis>.</bad>
smp.balloon.locked-hint=<faint>The objective board at the spawn shows how far along it is.</faint>
smp.balloon.card=<emphasis>{world}</emphasis>
smp.balloon.card-locked=<muted>{world}</muted>
smp.balloon.locked-unknown=a later milestone
smp.balloon.travelled=<muted>The balloon sets you down in <emphasis>{world}</emphasis>.</muted>
smp.balloon.unavailable=<bad>That world is not loaded right now.</bad> <muted>Try again in a moment.</muted>

# ---------------------------------------------------------------- portals
smp.portal.nether-locked=<bad>The Nether is not open yet.</bad> <muted>It is unlocked by a \
  milestone, not by obsidian - the objective board at the spawn shows what is left.</muted>
smp.portal.end-inactive=<bad>This portal will never activate.</bad> <muted>The End is entered by \
  balloon, once the community has unlocked it.</muted>

# ---------------------------------------------------------------- spawn protection
# On the action bar rather than in chat: it fires on a misclick as often as on an attempt.
smp.protect.denied=<bad>This is spawn ground</bad> <muted>- nothing here can be built, broken or opened.</muted>

# ---------------------------------------------------------------- the HUD
# Line 2 exists only while /navigate is on. Line 1 is four words at most, because 182 px is the whole bar.
smp.hud.milestone={milestone.name} - {percent}%
smp.hud.distance={blocks, plural, one {# block} other {# blocks}}
# A target in another world gets no arrow: the bearing would point somewhere confidently wrong.
smp.hud.navigate-other-world=in another world

# ---------------------------------------------------------------- /navigate
smp.navigate.title=Navigate
smp.navigate.stop=<bad>Stop navigating</bad>
smp.navigate.stopped=<muted>Navigation is off.</muted>
smp.navigate.started=<muted>Navigating to <emphasis>{target}</emphasis>.</muted>
smp.navigate.world-spawn=This world's spawn
smp.navigate.last-death=Where you last died
smp.navigate.at=<faint>{world} {x, number, plain} {y, number, plain} {z, number, plain}</faint>
smp.navigate.target=<emphasis>{target}</emphasis>
smp.navigate.click=<muted>Click to walk there.</muted>
smp.navigate.stop-hint=<muted>Turns the arrow off.</muted>
smp.navigate.previous-page=<muted>Previous page</muted>
smp.navigate.next-page=<muted>Next page</muted>

# Drawn inside the window in the pack's five-pixel sheet, so no MiniMessage (NavigatePanelTest).
smp.navigate.stop-button=Stop
smp.navigate.distance={blocks} m
smp.navigate.other-world=another world
smp.navigate.page={page}/{pages}

# ---------------------------------------------------------------- points of interest
smp.poi.added=<muted>The point of interest <emphasis>"{name}"</emphasis> is on the map for everybody.</muted>
smp.poi.removed=<muted><emphasis>"{name}"</emphasis> is gone.</muted>
smp.poi.duplicate=<bad>There is already a point of interest called <emphasis>"{name}"</emphasis>.</bad>
smp.poi.not-found=<bad>There is no point of interest called <emphasis>"{name}"</emphasis>.</bad>
# POIs are public to see and to use; deleting is the one asymmetry.
smp.poi.not-yours=<bad>Only whoever created that point of interest, or an admin, can remove it.</bad>
smp.poi.bad-name=<bad>A point of interest needs a name of at most <emphasis>{max}</emphasis> characters.</bad>

# Plain text, no MiniMessage: phrase() substitutes these into command.help.line.
command.describe.poi.add=Marks where you are standing as a point of interest everybody can navigate to.
command.describe.poi.remove=Removes a point of interest - your own, or anybody's if you are an admin.

# ---------------------------------------------------------------- the boards
smp.board.objective.title=<accent>Current objective</accent>
smp.board.objective.finished=<muted>Every milestone is finished. The world is yours.</muted>
smp.board.objective.milestone=<emphasis>{milestone.name}</emphasis>
smp.board.objective.row=<muted>{objective}  {bar}  {amount}/{target}</muted>
smp.board.objective.row-done=<good>{objective}  {bar}  {amount}/{target}</good>
smp.board.aura.title=<accent>Aura</accent>
smp.board.aura.empty=<muted>Nobody has earned any aura yet.</muted>
smp.board.aura.row=<emphasis>{place}. {player.name}  {aura}</emphasis>
smp.board.aura.row-zero=<faint>{place}. {player.name}  {aura}</faint>

# ---------------------------------------------------------------- more failures
smp.error.no-account-link=<bad>Your Minecraft account is not linked to a Discord account.</bad> \
  <muted>There is nothing to credit this to - link it in Discord first.</muted>

# ---------------------------------------------------------------- aura
smp.aura.death=<muted>A death costs you <bad>{aura} aura</bad>.</muted>
smp.aura.advancement=<good>+{aura} aura</good> <muted>for that advancement.</muted>

# ---------------------------------------------------------------- objectives and milestones
smp.objective.completed=<accent><glyph:announce></accent> <muted>The objective <emphasis>"{objective}"</emphasis> is finished. Everybody who helped has been paid.</muted>
# The default track's milestone names; a milestone added in the milestones group gets its name as an override.
smp.milestone.waiting=Waiting
smp.milestone.departure=Departure
smp.milestone.foothold=Foothold
smp.milestone.settlement=Settlement
smp.milestone.nether=Nether
smp.milestone.end=End
smp.milestone.expanse=Expanse
smp.milestone.frontier=Frontier

# Into the Discord announcement channels as plain text (Announcer): no glyphs, no markup.
smp.announce.milestone={milestone.name} is complete.
smp.announce.milestone.border={milestone.name} is complete - the border grows.
smp.announce.milestone.nether={milestone.name} is complete - the Nether is open.
smp.announce.milestone.end={milestone.name} is complete - the End is open.

# "Look up" is literal: rockets go up around every player.
smp.milestone.completed=<accent><glyph:announce></accent> <muted><emphasis>{milestone.name}</emphasis> is complete. Look up.</muted>

# Its own key: smp.milestone.* is checked against the boss bar font, and a title renders in minecraft:default.
smp.ceremony.title=<accent>{milestone.name}</accent>
smp.ceremony.subtitle=<muted>A milestone is finished.</muted>

# ---------------------------------------------------------------- graves
smp.grave.title=Grave
smp.grave.experience=<muted><emphasis>{experience}</emphasis> experience is yours.</muted>
# The name is on the head, not the title: one window is shared, so a title would carry one opener's language.
smp.grave.owner=<emphasis>{player.name}</emphasis>
smp.grave.owner-unknown=<emphasis>Somebody</emphasis>
smp.grave.died-at=<muted>Died {at, instant, date} at {x, number, plain} {y, number, plain} {z, number, plain}</muted>
smp.grave.experience-tooltip=<emphasis>Experience</emphasis>
smp.grave.experience-hint=<muted><emphasis>{experience}</emphasis> is paid out when the last item is gone.</muted>
smp.grave.take-all=<emphasis>Take everything</emphasis>
smp.grave.take-all-hint=<muted>Into your inventory; the rest drops at your feet.</muted>
# In the dead player's language, since the hologram has no single viewer.
smp.grave.hologram=<muted>Decays in <emphasis>{left, duration, short}</emphasis></muted>
# Drawn inside the window in the pack's five-pixel sheet, so no MiniMessage (GravePanelTest).
smp.grave.experience-line=+{experience} XP
smp.grave.take-all-button=Take all

# ---------------------------------------------------------------- duels
smp.duel.waiting=<muted>Waiting for somebody to step on the other side.</muted>
smp.duel.queued=<warn>Every arena is busy.</warn> <muted>You are in the queue.</muted>
smp.duel.countdown=<accent>{seconds}...</accent>
smp.duel.go=<good>Go.</good>
smp.duel.won=<good>You won.</good> <muted>+<emphasis>{aura}</emphasis> aura.</muted>
smp.duel.lost=<bad>You lost.</bad> <muted>-<emphasis>{aura}</emphasis> aura.</muted>
# The chat line carries the number; the title is what somebody reads without looking anywhere.
smp.duel.won.title=<good>Won</good>
smp.duel.won.subtitle=<muted>+{aura} aura</muted>
smp.duel.lost.title=<bad>Lost</bad>
smp.duel.lost.subtitle=<muted>-{aura} aura</muted>
# A duel that ends because the server is stopping costs nobody anything.
smp.duel.interrupted=<muted>The duel was interrupted and nothing was booked.</muted>

# ---------------------------------------------------------------- the wheel
smp.wheel.title=Wheel of Fortune
smp.wheel.won=<good>The wheel gives you</good> <emphasis>{amount}x {item}</emphasis><muted>.</muted>
smp.wheel.none=<bad>No spins left today.</bad> <muted>Come back tomorrow.</muted>
smp.wheel.none.one=<bad>No spins left today,</bad> <muted>but you still have one earned spin waiting.</muted>
smp.wheel.none.many=<bad>No spins left today,</bad> <muted>but you still have <emphasis>{extras}</emphasis> earned spins waiting.</muted>
smp.wheel.available=<muted>You have no spins right now.</muted>
smp.wheel.available.one=<muted>You have one spin.</muted>
smp.wheel.available.many=<muted>You have <emphasis>{count}</emphasis> spins.</muted>
smp.wheel.broken-prize=<bad>The wheel landed on a prize this server does not know.</bad> <muted>Tell an admin.</muted>
smp.wheel.hub=<emphasis>Spins left: {spins}</emphasis>
smp.wheel.hub-hint=<muted>Contributing <emphasis>{percent} %</emphasis> of an objective earns another one.</muted>
smp.wheel.again=<emphasis>Spin again</emphasis>
smp.wheel.again-hint=<muted>Uses one of the spins you have left.</muted>
smp.wheel.again-waiting=<muted>Spin again</muted>
smp.wheel.again-waiting-hint=<faint>Wait for this one to finish.</faint>
smp.wheel.again-none=<muted>Spin again</muted>
smp.wheel.again-none-hint=<faint>That was your last spin. There is a free one every day.</faint>
# Drawn inside the window in the pack's five-pixel sheet, so no MiniMessage (WheelPanelTest).
smp.wheel.spins-left={spins, plural, one {# spin left} other {# spins left}}
smp.wheel.rule-top=One spin per
smp.wheel.rule-bottom={percent} % share
smp.wheel.again-button=Again

# ---------------------------------------------------------------- the spawn NPC
smp.objectives.title=Current objective
smp.objectives.none=<muted>Nothing is being worked on right now.</muted>
smp.objectives.done=<good>Finished.</good>
smp.objectives.click-to-hand-in=<accent>Click to hand items in.</accent>
# A statistic counts itself and an advancement is earned elsewhere, so neither has anything to click.
smp.objectives.counts-itself=<faint>This one counts itself.</faint>
smp.objectives.item=<emphasis>{objective}</emphasis>
smp.objectives.item-done=<good>{objective}</good>
smp.objectives.progress=<muted>{bar}  {amount}/{target}</muted>
smp.objectives.items=<faint>{items}</faint>
smp.objectives.heading=<emphasis>{milestone.name}</emphasis>
smp.objectives.heading-hint=<muted>{done} of {total, plural, one {# objective} other {# objectives}} finished.</muted>
smp.objectives.your-share=<faint>Your share: {percent} % - {spins, plural, one {# extra spin} other {# extra spins}} on completion</faint>
smp.objectives.share-tooltip=<emphasis>What you have put in</emphasis>
smp.objectives.share-line=<muted>{objective} <emphasis>{percent} %</emphasis></muted>
# "When they finish", not "earned": extra spins are granted when an objective completes.
smp.objectives.share-spins=<muted>That is <emphasis>{spins, plural, one {# extra wheel spin} other {# extra wheel spins}}</emphasis> when they finish.</muted>
smp.objectives.share-empty-hint=<muted>Hand something in, or work on a statistic, and your share appears here.</muted>
# Drawn inside the window in the pack's five-pixel sheet, so no MiniMessage (ObjectivePanelTest).
smp.objectives.share={spins, plural, one {# extra spin} other {# extra spins}}
# Short, since the full wording runs into the page buttons.
smp.objectives.share-none=Not contributed yet
smp.objectives.previous-page=<muted>Previous objectives</muted>
smp.objectives.next-page=<muted>More objectives</muted>

smp.handin.title=Hand in
smp.handin.wanted=<emphasis>What is wanted</emphasis>
smp.handin.confirm=Hand in what is in this window
smp.handin.needed=<muted>Still needed: <emphasis>{amount}</emphasis> of <emphasis>{items}</emphasis></muted>
# Drawn inside the window in the pack's five-pixel sheet, so no MiniMessage (HandInPanelTest).
smp.handin.still-needed={amount} still needed
smp.handin.confirm-button=Hand in
smp.handin.accepted=<good>Handed in <emphasis>{amount}</emphasis>.</good> <muted>Thank you.</muted>
# Closing the window without confirming gives everything back, which is why nothing was taken here.
smp.handin.nothing-wanted=<bad>Nothing in there is wanted for this objective.</bad> <muted>Nothing was taken.</muted>
smp.handin.nothing-credited=<bad>Nothing could be credited.</bad> <muted>The objective was finished \
  while this window was open. Your items are back.</muted>

# ---------------------------------------------------------------- chat and the system lines
# These live in :paper-common's bundle as system.*; a key of the same name here overrides it.

# {logo} is Glyphs.LOGO_HEIGHT_32; <newline> is the line break, since a .properties value cannot carry one.
tab.footer=<newline><muted>{online}<faint>/</faint>{max} online</muted><newline><brand>nordtal.eu</brand>

# ---------------------------------------------------------------- the console's answers and the help
smp.access.active=Access runs until {until}.
smp.access.expired=No active access - the last period ended {since}.
smp.access.linked={player.name} is linked to Discord account {discord.name}.
smp.access.never=No access has ever been bought for this account.
smp.access.no-payment=No purchase is in progress.
smp.access.payment=Open purchase {reference}: {days, plural, one {# day} other {# days}}, {amount}, started {since}. The \
  payment link exists; they have not paid yet.
smp.access.payment-unstarted=Open purchase {reference}: {days, plural, one {# day} other {# days}}, started {since} - no payment \
  link was ever created. They stopped before asking for one.
smp.access.unlinked={player.name} has no Discord account linked. They should not have got past the login \
  gate at all, so something else is wrong.
smp.admin.aura-changed={player.name}'s aura was changed by {delta}, and the reason was recorded.
smp.admin.aura-unknown=The aura change for {player.name} ({delta}) failed part way through. It may \
  or may not have been booked - check the aura before running it again.
smp.admin.milestone-unlocked=Milestone {key} was unlocked, and everybody who qualified has been \
  paid.
smp.admin.player-offline=That player is not online.
smp.admin.target-unlinked={player.name} has no Discord account linked, so there is nothing to credit \
  aura to.
smp.admin.objective-completed=Objective {key} of milestone {milestone.name} was closed by hand. It paid \
  out what was actually collected, not the whole pot.
