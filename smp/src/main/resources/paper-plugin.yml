name: smp
version: "${version}"
main: eu.nordtal.season.smp.SmpPlugin
description: The season 2 SMP - Nordtal, the Nether and the End.
author: nordtal
website: https://nordtal.eu
api-version: "26.2"

# The name tags draw through PacketEvents, so a server without it fails at start; TAB is used when present.
dependencies:
  server:
    packetevents:
      load: BEFORE
      required: true
    TAB:
      load: BEFORE
      required: false
