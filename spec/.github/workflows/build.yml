name: build

# Every push to master and every pull request. release.yml only runs on a pushed tag, so without
# this a broken master stays invisible until somebody tags.
#
# `./gradlew build` runs checkSourcesTracked, compile and the real test suite, including the
# Testcontainers-backed DatabaseIntegrationTest - GitHub's ubuntu-latest runners have a Docker
# daemon, unlike JitPack's own build (see ../../jitpack.yml), so this is a strictly stronger check
# than what JitPack runs when a consumer first requests a tag.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Commit messages follow CONVENTIONS.md
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          for commit in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            sh .githooks/commit-msg "$RUNNER_TEMP/message"
          done

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and test
        run: ./gradlew build
