<!doctype html>
<!-- Dark only. The class is on the document and there is no code anywhere that removes it. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <!--
      A script or stylesheet that fails to load reports itself through a DOM "error" event that
      does not bubble; a capturing-phase listener on `window`, registered before anything else in
      <head> starts fetching, is the one place that still sees it. A plain script rather than a
      module, so it shares the document's fate rather than the bundle's, and it draws nothing
      itself: the paragraph and button it can write into already sit in #root as plain HTML.
    -->
    <script>
      ;(function () {
        // Remembered in storage, not a variable: the recovery this guards is a full page reload, which nothing in memory survives.
        var RELOAD_KEY = "steward:reloaded-after-startup-error"

        function show(message) {
          var line = document.getElementById("startup-fallback-message")
          if (line) {
            line.textContent = message
          }
          // The panel is invisible for the first seconds so a healthy start never flashes it; skip that wait once something is known to be wrong.
          var panel = document.getElementById("startup-fallback")
          if (panel) {
            panel.style.animation = "none"
            panel.style.opacity = "1"
          }
        }

        function alreadyReloaded() {
          try {
            return window.sessionStorage.getItem(RELOAD_KEY) !== null
          } catch (storageError) {
            // No storage to remember an attempt in: treat it as already spent rather than risk a reload loop.
            return true
          }
        }

        function reloadOnce(what) {
          if (alreadyReloaded()) {
            show(
              "Steward could not load " +
                what +
                ", even after reloading once. Saving this " +
                "page to the home screen again usually fixes it.",
            )
            return
          }
          try {
            window.sessionStorage.setItem(RELOAD_KEY, "1")
          } catch (storageError) {
            show("Steward could not load " + what + ". Reload this page to try again.")
            return
          }
          window.location.reload()
        }

        window.addEventListener(
          "error",
          function (event) {
            var target = event.target
            var isTheAppShell =
              target instanceof HTMLScriptElement || (target instanceof HTMLLinkElement && target.rel === "stylesheet")
            if (isTheAppShell) {
              reloadOnce("part of the app (" + (target.src || target.href) + ")")
              return
            }
            if (target && target !== window && typeof target.tagName === "string") {
              // An icon or the manifest failed to load; cosmetic, not a startup failure.
              return
            }
            // Reloading a bundle that loaded fine and then threw would not fix anything, so this only reports.
            show("Steward hit an error before it could start: " + (event.message || "no message was given") + ".")
          },
          true,
        )

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason && event.reason.message ? event.reason.message : event.reason
          show("Steward hit an error before it could start: " + reason + ".")
        })
      })()
    </script>

    <!--
      This fallback sits in the document from the first byte, because a screen that can only be
      drawn by JavaScript cannot report that JavaScript never ran. It stays invisible for two and a
      half seconds and then fades in, since React normally replaces it within a few hundred
      milliseconds and a message flashing past on every healthy start would just teach everyone to
      ignore it. The animation is CSS, inline in this document, so an animation that never runs
      leaves the panel hidden rather than sharing the bundle's fate; the reporter above reveals it
      directly instead of waiting for this once it has something to say.
    -->
    <style>
      #startup-fallback {
        opacity: 0;
        animation: startup-fallback-in 0.3s ease-out 2.5s forwards;
      }
      @keyframes startup-fallback-in {
        to {
          opacity: 1;
        }
      }
    </style>

    <!--
      viewport-fit=cover, because the status bar below is translucent: the page is drawn behind the
      notch and the home indicator, and index.css gives every edge back with env(safe-area-inset-*).
      Without the cover the browser letterboxes the page and a near-black interface grows two grey
      bars on a black phone.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0d0d" />

    <!--
      The mark is the server icon: resource-pack/src/pack.png is what a player sees in the server
      browser, and icon-512.png is that same file at exactly four times the size, nearest
      neighbour, since a smoothing resampler turns its 21 colours into hundreds.
    -->
    <link rel="icon" type="image/png" sizes="128x128" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Added to the home screen, this is a standalone app: no address bar, no Safari chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Steward" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Nordtal Steward</title>
  </head>
  <body>
    <div id="root">
      <!--
        Static, and stays on screen until React replaces it: createRoot(container).render(...) in
        main.tsx overwrites every child of #root on its first successful render, so this paragraph
        and button surviving means nothing above ever ran. Styled inline rather than through a
        class from index.css, since that stylesheet is one more built asset that can itself be the
        thing missing.
      -->
      <div
        id="startup-fallback"
        style="
          min-height: 100vh;
          min-height: 100dvh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1rem;
          padding: 2rem;
          text-align: center;
          background: #0d0d0d;
          color: #e5e5e5;
          font-family: system-ui, sans-serif;
        "
      >
        <p id="startup-fallback-message" style="margin: 0; max-width: 28rem">Steward has not started yet.</p>
        <button
          type="button"
          onclick="window.location.reload()"
          style="
            padding: 0.6rem 1.2rem;
            border-radius: 0.4rem;
            border: 1px solid #4b5563;
            background: #1f2937;
            color: #e5e5e5;
            font-size: 1rem;
          "
        >
          Reload
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
