# steward, English only: Steward's own page. The browser renders these, each value in the reader's zone.

# A service's state as a badge and as a dot says.
steward.service.state={state, select, running {running} healthy {healthy} starting {starting} unhealthy {unhealthy} held {held down} standby {standby} created {created} restarting {restarting} removing {removing} paused {paused} exited {exited} dead {dead} other {{state}}}
steward.service.docker-state=Docker reports the state "{state}".
steward.service.held-since=Held down since {since}. Docker reports the state "{state}".
steward.service.unhealthy=The container is running, but its healthcheck is failing.
steward.service.starting=The healthcheck has not reached a verdict yet.
steward.service.health=Healthcheck: {health}.
steward.service.no-health=Running. No healthcheck.
steward.service.not-read=Not read yet.

# What a source says of one artifact, kept apart, since a silent source must never read as up to date.
steward.artifact.status={status, select, up-to-date {up to date} outdated {outdated} missing {not installed} unsupported {unsupported} mount-missing {no volume} other {could not ask}}
steward.artifact.status-tip={status, select, up-to-date {What is installed is what the source says is newest.} outdated {A newer file exists. A run would install it.} missing {Nothing with this file name is installed. On a fresh volume that is normal; on a running server it is either new, or a publisher who renamed the jar.} unsupported {The source answered and has no build of this for the Minecraft version the network runs. Nothing is installed and nothing failed. It stays on this list, so the day a build appears the next run picks it up.} mount-missing {The volume is not mounted in steward, so nothing can be said about it.} other {The source could not be asked. This is not the same as nothing having changed.}}

steward.image.drift={drift, select, up-to-date {up to date} outdated {outdated} local {local build} other {unchecked}}
steward.image.drift-tip={drift, select, up-to-date {The running image carries the digest the registry names.} outdated {Out of date: the next update makes it again.} other {Not compared: either the registry did not answer, or this container's exact image is no longer on file locally (its tag was rebuilt without recreating it). That is not "up to date".}}
steward.image.label=Image

# An answer: why Steward refuses a request a person sent, rendered here into the error it answers.
steward.answer.not-admin=You are not an admin any more.
steward.answer.already-admin=They are an admin already.
steward.answer.not-a-member=Only a member of the Discord server can be made an admin.
steward.answer.grants-per-hour={count, number, plain} admins were granted in the last hour, by all admins together. Try again later.
steward.answer.self=Nobody can revoke their own admin.
steward.answer.not-below=You can only revoke admins you granted, or who were granted below you.
steward.answer.exempt-already=They play without it already.
steward.answer.enforced-already=They get it already.
steward.answer.unknown-person=Nobody by that Discord id is known.
steward.answer.no-database={kept, select, alerts {Steward has no database, so it keeps no alerts.} preferences {Steward has no database, so it keeps no preferences.} settings {Steward has no database, so it holds no settings.} plugins {Steward has no database, so it cannot say which plugins were added.} other {Steward has no database to keep an override in.}}
steward.answer.no-sources=Steward has no sources configured, so nothing can be resolved.
steward.answer.no-request=There is no request {request}.
steward.answer.no-announcement=There is no announcement {announcement, number, plain}.
steward.answer.no-bundle=There is no message bundle called {bundle}.
steward.answer.not-json=The body is not the JSON this endpoint takes.
steward.answer.empty=The body is empty.
steward.answer.empty-text=The {language} text is empty.
steward.answer.too-late=Too late: the countdown has already run out.
steward.answer.key-not-held=This sign-in has not used its security key yet.
steward.answer.key-not-recent=This is one of the things Steward asks for the key before doing, and it has not been held in the last {within, duration, long}.
steward.answer.no-key=This account has no security key yet, and Steward cannot be used without one. Register a key and this request will work.
steward.answer.key-first=This account already has a key, so adding another one needs the key you already have. Sign in again and use it first.
steward.answer.ceremony-elsewhere={registration, select, true {That registration} other {That sign-in}} was not started in this browser, or it was already finished, or it sat unanswered for ten minutes. Start it again.
steward.answer.no-such-key=This account has no key of that id.
steward.answer.sign-in-unconfigured=Sign-in is not configured yet: {missing} is empty.
steward.answer.sign-in-elsewhere=This sign-in did not start in this browser. Try again from the start.
steward.answer.no-code=Discord sent no code.
steward.answer.not-in-guild=You are not a member of the Nordtal guild.
steward.answer.not-an-admin={name} is in the guild but is not an admin.
steward.answer.sign-in-refused=Discord refused the sign-in ({status, number, plain}). The usual cause is a redirect URI that is not registered on the application: this one sends {uri}
steward.answer.no-access-token=Discord's answer carried no access token.
steward.answer.discord-answered=Discord answered {status, number, plain}.
steward.answer.discord-unreachable=Discord could not be reached: {error}
steward.answer.interrupted=Interrupted while talking to Discord.
