# steward, English only: Steward's own page. The browser renders these, each value in the reader's zone.

# A service's state as a badge and as a dot says.
steward.service.state={state, select, running {running} healthy {healthy} starting {starting} unhealthy {unhealthy} held {held down} standby {standby} created {created} restarting {restarting} removing {removing} paused {paused} exited {exited} dead {dead} other {{state}}}
steward.service.docker-state=Docker reports the state "{state}".
steward.service.held-since=Held down since {since}. Docker reports the state "{state}".
