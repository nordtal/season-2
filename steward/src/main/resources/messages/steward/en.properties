steward.said.message=Saved, and every service that shows it takes it at once.
steward.said.announced={posted, select, true {Posted to the {language} announcement channel.} other {Not posted: {language} has no announcement channel the bot can write to.}}
steward.said.no-guild-id=discord.guild-id is not set, so there is no guild to list.
steward.said.no-bot-token=discord.bot-token is not set. Without it the ids still work; they just have to be typed.
steward.said.guild-not-listed=The guild cannot be listed.
steward.said.words={text}

