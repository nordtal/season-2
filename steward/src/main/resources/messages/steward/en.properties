# What a source says of one artifact, kept apart, since a silent source must never read as up to date.
steward.artifact.status={status, select, up-to-date {up to date} outdated {outdated} missing {not installed} unsupported {unsupported} mount-missing {no volume} other {could not ask}}
steward.artifact.status-tip={status, select, up-to-date {What is installed is what the source says is newest.} outdated {A newer file exists. A run would install it.} missing {Nothing with this file name is installed. On a fresh volume that is normal; on a running server it is either new, or a publisher who renamed the jar.} unsupported {The source answered and has no build of this for the Minecraft version the network runs. Nothing is installed and nothing failed. It stays on this list, so the day a build appears the next run picks it up.} mount-missing {The volume is not mounted in steward, so nothing can be said about it.} other {The source could not be asked. This is not the same as nothing having changed.}}

steward.image.drift={drift, select, up-to-date {up to date} outdated {outdated} local {local build} other {unchecked}}
steward.image.drift-tip={drift, select, up-to-date {The running image carries the digest the registry names.} outdated {Out of date: the next update makes it again.} other {Not compared: either the registry did not answer, or this container's exact image is no longer on file locally (its tag was rebuilt without recreating it). That is not "up to date".}}
steward.image.label=Image
steward.image.local-jars=Plugin jars built here
steward.image.local-tip=Built on this host and in no release. An update that would replace it names it and asks first.

