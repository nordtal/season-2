# Steward's interface on this machine, for work on its UI: `docker compose up` here, then open http://localhost:5173.
# The README beside this file says what runs and how a change reaches the page.
name: steward-ui

services:
  # Throwaway: the data lives in memory, and every start of the preview drops what the last one left.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${STEWARD_UI_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The real interface and API from this checkout, over stand-ins for the agent, bunq and Discord, signed in as an
  # invented admin. The first start builds Steward and takes minutes; later ones are incremental.
  preview:
    build: .
    init: true
    working_dir: /src
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GRADLE_USER_HOME: /gradle
      NORDTAL_TEST_POSTGRES_HOST: postgres
      STEWARD_UI_DUMP: ${STEWARD_UI_DUMP:-}
    command:
      - sh
      - -c
      - >-
        args="--port 18180 --state /state/state.json";
        if [ -n "$$STEWARD_UI_DUMP" ]; then args="$$args --dump /dumps/$$STEWARD_UI_DUMP"; fi;
        exec sh gradlew --console=plain --project-cache-dir /build/project-cache -PbuildRoot=/build/modules
        :steward:preview --args="$$args"
    volumes:
      - ../..:/src
      # Everything the build writes stays in volumes, so the checkout's own build/ and node_modules/ stay this host's.
      - gradle:/gradle
      - build:/build
      - build-logic:/src/build-logic/build
      - build-logic-gradle:/src/build-logic/.gradle
      - kotlin:/src/build-logic/.kotlin
      - node-modules:/src/steward/frontend/node_modules
      - state:/state
      - ${STEWARD_UI_DUMPS:-./dumps}:/dumps:ro
    ports:
      - "127.0.0.1:18180:18180"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:18180/api/health >/dev/null && test -s /state/state.json"]
      interval: 5s
      timeout: 3s
      start_period: 15m
      start_interval: 5s

  # Vite with hot reload, in front of the preview; it hands every request the preview's session.
  vite:
    image: node:24.21.0-bookworm-slim
    working_dir: /src/steward/frontend
    depends_on:
      preview:
        condition: service_healthy
    environment:
      STEWARD_API: http://preview:18180
      STEWARD_PREVIEW_STATE: /state/state.json
    command: ["node", "node_modules/vite/bin/vite.js", "--host", "0.0.0.0", "--strictPort"]
    volumes:
      - ../..:/src
      - node-modules:/src/steward/frontend/node_modules
      - state:/state:ro
    ports:
      - "127.0.0.1:${STEWARD_UI_PORT:-5173}:5173"

volumes:
  gradle:
  build:
  build-logic:
  build-logic-gradle:
  kotlin:
  node-modules:
  state:
